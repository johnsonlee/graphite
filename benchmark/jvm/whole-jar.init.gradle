// Trusted shared validation for both source revisions, including bases predating this source set.
// Tests keep their original source layout; only the real JMH harness receives these assertions.
gradle.projectsEvaluated {
    def webgraph = gradle.rootProject.project(':webgraph')
    def kotlin = webgraph.extensions.getByName('kotlin')
    kotlin.sourceSets.getByName('jmh').kotlin.srcDir(
        webgraph.file('src/benchmark/kotlin'))
    webgraph.dependencies.add('jmhImplementation',
        "org.jetbrains.kotlin:kotlin-test:${kotlin.coreLibrariesVersion}")
}
