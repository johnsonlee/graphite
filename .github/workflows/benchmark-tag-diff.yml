name: Tag benchmark diff

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false
  queue: max

env:
  JAVA_OPTS: -Xmx2g -XX:MetaspaceSize=512m -Dfile.encoding=UTF-8
  JVM_OPTS: -Xmx2g -XX:MetaspaceSize=512m -Dfile.encoding=UTF-8

jobs:
  resolve:
    name: resolve-semantic-tag-pair
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      current_sha: ${{ steps.tags.outputs.current_sha }}
      current_tag: ${{ steps.tags.outputs.current_tag }}
      previous_available: ${{ steps.tags.outputs.previous_available }}
      previous_sha: ${{ steps.tags.outputs.previous_sha }}
      previous_tag: ${{ steps.tags.outputs.previous_tag }}

    steps:
    - name: Checkout exact pushed tag with complete tag history
      uses: actions/checkout@v7
      with:
        ref: ${{ github.ref }}
        fetch-depth: 0
        persist-credentials: false

    - name: Resolve semantic predecessor and exact commit SHAs
      id: tags
      env:
        CURRENT_TAG: ${{ github.ref_name }}
        EXPECTED_REF: ${{ github.ref }}
        EXPECTED_SHA: ${{ github.sha }}
      run: |
        mkdir -p tag-resolution
        node .github/scripts/benchmark-tag-diff.mjs resolve \
          --current-tag "${CURRENT_TAG}" \
          --expected-ref "${EXPECTED_REF}" \
          --expected-sha "${EXPECTED_SHA}" \
          --output tag-resolution/metadata.json
        jq -e '
          .schemaVersion == 1 and
          .current.tag == env.CURRENT_TAG and
          (.current.sha | test("^[0-9a-f]{40}$")) and
          (.current.harnessFingerprint | test("^[0-9a-f]{64}$")) and
          (.previous == null or (.previous.harnessFingerprint | test("^[0-9a-f]{64}$"))) and
          (.baselineAvailable == (.previous != null))
        ' tag-resolution/metadata.json >/dev/null
        {
          echo "current_sha=$(jq -r '.current.sha' tag-resolution/metadata.json)"
          echo "current_tag=$(jq -r '.current.tag' tag-resolution/metadata.json)"
          echo "previous_available=$(jq -r '.baselineAvailable' tag-resolution/metadata.json)"
          echo "previous_sha=$(jq -r '.previous.sha // empty' tag-resolution/metadata.json)"
          echo "previous_tag=$(jq -r '.previous.tag // empty' tag-resolution/metadata.json)"
        } >> "${GITHUB_OUTPUT}"

    - name: Upload immutable tag resolution
      uses: actions/upload-artifact@v7
      with:
        name: tag-benchmark-resolution-${{ github.run_id }}-${{ github.run_attempt }}
        path: tag-resolution/metadata.json
        if-no-files-found: error
        retention-days: 14

  multigraph-evidence-required:
    name: tag-multigraph-performance-evidence
    needs: [resolve]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Preserve the absence of a multi-graph release comparison
      run: |
        mkdir -p benchmark-results
        cat > benchmark-results/status.json <<'JSON'
        {"passed":false,"status":"UNAVAILABLE","scope":"multi-graph-only","errors":["The retired six synthetic single-graph JMH cases cannot establish release performance. A bound multi-graph pressure plan and complete operation evidence are required."],"historicalResultsPreserved":true}
        JSON
        echo 'Release performance is unavailable; existing published history is unchanged.' >> "$GITHUB_STEP_SUMMARY"
    - name: Upload explicit unavailable evidence
      uses: actions/upload-artifact@v7
      with:
        name: tag-multigraph-unavailable-${{ github.run_id }}-${{ github.run_attempt }}
        path: benchmark-results/status.json
        if-no-files-found: error
    - name: Require the multi-graph replacement before acceptance
      run: exit 1
