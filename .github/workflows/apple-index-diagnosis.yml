name: Apple index correctness diagnosis

# Run manually, or add apple-index-diagnosis to a same-repository PR after
# reviewing its diagnostic scripts. Ordinary pushes and PR updates do not trigger it.
# This correctness-only investigation retains both raw index dumps, IR streams,
# saved graphs and a file/USR/string diff. A completed comparison can contain
# differences; it does not change a shape pin or establish a performance result.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  compare-index-facts:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'apple-index-diagnosis' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: swift:6.1.3@sha256:6e43114610e161e38ad41636ebcafd6940dc67dfab355eace3a0ca100b2263db
    defaults:
      run:
        shell: bash
    env:
      BASE: 0818c68ecd084e14e80a978f7940c6d9d03e1a9a
    steps:
    - name: Checkout reviewed diagnostic controls
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        path: controls
        persist-credentials: false
    - name: Checkout immutable production baseline
      uses: actions/checkout@v7
      with:
        ref: ${{ env.BASE }}
        path: baseline
        persist-credentials: false
    - name: Install baseline build prerequisites
      run: |
        apt-get update -q
        apt-get install -y -q --no-install-recommends ca-certificates curl git build-essential python3 libsqlite3-dev pkg-config
        python3 -m unittest discover -s controls/backend/bench -p test_diagnose_apple_index.py
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
    - name: Record both trees, container reference and installed tools
      run: |
        mkdir -p evidence "$RUNNER_TEMP/diagnosis-bin"
        test "$(git -C baseline rev-parse HEAD)" = "$BASE"
        test "$(git -C baseline rev-parse HEAD:frontend/apple)" = 1deb1cade3b2a13bef8af3cd6d9c57a42d6fece4
        {
          echo "swift:6.1.3@sha256:6e43114610e161e38ad41636ebcafd6940dc67dfab355eace3a0ca100b2263db"
          git -C controls rev-parse HEAD 'HEAD^{tree}'
          git -C baseline rev-parse HEAD 'HEAD^{tree}' HEAD:frontend/apple
          sha256sum baseline/frontend/apple/Package.resolved controls/backend/bench/{apple-index-dump.swift,diagnose-apple-index.py,prepare-apple-corpus.py,apple-frontend.py}
          swift --version
          clang --version
          java -version
          uname -a
          dpkg-query -W
        } > evidence/toolchain.txt 2>&1
    - name: Build the pristine production frontend and importer once
      run: |
        bin="$RUNNER_TEMP/diagnosis-bin"
        baseline/frontend/apple/swift.sh build --product graphite-frontend-apple -c release --jobs 4 --force-resolved-versions --static-swift-stdlib 2>&1 | tee evidence/frontend-build.log
        cp baseline/frontend/apple/.build/release/graphite-frontend-apple "$bin/"
        (cd baseline && ./gradlew :query:shadowJar --no-daemon) 2>&1 | tee evidence/jar-build.log
        cp baseline/frontend/jvm/query/build/libs/graphite.jar "$bin/"
        git -C baseline diff --exit-code
    - name: Build the read-only index sidecar from an isolated copy of the same sources
      run: |
        probe="$RUNNER_TEMP/diagnosis-probe"
        mkdir "$probe"
        git -C baseline archive "$BASE:frontend/apple" | tar -x -C "$probe"
        mkdir "$probe/Sources/apple-index-dump"
        cp controls/backend/bench/apple-index-dump.swift "$probe/Sources/apple-index-dump/main.swift"
        cat >> "$probe/Package.swift" <<'SWIFT'
        package.products.append(.executable(name: "apple-index-dump", targets: ["apple-index-dump"]))
        package.targets.append(.executableTarget(name: "apple-index-dump", dependencies: [
            "GraphiteFrontend", .product(name: "IndexStoreDB", package: "indexstore-db"),
        ]))
        SWIFT
        "$probe/swift.sh" build --product apple-index-dump -c release --jobs 4 --force-resolved-versions --static-swift-stdlib 2>&1 | tee evidence/probe-build.log
        cmp baseline/frontend/apple/Package.resolved "$probe/Package.resolved"
        cp "$probe/.build/release/apple-index-dump" "$RUNNER_TEMP/diagnosis-bin/"
    - name: Collect both fresh compiler indexes, baseline IRs and production import results
      run: |
        bin="$RUNNER_TEMP/diagnosis-bin"
        test "$RUNNER_TEMP/corpus" = /__w/_temp/corpus
        test "$GITHUB_WORKSPACE/corpus" = /__w/graphite/graphite/corpus
        python3 controls/backend/bench/diagnose-apple-index.py \
          --baseline baseline --frontend "$bin/graphite-frontend-apple" --probe "$bin/apple-index-dump" --jar "$bin/graphite.jar" \
          --manifest controls/backend/bench/apple-frontend-corpus-large.json --out evidence \
          --temp-root "$RUNNER_TEMP/corpus" --workspace-root "$GITHUB_WORKSPACE/corpus"
    - name: Preserve raw diagnostics and failures
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: apple-index-diagnosis-${{ github.run_id }}-${{ github.run_attempt }}
        path: evidence/
        if-no-files-found: error
        retention-days: 14
