name: Publish

on:
  push:
    tags:
      - 'v*'
  repository_dispatch:
    types: [publish]
  # A dry run: every job builds and verifies what a tag would publish, from the commit
  # the workflow is started on, and publishes nothing to any remote: Maven artifacts go
  # to the runner's local repository (signed when the GPG secrets are available), the
  # binaries, frontend packages and the rendered formula are checked and kept as the
  # `release-<tag>` artifact, the formula is installed from those assets on a
  # macOS runner, and both image architectures are built but not pushed. Not covered:
  # Sonatype/GitHub Packages authentication and upload, the GitHub Release, the tap and registry
  # push; those run for real on a pre-release tag (v2.5.0-rc.1), which leaves the
  # default channels alone. `workflow_dispatch` is available once this file is on the
  # default branch (it already is). --ref selects the candidate workflow and checkout;
  # github.sha pins every dry-run checkout to that selected revision. The tag named
  # here need not exist; it only stamps the version.
  #   gh workflow run publish.yml --ref <branch> -f tag=v2.5.0
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to rehearse (v-prefixed, e.g. v2.5.0-rc.1)'
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.event.client_payload.tag || github.ref_name }}
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  # ---- The one place the tag is parsed ----
  # Every publishing job depends on this one and takes the version and the pre-release
  # flag from its outputs, so a tag that is not `v` + strict SemVer stops here, before any
  # artifact is uploaded or any channel moved. The publishers are not atomic with each
  # other; a malformed tag must not get as far as one of them.
  validate:
    name: validate-release-tag
    runs-on: ubuntu-latest
    if: github.repository_owner == 'johnsonlee'
    outputs:
      version: ${{ steps.semver.outputs.version }}
      prerelease: ${{ steps.semver.outputs.prerelease }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || env.RELEASE_TAG }}
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: .github/scripts/package.json
    - name: Parse the release tag as SemVer
      id: semver
      run: |
        bun test ./.github/scripts/release/version.test.ts ./.github/scripts/release/publication.test.ts
        bun .github/scripts/release/version.ts "${RELEASE_TAG}" | tee -a "${GITHUB_OUTPUT}"
    - name: Test release smoke validation and real-source preparation
      run: |
        python3 .github/scripts/test_verify_apple_release.py
        python3 -m unittest discover -s backend/bench -p test_prepare_apple_corpus.py

  # ---- Maven Central (Sonatype) ----
  maven:
    needs: validate
    permissions:
      contents: read
    runs-on: ubuntu-latest
    if: github.repository_owner == 'johnsonlee'
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || env.RELEASE_TAG }}
    - uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
    # The same publication tasks as the release (POMs, jars, sources, signatures) into
    # the runner's local Maven repository; only the Sonatype upload is left out.
    - name: Publish the Maven artifacts to the local repository (dry run)
      if: env.DRY_RUN == 'true'
      run: |
        SIGNING=()
        if [ -n "${GPG_KEY_ARMOR:-}" ]; then
          echo "$GPG_KEY_ARMOR" | base64 --decode > "${GITHUB_WORKSPACE}/secring.gpg"
          SIGNING=(-Psigning.keyId="${GPG_KEY_ID}" -Psigning.password="${GPG_PASSPHRASE}"
                   -Psigning.secretKeyRingFile="${GITHUB_WORKSPACE}/secring.gpg")
        else
          echo "GPG secrets are not available to this run: publishing unsigned to the local repository"
        fi
        ./gradlew clean publishToMavenLocal -S --no-daemon -Pversion=${RELEASE_VERSION} "${SIGNING[@]}"
        # The published coordinates are io.johnsonlee.graphite:<module> (settings.gradle.kts
        # keeps the project names prefix-free), so the local repository holds
        # io/johnsonlee/graphite/<module>/<version>/<module>-<version>.*, as on Maven Central.
        for MODULE in core ir cypher sootup webgraph; do
          DIR="${HOME}/.m2/repository/io/johnsonlee/graphite/${MODULE}/${RELEASE_VERSION}"
          ls -la "${DIR}"
          POM="${DIR}/${MODULE}-${RELEASE_VERSION}.pom"
          test -f "${POM}"
          test -f "${DIR}/${MODULE}-${RELEASE_VERSION}.jar"
          test -f "${DIR}/${MODULE}-${RELEASE_VERSION}-sources.jar"
          test -f "${DIR}/${MODULE}-${RELEASE_VERSION}-javadoc.jar"
          grep -q "<groupId>io.johnsonlee.graphite</groupId>" "${POM}"
          grep -q "<artifactId>${MODULE}</artifactId>" "${POM}"
          grep -q "<version>${RELEASE_VERSION}</version>" "${POM}"
          if [ -n "${GPG_KEY_ARMOR:-}" ]; then
            test -f "${POM}.asc"
            test -f "${DIR}/${MODULE}-${RELEASE_VERSION}.jar.asc"
          fi
        done
      env:
        JAVA_OPTS: -Xmx8g -XX:MetaspaceSize=512m -Dfile.encoding=UTF-8
        JVM_OPTS: -Xmx8g -XX:MetaspaceSize=512m -Dfile.encoding=UTF-8
        GPG_KEY_ARMOR: ${{ secrets.GPG_KEY_ARMOR }}
        GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    - name: Publish to Sonatype Central
      id: sonatype
      if: env.DRY_RUN != 'true'
      continue-on-error: true
      run: |
        echo "Publishing version ${RELEASE_VERSION} ..."
        echo "Create GPG private key"
        echo $GPG_KEY_ARMOR | base64 --decode > ${GITHUB_WORKSPACE}/secring.gpg
        ./gradlew clean publishMavenJavaPublicationToSonatypeRepository closeAndReleaseSonatypeStagingRepository -S --no-daemon \
            -Pversion=${RELEASE_VERSION} \
            -POSSRH_USERNAME=${OSSRH_USERNAME} \
            -POSSRH_PASSWORD=${OSSRH_PASSWORD} \
            -POSSRH_PACKAGE_GROUP=${OSSRH_PACKAGE_GROUP} \
            -Psigning.keyId=${GPG_KEY_ID} \
            -Psigning.password=${GPG_PASSPHRASE} \
            -Psigning.secretKeyRingFile=${GITHUB_WORKSPACE}/secring.gpg
      env:
        JAVA_OPTS: -Xmx8g -XX:MetaspaceSize=512m -Dfile.encoding=UTF-8
        JVM_OPTS: -Xmx8g -XX:MetaspaceSize=512m -Dfile.encoding=UTF-8
        GPG_KEY_ARMOR: ${{ secrets.GPG_KEY_ARMOR }}
        GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
        OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
        OSSRH_PACKAGE_GROUP: ${{ secrets.OSSRH_PACKAGE_GROUP }}

    - name: Report Sonatype publication failure
      if: always() && steps.sonatype.outcome == 'failure'
      run: |
        echo "::warning title=Sonatype publication failed::Maven Central publication failed. See the original publish step logs; GitHub Packages and release assets are independent."
        {
          echo '### Sonatype Maven publication failed'
          echo 'The real Sonatype upload/release step failed. Its original error logs remain in this job.'
          echo 'GitHub Packages and release assets run independently; Maven Central availability is not confirmed.'
        } >> "${GITHUB_STEP_SUMMARY}"

  # ---- GitHub Packages: independent Maven publication of the same coordinates ----
  github-packages:
    needs: validate
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    if: github.repository_owner == 'johnsonlee'
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      JAVA_OPTS: -Xmx2g -Dfile.encoding=UTF-8
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || env.RELEASE_TAG }}
    - uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
    - uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: true
    - name: Rehearse GitHub Packages in a local file repository
      if: env.DRY_RUN == 'true'
      run: |
        ./gradlew publishMavenJavaPublicationToGitHubPackagesRepository verifyGitHubPackagesLocalPublication \
          --no-daemon --stacktrace -Pversion="${RELEASE_VERSION}" \
          -PgithubPackagesLocalRepository="${RUNNER_TEMP}/github-packages-repository"
        cat "${RUNNER_TEMP}/github-packages-repository/verified-publications.txt" >> "${GITHUB_STEP_SUMMARY}"
    - name: Publish Maven artifacts to GitHub Packages
      if: env.DRY_RUN != 'true'
      run: ./gradlew publishMavenJavaPublicationToGitHubPackagesRepository --no-daemon --stacktrace -Pversion="${RELEASE_VERSION}"
      env:
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---- The graphite CLI: one tarball per platform ----
  binaries:
    needs: validate
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    if: github.repository_owner == 'johnsonlee'
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux binaries are static musl builds, as docs/architecture-frontend-backend.md
          # promises: no libc requirement, so the tarball runs on any distribution and
          # the image can be distroless `static`. Package checks the binary is static.
          # x86_64 builds natively with Ubuntu's musl-tools. aarch64 is cross-compiled
          # with cross-rs on the x86_64 runner: jemalloc's C build fails under the arm64
          # musl-tools compiler (its configure finds no atomics), and cross's image ships
          # a proper musl cross toolchain, the same way tikv-jemallocator's own CI builds
          # this target. Its self-check runs the binary under qemu-user.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            cc: CC_x86_64_unknown_linux_musl
          # Ubuntu 26.04 removed qemu-user-static; keep the cross runner on the
          # supported image that provides the emulator used by Package below.
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-musl
            cross: true
            exec: qemu-aarch64-static
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || env.RELEASE_TAG }}
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: .github/scripts/package.json
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
    - name: Install the musl C toolchain
      if: contains(matrix.target, 'musl') && !matrix.cross
      run: |
        sudo apt-get install -y -q musl-tools
        echo "${{ matrix.cc }}=musl-gcc" >> "${GITHUB_ENV}"
    - name: Install cross and qemu-user
      if: matrix.cross
      run: |
        cargo install cross --locked
        sudo apt-get install -y -q qemu-user-static
    - name: Build release binaries
      env:
        GRAPHITE_VERSION: ${{ env.RELEASE_VERSION }}
        GRAPHITE_COMMIT: ${{ github.sha }}
      run: |
        if [ "${{ matrix.cross }}" = "true" ]; then
          cross build --release --locked --target ${{ matrix.target }} -p graphite-cli
        else
          cargo build --release --locked --target ${{ matrix.target }} -p graphite-cli
        fi
    - name: Package
      shell: bash
      run: |
        ASSET="graphite-${RELEASE_VERSION}-${{ matrix.target }}.tar.gz"
        mkdir -p release-assets
        ${{ matrix.exec }} "target/${{ matrix.target }}/release/graphite" --version | grep -F "${RELEASE_VERSION}"
        case "${{ matrix.target }}" in
          *-linux-musl) bun .github/scripts/checks/static-link.ts "target/${{ matrix.target }}/release/graphite" ;;
        esac
        tar -czf "release-assets/${ASSET}" -C "target/${{ matrix.target }}/release" graphite
        (cd release-assets && shasum -a 256 "${ASSET}" > "${ASSET}.sha256")
        cat "release-assets/${ASSET}.sha256"
    - uses: actions/upload-artifact@v7
      with:
        name: binaries-${{ matrix.target }}
        path: release-assets/*
        if-no-files-found: error

  js-frontends:
    needs: validate
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || env.RELEASE_TAG }}
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: .github/scripts/package.json
    - uses: actions/setup-node@v6
      with:
        node-version: '20.19.6'
        package-manager-cache: false
    - name: Compile the standalone JS frontend and prepare its expected graph
      working-directory: frontend/web
      run: |
        npm ci
        npm run package:release -- "$TARGET"
        mkdir -p "$RUNNER_TEMP/standalone"
        cp "release-assets/graphite-frontend-js-$TARGET" "$RUNNER_TEMP/standalone/frontend"
        cp test/standalone.sh "$RUNNER_TEMP/standalone/"
        cd "$RUNNER_TEMP/standalone"
        printf '%s\n' 'console.log("built"); Promise.resolve([1].map(n => n));' > app.mjs
        node "$GITHUB_WORKSPACE/frontend/web/dist/cli.js" build app.mjs -o expected.json
    - name: Run the executable on its target without Node or Bun on PATH
      run: |
        cd "$RUNNER_TEMP/standalone"
        if [[ "$TARGET" == *-musl ]]; then
          docker run --rm -v "$PWD:/check" -w /check alpine:3.22 sh -ec \
            'apk add --no-cache libstdc++ && sh standalone.sh "$1"' sh "$RELEASE_VERSION"
        else
          sh standalone.sh "$RELEASE_VERSION"
        fi
    - uses: actions/upload-artifact@v7
      with:
        name: js-frontend-${{ matrix.target }}
        path: frontend/web/release-assets/graphite-frontend-js-${{ matrix.target }}*
        if-no-files-found: error

  # ---- The Apple frontend ----
  # graphite-frontend-apple is a Swift binary (frontend/apple). It is built natively per
  # target: the two macOS architectures on their own runners, Linux x86_64 in the
  # swift:6.1.3 image with the Swift standard library linked statically so the binary runs
  # wherever the Swift toolchain it drives is installed. `graphite frontend install apple`
  # downloads the tarball for its host, verifies the .sha256 next to it and unpacks the
  # one executable. Compiler versions match the real-corpus gate and calibration:
  # Xcode 16.4 on macOS 15 and Swift 6.1.3 on Linux.
  apple-frontend:
    needs: validate
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    if: github.repository_owner == 'johnsonlee'
    container: ${{ matrix.container }}
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            container: swift:6.1.3
            static: --static-swift-stdlib
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || env.RELEASE_TAG }}
    - name: Select the frontend compiler
      if: runner.os == 'macOS'
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.4'
    - name: Install what the swift image lacks
      if: matrix.container != ''
      run: apt-get update -q && apt-get install -y -q --no-install-recommends ca-certificates
    - name: Build the frontend
      run: frontend/apple/swift.sh build -c release ${{ matrix.static }}
    - name: Package
      shell: bash
      run: |
        ASSET="graphite-frontend-apple-${RELEASE_VERSION}-${{ matrix.target }}.tar.gz"
        BIN="frontend/apple/.build/release/graphite-frontend-apple"
        "${BIN}" version
        "${BIN}" describe | grep -F '"ir_schema": [1]'
        mkdir -p release-assets
        tar -czf "release-assets/${ASSET}" -C "$(dirname "${BIN}")" graphite-frontend-apple
        (cd release-assets && shasum -a 256 "${ASSET}" > "${ASSET}.sha256")
        cat "release-assets/${ASSET}.sha256"
    - uses: actions/upload-artifact@v7
      with:
        name: apple-frontend-${{ matrix.target }}
        path: release-assets/*
        if-no-files-found: error

  # ---- GitHub Release ----
  # Everything this job does before the last step is preparation that can be repeated:
  # build the frontends, collect the binaries, verify the checksums, render the formula, keep
  # them all as the `release-<tag>` artifact. The last step is the only one that changes
  # remote state, and it is re-runnable too: this repository has immutable releases, so
  # `.github/scripts/release/publish.ts` builds the release as a draft, makes the draft's
  # assets equal to `release-assets/` by name and sha256, publishes it, and reads the
  # state back rather than trusting the publish response. A re-run after that finds the
  # published release, verifies its assets against the local ones and uploads nothing,
  # so the downstream jobs (tap, docker) can be re-run from a failure without this job
  # ever being asked to modify an immutable release. (v3.0.0-alpha2 was left without
  # assets by creating the release published first and uploading afterwards.)
  release:
    needs: [validate, github-packages, binaries, js-frontends, apple-frontend]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    if: github.repository_owner == 'johnsonlee'
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      PRERELEASE: ${{ needs.validate.outputs.prerelease }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || env.RELEASE_TAG }}
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: .github/scripts/package.json
    - uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
    # graphite.jar is the JVM frontend: `graphite build` runs it. It stays a complete
    # CLI of its own (build/query/serve) for anyone not yet on the binary.
    - name: Build the JVM frontend jar
      run: |
        ./gradlew :query:shadowJar --no-daemon -Pversion=${RELEASE_VERSION}
        mkdir -p release-assets
        cp frontend/jvm/query/build/libs/graphite.jar release-assets/graphite.jar
        (cd release-assets && sha256sum graphite.jar > graphite.jar.sha256)
    - name: Collect the standalone JavaScript frontends
      uses: actions/download-artifact@v8
      with:
        pattern: js-frontend-*
        path: release-assets
        merge-multiple: true
    - name: Collect the Rust binaries
      uses: actions/download-artifact@v8
      with:
        pattern: binaries-*
        path: release-assets
        merge-multiple: true
    - name: Collect the Apple frontends
      uses: actions/download-artifact@v8
      with:
        pattern: apple-frontend-*
        path: release-assets
        merge-multiple: true
    - name: Verify release assets
      run: |
        cd release-assets
        ls -la
        for TARGET in x86_64-unknown-linux-musl aarch64-unknown-linux-musl x86_64-apple-darwin aarch64-apple-darwin; do
          test -f "graphite-${RELEASE_VERSION}-${TARGET}.tar.gz"
          sha256sum -c "graphite-${RELEASE_VERSION}-${TARGET}.tar.gz.sha256"
        done
        for TARGET in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu; do
          test -f "graphite-frontend-apple-${RELEASE_VERSION}-${TARGET}.tar.gz"
          sha256sum -c "graphite-frontend-apple-${RELEASE_VERSION}-${TARGET}.tar.gz.sha256"
        done
        sha256sum -c graphite.jar.sha256
        for TARGET in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-unknown-linux-musl aarch64-unknown-linux-musl x86_64-apple-darwin aarch64-apple-darwin; do
          sha256sum -c "graphite-frontend-js-${TARGET}.sha256"
        done
    - name: Install the JavaScript frontend with the release CLI and query a saved graph
      run: |
        tar -xzf "release-assets/graphite-${RELEASE_VERSION}-x86_64-unknown-linux-musl.tar.gz" -C "$RUNNER_TEMP" graphite
        python3 .github/scripts/check-js-frontend-install.py --cli "$RUNNER_TEMP/graphite" \
          --assets release-assets --version "$RELEASE_VERSION" --target x86_64-unknown-linux-gnu
    # The formula is rendered and syntax-checked before anything is published, on every
    # run; the tap job pushes it after the release exists, and only for a stable tag.
    - name: Render the Homebrew formula
      run: |
        QUERY_SHA=$(sha256sum release-assets/graphite.jar | awk '{print $1}')
        asset_sha() { awk '{print $1}' "release-assets/graphite-${RELEASE_VERSION}-$1.tar.gz.sha256"; }
        SHA_MAC_ARM=$(asset_sha aarch64-apple-darwin)
        SHA_MAC_X86=$(asset_sha x86_64-apple-darwin)
        SHA_LINUX_ARM=$(asset_sha aarch64-unknown-linux-musl)
        SHA_LINUX_X86=$(asset_sha x86_64-unknown-linux-musl)
        apple_sha() { awk '{print $1}' "release-assets/graphite-frontend-apple-${RELEASE_VERSION}-$1.tar.gz.sha256"; }
        SHA_APPLE_MAC_ARM=$(apple_sha aarch64-apple-darwin)
        SHA_APPLE_MAC_X86=$(apple_sha x86_64-apple-darwin)
        SHA_APPLE_LINUX_X86=$(apple_sha x86_64-unknown-linux-gnu)
        BASE="https://github.com/johnsonlee/graphite/releases/download/v${RELEASE_VERSION}"

        mkdir -p formula/Formula
        cd formula

        # The formula installs the Rust binary and the JVM frontend jar next to it.
        # `graphite build` finds the jar and openjdk@17 through the two variables the
        # wrapper sets; every command line written for the jar-based formula still works.
        cat > Formula/graphite.rb <<RUBY
        class Graphite < Formula
          desc "Build, query, and serve Graphite static analysis graphs"
          homepage "https://github.com/johnsonlee/graphite"
          version "${RELEASE_VERSION}"
          license "Apache-2.0"

          on_macos do
            on_arm do
              url "${BASE}/graphite-${RELEASE_VERSION}-aarch64-apple-darwin.tar.gz"
              sha256 "${SHA_MAC_ARM}"
            end
            on_intel do
              url "${BASE}/graphite-${RELEASE_VERSION}-x86_64-apple-darwin.tar.gz"
              sha256 "${SHA_MAC_X86}"
            end
          end

          on_linux do
            on_arm do
              url "${BASE}/graphite-${RELEASE_VERSION}-aarch64-unknown-linux-musl.tar.gz"
              sha256 "${SHA_LINUX_ARM}"
            end
            on_intel do
              url "${BASE}/graphite-${RELEASE_VERSION}-x86_64-unknown-linux-musl.tar.gz"
              sha256 "${SHA_LINUX_X86}"
            end
          end

          # The JVM frontend: \`graphite build\` runs it to analyse JAR/WAR/APK inputs.
          resource "frontend-jvm" do
            url "${BASE}/graphite.jar"
            sha256 "${QUERY_SHA}"
          end

          # The Apple frontend: \`graphite build\` runs it on a Swift package. It drives
          # the Swift toolchain on the machine (Xcode, or swift.org's on Linux); the
          # formula does not depend on one.
          resource "frontend-apple" do
            on_macos do
              on_arm do
                url "${BASE}/graphite-frontend-apple-${RELEASE_VERSION}-aarch64-apple-darwin.tar.gz"
                sha256 "${SHA_APPLE_MAC_ARM}"
              end
              on_intel do
                url "${BASE}/graphite-frontend-apple-${RELEASE_VERSION}-x86_64-apple-darwin.tar.gz"
                sha256 "${SHA_APPLE_MAC_X86}"
              end
            end
            on_linux do
              url "${BASE}/graphite-frontend-apple-${RELEASE_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
              sha256 "${SHA_APPLE_LINUX_X86}"
            end
          end

          depends_on "openjdk@17"

          def install
            libexec.install "graphite"
            resource("frontend-jvm").stage { libexec.install "graphite.jar" }
            if OS.mac? || Hardware::CPU.intel?
              resource("frontend-apple").stage { libexec.install "graphite-frontend-apple" }
            end
            (bin/"graphite").write_env_script libexec/"graphite",
              GRAPHITE_JAVA:         "#{Formula["openjdk@17"].opt_bin}/java",
              GRAPHITE_FRONTEND_JVM: "#{libexec}/graphite.jar"
          end

          test do
            assert_match "Usage", shell_output("#{bin}/graphite --help")
            assert_match "jvm", shell_output("#{bin}/graphite frontend list")
            assert_match "apple", shell_output("#{bin}/graphite frontend list")
          end
        end
        RUBY
        ruby -c Formula/graphite.rb
        cat Formula/graphite.rb
    # Kept on every run: a dry run's only output, and what the tap and formula jobs
    # take their input from, so each of them can be re-run on its own.
    - name: Keep the assets and the rendered formula
      uses: actions/upload-artifact@v7
      with:
        name: release-${{ env.RELEASE_TAG }}
        path: |
          release-assets/*
          formula/Formula/graphite.rb
        if-no-files-found: error
    # A tag whose SemVer has a pre-release part (v2.5.0-alpha.1, -beta.2, -rc.1)
    # rehearses this workflow end to end without touching what users install by
    # default: the GitHub Release is marked pre-release (so it is not "latest"), the
    # Homebrew formula is left alone, and the image is not tagged `latest` (see the
    # docker job). The flag comes from the validate job's parse, so build metadata
    # such as v2.5.0+linux-1 stays a stable release.
    - name: Test release publication transport and recovery
      run: bun test ./.github/scripts/release
    - name: Publish the GitHub Release
      if: env.DRY_RUN != 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
      run: bun .github/scripts/release/publish.ts release-assets

  # Test the assembled tarballs, not the binaries in the build jobs' workspaces. The
  # Linux frontend here is the actual --static-swift-stdlib release artifact.
  apple-release-smoke:
    name: apple-release-smoke (${{ matrix.apple-target }})
    needs: [validate, release]
    if: github.event_name == 'workflow_dispatch' && github.repository_owner == 'johnsonlee'
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            cli-target: aarch64-apple-darwin
            apple-target: aarch64-apple-darwin
          - os: macos-15-intel
            cli-target: x86_64-apple-darwin
            apple-target: x86_64-apple-darwin
          - os: ubuntu-latest
            cli-target: x86_64-unknown-linux-musl
            apple-target: x86_64-unknown-linux-gnu
            container: swift:6.1.3
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
    - uses: actions/download-artifact@v8
      with:
        name: release-${{ env.RELEASE_TAG }}
        path: dry-run
    - name: Verify, unpack and exercise the shipped artifacts
      shell: bash
      run: |
        set -euo pipefail
        ASSETS="$PWD/dry-run/release-assets"
        INSTALLED="${RUNNER_TEMP}/apple-release"
        mkdir -p "${INSTALLED}"
        CLI="graphite-${RELEASE_VERSION}-${{ matrix.cli-target }}.tar.gz"
        APPLE="graphite-frontend-apple-${RELEASE_VERSION}-${{ matrix.apple-target }}.tar.gz"
        (cd "${ASSETS}" && shasum -a 256 -c "${CLI}.sha256" "${APPLE}.sha256" graphite.jar.sha256)
        tar -xzf "${ASSETS}/${CLI}" -C "${INSTALLED}"
        tar -xzf "${ASSETS}/${APPLE}" -C "${INSTALLED}"
        cp "${ASSETS}/graphite.jar" "${INSTALLED}/graphite.jar"
        "${INSTALLED}/graphite" --version | grep -F "${RELEASE_VERSION}"
        bash .github/scripts/verify-apple-release.sh "${INSTALLED}/graphite" \
          frontend/apple/Fixtures/AcmeShop "${RUNNER_TEMP}/apple-release-check"
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: apple-release-check-${{ matrix.apple-target }}
        path: |
          ${{ runner.temp }}/apple-release-check/*.csv
          ${{ runner.temp }}/apple-release-check/*.graphite
        if-no-files-found: warn

  # ---- Homebrew tap ----
  # Runs after the release is published and can be re-run on its own: the formula was
  # rendered before publication and comes from the `release-<tag>` artifact. Only a
  # stable tag moves the unversioned formula; version-pinned formulae are maintained
  # directly in the tap.
  tap:
    name: update-the-homebrew-tap
    needs: [validate, release]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' && github.repository_owner == 'johnsonlee' && needs.validate.outputs.prerelease == 'false'
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: release-${{ env.RELEASE_TAG }}
        path: release
    - name: Update Homebrew tap
      env:
        HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      run: |
        if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
          echo "HOMEBREW_TAP_TOKEN not set — skipping tap update"
          exit 0
        fi
        ruby -c release/formula/Formula/graphite.rb
        git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/johnsonlee/homebrew-tap.git" tap
        mkdir -p tap/Formula
        cp release/formula/Formula/graphite.rb tap/Formula/graphite.rb
        cd tap
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add Formula/graphite.rb
        if ! git diff --cached --quiet; then
          git commit -m "graphite ${RELEASE_VERSION}"
          git push origin main
        fi

  # ---- The rendered formula, installed for real from the dry-run assets ----
  # Homebrew resolves the formula's URLs against the dry-run artifact instead of the
  # GitHub Release, installs it with its openjdk dependency, and runs its `test` block.
  formula:
    name: install-the-formula (dry run)
    needs: [validate, release]
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch' && github.repository_owner == 'johnsonlee'
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}
    - uses: actions/download-artifact@v8
      with:
        name: release-${{ env.RELEASE_TAG }}
        path: dry-run
    - name: Install the formula from the dry-run assets and run its test
      run: |
        ASSETS="$PWD/dry-run/release-assets"
        FORMULA="$PWD/dry-run/formula/Formula/graphite.rb"
        sed -i '' "s|https://github.com/johnsonlee/graphite/releases/download/v${RELEASE_VERSION}|file://${ASSETS}|g" "${FORMULA}"
        grep -c 'file://' "${FORMULA}"
        # Homebrew requires formulae to belong to a tap. Keep this tap local to
        # the disposable runner and select its formula explicitly, avoiding core.
        DRY_RUN_TAP="graphite/dry-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        brew tap-new "${DRY_RUN_TAP}"
        cp "${FORMULA}" "$(brew --repository "${DRY_RUN_TAP}")/Formula/graphite.rb"
        brew install --formula "${DRY_RUN_TAP}/graphite"
        graphite --version | grep -F "${RELEASE_VERSION}"
        graphite frontend list
        graphite frontend describe jvm
        graphite frontend describe apple | grep -F '"writes": "ir"'
        brew test "${DRY_RUN_TAP}/graphite"
        bash .github/scripts/verify-apple-release.sh "$(command -v graphite)" \
          frontend/apple/Fixtures/AcmeShop "${RUNNER_TEMP}/apple-formula-check"
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: apple-formula-check
        path: |
          ${{ runner.temp }}/apple-formula-check/*.csv
          ${{ runner.temp }}/apple-formula-check/*.graphite
        if-no-files-found: warn

  # ---- Docker image ----
  # Takes the Linux binaries from the published GitHub Release, so it can be re-run
  # on its own once the release job has published (a re-run of the release job on a
  # published release verifies and changes nothing).
  docker:
    needs: [validate, release]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    if: github.repository_owner == 'johnsonlee'
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || env.RELEASE_TAG }}
    # A real release takes the binaries from the GitHub Release it just published; a
    # dry run takes the same tarballs from this run's `binaries` artifacts.
    - name: Take the Linux binaries from this run (dry run)
      if: env.DRY_RUN == 'true'
      uses: actions/download-artifact@v8
      with:
        pattern: binaries-*-linux-musl
        merge-multiple: true
        path: .
    - name: Download the Linux binaries from the GitHub Release
      run: |
        for PAIR in x86_64-unknown-linux-musl:amd64 aarch64-unknown-linux-musl:arm64; do
          TARGET=${PAIR%%:*}; ARCH=${PAIR##*:}
          ASSET="graphite-${RELEASE_VERSION}-${TARGET}.tar.gz"
          if [ "${DRY_RUN}" != true ]; then
            gh release download "${RELEASE_TAG}" -p "${ASSET}" -p "${ASSET}.sha256" -D .
          fi
          sha256sum -c "${ASSET}.sha256"
          mkdir -p "release-assets/linux/${ARCH}"
          tar -xzf "${ASSET}" -C "release-assets/linux/${ARCH}" graphite
        done
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/setup-qemu-action@v4
    - uses: docker/setup-buildx-action@v4
    - name: Login to GitHub Container Registry
      if: env.DRY_RUN != 'true'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Login to Docker Hub
      if: env.DRY_RUN != 'true'
      uses: docker/login-action@v4
      with:
        username: johnsonlee
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Extract Docker metadata
      id: docker_meta
      uses: docker/metadata-action@v6
      with:
        images: |
          ghcr.io/johnsonlee/graphite-explore
          docker.io/johnsonlee/graphite-explore
        tags: |
          type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
          type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
          type=semver,pattern={{major}},value=${{ env.RELEASE_TAG }}
          type=raw,value=latest,enable=${{ needs.validate.outputs.prerelease == 'false' }}
        labels: |
          org.opencontainers.image.title=graphite-explore
          org.opencontainers.image.description=Interactive web visualization for Graphite static analysis graphs
          org.opencontainers.image.source=https://github.com/johnsonlee/graphite
          org.opencontainers.image.licenses=Apache-2.0
    # The pushed image is never run by this workflow otherwise: build the runner's
    # architecture alone first and start the binary from it.
    - name: Build and run the image for the runner's architecture
      uses: docker/build-push-action@v7
      with:
        context: .
        file: backend/explore/Dockerfile
        platforms: linux/amd64
        load: true
        tags: graphite-explore:smoke
        build-args: |
          VERSION=${{ env.RELEASE_TAG }}
    - name: Check the image starts and reports the release version
      run: |
        docker run --rm --entrypoint /app/graphite graphite-explore:smoke --version | grep -F "${RELEASE_VERSION}"
        docker run --rm graphite-explore:smoke --help | grep -F -- '--graph'
    # In a dry run both architectures are still built (arm64 under QEMU), nothing is pushed.
    - name: Build and push graphite-explore image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: backend/explore/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: ${{ env.DRY_RUN != 'true' }}
        tags: ${{ steps.docker_meta.outputs.tags }}
        labels: ${{ steps.docker_meta.outputs.labels }}
        build-args: |
          VERSION=${{ env.RELEASE_TAG }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
