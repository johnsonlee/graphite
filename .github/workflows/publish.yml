name: Publish

on:
  push:
    tags:
      - 'v*'
  repository_dispatch:
    types: [publish]

env:
  RELEASE_TAG: ${{ github.event.client_payload.tag || github.ref_name }}

jobs:
  # ---- Maven Central (Sonatype) ----
  maven:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    if: github.repository_owner == 'johnsonlee'
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.RELEASE_TAG }}
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: Resolve release version
      run: |
        if [ -z "${RELEASE_TAG:-}" ] || [ "${RELEASE_TAG#v}" = "${RELEASE_TAG}" ]; then
          echo "RELEASE_TAG must be a v-prefixed tag, got '${RELEASE_TAG:-<empty>}'" >&2
          exit 1
        fi
        echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "${GITHUB_ENV}"
    - name: Publish to Sonatype Central
      run: |
        echo "Publishing version ${RELEASE_VERSION} ..."
        echo "Create GPG private key"
        echo $GPG_KEY_ARMOR | base64 --decode > ${GITHUB_WORKSPACE}/secring.gpg
        ./gradlew clean publishMavenJavaPublicationToSonatypeRepository closeAndReleaseSonatypeStagingRepository -S --no-daemon \
            -Pversion=${RELEASE_VERSION} \
            -POSSRH_USERNAME=${OSSRH_USERNAME} \
            -POSSRH_PASSWORD=${OSSRH_PASSWORD} \
            -POSSRH_PACKAGE_GROUP=${OSSRH_PACKAGE_GROUP} \
            -Psigning.keyId=${GPG_KEY_ID} \
            -Psigning.password=${GPG_PASSPHRASE} \
            -Psigning.secretKeyRingFile=${GITHUB_WORKSPACE}/secring.gpg
      env:
        JAVA_OPTS: -Xmx8g -XX:MetaspaceSize=512m -Dfile.encoding=UTF-8
        JVM_OPTS: -Xmx8g -XX:MetaspaceSize=512m -Dfile.encoding=UTF-8
        GPG_KEY_ARMOR: ${{ secrets.GPG_KEY_ARMOR }}
        GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
        OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
        OSSRH_PACKAGE_GROUP: ${{ secrets.OSSRH_PACKAGE_GROUP }}

  # ---- GitHub Release + Homebrew tap ----
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    if: github.repository_owner == 'johnsonlee'
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.RELEASE_TAG }}
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: Resolve release version
      run: |
        if [ -z "${RELEASE_TAG:-}" ] || [ "${RELEASE_TAG#v}" = "${RELEASE_TAG}" ]; then
          echo "RELEASE_TAG must be a v-prefixed tag, got '${RELEASE_TAG:-<empty>}'" >&2
          exit 1
        fi
        echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "${GITHUB_ENV}"
    - name: Build CLI shadow JARs
      run: |
        ./gradlew :query:shadowJar --no-daemon -Pversion=${RELEASE_VERSION}
        mkdir -p release-assets
        cp graphite-query/build/libs/graphite.jar release-assets/graphite.jar
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: Release ${{ env.RELEASE_TAG }}
        tag_name: ${{ env.RELEASE_TAG }}
        generate_release_notes: true
        files: release-assets/*.jar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Update Homebrew tap
      env:
        HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      run: |
        if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
          echo "HOMEBREW_TAP_TOKEN not set — skipping tap update"
          exit 0
        fi

        QUERY_SHA=$(sha256sum release-assets/graphite.jar | awk '{print $1}')

        git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/johnsonlee/homebrew-tap.git" tap
        cd tap
        mkdir -p Formula

        cat > Formula/graphite.rb <<RUBY
        class Graphite < Formula
          desc "Build, query, and serve Graphite static analysis graphs"
          homepage "https://github.com/johnsonlee/graphite"
          url "https://github.com/johnsonlee/graphite/releases/download/v${RELEASE_VERSION}/graphite.jar"
          version "${RELEASE_VERSION}"
          sha256 "${QUERY_SHA}"
          license "Apache-2.0"

          depends_on "openjdk@17"

          def install
            libexec.install "graphite.jar"
            (bin/"graphite").write <<~EOS
              #!/bin/bash
              export JAVA_TOOL_OPTIONS="\${JAVA_TOOL_OPTIONS:-\${JAVA_OPTS:--Xmx8g}}"
              AGENT_ARGS=""
              PASSTHROUGH_ARGS=()
              for arg in "\$@"; do
                if [ "\$arg" = "--profile" ]; then
                  PROFILE_OUT="\${GRAPHITE_PROFILE:-profile.html}"
                  AP_LIB=""
                  ASPROF="\$(which asprof 2>/dev/null)"
                  if [ -n "\$ASPROF" ]; then
                    AP_DIR="\$(dirname "\$ASPROF")/../lib"
                    for ext in dylib so; do
                      [ -f "\$AP_DIR/libasyncProfiler.\$ext" ] && AP_LIB="\$AP_DIR/libasyncProfiler.\$ext" && break
                    done
                  fi
                  if [ -n "\$AP_LIB" ]; then
                    AGENT_ARGS="-agentpath:\$AP_LIB=start,event=cpu,file=\$PROFILE_OUT"
                  else
                    echo "async-profiler not found. Install: brew install async-profiler" >&2
                    exit 1
                  fi
                else
                  PASSTHROUGH_ARGS+=("\$arg")
                fi
              done
              exec "#{formula_opt_bin("openjdk@17")}/java" \$AGENT_ARGS -jar "#{libexec}/graphite.jar" "\${PASSTHROUGH_ARGS[@]}"
            EOS
          end

          test do
            assert_match "Usage", shell_output("#{bin}/graphite --help")
          end
        end
        RUBY

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        # The unversioned formulae track the current release. Version-pinned
        # formulae are maintained directly in the tap without cutting duplicate
        # Graphite releases.
        git add Formula/graphite.rb
        if ! git diff --cached --quiet; then
          git commit -m "graphite ${RELEASE_VERSION}"
          git push origin main
        fi

  # ---- Docker image (depends on release for the pre-built jar) ----
  docker:
    needs: release
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    if: github.repository_owner == 'johnsonlee'
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.RELEASE_TAG }}
    - name: Resolve release version
      run: |
        if [ -z "${RELEASE_TAG:-}" ] || [ "${RELEASE_TAG#v}" = "${RELEASE_TAG}" ]; then
          echo "RELEASE_TAG must be a v-prefixed tag, got '${RELEASE_TAG:-<empty>}'" >&2
          exit 1
        fi
        echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "${GITHUB_ENV}"
    - name: Download graphite jar from GitHub Release
      run: |
        gh release download "${RELEASE_TAG}" -p "graphite.jar" -D .
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/setup-qemu-action@v3
    - uses: docker/setup-buildx-action@v3
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: johnsonlee
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Extract Docker metadata
      id: docker_meta
      uses: docker/metadata-action@v5
      with:
        images: |
          ghcr.io/johnsonlee/graphite-explore
          docker.io/johnsonlee/graphite-explore
        tags: |
          type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
          type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
          type=semver,pattern={{major}},value=${{ env.RELEASE_TAG }}
          type=raw,value=latest,enable=${{ !contains(env.RELEASE_TAG, '-') }}
        labels: |
          org.opencontainers.image.title=graphite-explore
          org.opencontainers.image.description=Interactive web visualization for Graphite static analysis graphs
          org.opencontainers.image.source=https://github.com/johnsonlee/graphite
          org.opencontainers.image.licenses=Apache-2.0
    - name: Build and push graphite-explore image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: graphite-explore/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.docker_meta.outputs.tags }}
        labels: ${{ steps.docker_meta.outputs.labels }}
        build-args: |
          VERSION=${{ env.RELEASE_TAG }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # ---- npm (MCP server) ----
  npm:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    if: github.repository_owner == 'johnsonlee'
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.RELEASE_TAG }}
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        registry-url: 'https://registry.npmjs.org'
    - name: Resolve release version
      run: |
        if [ -z "${RELEASE_TAG:-}" ] || [ "${RELEASE_TAG#v}" = "${RELEASE_TAG}" ]; then
          echo "RELEASE_TAG must be a v-prefixed tag, got '${RELEASE_TAG:-<empty>}'" >&2
          exit 1
        fi
        echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "${GITHUB_ENV}"
    - name: Publish graphite-mcp to npm
      working-directory: graphite-mcp
      run: |
        npm version "$RELEASE_VERSION" --no-git-tag-version
        npm install
        npm run build
        npm publish
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
