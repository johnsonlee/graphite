name: Go server

on:
  pull_request:
    paths:
      - 'graphite-server/**'
      - 'graphite-cypher/src/main/antlr/**'
      - 'graphite-explore/src/main/resources/web/**'
      - '.github/workflows/go-server.yml'
      - 'scripts/native/**'
      - 'graphite-explore/build.gradle.kts'
      - 'graphite-query/build.gradle.kts'
      - 'graphite-explore/src/main/kotlin/io/johnsonlee/graphite/cli/NativeServerLauncher.kt'
  push:
    branches: [main]
    paths:
      - 'graphite-server/**'
      - 'graphite-cypher/src/main/antlr/**'
      - 'graphite-explore/src/main/resources/web/**'
      - '.github/workflows/go-server.yml'
      - 'scripts/native/**'
      - 'graphite-explore/build.gradle.kts'
      - 'graphite-query/build.gradle.kts'
      - 'graphite-explore/src/main/kotlin/io/johnsonlee/graphite/cli/NativeServerLauncher.kt'

permissions:
  contents: read

jobs:
  native-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: graphite-server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: graphite-server/go.mod
          cache-dependency-path: graphite-server/go.sum
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Regenerate parser and shared frontend assets
        run: |
          python3 internal/web/generate.py --check
          python3 internal/web/test_generate.py
          go generate ./internal/cypher ./internal/web
          git diff --exit-code -- internal/cypher/generated internal/web/assets
      - name: Verify native behavior and races
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Verify benchmark failure evidence handling
        run: python3 -W error::ResourceWarning scripts/test_benchmark_http.py
      - name: Verify native packaging tools
        working-directory: .
        run: |
          go test -race scripts/native/build.go scripts/native/build_test.go
          go vet scripts/native/build.go scripts/native/build_test.go
      - name: Verify installed native JARs and distributions
        working-directory: .
        run: |
          ./gradlew :query:shadowJar :explore:shadowJar :query:installDist :explore:installDist --no-daemon -Pversion=0.0.0-ci -Pgraphite.nativeTargets=host
          python3 -W error::ResourceWarning scripts/native/smoke.py --output native-package-smoke.json
      - name: Retain package smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-package-smoke-${{ matrix.os }}
          path: native-package-smoke.json
      - name: Build standalone server without CGo
        run: CGO_ENABLED=0 go build -o /tmp/graphite-server ./cmd/graphite-server

  # This workflow is a correctness gate. Full64 real-data performance acceptance
  # remains mandatory and is documented in graphite-server/scripts/README.md;
  # tiny test fixtures must never substitute for that performance gate.
