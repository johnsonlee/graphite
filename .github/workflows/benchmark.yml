          test -n "${JAR}"
          java -Xmx4g -XX:ActiveProcessorCount=4 -cp "${JAR}" \
            io.johnsonlee.graphite.webgraph.MappedAdmissionCorrectness | tee "benchmark-results/${REVISION}-budgeted-string.log"
        done
        node candidate/.github/scripts/benchmark-correctness.mjs budgeted-string \
