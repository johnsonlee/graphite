name: Benchmark correctness and OOM

on:
  pull_request:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  harness:
    name: benchmark-harness-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      comparison-base: ${{ steps.sources.outputs.comparison-base }}
      controller-ref: ${{ steps.sources.outputs.controller-ref }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Resolve product ancestry and trusted controller source
      id: sources
      env:
        TARGET_BASE: ${{ github.event.pull_request.base.sha }}
        PR_HEAD: ${{ github.event.pull_request.head.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        test "$(git rev-parse HEAD)" = "$PR_HEAD"
        comparison_base=$(git merge-base "$TARGET_BASE" "$PR_HEAD")
        controller_ref="$TARGET_BASE"
        if ! git cat-file -e "$TARGET_BASE:benchmark/Cargo.toml" 2>/dev/null; then
          # One reviewed migration snapshot, never the candidate's moving HEAD.
          test "$GITHUB_REPOSITORY" = johnsonlee/graphite
          test "$PR_NUMBER" = 179
          test "$TARGET_BASE" = 7c693e0f29ef5abf318640bdb20c31bf84d8818e
          controller_ref=7089c5fde5de9fd27e77ece3bb594ffa9e300dfc
        fi
        echo "comparison-base=$comparison_base" >> "$GITHUB_OUTPUT"
        echo "controller-ref=$controller_ref" >> "$GITHUB_OUTPUT"
    - name: Checkout trusted controller and frontend harness
      uses: actions/checkout@v7
      with:
        ref: ${{ steps.sources.outputs.controller-ref }}
        path: trusted
        persist-credentials: false
    - name: Setup trusted CI script runtime
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: trusted/.github/scripts/package.json
    - name: Check and test the trusted comment publisher
      working-directory: trusted/.github/scripts
      run: |
        bun install --frozen-lockfile
        bun run check
        bun test benchmark
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: trusted
    - name: Verify the trusted benchmark controller
      working-directory: trusted
      run: |
        cargo fmt --all --check
        cargo clippy --locked -p graphite-benchmark --all-targets -- -D warnings
        cargo test --locked -p graphite-benchmark
        cargo build --release --locked -p graphite-benchmark
    - uses: actions/upload-artifact@v7
      with:
        name: benchmark-controller
        path: trusted/target/release/graphite-benchmark
        if-no-files-found: error
        # Reuse the same binary when only failed downstream jobs are rerun.
        overwrite: true
        retention-days: 30

  compare:
    name: benchmark-base-head
    needs: harness
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
    - name: Checkout exact base
      uses: actions/checkout@v7
      with:
        ref: ${{ needs.harness.outputs.comparison-base }}
        path: base
        persist-credentials: false
    - name: Checkout exact product head
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: head
        persist-credentials: false
    - name: Checkout the matching trusted frontend harness
      uses: actions/checkout@v7
      with:
        ref: ${{ needs.harness.outputs.controller-ref }}
        path: trusted
        persist-credentials: false
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
    - uses: dtolnay/rust-toolchain@stable
    - uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: true
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          base
          head
    - uses: actions/download-artifact@v8
      with:
        name: benchmark-controller
        path: controller
    - name: Run matched base/head correctness, OOM and timing report
      id: benchmark
      run: |
        chmod +x controller/graphite-benchmark
        controller/graphite-benchmark run \
          --base-source base --head-source head --harness-source trusted \
          --output benchmark-run
    - name: Finalize retained evidence even after an interrupted controller
      if: always() && steps.benchmark.outcome != 'skipped'
      run: controller/graphite-benchmark report --run benchmark-run
    - name: Publish Markdown summary
      if: always()
      run: |
        if test -f benchmark-run/report/summary.md; then cat benchmark-run/report/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
    - name: Retain report for the PR comment
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-report-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
        path: benchmark-run/report/
        if-no-files-found: warn
        retention-days: 30
    - name: Retain raw evidence and failures
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-evidence-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
        path: |
          benchmark-run/results/**/suite.json
          benchmark-run/results/**/*.json
          benchmark-run/results/**/*.log
          benchmark-run/results/**/*.receipt
          benchmark-run/results/**/*.tsv
          benchmark-run/results/**/*.txt
          benchmark-run/execution.json
          benchmark-run/prepared/preparation.json
          benchmark-run/prepared/**/source-tree.txt
          benchmark-run/prepared/**/product-identity.txt
          benchmark-run/prepared/**/*.log
        if-no-files-found: warn
        retention-days: 14

  benchmark-regression-gate:
    # Keep the existing required-check name. Performance deltas never decide this check.
    name: benchmark-regression-gate
    if: always()
    needs: [harness, compare]
    runs-on: ubuntu-24.04
    steps:
    - name: Require correctness and OOM completion
      env:
        HARNESS_RESULT: ${{ needs.harness.result }}
        COMPARISON_RESULT: ${{ needs.compare.result }}
      run: |
        test "$HARNESS_RESULT" = success
        test "$COMPARISON_RESULT" = success
