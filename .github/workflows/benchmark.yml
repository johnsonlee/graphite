name: Benchmark regression

on:
  pull_request:
    branches: ['*']

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: benchmark-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  JAVA_OPTS: -Xmx2g -XX:MetaspaceSize=512m -Dfile.encoding=UTF-8
  JVM_OPTS: -Xmx2g -XX:MetaspaceSize=512m -Dfile.encoding=UTF-8
  PRE_PR_95_BASELINE_SHA: 44b57562f2b3d0c88882a9002bdc488e05e5d7a7
  BUDGETED_LOOKUP_BASELINE_SHA: 87c74c2cae0685e40e32fb2eb46b33987ec1a7a0
  BUDGETED_COLLECTION_BASELINE_SHA: e070eb8183b55665863a4f8496b9515163575560

jobs:
  method-level:
    name: method-level-benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout base
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: base

    - name: Checkout PR
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: candidate

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: true

    - name: Test benchmark gate logic
      run: node --test candidate/.github/scripts/benchmark-gate.test.mjs

    - name: Build JMH jars
      run: |
        cp candidate/graphite-cypher/src/jmh/kotlin/io/johnsonlee/graphite/cypher/BudgetedCypherBenchmark.kt \
          base/graphite-cypher/src/jmh/kotlin/io/johnsonlee/graphite/cypher/BudgetedCypherBenchmark.kt
        base/gradlew -p base :cypher:jmhJar --no-daemon
        candidate/gradlew -p candidate :cypher:jmhJar --no-daemon

    - name: Benchmark base
      run: |
        mkdir -p benchmark-results
        JMH_JAR=$(find base/graphite-cypher/build/libs -name '*-jmh.jar' -print -quit)
        test -n "${JMH_JAR}"
        java -jar "${JMH_JAR}" \
          'io.johnsonlee.graphite.cypher.(CypherBenchmark.*|BudgetedCypherBenchmark.budgetedGeneralRegex)' \
          -foe true -rf json -rff "${PWD}/benchmark-results/base-jmh.json"

    - name: Benchmark PR
      run: |
        JMH_JAR=$(find candidate/graphite-cypher/build/libs -name '*-jmh.jar' -print -quit)
        test -n "${JMH_JAR}"
        java -jar "${JMH_JAR}" \
          'io.johnsonlee.graphite.cypher.(CypherBenchmark.*|BudgetedCypherBenchmark.budgetedGeneralRegex)' \
          -foe true -rf json -rff "${PWD}/benchmark-results/candidate-jmh.json"

    - name: Compare method-level results
      run: |
        if node candidate/.github/scripts/benchmark-gate.mjs compare-jmh \
          --base benchmark-results/base-jmh.json \
          --candidate benchmark-results/candidate-jmh.json \
          --threshold 15 \
          --report benchmark-results/initial-method-report.md \
          --status benchmark-results/initial-method-status.json; then
          mv benchmark-results/initial-method-report.md benchmark-results/method-report.md
          mv benchmark-results/initial-method-status.json benchmark-results/method-status.json
        else
          CANDIDATE_JAR=$(find candidate/graphite-cypher/build/libs -name '*-jmh.jar' -print -quit)
          BASE_JAR=$(find base/graphite-cypher/build/libs -name '*-jmh.jar' -print -quit)
          java -jar "${CANDIDATE_JAR}" \
            'io.johnsonlee.graphite.cypher.(CypherBenchmark.*|BudgetedCypherBenchmark.budgetedGeneralRegex)' \
            -foe true -rf json -rff "${PWD}/benchmark-results/candidate-jmh-confirmation.json"
          java -jar "${BASE_JAR}" \
            'io.johnsonlee.graphite.cypher.(CypherBenchmark.*|BudgetedCypherBenchmark.budgetedGeneralRegex)' \
            -foe true -rf json -rff "${PWD}/benchmark-results/base-jmh-confirmation.json"
          node candidate/.github/scripts/benchmark-gate.mjs confirm-jmh \
            --initial benchmark-results/initial-method-status.json \
            --base benchmark-results/base-jmh-confirmation.json \
            --candidate benchmark-results/candidate-jmh-confirmation.json \
            --threshold 15 \
            --report benchmark-results/method-report.md \
            --status benchmark-results/method-status.json
        fi

    - name: Upload method-level results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-method-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
        path: benchmark-results/
        if-no-files-found: warn
        retention-days: 14

  budgeted-collection:
    name: budgeted-collection-latency
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout cancellable collection baseline
      uses: actions/checkout@v7
      with:
        ref: ${{ env.BUDGETED_COLLECTION_BASELINE_SHA }}
        path: baseline

    - name: Checkout PR
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: candidate

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: true

    - name: Install identical budgeted collection harness in baseline
      run: |
        HARNESS='graphite-cypher/src/jmh/kotlin/io/johnsonlee/graphite/cypher/BudgetedCypherBenchmark.kt'
        cp "candidate/${HARNESS}" "baseline/${HARNESS}"

    - name: Build budgeted collection JMH jars
      run: |
        baseline/gradlew -p baseline :cypher:jmhJar --no-daemon
        candidate/gradlew -p candidate :cypher:jmhJar --no-daemon

    - name: Benchmark baseline then PR
      run: |
        mkdir -p benchmark-results
        BASELINE_JAR=$(find baseline/graphite-cypher/build/libs -name '*-jmh.jar' -print -quit)
        CANDIDATE_JAR=$(find candidate/graphite-cypher/build/libs -name '*-jmh.jar' -print -quit)
        test -n "${BASELINE_JAR}" && test -n "${CANDIDATE_JAR}"
        java -jar "${BASELINE_JAR}" \
          'io.johnsonlee.graphite.cypher.BudgetedCypherBenchmark.budgeted(ListConcatenation|ListMembership)' \
          -foe true -rf json -rff "${PWD}/benchmark-results/baseline-budgeted-collection.json"
        java -jar "${CANDIDATE_JAR}" \
          'io.johnsonlee.graphite.cypher.BudgetedCypherBenchmark.budgeted(ListConcatenation|ListMembership)' \
          -foe true -rf json -rff "${PWD}/benchmark-results/candidate-budgeted-collection.json"

    - name: Compare budgeted collection latency
      run: |
        if node candidate/.github/scripts/benchmark-gate.mjs compare-jmh \
          --base benchmark-results/baseline-budgeted-collection.json \
          --candidate benchmark-results/candidate-budgeted-collection.json \
          --threshold 15 \
          --title 'Budgeted collection latency' \
          --report benchmark-results/initial-budgeted-collection-report.md \
          --status benchmark-results/initial-budgeted-collection-status.json; then
          mv benchmark-results/initial-budgeted-collection-report.md \
            benchmark-results/budgeted-collection-report.md
          mv benchmark-results/initial-budgeted-collection-status.json \
            benchmark-results/budgeted-collection-status.json
        else
          BASELINE_JAR=$(find baseline/graphite-cypher/build/libs -name '*-jmh.jar' -print -quit)
          CANDIDATE_JAR=$(find candidate/graphite-cypher/build/libs -name '*-jmh.jar' -print -quit)
          java -jar "${CANDIDATE_JAR}" \
            'io.johnsonlee.graphite.cypher.BudgetedCypherBenchmark.budgeted(ListConcatenation|ListMembership)' \
            -foe true -rf json \
            -rff "${PWD}/benchmark-results/candidate-budgeted-collection-confirmation.json"
          java -jar "${BASELINE_JAR}" \
            'io.johnsonlee.graphite.cypher.BudgetedCypherBenchmark.budgeted(ListConcatenation|ListMembership)' \
            -foe true -rf json \
            -rff "${PWD}/benchmark-results/baseline-budgeted-collection-confirmation.json"
          node candidate/.github/scripts/benchmark-gate.mjs confirm-jmh \
            --initial benchmark-results/initial-budgeted-collection-status.json \
            --base benchmark-results/baseline-budgeted-collection-confirmation.json \
            --candidate benchmark-results/candidate-budgeted-collection-confirmation.json \
            --threshold 15 \
            --title 'Budgeted collection latency' \
            --report benchmark-results/budgeted-collection-report.md \
            --status benchmark-results/budgeted-collection-status.json
        fi

    - name: Upload budgeted collection results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-budgeted-collection-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
        path: benchmark-results/
        if-no-files-found: warn
        retention-days: 14

  budgeted-mapped-string:
    name: budgeted-mapped-string-latency
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout budgeted lookup baseline
      uses: actions/checkout@v7
      with:
        ref: ${{ env.BUDGETED_LOOKUP_BASELINE_SHA }}
        path: baseline

    - name: Checkout PR
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: candidate

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: true

    - name: Install identical budgeted lookup harness in baseline
      run: |
        HARNESS='graphite-webgraph/src/jmh/kotlin/io/johnsonlee/graphite/webgraph/MappedStringAdmissionBenchmark.kt'
        cp "candidate/${HARNESS}" "baseline/${HARNESS}"

    - name: Build budgeted lookup JMH jars
      run: |
        baseline/gradlew -p baseline :webgraph:jmhJar --no-daemon
        candidate/gradlew -p candidate :webgraph:jmhJar --no-daemon

    - name: Benchmark baseline then PR
      run: |
        mkdir -p benchmark-results
        BASELINE_JAR=$(find baseline/graphite-webgraph/build/libs -name '*-jmh.jar' -print -quit)
        CANDIDATE_JAR=$(find candidate/graphite-webgraph/build/libs -name '*-jmh.jar' -print -quit)
        test -n "${BASELINE_JAR}" && test -n "${CANDIDATE_JAR}"
        java -jar "${BASELINE_JAR}" \
          'io.johnsonlee.graphite.webgraph.MappedStringAdmissionBenchmark.budgetedTransformedZeroHit' \
          -foe true -rf json -rff "${PWD}/benchmark-results/baseline-budgeted-string.json"
        java -jar "${CANDIDATE_JAR}" \
          'io.johnsonlee.graphite.webgraph.MappedStringAdmissionBenchmark.budgetedTransformedZeroHit' \
          -foe true -rf json -rff "${PWD}/benchmark-results/candidate-budgeted-string.json"

    - name: Compare budgeted lookup latency
      run: |
        if node candidate/.github/scripts/benchmark-gate.mjs compare-jmh \
          --base benchmark-results/baseline-budgeted-string.json \
          --candidate benchmark-results/candidate-budgeted-string.json \
          --threshold 15 \
          --threshold-only \
          --title 'Budgeted mapped-string latency' \
          --report benchmark-results/initial-budgeted-string-report.md \
          --status benchmark-results/initial-budgeted-string-status.json; then
          mv benchmark-results/initial-budgeted-string-report.md benchmark-results/budgeted-string-report.md
          mv benchmark-results/initial-budgeted-string-status.json benchmark-results/budgeted-string-status.json
        else
          BASELINE_JAR=$(find baseline/graphite-webgraph/build/libs -name '*-jmh.jar' -print -quit)
          CANDIDATE_JAR=$(find candidate/graphite-webgraph/build/libs -name '*-jmh.jar' -print -quit)
          java -jar "${CANDIDATE_JAR}" \
            'io.johnsonlee.graphite.webgraph.MappedStringAdmissionBenchmark.budgetedTransformedZeroHit' \
            -foe true -rf json -rff "${PWD}/benchmark-results/candidate-budgeted-string-confirmation.json"
          java -jar "${BASELINE_JAR}" \
            'io.johnsonlee.graphite.webgraph.MappedStringAdmissionBenchmark.budgetedTransformedZeroHit' \
            -foe true -rf json -rff "${PWD}/benchmark-results/baseline-budgeted-string-confirmation.json"
          node candidate/.github/scripts/benchmark-gate.mjs confirm-jmh \
            --initial benchmark-results/initial-budgeted-string-status.json \
            --base benchmark-results/baseline-budgeted-string-confirmation.json \
            --candidate benchmark-results/candidate-budgeted-string-confirmation.json \
            --threshold 15 \
            --threshold-only \
            --title 'Budgeted mapped-string latency' \
            --report benchmark-results/budgeted-string-report.md \
            --status benchmark-results/budgeted-string-status.json
        fi

    - name: Upload budgeted lookup results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-budgeted-string-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
        path: benchmark-results/
        if-no-files-found: warn
        retention-days: 14

  large-corpus:
    name: large-corpus-benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout base
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: base

    - name: Checkout PR
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: candidate

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: true

    - name: Benchmark PR large corpora
      run: |
        set -o pipefail
        mkdir -p benchmark-results
        candidate/gradlew -p candidate :webgraph:largeCorpusTest \
          -Dlarge.corpus.record=true --no-daemon 2>&1 \
          | tee benchmark-results/candidate-large-corpus.log

    - name: Benchmark base large corpora
      run: |
        set -o pipefail
        base/gradlew -p base :webgraph:largeCorpusTest \
          -Dlarge.corpus.record=true --no-daemon 2>&1 \
          | tee benchmark-results/base-large-corpus.log

    - name: Compare large-corpus results
      run: |
        if node candidate/.github/scripts/benchmark-gate.mjs compare-large-corpus \
          --base benchmark-results/base-large-corpus.log \
          --candidate benchmark-results/candidate-large-corpus.log \
          --report benchmark-results/initial-large-corpus-report.md \
          --status benchmark-results/initial-large-corpus-status.json; then
          mv benchmark-results/initial-large-corpus-report.md benchmark-results/large-corpus-report.md
          mv benchmark-results/initial-large-corpus-status.json benchmark-results/large-corpus-status.json
        else
          set -o pipefail
          base/gradlew -p base :webgraph:largeCorpusTest \
            -Dlarge.corpus.record=true --no-daemon 2>&1 \
            | tee benchmark-results/base-large-corpus-confirmation.log
          candidate/gradlew -p candidate :webgraph:largeCorpusTest \
            -Dlarge.corpus.record=true --no-daemon 2>&1 \
            | tee benchmark-results/candidate-large-corpus-confirmation.log
          node candidate/.github/scripts/benchmark-gate.mjs confirm-large-corpus \
            --initial benchmark-results/initial-large-corpus-status.json \
            --base benchmark-results/base-large-corpus-confirmation.log \
            --candidate benchmark-results/candidate-large-corpus-confirmation.log \
            --report benchmark-results/large-corpus-report.md \
            --status benchmark-results/large-corpus-status.json
        fi

    - name: Upload large-corpus results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-large-corpus-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
        path: benchmark-results/
        if-no-files-found: warn
        retention-days: 14

  prepare-latency-fixtures:
    name: prepare-latency-fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout PR
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: candidate

    - name: Restore or save persisted fixture graphs
      id: fixture-cache
      uses: actions/cache@v5
      with:
        path: fixture-graphs
        key: ${{ runner.os }}-${{ runner.arch }}-wrapped-query-fixtures-v2-${{ hashFiles('candidate/gradle/libs.versions.toml', 'candidate/gradle/wrapper/gradle-wrapper.properties', 'candidate/settings.gradle.kts', 'candidate/**/build.gradle.kts', 'candidate/graphite-core/src/main/**', 'candidate/graphite-sootup/src/main/**', 'candidate/graphite-webgraph/src/main/**', 'candidate/graphite-webgraph/src/jmh/kotlin/io/johnsonlee/graphite/webgraph/BenchmarkCorpus.kt', 'candidate/graphite-webgraph/src/jmh/kotlin/io/johnsonlee/graphite/webgraph/AllFixtureBenchmarkGraphPreparation.kt') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-wrapped-query-fixtures-v1-a7ddb452997f5699a3233189a81be5020d3d8dd2f52b6cabee950de13689ed10

    - name: Detect complete persisted fixture cache
      id: fixture-cache-state
      run: |
        READY=true
        test -f fixture-graphs/.complete || READY=false
        for CORPUS in android tika hive kotlin-compiler; do
          test -d "fixture-graphs/${CORPUS}" || READY=false
        done
        echo "ready=${READY}" >> "${GITHUB_OUTPUT}"

    - name: Setup Java
      if: steps.fixture-cache-state.outputs.ready != 'true'
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Setup Gradle
      if: steps.fixture-cache-state.outputs.ready != 'true'
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: true

    - name: Build fixture preparation harness
      if: steps.fixture-cache-state.outputs.ready != 'true'
      run: |
        candidate/gradlew -p candidate :webgraph:prepareBenchmarkFixtures :webgraph:jmhJar --no-daemon

    - name: Prepare all real fixture graphs
      if: steps.fixture-cache-state.outputs.ready != 'true'
      run: |
        FIXTURE_DIR="${PWD}/candidate/graphite-webgraph/build/benchmark-fixtures"
        ANDROID_JAR=$(find "${FIXTURE_DIR}" -name 'android-all-*.jar' -print -quit)
        TIKA_JAR=$(find "${FIXTURE_DIR}" -name 'tika-app-*.jar' -print -quit)
        HIVE_JAR=$(find "${FIXTURE_DIR}" -name 'hive-exec-*.jar' -print -quit)
        KOTLIN_JAR=$(find "${FIXTURE_DIR}" -name 'kotlin-compiler-embeddable-*.jar' -print -quit)
        CANDIDATE_JAR=$(find candidate/graphite-webgraph/build/libs -name '*-jmh.jar' -print -quit)
        test -n "${ANDROID_JAR}" && test -n "${TIKA_JAR}" && test -n "${HIVE_JAR}" && \
          test -n "${KOTLIN_JAR}" && test -n "${CANDIDATE_JAR}"
        mkdir -p "${PWD}/fixture-graphs"
        for CORPUS in android tika hive kotlin-compiler; do
          SOURCE_TMP=$(mktemp -d "${RUNNER_TEMP}/graphite-source-${CORPUS}-XXXXXX")
          java -Xmx4g -Djava.io.tmpdir="${SOURCE_TMP}" \
            -Dandroid.jar.path="${ANDROID_JAR}" \
            -Dtika.jar.path="${TIKA_JAR}" \
            -Dhive.jar.path="${HIVE_JAR}" \
            -Dkotlin.compiler.jar.path="${KOTLIN_JAR}" \
            -cp "${CANDIDATE_JAR}" \
            io.johnsonlee.graphite.webgraph.AllFixtureBenchmarkGraphPreparation \
            "${CORPUS}" "${PWD}/fixture-graphs/${CORPUS}"
          rm -rf -- "${SOURCE_TMP}"
        done
        java -Xmx4g -cp "${CANDIDATE_JAR}" \
          io.johnsonlee.graphite.webgraph.AllFixtureBenchmarkDistributionCalibration \
          "${PWD}/fixture-graphs"
        touch "${PWD}/fixture-graphs/.complete"

    - name: Verify persisted fixture graph cache
      run: |
        test -f fixture-graphs/.complete
        for CORPUS in android tika hive kotlin-compiler; do
          test -d "fixture-graphs/${CORPUS}"
        done

  wrapped-query-latency-shard:
    name: wrapped-query-latency-shard-${{ matrix.shard }}
    needs: [prepare-latency-fixtures]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
        - shard: synthetic
          real: false
          correctness: false
          filter: 'io.johnsonlee.graphite.webgraph.WrappedDiscoveryLatencyBenchmark.(coldWrappedCaseInsensitiveDiscovery|wrappedCaseInsensitiveDiscovery)'
        - shard: real-a
          real: true
          correctness: true
          filter: 'io.johnsonlee.graphite.webgraph.AllFixtureWrappedDiscoveryLatencyBenchmark.(zeroHitBroadContainsCaseInsensitiveDiscovery|denseDistributedMethodContainsCaseInsensitiveDiscovery)'
        - shard: real-b
          real: true
          correctness: false
          filter: 'io.johnsonlee.graphite.webgraph.AllFixtureWrappedDiscoveryLatencyBenchmark.(earlyGraphClassPrefixCaseInsensitiveDiscovery|middleGraphsClassPrefixCaseInsensitiveDiscovery)'
        - shard: real-c
          real: true
          correctness: false
          filter: 'io.johnsonlee.graphite.webgraph.AllFixtureWrappedDiscoveryLatencyBenchmark.(lateGraphClassPrefixCaseInsensitiveDiscovery|broadlyDistributedClassPrefixCaseInsensitiveDiscovery)'
        - shard: real-d
          real: true
          correctness: false
          filter: 'io.johnsonlee.graphite.webgraph.AllFixtureWrappedDiscoveryLatencyBenchmark.(firstLastGraphBimodalClassPrefixCaseInsensitiveDiscovery|skewedMixedClassMethodOperatorCaseInsensitiveDiscovery)'

    steps:
    - name: Checkout fixed pre-PR-95 baseline
      uses: actions/checkout@v7
      with:
        ref: ${{ env.PRE_PR_95_BASELINE_SHA }}
        path: fixed

    - name: Checkout PR base
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: base

    - name: Checkout PR
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: candidate

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: true

    - name: Restore persisted fixture graphs
      if: matrix.real
      uses: actions/cache/restore@v5
      with:
        path: fixture-graphs
        key: ${{ runner.os }}-${{ runner.arch }}-wrapped-query-fixtures-v2-${{ hashFiles('candidate/gradle/libs.versions.toml', 'candidate/gradle/wrapper/gradle-wrapper.properties', 'candidate/settings.gradle.kts', 'candidate/**/build.gradle.kts', 'candidate/graphite-core/src/main/**', 'candidate/graphite-sootup/src/main/**', 'candidate/graphite-webgraph/src/main/**', 'candidate/graphite-webgraph/src/jmh/kotlin/io/johnsonlee/graphite/webgraph/BenchmarkCorpus.kt', 'candidate/graphite-webgraph/src/jmh/kotlin/io/johnsonlee/graphite/webgraph/AllFixtureBenchmarkGraphPreparation.kt') }}

    - name: Verify restored fixture graphs
      if: matrix.real
      run: |
        test -f fixture-graphs/.complete
        for CORPUS in android tika hive kotlin-compiler; do
          test -d "fixture-graphs/${CORPUS}"
        done

    - name: Install identical latency harness in baselines
      run: |
        for HARNESS in \
          WrappedDiscoveryLatencyBenchmark.kt \
          AllFixtureWrappedDiscoveryLatencyBenchmark.kt; do
          SOURCE="graphite-webgraph/src/jmh/kotlin/io/johnsonlee/graphite/webgraph/${HARNESS}"
          cp "candidate/${SOURCE}" "fixed/${SOURCE}"
          cp "candidate/${SOURCE}" "base/${SOURCE}"
        done

    - name: Build latency benchmark jars
      run: |
        candidate/gradlew -p candidate :webgraph:prepareBenchmarkFixtures --no-daemon
        fixed/gradlew -p fixed :webgraph:jmhJar --no-daemon
        base/gradlew -p base :webgraph:jmhJar --no-daemon
        candidate/gradlew -p candidate :webgraph:jmhJar --no-daemon

    - name: Verify all real-fixture query results
      if: matrix.correctness
      run: |
        set -o pipefail
        mkdir -p benchmark-results
        for REVISION in fixed base candidate; do
          JMH_JAR=$(find "${REVISION}/graphite-webgraph/build/libs" -name '*-jmh.jar' -print -quit)
          test -n "${JMH_JAR}"
          LEGACY_BUDGET_ARGS=()
          if [ "${REVISION}" = fixed ]; then
            LEGACY_BUDGET_ARGS=(-Dgraphite.benchmark.allowLegacyUnbudgetedExecutor=true)
          elif [ "${REVISION}" = base ]; then
            LEGACY_BUDGET_ARGS=(-Dgraphite.benchmark.allowLegacyBudgetDefault=true)
          fi
          java -Xmx8g -cp "${JMH_JAR}" \
            "${LEGACY_BUDGET_ARGS[@]}" \
            io.johnsonlee.graphite.webgraph.AllFixtureBenchmarkQueryCorrectness \
            "${PWD}/fixture-graphs" \
            | tee "benchmark-results/${REVISION}-fixture-correctness.log"
          grep '^ALL_FIXTURE_QUERY_RESULT' \
            "benchmark-results/${REVISION}-fixture-correctness.log" \
            > "benchmark-results/${REVISION}-fixture-correctness.txt"
          test "$(wc -l < "benchmark-results/${REVISION}-fixture-correctness.txt")" -eq 8
        done
        cmp benchmark-results/fixed-fixture-correctness.txt \
          benchmark-results/base-fixture-correctness.txt
        cmp benchmark-results/fixed-fixture-correctness.txt \
          benchmark-results/candidate-fixture-correctness.txt

    - name: Benchmark fixed baseline, PR base, and PR
      env:
        BENCHMARK_FILTER: ${{ matrix.filter }}
        SHARD: ${{ matrix.shard }}
      run: |
        mkdir -p benchmark-results
        FIXED_JAR=$(find fixed/graphite-webgraph/build/libs -name '*-jmh.jar' -print -quit)
        BASE_JAR=$(find base/graphite-webgraph/build/libs -name '*-jmh.jar' -print -quit)
        CANDIDATE_JAR=$(find candidate/graphite-webgraph/build/libs -name '*-jmh.jar' -print -quit)
        test -n "${FIXED_JAR}" && test -n "${BASE_JAR}" && test -n "${CANDIDATE_JAR}"
        GRAPH_JVM_ARGS="-Dandroid.graph.path=${PWD}/fixture-graphs/android \
          -Dtika.graph.path=${PWD}/fixture-graphs/tika \
          -Dhive.graph.path=${PWD}/fixture-graphs/hive \
          -Dkotlin.compiler.graph.path=${PWD}/fixture-graphs/kotlin-compiler"
        FIXED_GRAPH_JVM_ARGS="${GRAPH_JVM_ARGS} \
          -Dgraphite.benchmark.allowLegacyUnbudgetedExecutor=true"
        BASE_GRAPH_JVM_ARGS="${GRAPH_JVM_ARGS} \
          -Dgraphite.benchmark.allowLegacyBudgetDefault=true"
        java -jar "${FIXED_JAR}" \
          "${BENCHMARK_FILTER}" \
          -jvmArgsAppend "${FIXED_GRAPH_JVM_ARGS}" -foe true -prof gc -rf json \
          -rff "${PWD}/benchmark-results/fixed-latency-${SHARD}.json"
        java -jar "${BASE_JAR}" \
          "${BENCHMARK_FILTER}" \
          -jvmArgsAppend "${BASE_GRAPH_JVM_ARGS}" -foe true -prof gc -rf json \
          -rff "${PWD}/benchmark-results/base-latency-${SHARD}.json"
        java -jar "${CANDIDATE_JAR}" \
          "${BENCHMARK_FILTER}" \
          -jvmArgsAppend "${GRAPH_JVM_ARGS}" -foe true -prof gc -rf json \
          -rff "${PWD}/benchmark-results/candidate-latency-${SHARD}.json"

    - name: Enforce fixed baseline speedup and current-base regression gate
      env:
        BENCHMARK_FILTER: ${{ matrix.filter }}
        SHARD: ${{ matrix.shard }}
      run: |
        if node candidate/.github/scripts/benchmark-gate.mjs compare-latency-baseline \
          --fixed "benchmark-results/fixed-latency-${SHARD}.json" \
          --base "benchmark-results/base-latency-${SHARD}.json" \
          --candidate "benchmark-results/candidate-latency-${SHARD}.json" \
          --minimum-speedup 50 \
          --threshold 15 \
          --allow-subset \
          --report "benchmark-results/initial-latency-report-${SHARD}.md" \
          --status "benchmark-results/initial-latency-status-${SHARD}.json"; then
          mv "benchmark-results/initial-latency-report-${SHARD}.md" "benchmark-results/latency-report-${SHARD}.md"
          mv "benchmark-results/initial-latency-status-${SHARD}.json" "benchmark-results/latency-status-${SHARD}.json"
        else
          CANDIDATE_JAR=$(find candidate/graphite-webgraph/build/libs -name '*-jmh.jar' -print -quit)
          BASE_JAR=$(find base/graphite-webgraph/build/libs -name '*-jmh.jar' -print -quit)
          FIXED_JAR=$(find fixed/graphite-webgraph/build/libs -name '*-jmh.jar' -print -quit)
          GRAPH_JVM_ARGS="-Dandroid.graph.path=${PWD}/fixture-graphs/android \
            -Dtika.graph.path=${PWD}/fixture-graphs/tika \
            -Dhive.graph.path=${PWD}/fixture-graphs/hive \
            -Dkotlin.compiler.graph.path=${PWD}/fixture-graphs/kotlin-compiler"
          FIXED_GRAPH_JVM_ARGS="${GRAPH_JVM_ARGS} \
            -Dgraphite.benchmark.allowLegacyUnbudgetedExecutor=true"
          BASE_GRAPH_JVM_ARGS="${GRAPH_JVM_ARGS} \
            -Dgraphite.benchmark.allowLegacyBudgetDefault=true"
          java -jar "${CANDIDATE_JAR}" \
            "${BENCHMARK_FILTER}" \
            -jvmArgsAppend "${GRAPH_JVM_ARGS}" -foe true -prof gc -rf json \
            -rff "${PWD}/benchmark-results/candidate-latency-confirmation-${SHARD}.json"
          java -jar "${BASE_JAR}" \
            "${BENCHMARK_FILTER}" \
            -jvmArgsAppend "${BASE_GRAPH_JVM_ARGS}" -foe true -prof gc -rf json \
            -rff "${PWD}/benchmark-results/base-latency-confirmation-${SHARD}.json"
          java -jar "${FIXED_JAR}" \
            "${BENCHMARK_FILTER}" \
            -jvmArgsAppend "${FIXED_GRAPH_JVM_ARGS}" -foe true -prof gc -rf json \
            -rff "${PWD}/benchmark-results/fixed-latency-confirmation-${SHARD}.json"
          node candidate/.github/scripts/benchmark-gate.mjs confirm-latency-baseline \
            --initial "benchmark-results/initial-latency-status-${SHARD}.json" \
            --fixed "benchmark-results/fixed-latency-confirmation-${SHARD}.json" \
            --base "benchmark-results/base-latency-confirmation-${SHARD}.json" \
            --candidate "benchmark-results/candidate-latency-confirmation-${SHARD}.json" \
            --minimum-speedup 50 \
            --threshold 15 \
            --allow-subset \
            --report "benchmark-results/latency-report-${SHARD}.md" \
            --status "benchmark-results/latency-status-${SHARD}.json"
        fi

    - name: Upload wrapped-query latency results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: latency-shard-${{ matrix.shard }}-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
        path: benchmark-results/
        if-no-files-found: warn
        retention-days: 14

  wrapped-query-latency:
    name: wrapped-query-latency
    if: always()
    needs: [wrapped-query-latency-shard]
    runs-on: ubuntu-latest

    steps:
    - name: Checkout PR reporting code
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}

    - name: Download latency shard results
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        pattern: latency-shard-*-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
        path: benchmark-results
        merge-multiple: true

    - name: Combine latency shard results
      if: always()
      run: |
        mkdir -p benchmark-results
        node .github/scripts/benchmark-gate.mjs combine-latency-shards \
          --directory benchmark-results \
          --report benchmark-results/latency-report.md \
          --status benchmark-results/latency-status.json

    - name: Upload combined wrapped-query latency results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-latency-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
        path: benchmark-results/
        if-no-files-found: error
        retention-days: 14

    - name: Enforce latency shards
      if: always()
      env:
        SHARD_JOB: ${{ needs.wrapped-query-latency-shard.result }}
      run: |
        test "${SHARD_JOB}" = success
        node -e "const s=require('./benchmark-results/latency-status.json'); if(!s.passed) process.exit(1)"

  benchmark-regression-gate:
    name: benchmark-regression-gate
    if: always()
    needs: [method-level, budgeted-collection, budgeted-mapped-string, large-corpus, wrapped-query-latency]
    runs-on: ubuntu-latest

    steps:
    - name: Checkout PR reporting code
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}

    - name: Download benchmark results
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        pattern: benchmark-*-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
        path: benchmark-results
        merge-multiple: true

    - name: Build benchmark report
      if: always()
      run: |
        mkdir -p benchmark-results
        node .github/scripts/benchmark-gate.mjs aggregate \
          --directory benchmark-results \
          --base-sha '${{ github.event.pull_request.base.sha }}' \
          --candidate-sha '${{ github.event.pull_request.head.sha }}' \
          --runner '${{ runner.os }}-${{ runner.arch }}' \
          --run-url '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' \
          --report benchmark-results/benchmark-report.md \
          --status benchmark-results/benchmark-status.json

    - name: Attach benchmark report to PR
      if: always()
      continue-on-error: true
      uses: actions/github-script@v9
      with:
        script: |
          const fs = require('fs');
          const marker = '<!-- graphite-benchmark-regression-gate -->';
          let body;
          try {
            body = fs.readFileSync('benchmark-results/benchmark-report.md', 'utf8');
          } catch (error) {
            body = `${marker}\n## Benchmark Regression Gate\n\n**FAIL**\n\nReport generation failed. ` +
              `[View logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
          }

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            per_page: 100
          });
          const existing = comments.find((comment) => comment.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
          }

    - name: Enforce benchmark gate
      if: always()
      env:
        METHOD_JOB: ${{ needs.method-level.result }}
        BUDGETED_COLLECTION_JOB: ${{ needs.budgeted-collection.result }}
        BUDGETED_STRING_JOB: ${{ needs.budgeted-mapped-string.result }}
        LARGE_CORPUS_JOB: ${{ needs.large-corpus.result }}
        LATENCY_JOB: ${{ needs.wrapped-query-latency.result }}
      run: |
        if [ "${METHOD_JOB}" != success ] || [ "${BUDGETED_COLLECTION_JOB}" != success ] || \
          [ "${BUDGETED_STRING_JOB}" != success ] || \
          [ "${LARGE_CORPUS_JOB}" != success ] || \
          [ "${LATENCY_JOB}" != success ]; then
          echo "::error::Benchmark execution or comparison failed"
          exit 1
        fi
        node -e "const s=require('./benchmark-results/benchmark-status.json'); if(!s.passed) process.exit(1)"
