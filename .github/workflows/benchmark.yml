name: Benchmark regression

on:
  pull_request:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  JAVA_OPTS: -Xmx2g -XX:MetaspaceSize=512m -Dfile.encoding=UTF-8
  JVM_OPTS: -Xmx2g -XX:MetaspaceSize=512m -Dfile.encoding=UTF-8
  # Cap direct Java launchers and inherited forks; explicit per-task heaps take precedence.
  JAVA_TOOL_OPTIONS: -Xmx2g
  MULTIGRAPH_LARGE_CORPUS_CORRECTNESS_SHA256: c056fe730ca0f84b5d1d02c0f46fe1783edb77f39997aa75d4181adba36ddf4c
  MULTIGRAPH_LARGE_CORPUS_4F_CORRECTNESS_SHA256: 69d71cb6b8f72f5cccd3f3273d0ee699a82ac0bfdcee2aaa72df0dc48110f4e2
  MULTIGRAPH_CORRECTNESS_CONTROLS_SHA256: df66c9ef10b8cf45b968dd85479008ee73dd5e7306acafe730a6e790bc7ab0b9
  MULTIGRAPH_PRESSURE_PREPARATION_CONTROLS_SHA256: ca7b8ddf92d378d475cc6fba966314b4edb22c478af2fd68f42efd0b3542ea56
  WRAPPED_QUERY_REFERENCE_SHA: 0b421f8a25800193fd86a7e4aebf72aa9e9d6cc6
  ANCHOR_BOOTSTRAP_COMPARATOR_SHA256: 958523660e5a875505d591534745e7b4cc3e0b7e1cb45145fe069086f716e7bd
  LARGE_CORPUS_LEGACY_HARNESS_SHA256: 66feedea8a6d8087e80c571fa74204a237bc46c5b508735c7150ad82cf74dd93
  LARGE_CORPUS_TRANSITION_HARNESS_SHA256: 9a9817547174323dd26f12ce656083d33408d858d290f1d3544f18f784abd840
  LARGE_CORPUS_TRANSITION_COMPARATOR_SHA256: e29b5cb74064a47871dadb9e25a6f5b471c74fc926ba795824fbe5003729fd55
  LARGE_CORPUS_SHAPE_BASE_HARNESS_SHA256: 9a9817547174323dd26f12ce656083d33408d858d290f1d3544f18f784abd840
  LARGE_CORPUS_SHAPE_CANDIDATE_HARNESS_SHA256: dc0ddb816d2d27921df7a0247b0d02b88c9616ab7fe9125baed05fe03edddd54
  WRAPPED_QUERY_SHAPE_BASE_CORPUS_SHA256: 5c2be9550c0f3e0fa408d5d56375efc4b9e3c78d96b95de1c20718f08aa4dd2b
  WRAPPED_QUERY_SHAPE_CANDIDATE_CORPUS_SHA256: def30380a6a2393797037859b3c3d2cc375af80e7614dc583d6ce12a4021ccf2
  WRAPPED_QUERY_SHAPE_BASE_LATENCY_HARNESS_SHA256: 78ca6a23e8f5e86674296d9f878a828ad8892ed6e18fc616a9ecbcdf2d21c492
  WRAPPED_QUERY_SHAPE_CANDIDATE_LATENCY_HARNESS_SHA256: fbb2259cef6c84bb27e09debf7a2ca7d5dcb836215a3eb737bf56b4eb4f26b1c
  LARGE_CORPUS_SHAPE_COMPARATOR_SHA256: b86ece2b9e3b4945771c7b78829af4314936547317b375016c857dec277788f7
  BENCHMARK_REPORT_TRANSITION_SHA256: b86ece2b9e3b4945771c7b78829af4314936547317b375016c857dec277788f7
