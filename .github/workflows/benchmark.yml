name: Benchmark correctness and OOM

on:
  pull_request:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  harness:
    name: benchmark-harness-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      comparison-base: ${{ steps.sources.outputs.comparison-base }}
      controller-ref: ${{ steps.sources.outputs.controller-ref }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Resolve product ancestry and trusted controller source
      id: sources
      env:
        TARGET_BASE: ${{ github.event.pull_request.base.sha }}
        PR_HEAD: ${{ github.event.pull_request.head.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        test "$(git rev-parse HEAD)" = "$PR_HEAD"
        comparison_base=$(git merge-base "$TARGET_BASE" "$PR_HEAD")
        controller_ref="$TARGET_BASE"
        if ! git cat-file -e "$TARGET_BASE:benchmark/Cargo.toml" 2>/dev/null; then
          # One reviewed migration snapshot, never the candidate's moving HEAD.
          test "$GITHUB_REPOSITORY" = johnsonlee/graphite
          test "$PR_NUMBER" = 179
          test "$TARGET_BASE" = 7c693e0f29ef5abf318640bdb20c31bf84d8818e
          controller_ref=ff654089aeeb1d117f834fc5a5444bd73a78dd53
        fi
        echo "comparison-base=$comparison_base" >> "$GITHUB_OUTPUT"
        echo "controller-ref=$controller_ref" >> "$GITHUB_OUTPUT"
    - name: Checkout trusted controller and frontend harness
      uses: actions/checkout@v7
      with:
        ref: ${{ steps.sources.outputs.controller-ref }}
        path: trusted
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: trusted
    - name: Verify the trusted benchmark controller
      working-directory: trusted
      run: |
        cargo fmt --all --check
        cargo clippy --locked -p graphite-benchmark --all-targets -- -D warnings
        cargo test --locked -p graphite-benchmark
        cargo build --release --locked -p graphite-benchmark
        node --test .github/scripts/benchmark-comment.test.cjs
    - uses: actions/upload-artifact@v7
      with:
        name: benchmark-controller
        path: trusted/target/release/graphite-benchmark
        if-no-files-found: error
        # Reuse the same binary when only failed downstream jobs are rerun.
        overwrite: true
        retention-days: 30

  compare:
    name: benchmark-base-head
    needs: harness
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      BASE_SHA: ${{ needs.harness.outputs.comparison-base }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
    - name: Checkout exact base
      uses: actions/checkout@v7
      with:
        ref: ${{ needs.harness.outputs.comparison-base }}
        path: base
        persist-credentials: false
    - name: Checkout exact product head
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: head
        persist-credentials: false
    - name: Checkout the matching trusted frontend harness
      uses: actions/checkout@v7
      with:
        ref: ${{ needs.harness.outputs.controller-ref }}
        path: trusted
        persist-credentials: false
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
    - uses: dtolnay/rust-toolchain@stable
    - uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: true
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          base
          head
    - uses: actions/download-artifact@v8
      with:
        name: benchmark-controller
        path: controller
    - name: Prepare source-built base and head with identical fixture inputs
      id: prepare
      run: |
        chmod +x controller/graphite-benchmark
        controller/graphite-benchmark prepare --base-source base --head-source head --harness-source trusted --output prepared
    - name: JMH frontend build and save under the fixed heap ceiling
      if: ${{ !cancelled() && steps.prepare.outcome != 'skipped' }}
      run: |
        controller/graphite-benchmark jvm --suite frontend-build-save \
          --base-jar prepared/base/webgraph-jmh.jar --head-jar prepared/head/webgraph-jmh.jar \
          --fixtures prepared/fixtures --output results/frontend \
          --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA"
    - name: Rust server loading, correctness, and real64 pressure
      if: ${{ !cancelled() && steps.prepare.outcome != 'skipped' }}
      run: |
        controller/graphite-benchmark native \
          --base prepared/base/graphite --head prepared/head/graphite \
          --base-manifest results/frontend/base/graphs/graphs.tsv \
          --head-manifest results/frontend/head/graphs/graphs.tsv \
          --output results/native --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA"
    - name: Require complete correctness and OOM evidence; render report-only timings
      if: always() && steps.prepare.outcome != 'skipped'
      run: |
        controller/graphite-benchmark report --input results --output report
    - name: Publish Markdown summary
      if: always()
      run: |
        if test -f report/summary.md; then cat report/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
    - name: Retain report for the PR comment
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-report-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
        path: report/
        if-no-files-found: warn
        retention-days: 30
    - name: Retain raw evidence and failures
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-evidence-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
        path: |
          results/**/suite.json
          results/**/*.json
          results/**/*.log
          results/**/*.receipt
          results/**/*.tsv
          results/**/*.txt
          prepared/preparation.json
          prepared/**/source-tree.txt
          prepared/**/product-identity.txt
          prepared/**/*.log
        if-no-files-found: warn
        retention-days: 14

  benchmark-regression-gate:
    # Keep the existing required-check name. Performance deltas never decide this check.
    name: benchmark-regression-gate
    if: always()
    needs: [harness, compare]
    runs-on: ubuntu-24.04
    steps:
    - name: Require correctness and OOM completion
      env:
        HARNESS_RESULT: ${{ needs.harness.result }}
        COMPARISON_RESULT: ${{ needs.compare.result }}
      run: |
        test "$HARNESS_RESULT" = success
        test "$COMPARISON_RESULT" = success
