name: Benchmark regression

on:
  pull_request:
    branches: ['*']

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: benchmark-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  JAVA_OPTS: -Xmx2g -XX:MetaspaceSize=512m -Dfile.encoding=UTF-8
  JVM_OPTS: -Xmx2g -XX:MetaspaceSize=512m -Dfile.encoding=UTF-8
  PRE_PR_95_BASELINE_SHA: 44b57562f2b3d0c88882a9002bdc488e05e5d7a7

jobs:
  method-level:
    name: method-level-benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout base
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: base

    - name: Checkout PR
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: candidate

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: true

    - name: Test benchmark gate logic
      run: node --test candidate/.github/scripts/benchmark-gate.test.mjs

    - name: Build JMH jars
      run: |
        base/gradlew -p base :cypher:jmhJar --no-daemon
        candidate/gradlew -p candidate :cypher:jmhJar --no-daemon

    - name: Benchmark base
      run: |
        mkdir -p benchmark-results
        JMH_JAR=$(find base/graphite-cypher/build/libs -name '*-jmh.jar' -print -quit)
        test -n "${JMH_JAR}"
        java -jar "${JMH_JAR}" \
          'io.johnsonlee.graphite.cypher.CypherBenchmark.*' \
          -foe true -rf json -rff "${PWD}/benchmark-results/base-jmh.json"

    - name: Benchmark PR
      run: |
        JMH_JAR=$(find candidate/graphite-cypher/build/libs -name '*-jmh.jar' -print -quit)
        test -n "${JMH_JAR}"
        java -jar "${JMH_JAR}" \
          'io.johnsonlee.graphite.cypher.CypherBenchmark.*' \
          -foe true -rf json -rff "${PWD}/benchmark-results/candidate-jmh.json"

    - name: Compare method-level results
      run: |
        if node candidate/.github/scripts/benchmark-gate.mjs compare-jmh \
          --base benchmark-results/base-jmh.json \
          --candidate benchmark-results/candidate-jmh.json \
          --threshold 15 \
          --report benchmark-results/initial-method-report.md \
          --status benchmark-results/initial-method-status.json; then
          mv benchmark-results/initial-method-report.md benchmark-results/method-report.md
          mv benchmark-results/initial-method-status.json benchmark-results/method-status.json
        else
          CANDIDATE_JAR=$(find candidate/graphite-cypher/build/libs -name '*-jmh.jar' -print -quit)
          BASE_JAR=$(find base/graphite-cypher/build/libs -name '*-jmh.jar' -print -quit)
          java -jar "${CANDIDATE_JAR}" \
            'io.johnsonlee.graphite.cypher.CypherBenchmark.*' \
            -foe true -rf json -rff "${PWD}/benchmark-results/candidate-jmh-confirmation.json"
          java -jar "${BASE_JAR}" \
            'io.johnsonlee.graphite.cypher.CypherBenchmark.*' \
            -foe true -rf json -rff "${PWD}/benchmark-results/base-jmh-confirmation.json"
          node candidate/.github/scripts/benchmark-gate.mjs confirm-jmh \
            --initial benchmark-results/initial-method-status.json \
            --base benchmark-results/base-jmh-confirmation.json \
            --candidate benchmark-results/candidate-jmh-confirmation.json \
            --threshold 15 \
            --report benchmark-results/method-report.md \
            --status benchmark-results/method-status.json
        fi

    - name: Upload method-level results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-method-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
        path: benchmark-results/
        if-no-files-found: warn
        retention-days: 14

  large-corpus:
    name: large-corpus-benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout base
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: base

    - name: Checkout PR
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: candidate

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: true

    - name: Benchmark PR large corpora
      run: |
        set -o pipefail
        mkdir -p benchmark-results
        candidate/gradlew -p candidate :webgraph:largeCorpusTest \
          -Dlarge.corpus.record=true --no-daemon 2>&1 \
          | tee benchmark-results/candidate-large-corpus.log

    - name: Benchmark base large corpora
      run: |
        set -o pipefail
        base/gradlew -p base :webgraph:largeCorpusTest \
          -Dlarge.corpus.record=true --no-daemon 2>&1 \
          | tee benchmark-results/base-large-corpus.log

    - name: Compare large-corpus results
      run: |
        if node candidate/.github/scripts/benchmark-gate.mjs compare-large-corpus \
          --base benchmark-results/base-large-corpus.log \
          --candidate benchmark-results/candidate-large-corpus.log \
          --report benchmark-results/initial-large-corpus-report.md \
          --status benchmark-results/initial-large-corpus-status.json; then
          mv benchmark-results/initial-large-corpus-report.md benchmark-results/large-corpus-report.md
          mv benchmark-results/initial-large-corpus-status.json benchmark-results/large-corpus-status.json
        else
          set -o pipefail
          base/gradlew -p base :webgraph:largeCorpusTest \
            -Dlarge.corpus.record=true --no-daemon 2>&1 \
            | tee benchmark-results/base-large-corpus-confirmation.log
          candidate/gradlew -p candidate :webgraph:largeCorpusTest \
            -Dlarge.corpus.record=true --no-daemon 2>&1 \
            | tee benchmark-results/candidate-large-corpus-confirmation.log
          node candidate/.github/scripts/benchmark-gate.mjs confirm-large-corpus \
            --initial benchmark-results/initial-large-corpus-status.json \
            --base benchmark-results/base-large-corpus-confirmation.log \
            --candidate benchmark-results/candidate-large-corpus-confirmation.log \
            --report benchmark-results/large-corpus-report.md \
            --status benchmark-results/large-corpus-status.json
        fi

    - name: Upload large-corpus results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-large-corpus-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
        path: benchmark-results/
        if-no-files-found: warn
        retention-days: 14

  wrapped-query-latency:
    name: wrapped-query-latency
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: Checkout fixed pre-PR-95 baseline
      uses: actions/checkout@v7
      with:
        ref: ${{ env.PRE_PR_95_BASELINE_SHA }}
        path: fixed

    - name: Checkout PR base
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: base

    - name: Checkout PR
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: candidate

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: true

    - name: Install identical latency harness in baselines
      run: |
        for HARNESS in \
          WrappedDiscoveryLatencyBenchmark.kt \
          AllFixtureWrappedDiscoveryLatencyBenchmark.kt; do
          SOURCE="graphite-webgraph/src/jmh/kotlin/io/johnsonlee/graphite/webgraph/${HARNESS}"
          cp "candidate/${SOURCE}" "fixed/${SOURCE}"
          cp "candidate/${SOURCE}" "base/${SOURCE}"
        done

    - name: Build latency benchmark jars
      run: |
        candidate/gradlew -p candidate :webgraph:prepareBenchmarkFixtures --no-daemon
        fixed/gradlew -p fixed :webgraph:jmhJar --no-daemon
        base/gradlew -p base :webgraph:jmhJar --no-daemon
        candidate/gradlew -p candidate :webgraph:jmhJar --no-daemon

    - name: Prepare all real fixture graphs
      run: |
        FIXTURE_DIR="${PWD}/candidate/graphite-webgraph/build/benchmark-fixtures"
        ANDROID_JAR=$(find "${FIXTURE_DIR}" -name 'android-all-*.jar' -print -quit)
        TIKA_JAR=$(find "${FIXTURE_DIR}" -name 'tika-app-*.jar' -print -quit)
        HIVE_JAR=$(find "${FIXTURE_DIR}" -name 'hive-exec-*.jar' -print -quit)
        KOTLIN_JAR=$(find "${FIXTURE_DIR}" -name 'kotlin-compiler-embeddable-*.jar' -print -quit)
        CANDIDATE_JAR=$(find candidate/graphite-webgraph/build/libs -name '*-jmh.jar' -print -quit)
        test -n "${ANDROID_JAR}" && test -n "${TIKA_JAR}" && test -n "${HIVE_JAR}" && \
          test -n "${KOTLIN_JAR}" && test -n "${CANDIDATE_JAR}"
        mkdir -p "${PWD}/fixture-graphs"
        for CORPUS in android tika hive kotlin-compiler; do
          SOURCE_TMP=$(mktemp -d "${RUNNER_TEMP}/graphite-source-${CORPUS}-XXXXXX")
          java -Xmx4g -Djava.io.tmpdir="${SOURCE_TMP}" \
            -Dandroid.jar.path="${ANDROID_JAR}" \
            -Dtika.jar.path="${TIKA_JAR}" \
            -Dhive.jar.path="${HIVE_JAR}" \
            -Dkotlin.compiler.jar.path="${KOTLIN_JAR}" \
            -cp "${CANDIDATE_JAR}" \
            io.johnsonlee.graphite.webgraph.AllFixtureBenchmarkGraphPreparation \
            "${CORPUS}" "${PWD}/fixture-graphs/${CORPUS}"
          rm -rf -- "${SOURCE_TMP}"
        done
        java -Xmx4g -cp "${CANDIDATE_JAR}" \
          io.johnsonlee.graphite.webgraph.AllFixtureBenchmarkDistributionCalibration \
          "${PWD}/fixture-graphs"

    - name: Verify all real-fixture query results
      run: |
        mkdir -p benchmark-results
        for REVISION in fixed base candidate; do
          JMH_JAR=$(find "${REVISION}/graphite-webgraph/build/libs" -name '*-jmh.jar' -print -quit)
          test -n "${JMH_JAR}"
          java -Xmx8g -cp "${JMH_JAR}" \
            io.johnsonlee.graphite.webgraph.AllFixtureBenchmarkQueryCorrectness \
            "${PWD}/fixture-graphs" \
            | grep '^ALL_FIXTURE_QUERY_RESULT' \
            > "benchmark-results/${REVISION}-fixture-correctness.txt"
          test "$(wc -l < "benchmark-results/${REVISION}-fixture-correctness.txt")" -eq 8
        done
        cmp benchmark-results/fixed-fixture-correctness.txt \
          benchmark-results/base-fixture-correctness.txt
        cmp benchmark-results/fixed-fixture-correctness.txt \
          benchmark-results/candidate-fixture-correctness.txt

    - name: Benchmark fixed baseline, PR base, and PR
      run: |
        mkdir -p benchmark-results
        FIXED_JAR=$(find fixed/graphite-webgraph/build/libs -name '*-jmh.jar' -print -quit)
        BASE_JAR=$(find base/graphite-webgraph/build/libs -name '*-jmh.jar' -print -quit)
        CANDIDATE_JAR=$(find candidate/graphite-webgraph/build/libs -name '*-jmh.jar' -print -quit)
        test -n "${FIXED_JAR}" && test -n "${BASE_JAR}" && test -n "${CANDIDATE_JAR}"
        GRAPH_JVM_ARGS="-Dandroid.graph.path=${PWD}/fixture-graphs/android \
          -Dtika.graph.path=${PWD}/fixture-graphs/tika \
          -Dhive.graph.path=${PWD}/fixture-graphs/hive \
          -Dkotlin.compiler.graph.path=${PWD}/fixture-graphs/kotlin-compiler"
        java -jar "${FIXED_JAR}" \
          'io.johnsonlee.graphite.webgraph.(WrappedDiscoveryLatencyBenchmark|AllFixtureWrappedDiscoveryLatencyBenchmark).*CaseInsensitiveDiscovery' \
          -jvmArgsAppend "${GRAPH_JVM_ARGS}" -foe true -prof gc -rf json \
          -rff "${PWD}/benchmark-results/fixed-latency.json"
        java -jar "${BASE_JAR}" \
          'io.johnsonlee.graphite.webgraph.(WrappedDiscoveryLatencyBenchmark|AllFixtureWrappedDiscoveryLatencyBenchmark).*CaseInsensitiveDiscovery' \
          -jvmArgsAppend "${GRAPH_JVM_ARGS}" -foe true -prof gc -rf json \
          -rff "${PWD}/benchmark-results/base-latency.json"
        java -jar "${CANDIDATE_JAR}" \
          'io.johnsonlee.graphite.webgraph.(WrappedDiscoveryLatencyBenchmark|AllFixtureWrappedDiscoveryLatencyBenchmark).*CaseInsensitiveDiscovery' \
          -jvmArgsAppend "${GRAPH_JVM_ARGS}" -foe true -prof gc -rf json \
          -rff "${PWD}/benchmark-results/candidate-latency.json"

    - name: Enforce fixed baseline speedup and current-base regression gate
      run: |
        if node candidate/.github/scripts/benchmark-gate.mjs compare-latency-baseline \
          --fixed benchmark-results/fixed-latency.json \
          --base benchmark-results/base-latency.json \
          --candidate benchmark-results/candidate-latency.json \
          --minimum-speedup 50 \
          --threshold 15 \
          --report benchmark-results/initial-latency-report.md \
          --status benchmark-results/initial-latency-status.json; then
          mv benchmark-results/initial-latency-report.md benchmark-results/latency-report.md
          mv benchmark-results/initial-latency-status.json benchmark-results/latency-status.json
        else
          CANDIDATE_JAR=$(find candidate/graphite-webgraph/build/libs -name '*-jmh.jar' -print -quit)
          BASE_JAR=$(find base/graphite-webgraph/build/libs -name '*-jmh.jar' -print -quit)
          FIXED_JAR=$(find fixed/graphite-webgraph/build/libs -name '*-jmh.jar' -print -quit)
          GRAPH_JVM_ARGS="-Dandroid.graph.path=${PWD}/fixture-graphs/android \
            -Dtika.graph.path=${PWD}/fixture-graphs/tika \
            -Dhive.graph.path=${PWD}/fixture-graphs/hive \
            -Dkotlin.compiler.graph.path=${PWD}/fixture-graphs/kotlin-compiler"
          java -jar "${CANDIDATE_JAR}" \
            'io.johnsonlee.graphite.webgraph.(WrappedDiscoveryLatencyBenchmark|AllFixtureWrappedDiscoveryLatencyBenchmark).*CaseInsensitiveDiscovery' \
            -jvmArgsAppend "${GRAPH_JVM_ARGS}" -foe true -prof gc -rf json \
            -rff "${PWD}/benchmark-results/candidate-latency-confirmation.json"
          java -jar "${BASE_JAR}" \
            'io.johnsonlee.graphite.webgraph.(WrappedDiscoveryLatencyBenchmark|AllFixtureWrappedDiscoveryLatencyBenchmark).*CaseInsensitiveDiscovery' \
            -jvmArgsAppend "${GRAPH_JVM_ARGS}" -foe true -prof gc -rf json \
            -rff "${PWD}/benchmark-results/base-latency-confirmation.json"
          java -jar "${FIXED_JAR}" \
            'io.johnsonlee.graphite.webgraph.(WrappedDiscoveryLatencyBenchmark|AllFixtureWrappedDiscoveryLatencyBenchmark).*CaseInsensitiveDiscovery' \
            -jvmArgsAppend "${GRAPH_JVM_ARGS}" -foe true -prof gc -rf json \
            -rff "${PWD}/benchmark-results/fixed-latency-confirmation.json"
          node candidate/.github/scripts/benchmark-gate.mjs compare-latency-baseline \
            --fixed benchmark-results/fixed-latency-confirmation.json \
            --base benchmark-results/base-latency-confirmation.json \
            --candidate benchmark-results/candidate-latency-confirmation.json \
            --minimum-speedup 50 \
            --threshold 15 \
            --report benchmark-results/latency-report.md \
            --status benchmark-results/latency-status.json
        fi

    - name: Upload wrapped-query latency results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-latency-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
        path: benchmark-results/
        if-no-files-found: warn
        retention-days: 14

  benchmark-regression-gate:
    name: benchmark-regression-gate
    if: always()
    needs: [method-level, large-corpus, wrapped-query-latency]
    runs-on: ubuntu-latest

    steps:
    - name: Checkout PR reporting code
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}

    - name: Download benchmark results
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        pattern: benchmark-*-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
        path: benchmark-results
        merge-multiple: true

    - name: Build benchmark report
      if: always()
      run: |
        mkdir -p benchmark-results
        node .github/scripts/benchmark-gate.mjs aggregate \
          --directory benchmark-results \
          --base-sha '${{ github.event.pull_request.base.sha }}' \
          --candidate-sha '${{ github.event.pull_request.head.sha }}' \
          --runner '${{ runner.os }}-${{ runner.arch }}' \
          --run-url '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' \
          --report benchmark-results/benchmark-report.md \
          --status benchmark-results/benchmark-status.json

    - name: Attach benchmark report to PR
      if: always()
      continue-on-error: true
      uses: actions/github-script@v9
      with:
        script: |
          const fs = require('fs');
          const marker = '<!-- graphite-benchmark-regression-gate -->';
          let body;
          try {
            body = fs.readFileSync('benchmark-results/benchmark-report.md', 'utf8');
          } catch (error) {
            body = `${marker}\n## Benchmark Regression Gate\n\n**FAIL**\n\nReport generation failed. ` +
              `[View logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
          }

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            per_page: 100
          });
          const existing = comments.find((comment) => comment.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
          }

    - name: Enforce benchmark gate
      if: always()
      env:
        METHOD_JOB: ${{ needs.method-level.result }}
        LARGE_CORPUS_JOB: ${{ needs.large-corpus.result }}
        LATENCY_JOB: ${{ needs.wrapped-query-latency.result }}
      run: |
        if [ "${METHOD_JOB}" != success ] || [ "${LARGE_CORPUS_JOB}" != success ] || \
          [ "${LATENCY_JOB}" != success ]; then
          echo "::error::Benchmark execution or comparison failed"
          exit 1
        fi
        node -e "const s=require('./benchmark-results/benchmark-status.json'); if(!s.passed) process.exit(1)"
