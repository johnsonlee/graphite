  validate-cpu-accounting:
    name: validate-cpu-accounting
    needs: [prepare-latency-fixtures]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout PR
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: candidate
        persist-credentials: false

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: true

    # The candidate's own Explorer harness is built WITHOUT the base-owned gate install, so this jar
    # exercises the candidate server lifecycle and CPU accounting together. The paired gate uses
    # the reviewed pinned Explorer repair with base-owned accounting; this separate candidate-native
    # artifact proves future helper changes too and never feeds the trusted paired gate.
    - name: Build candidate-owned Explorer JMH JAR
      run: |
        candidate/gradlew -p candidate :explore:testClasses :explore:jmhJar --no-daemon
        mapfile -t JARS < <(find candidate/frontend/jvm/explore/build/libs -name '*-jmh.jar' -type f)
        test "${#JARS[@]}" -eq 1
        jar tf "${JARS[0]}" >/dev/null
        mkdir -p jmh-candidate-native
        install -m 0644 "${JARS[0]}" jmh-candidate-native/candidate-native-explore-jmh.jar

    - name: Restore persisted fixture graphs
      uses: actions/cache/restore@v5
      with:
        path: fixture-graphs
        key: ${{ runner.os }}-${{ runner.arch }}-wrapped-query-fixtures-v2-${{ hashFiles('candidate/gradle/libs.versions.toml', 'candidate/gradle/wrapper/gradle-wrapper.properties', 'candidate/settings.gradle.kts', 'candidate/**/build.gradle.kts', 'candidate/frontend/jvm/core/src/main/**', 'candidate/frontend/jvm/sootup/src/main/**', 'candidate/frontend/jvm/webgraph/src/main/**', 'candidate/frontend/jvm/webgraph/src/jmh/kotlin/io/johnsonlee/graphite/webgraph/BenchmarkCorpus.kt', 'candidate/frontend/jvm/webgraph/src/jmh/kotlin/io/johnsonlee/graphite/webgraph/AllFixtureBenchmarkGraphPreparation.kt') }}

    - name: Verify restored real graphs
      run: |
        test -f fixture-graphs/.complete
        for CORPUS in android tika hive kotlin-compiler; do
          test -f "fixture-graphs/${CORPUS}/graph.metadata"
          test -f "fixture-graphs/${CORPUS}/graph.nodedata"
        done

    - name: Assert CPU-accounting and server-lifecycle contracts
      run: |
        set -euo pipefail
        mkdir -p benchmark-results
        JAR=jmh-candidate-native/candidate-native-explore-jmh.jar
        java -Xmx512m -XX:ActiveProcessorCount=4 -cp "${JAR}" \
          io.johnsonlee.graphite.cli.MethodBenchmarkServerLifecycleContract \
          | tee benchmark-results/server-lifecycle-contract.log
        java -Xmx512m -XX:ActiveProcessorCount=4 -cp "${JAR}" \
          io.johnsonlee.graphite.cli.MethodCompatibilityCpuAccountingContract \
          | tee benchmark-results/cpu-accounting-contract.log
        # Real Method results remain checked by the complete untimed 33-scenario matrix.
        # Process CPU/RSS acceptance belongs to the multi-graph pressure worker boundaries.

    - name: Upload CPU accounting smoke result
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-cpu-accounting-smoke-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
        path: benchmark-results/
        if-no-files-found: error
        retention-days: 14

