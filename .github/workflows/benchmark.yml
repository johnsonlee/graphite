  method-compatibility-shard:
    name: method-compatibility-${{ matrix.graph_count }}-${{ matrix.group }}
    needs: [prepare-latency-fixtures, build-explore-jmh]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
        - graph_count: 4
          group: position
          scenarios: zero,early,middle
        - graph_count: 4
          group: string
          scenarios: late,prefix,suffix
        - graph_count: 4
          group: scan
          scenarios: contains,regex,or
        - graph_count: 4
          group: aggregate
          scenarios: count,order
        - graph_count: 17
          group: position
          scenarios: zero,early,middle
        - graph_count: 17
          group: string
          scenarios: late,prefix,suffix
        - graph_count: 17
          group: scan
          scenarios: contains,regex,or
        - graph_count: 17
          group: aggregate
          scenarios: count,order
        - graph_count: 36
          group: position
          scenarios: zero,early,middle
        - graph_count: 36
          group: string
          scenarios: late,prefix,suffix
        - graph_count: 36
          group: scan
          scenarios: contains,regex,or
        - graph_count: 36
          group: aggregate
          scenarios: count,order

    steps:
    - name: Checkout base
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: base
        persist-credentials: false

    - name: Checkout PR
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: candidate
        persist-credentials: false

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Download base Explorer JMH JAR
      uses: actions/download-artifact@v8
      with:
        name: jmh-explore-base-${{ github.event.pull_request.number }}
        path: jmh-jars/base

    - name: Download candidate Explorer JMH JAR
      uses: actions/download-artifact@v8
      with:
        name: jmh-explore-candidate-${{ github.event.pull_request.number }}
        path: jmh-jars/candidate

    - name: Verify Explorer JMH artifacts
      run: |
        for REVISION in base candidate; do
          test -f "jmh-jars/${REVISION}/${REVISION}-explore-jmh.jar"
          test -f "jmh-jars/${REVISION}/${REVISION}-explore-jmh.jar.sha256"
          (cd "jmh-jars/${REVISION}" && sha256sum -c "${REVISION}-explore-jmh.jar.sha256")
          jar tf "jmh-jars/${REVISION}/${REVISION}-explore-jmh.jar" >/dev/null
        done

    - name: Restore persisted fixture graphs
      uses: actions/cache/restore@v5
      with:
        path: fixture-graphs
        key: ${{ runner.os }}-${{ runner.arch }}-wrapped-query-fixtures-v2-${{ hashFiles('candidate/gradle/libs.versions.toml', 'candidate/gradle/wrapper/gradle-wrapper.properties', 'candidate/settings.gradle.kts', 'candidate/**/build.gradle.kts', 'candidate/frontend/jvm/core/src/main/**', 'candidate/frontend/jvm/sootup/src/main/**', 'candidate/frontend/jvm/webgraph/src/main/**', 'candidate/frontend/jvm/webgraph/src/jmh/kotlin/io/johnsonlee/graphite/webgraph/BenchmarkCorpus.kt', 'candidate/frontend/jvm/webgraph/src/jmh/kotlin/io/johnsonlee/graphite/webgraph/AllFixtureBenchmarkGraphPreparation.kt') }}

    - name: Verify restored real graphs
      run: |
        test -f fixture-graphs/.complete
        for CORPUS in android tika hive kotlin-compiler; do
          test -f "fixture-graphs/${CORPUS}/graph.metadata"
          test -f "fixture-graphs/${CORPUS}/graph.nodedata"
        done

    - name: Verify reviewed correctness and comparison control closure
      run: |
        set -euo pipefail
        MANIFEST=.github/scripts/multigraph-correctness-controls.sha256
        test ! -L "candidate/${MANIFEST}"
        test "$(sha256sum "candidate/${MANIFEST}" | cut -d' ' -f1)" = "${MULTIGRAPH_CORRECTNESS_CONTROLS_SHA256}"
        (cd candidate && sha256sum -c "${MANIFEST}")

    - name: Assert every Method scenario without timing
      env:
        GRAPH_COUNT: ${{ matrix.graph_count }}
        GROUP: ${{ matrix.group }}
        SCENARIOS: ${{ matrix.scenarios }}
      run: |
        set -euo pipefail
        mkdir -p benchmark-results
        GRAPH_ARGS=(-Dandroid.graph.path="${PWD}/fixture-graphs/android"
          -Dtika.graph.path="${PWD}/fixture-graphs/tika"
          -Dhive.graph.path="${PWD}/fixture-graphs/hive"
          -Dkotlin.compiler.graph.path="${PWD}/fixture-graphs/kotlin-compiler")
        IFS=, read -ra CASES <<< "${SCENARIOS}"
        EXPECTED=()
        for SCENARIO in "${CASES[@]}"; do
          EXPECTED+=("$(printf 'methods\t%s\t%s' "${GRAPH_COUNT}" "${SCENARIO}")")
        done
        for REVISION in base candidate; do
          JAR="jmh-jars/${REVISION}/${REVISION}-explore-jmh.jar"
          for SCENARIO in "${CASES[@]}"; do
            java -Xmx8g -XX:ActiveProcessorCount=4 -cp "${JAR}" "${GRAPH_ARGS[@]}" \
              -Dgraphite.method.compatibility.output="${PWD}/benchmark-results/${REVISION}-method-compatibility-${GRAPH_COUNT}-${GROUP}.txt" \
              io.johnsonlee.graphite.cli.SingleGraphCorrectness methods "${GRAPH_COUNT}" "${SCENARIO}" \
              | tee -a "benchmark-results/${REVISION}-method-compatibility-${GRAPH_COUNT}-${GROUP}.log"
          done
        done
        diff -u \
          <(sort "benchmark-results/base-method-compatibility-${GRAPH_COUNT}-${GROUP}.txt") \
          <(sort "benchmark-results/candidate-method-compatibility-${GRAPH_COUNT}-${GROUP}.txt")
        node candidate/.github/scripts/benchmark-correctness.mjs method-compatibility \
          "benchmark-results/method-compatibility-shard-${GRAPH_COUNT}-${GROUP}" \
          "benchmark-results/base-method-compatibility-${GRAPH_COUNT}-${GROUP}.log" \
          "benchmark-results/candidate-method-compatibility-${GRAPH_COUNT}-${GROUP}.log" "${EXPECTED[@]}"

