  large-corpus:
    name: large-corpus-benchmarks
    needs: [candidate-gate-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout base
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: base
        persist-credentials: false

    - name: Checkout PR
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: candidate
        persist-credentials: false

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: true

    - name: Verify reviewed correctness and comparison control closure
      run: |
        set -euo pipefail
        MANIFEST=.github/scripts/multigraph-correctness-controls.sha256
        test ! -L "candidate/${MANIFEST}"
        test "$(sha256sum "candidate/${MANIFEST}" | cut -d' ' -f1)" = "${MULTIGRAPH_CORRECTNESS_CONTROLS_SHA256}"
        (cd candidate && sha256sum -c "${MANIFEST}")

    - name: Install reviewed correctness-only corpus assertions
      id: large-corpus-controls
      run: |
        set -euo pipefail
        jvm() { if [[ -d "$1/frontend/jvm/$2" ]]; then echo "$1/frontend/jvm/$2"; else echo "$1/graphite-$2"; fi; }
        HARNESS=src/test/kotlin/io/johnsonlee/graphite/webgraph/LargeCorpusPerformanceGateTest.kt
        BASE_HARNESS="$(jvm base webgraph)/$HARNESS"
        CANDIDATE_HARNESS="$(jvm candidate webgraph)/$HARNESS"
        test ! -L "$BASE_HARNESS" && test ! -L "$CANDIDATE_HARNESS"
        test "$(sha256sum "$CANDIDATE_HARNESS" | cut -d' ' -f1)" = "$MULTIGRAPH_LARGE_CORPUS_CORRECTNESS_SHA256"
        BASE_SHA=$(git -C base rev-parse HEAD)
        ORIGINAL=$(sha256sum "$BASE_HARNESS" | cut -d' ' -f1)
        mkdir -p benchmark-results
        cp "$BASE_HARNESS" benchmark-results/original-base-corpus-harness.kt
        if [[ "$BASE_SHA" = 4f2ccf33b969e684972e56b5e810034e6e67c1b3 ]]; then
          test "$ORIGINAL" = "$LARGE_CORPUS_SHAPE_BASE_HARNESS_SHA256"
          # The only baseline difference is the independently audited 64/27 method identities.
          sed -e 's/methodCount = 312_852/methodCount = 312_788/' \
              -e 's/methodCount = 404_043/methodCount = 404_016/' \
              "$CANDIDATE_HARNESS" > "$BASE_HARNESS"
          test "$(sha256sum "$BASE_HARNESS" | cut -d' ' -f1)" = "$MULTIGRAPH_LARGE_CORPUS_4F_CORRECTNESS_SHA256"
          echo 'comparison=--structural-types-transition' >> "$GITHUB_OUTPUT"
        else
          # A same-format base must already carry the reviewed current assertions or the
          # exact predecessor GTY03 assertion source; unknown bases fail before execution.
          [[ "$ORIGINAL" = "$MULTIGRAPH_LARGE_CORPUS_CORRECTNESS_SHA256" || \
             "$ORIGINAL" = b093034329f31e30bbd3f8e3aadab8f8d5d265aa30b7d5aa859d39159198e159 || \
             "$ORIGINAL" = dc0ddb816d2d27921df7a0247b0d02b88c9616ab7fe9125baed05fe03edddd54 ]]
          install -m 0644 "$CANDIDATE_HARNESS" "$BASE_HARNESS"
        fi
        cp "$BASE_HARNESS" benchmark-results/base-correctness-harness.kt
        cp "$CANDIDATE_HARNESS" benchmark-results/candidate-correctness-harness.kt

    - name: Verify both complete corpus persistence pipelines without sampling
      run: |
        set -euo pipefail
        for REVISION in base candidate; do
          "$REVISION/gradlew" -p "$REVISION" :webgraph:largeCorpusTest \
            --no-daemon --max-workers=2 2>&1 | tee "benchmark-results/$REVISION-large-corpus.log"
        done

    - name: Compare exact corpus shape and storage transition
      run: |
        node candidate/.github/scripts/benchmark-gate.mjs compare-large-corpus --correctness-only \
          ${{ steps.large-corpus-controls.outputs.comparison }} \
          --base benchmark-results/base-large-corpus.log \
          --candidate benchmark-results/candidate-large-corpus.log \
          --report benchmark-results/large-corpus-report.md \
          --status benchmark-results/large-corpus-status.json

    - name: Upload large-corpus results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-large-corpus-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
        path: benchmark-results/
        if-no-files-found: warn
        retention-days: 14

  prepare-latency-fixtures:
    name: prepare-latency-fixtures
    needs: [build-wrapped-query-jmh]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout PR
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: candidate
        persist-credentials: false

    - name: Restore or save persisted fixture graphs
      id: fixture-cache
      uses: actions/cache@v5
      with:
        path: fixture-graphs
        key: ${{ runner.os }}-${{ runner.arch }}-wrapped-query-fixtures-v2-${{ hashFiles('candidate/gradle/libs.versions.toml', 'candidate/gradle/wrapper/gradle-wrapper.properties', 'candidate/settings.gradle.kts', 'candidate/**/build.gradle.kts', 'candidate/frontend/jvm/core/src/main/**', 'candidate/frontend/jvm/sootup/src/main/**', 'candidate/frontend/jvm/webgraph/src/main/**', 'candidate/frontend/jvm/webgraph/src/jmh/kotlin/io/johnsonlee/graphite/webgraph/BenchmarkCorpus.kt', 'candidate/frontend/jvm/webgraph/src/jmh/kotlin/io/johnsonlee/graphite/webgraph/AllFixtureBenchmarkGraphPreparation.kt') }}

    - name: Detect complete persisted fixture cache
      id: fixture-cache-state
      run: |
        READY=true
        test -f fixture-graphs/.complete || READY=false
        for CORPUS in android tika hive kotlin-compiler; do
          test -d "fixture-graphs/${CORPUS}" || READY=false
        done
        echo "ready=${READY}" >> "${GITHUB_OUTPUT}"

    - name: Setup Java
      if: steps.fixture-cache-state.outputs.ready != 'true'
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Setup Gradle
      if: steps.fixture-cache-state.outputs.ready != 'true'
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: true

    - name: Download candidate wrapped-query JMH JAR
      if: steps.fixture-cache-state.outputs.ready != 'true'
      uses: actions/download-artifact@v8
      with:
        name: jmh-wrapped-query-candidate-${{ github.event.pull_request.number }}
        path: jmh-jars/candidate

    - name: Resolve fixture source JARs
      if: steps.fixture-cache-state.outputs.ready != 'true'
      run: candidate/gradlew -p candidate :webgraph:prepareBenchmarkFixtures --no-daemon

    - name: Prepare all real fixture graphs
      if: steps.fixture-cache-state.outputs.ready != 'true'
      run: |
        FIXTURE_DIR="${PWD}/candidate/frontend/jvm/webgraph/build/benchmark-fixtures"
        ANDROID_JAR=$(find "${FIXTURE_DIR}" -name 'android-all-*.jar' -print -quit)
        TIKA_JAR=$(find "${FIXTURE_DIR}" -name 'tika-app-*.jar' -print -quit)
        HIVE_JAR=$(find "${FIXTURE_DIR}" -name 'hive-exec-*.jar' -print -quit)
        KOTLIN_JAR=$(find "${FIXTURE_DIR}" -name 'kotlin-compiler-embeddable-*.jar' -print -quit)
        (cd jmh-jars/candidate && sha256sum -c candidate-webgraph-jmh.jar.sha256)
        CANDIDATE_JAR=${PWD}/jmh-jars/candidate/candidate-webgraph-jmh.jar
        test -n "${ANDROID_JAR}" && test -n "${TIKA_JAR}" && test -n "${HIVE_JAR}" && \
          test -n "${KOTLIN_JAR}" && test -f "${CANDIDATE_JAR}"
        mkdir -p "${PWD}/fixture-graphs"
        for CORPUS in android tika hive kotlin-compiler; do
          SOURCE_TMP=$(mktemp -d "${RUNNER_TEMP}/graphite-source-${CORPUS}-XXXXXX")
          java -Xmx4g -Djava.io.tmpdir="${SOURCE_TMP}" \
            -Dandroid.jar.path="${ANDROID_JAR}" \
            -Dtika.jar.path="${TIKA_JAR}" \
            -Dhive.jar.path="${HIVE_JAR}" \
            -Dkotlin.compiler.jar.path="${KOTLIN_JAR}" \
            -cp "${CANDIDATE_JAR}" \
            io.johnsonlee.graphite.webgraph.AllFixtureBenchmarkGraphPreparation \
            "${CORPUS}" "${PWD}/fixture-graphs/${CORPUS}"
          rm -rf -- "${SOURCE_TMP}"
        done
        java -Xmx4g -cp "${CANDIDATE_JAR}" \
          io.johnsonlee.graphite.webgraph.AllFixtureBenchmarkDistributionCalibration \
          "${PWD}/fixture-graphs"
        touch "${PWD}/fixture-graphs/.complete"

    - name: Verify persisted fixture graph cache
      run: |
        test -f fixture-graphs/.complete
        for CORPUS in android tika hive kotlin-compiler; do
          test -d "fixture-graphs/${CORPUS}"
        done

  wrapped-query-latency-shard:
    name: wrapped-query-latency-shard-${{ matrix.shard }}
    needs: [candidate-gate-tests, prepare-latency-fixtures, build-wrapped-query-jmh]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
        - shard: real-a
          real: true
          correctness: true
          parameters: ''
          filter: 'io.johnsonlee.graphite.webgraph.AllFixtureWrappedDiscoveryLatencyBenchmark.(zeroHitBroadContainsCaseInsensitiveDiscovery|denseDistributedMethodContainsCaseInsensitiveDiscovery)'
        - shard: real-b
          real: true
          correctness: false
          parameters: ''
          filter: 'io.johnsonlee.graphite.webgraph.AllFixtureWrappedDiscoveryLatencyBenchmark.(earlyGraphClassPrefixCaseInsensitiveDiscovery|middleGraphsClassPrefixCaseInsensitiveDiscovery)'
        - shard: real-c
          real: true
          correctness: false
          parameters: ''
          filter: 'io.johnsonlee.graphite.webgraph.AllFixtureWrappedDiscoveryLatencyBenchmark.(lateGraphClassPrefixCaseInsensitiveDiscovery|broadlyDistributedClassPrefixCaseInsensitiveDiscovery)'
        - shard: real-d
          real: true
          correctness: false
          parameters: ''
          filter: 'io.johnsonlee.graphite.webgraph.AllFixtureWrappedDiscoveryLatencyBenchmark.(firstLastGraphBimodalClassPrefixCaseInsensitiveDiscovery|skewedMixedClassMethodOperatorCaseInsensitiveDiscovery)'
        - shard: real-36
          real: true
          correctness: false
          parameters: ''
          filter: 'io.johnsonlee.graphite.webgraph.RealThirtySixGraphWrappedDiscoveryLatencyBenchmark.zeroHitBroadContainsAcrossThirtySixRealGraphs'

    steps:
    - name: Checkout PR base
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: base
        persist-credentials: false

    - name: Checkout PR
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: candidate
        persist-credentials: false

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Download known-good wrapped-query JMH JAR
      uses: actions/download-artifact@v8
      with:
        name: jmh-wrapped-query-reference-${{ github.event.pull_request.number }}
        path: jmh-jars/reference

    - name: Download base wrapped-query JMH JAR
      uses: actions/download-artifact@v8
      with:
        name: jmh-wrapped-query-base-${{ github.event.pull_request.number }}
        path: jmh-jars/base

    - name: Download candidate wrapped-query JMH JAR
      uses: actions/download-artifact@v8
      with:
        name: jmh-wrapped-query-candidate-${{ github.event.pull_request.number }}
        path: jmh-jars/candidate

    - name: Verify wrapped-query JMH artifacts
      run: |
        for REVISION in reference base candidate; do
          test -f "jmh-jars/${REVISION}/${REVISION}-webgraph-jmh.jar"
          test -f "jmh-jars/${REVISION}/${REVISION}-webgraph-jmh.jar.sha256"
          (cd "jmh-jars/${REVISION}" && sha256sum -c "${REVISION}-webgraph-jmh.jar.sha256")
          jar tf "jmh-jars/${REVISION}/${REVISION}-webgraph-jmh.jar" >/dev/null
        done

    - name: Restore persisted fixture graphs
      if: matrix.real
      uses: actions/cache/restore@v5
      with:
        path: fixture-graphs
        key: ${{ runner.os }}-${{ runner.arch }}-wrapped-query-fixtures-v2-${{ hashFiles('candidate/gradle/libs.versions.toml', 'candidate/gradle/wrapper/gradle-wrapper.properties', 'candidate/settings.gradle.kts', 'candidate/**/build.gradle.kts', 'candidate/frontend/jvm/core/src/main/**', 'candidate/frontend/jvm/sootup/src/main/**', 'candidate/frontend/jvm/webgraph/src/main/**', 'candidate/frontend/jvm/webgraph/src/jmh/kotlin/io/johnsonlee/graphite/webgraph/BenchmarkCorpus.kt', 'candidate/frontend/jvm/webgraph/src/jmh/kotlin/io/johnsonlee/graphite/webgraph/AllFixtureBenchmarkGraphPreparation.kt') }}

    - name: Verify restored fixture graphs
      if: matrix.real
      run: |
        test -f fixture-graphs/.complete
        for CORPUS in android tika hive kotlin-compiler; do
          test -d "fixture-graphs/${CORPUS}"
        done

    - name: Verify all real-fixture query results
      if: matrix.correctness
      run: |
        set -o pipefail
        mkdir -p benchmark-results
        for REVISION in reference base candidate; do
          JMH_JAR=$(find "jmh-jars/${REVISION}" -name '*-jmh.jar' -print -quit)
          test -n "${JMH_JAR}"
          java -Xmx8g -cp "${JMH_JAR}" \
            io.johnsonlee.graphite.webgraph.AllFixtureBenchmarkQueryCorrectness \
            "${PWD}/fixture-graphs" \
            | tee "benchmark-results/${REVISION}-fixture-correctness.log"
          grep '^ALL_FIXTURE_QUERY_RESULT' \
            "benchmark-results/${REVISION}-fixture-correctness.log" \
            > "benchmark-results/${REVISION}-fixture-correctness.txt"
          test "$(wc -l < "benchmark-results/${REVISION}-fixture-correctness.txt")" -eq 9
        done
        cmp benchmark-results/reference-fixture-correctness.txt \
          benchmark-results/base-fixture-correctness.txt
        cmp benchmark-results/reference-fixture-correctness.txt \
          benchmark-results/candidate-fixture-correctness.txt

    - name: Benchmark known-good reference, PR base, and PR
      env:
        BENCHMARK_FILTER: ${{ matrix.filter }}
        BENCHMARK_PARAMETERS: ${{ matrix.parameters }}
        CANDIDATE_GATE_TEST_JOB: ${{ needs.candidate-gate-tests.result }}
        SHARD: ${{ matrix.shard }}
      run: |
        mkdir -p benchmark-results
        REFERENCE_JAR=$(find jmh-jars/reference -name '*-jmh.jar' -print -quit)
        BASE_JAR=$(find jmh-jars/base -name '*-jmh.jar' -print -quit)
        CANDIDATE_JAR=$(find jmh-jars/candidate -name '*-jmh.jar' -print -quit)
        test -n "${REFERENCE_JAR}" && test -n "${BASE_JAR}" && test -n "${CANDIDATE_JAR}"
        GRAPH_JVM_ARGS="-Dandroid.graph.path=${PWD}/fixture-graphs/android \
          -Dtika.graph.path=${PWD}/fixture-graphs/tika \
          -Dhive.graph.path=${PWD}/fixture-graphs/hive \
          -Dkotlin.compiler.graph.path=${PWD}/fixture-graphs/kotlin-compiler"
        PARAM_ARGS=()
        if [ -n "${BENCHMARK_PARAMETERS}" ]; then
          read -r -a PARAM_ARGS <<< "${BENCHMARK_PARAMETERS}"
        fi
        java -jar "${REFERENCE_JAR}" \
          "${BENCHMARK_FILTER}" "${PARAM_ARGS[@]}" \
          -jvmArgsAppend "${GRAPH_JVM_ARGS}" -foe true -prof gc -rf json \
          -rff "${PWD}/benchmark-results/reference-latency-${SHARD}.json"
        java -jar "${BASE_JAR}" \
          "${BENCHMARK_FILTER}" "${PARAM_ARGS[@]}" \
          -jvmArgsAppend "${GRAPH_JVM_ARGS}" -foe true -prof gc -rf json \
          -rff "${PWD}/benchmark-results/base-latency-${SHARD}.json"
        java -jar "${CANDIDATE_JAR}" \
          "${BENCHMARK_FILTER}" "${PARAM_ARGS[@]}" \
          -jvmArgsAppend "${GRAPH_JVM_ARGS}" -foe true -prof gc -rf json \
          -rff "${PWD}/benchmark-results/candidate-latency-${SHARD}.json"

    - name: Enforce known-good anchor and current-base regression gate
      env:
        BENCHMARK_FILTER: ${{ matrix.filter }}
        BENCHMARK_PARAMETERS: ${{ matrix.parameters }}
        CANDIDATE_GATE_TEST_JOB: ${{ needs.candidate-gate-tests.result }}
        SHARD: ${{ matrix.shard }}
      run: |
        COMPARATOR=base/.github/scripts/benchmark-gate.mjs
        POINT_ESTIMATE_POLICY='const baseComparison = compareJmh(baseResults, candidateResults, regressionThreshold, true);'
        if ! grep -Fq "${POINT_ESTIMATE_POLICY}" "${COMPARATOR}"; then
          # Transition only: the base comparator has the anchor command but still lets
          # confidence overlap suppress a point-estimate regression. Use the reviewed,
          # hash-pinned candidate policy only after its contract tests pass.
          test "${CANDIDATE_GATE_TEST_JOB}" = success
          test "$(sha256sum candidate/.github/scripts/benchmark-gate.mjs | cut -d ' ' -f 1)" = \
            "${LATENCY_POINT_ESTIMATE_COMPARATOR_SHA256}"
          MANIFEST=.github/scripts/multigraph-correctness-controls.sha256
          test "$(sha256sum "candidate/${MANIFEST}" | cut -d' ' -f1)" = "${MULTIGRAPH_CORRECTNESS_CONTROLS_SHA256}"
          (cd candidate && sha256sum -c "${MANIFEST}")
          COMPARATOR=candidate/.github/scripts/benchmark-gate.mjs
          grep -Fq "${POINT_ESTIMATE_POLICY}" "${COMPARATOR}"
          grep -Fq \
            'const anchorComparison = compareJmh(anchorResults, candidateResults, anchorThreshold, true);' \
            "${COMPARATOR}"
        fi
        if node "${COMPARATOR}" compare-latency-anchor \
          --anchor "benchmark-results/reference-latency-${SHARD}.json" \
          --base "benchmark-results/base-latency-${SHARD}.json" \
          --candidate "benchmark-results/candidate-latency-${SHARD}.json" \
          --anchor-threshold 50 \
          --threshold 15 \
          --allow-subset \
          --report "benchmark-results/initial-latency-report-${SHARD}.md" \
          --status "benchmark-results/initial-latency-status-${SHARD}.json"; then
          mv "benchmark-results/initial-latency-report-${SHARD}.md" "benchmark-results/latency-report-${SHARD}.md"
          mv "benchmark-results/initial-latency-status-${SHARD}.json" "benchmark-results/latency-status-${SHARD}.json"
        else
          CANDIDATE_JAR=$(find jmh-jars/candidate -name '*-jmh.jar' -print -quit)
          BASE_JAR=$(find jmh-jars/base -name '*-jmh.jar' -print -quit)
          REFERENCE_JAR=$(find jmh-jars/reference -name '*-jmh.jar' -print -quit)
          GRAPH_JVM_ARGS="-Dandroid.graph.path=${PWD}/fixture-graphs/android \
            -Dtika.graph.path=${PWD}/fixture-graphs/tika \
            -Dhive.graph.path=${PWD}/fixture-graphs/hive \
            -Dkotlin.compiler.graph.path=${PWD}/fixture-graphs/kotlin-compiler"
          PARAM_ARGS=()
          if [ -n "${BENCHMARK_PARAMETERS}" ]; then
            read -r -a PARAM_ARGS <<< "${BENCHMARK_PARAMETERS}"
          fi
          java -jar "${CANDIDATE_JAR}" \
            "${BENCHMARK_FILTER}" "${PARAM_ARGS[@]}" \
            -jvmArgsAppend "${GRAPH_JVM_ARGS}" -foe true -prof gc -rf json \
            -rff "${PWD}/benchmark-results/candidate-latency-confirmation-${SHARD}.json"
          java -jar "${BASE_JAR}" \
            "${BENCHMARK_FILTER}" "${PARAM_ARGS[@]}" \
            -jvmArgsAppend "${GRAPH_JVM_ARGS}" -foe true -prof gc -rf json \
            -rff "${PWD}/benchmark-results/base-latency-confirmation-${SHARD}.json"
          java -jar "${REFERENCE_JAR}" \
            "${BENCHMARK_FILTER}" "${PARAM_ARGS[@]}" \
            -jvmArgsAppend "${GRAPH_JVM_ARGS}" -foe true -prof gc -rf json \
            -rff "${PWD}/benchmark-results/reference-latency-confirmation-${SHARD}.json"
          node "${COMPARATOR}" confirm-latency-anchor \
            --initial "benchmark-results/initial-latency-status-${SHARD}.json" \
            --anchor "benchmark-results/reference-latency-confirmation-${SHARD}.json" \
            --base "benchmark-results/base-latency-confirmation-${SHARD}.json" \
            --candidate "benchmark-results/candidate-latency-confirmation-${SHARD}.json" \
            --anchor-threshold 50 \
            --threshold 15 \
            --allow-subset \
            --report "benchmark-results/latency-report-${SHARD}.md" \
            --status "benchmark-results/latency-status-${SHARD}.json"
        fi

    - name: Upload wrapped-query latency results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: latency-shard-${{ matrix.shard }}-${{ github.event.pull_request.number }}
        path: benchmark-results/
        if-no-files-found: warn
        overwrite: true
        retention-days: 14

  wrapped-query-latency:
    name: wrapped-query-latency
    if: always()
    needs: [candidate-gate-tests, wrapped-query-latency-shard]
    runs-on: ubuntu-latest

    steps:
    - name: Checkout base reporting code
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        persist-credentials: false

    - name: Checkout candidate reporting code for anchor rollout
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: candidate-reporting
        persist-credentials: false

    - name: Download real-a results
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: latency-shard-real-a-${{ github.event.pull_request.number }}
        path: shard-results/real-a

    - name: Download real-b results
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: latency-shard-real-b-${{ github.event.pull_request.number }}
        path: shard-results/real-b

    - name: Download real-c results
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: latency-shard-real-c-${{ github.event.pull_request.number }}
        path: shard-results/real-c

    - name: Download real-d results
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: latency-shard-real-d-${{ github.event.pull_request.number }}
        path: shard-results/real-d

    - name: Download real-36 results
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: latency-shard-real-36-${{ github.event.pull_request.number }}
        path: shard-results/real-36

    - name: Combine latency shard results
      if: always()
      env:
        CANDIDATE_GATE_TEST_JOB: ${{ needs.candidate-gate-tests.result }}
      run: |
        mkdir -p benchmark-results
        for SHARD in real-a real-b real-c real-d real-36; do
          for FILE in "latency-report-${SHARD}.md" "latency-status-${SHARD}.json"; do
            SOURCE="shard-results/${SHARD}/${FILE}"
            if [ -f "${SOURCE}" ] && [ ! -L "${SOURCE}" ]; then
              install -m 0644 "${SOURCE}" "benchmark-results/${FILE}"
            fi
          done
        done
        COMBINER=.github/scripts/benchmark-gate.mjs
        # Bootstrap only: a base predating the anchor command cannot render anchor rows,
        # and the first real-only policy revision must not require retired synthetic shards.
        # Candidate execution is allowed only after its comparator contract tests pass;
        # once this workflow is in the base, the base-owned combiner is always selected.
        if ! grep -q 'compare-latency-anchor' "${COMBINER}" || \
          grep -q '"synthetic-1"' "${COMBINER}"; then
          if grep -q '"synthetic-1"' "${COMBINER}"; then
            test "$(sha256sum candidate-reporting/.github/scripts/benchmark-gate.mjs | cut -d ' ' -f 1)" = \
              "${REAL_ONLY_LATENCY_COMPARATOR_SHA256}"
          else
            test "$(sha256sum "${COMBINER}" | cut -d ' ' -f 1)" = \
              "${ANCHOR_BOOTSTRAP_COMPARATOR_SHA256}"
          fi
          test "${CANDIDATE_GATE_TEST_JOB}" = success
          MANIFEST=.github/scripts/multigraph-correctness-controls.sha256
          test "$(sha256sum "candidate-reporting/${MANIFEST}" | cut -d' ' -f1)" = "${MULTIGRAPH_CORRECTNESS_CONTROLS_SHA256}"
          (cd candidate-reporting && sha256sum -c "${MANIFEST}")
          COMBINER=candidate-reporting/.github/scripts/benchmark-gate.mjs
          grep -q 'compare-latency-anchor' "${COMBINER}"
          if grep -q '"synthetic-1"' "${COMBINER}"; then exit 1; fi
        fi
        node "${COMBINER}" combine-latency-shards \
          --directory benchmark-results \
          --report benchmark-results/latency-report.md \
          --status benchmark-results/latency-status.json

    - name: Upload combined wrapped-query latency results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-latency-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
        path: benchmark-results/
        if-no-files-found: error
        retention-days: 14

    - name: Enforce latency shards
      if: always()
      env:
        SHARD_JOB: ${{ needs.wrapped-query-latency-shard.result }}
      run: |
        test "${SHARD_JOB}" = success
        node -e "const s=require('./benchmark-results/latency-status.json'); if(!s.passed) process.exit(1)"

  wrapped-query-resources:
    name: wrapped-query-resources
    needs: [candidate-gate-tests, prepare-latency-fixtures, build-wrapped-query-jmh]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout PR base
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: base
        persist-credentials: false

    - name: Checkout PR
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: candidate
        persist-credentials: false

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Download base wrapped-query JMH JAR
      uses: actions/download-artifact@v8
      with:
        name: jmh-wrapped-query-base-${{ github.event.pull_request.number }}
        path: jmh-jars/base

    - name: Download candidate wrapped-query JMH JAR
      uses: actions/download-artifact@v8
      with:
        name: jmh-wrapped-query-candidate-${{ github.event.pull_request.number }}
        path: jmh-jars/candidate

    - name: Verify wrapped-query JMH artifacts
      run: |
        for REVISION in base candidate; do
          test -f "jmh-jars/${REVISION}/${REVISION}-webgraph-jmh.jar"
          test -f "jmh-jars/${REVISION}/${REVISION}-webgraph-jmh.jar.sha256"
          (cd "jmh-jars/${REVISION}" && sha256sum -c "${REVISION}-webgraph-jmh.jar.sha256")
          jar tf "jmh-jars/${REVISION}/${REVISION}-webgraph-jmh.jar" >/dev/null
        done

    - name: Restore persisted fixture graphs
      uses: actions/cache/restore@v5
      with:
        path: fixture-graphs
        key: ${{ runner.os }}-${{ runner.arch }}-wrapped-query-fixtures-v2-${{ hashFiles('candidate/gradle/libs.versions.toml', 'candidate/gradle/wrapper/gradle-wrapper.properties', 'candidate/settings.gradle.kts', 'candidate/**/build.gradle.kts', 'candidate/frontend/jvm/core/src/main/**', 'candidate/frontend/jvm/sootup/src/main/**', 'candidate/frontend/jvm/webgraph/src/main/**', 'candidate/frontend/jvm/webgraph/src/jmh/kotlin/io/johnsonlee/graphite/webgraph/BenchmarkCorpus.kt', 'candidate/frontend/jvm/webgraph/src/jmh/kotlin/io/johnsonlee/graphite/webgraph/AllFixtureBenchmarkGraphPreparation.kt') }}

    - name: Verify restored fixture graphs
      run: |
        test -f fixture-graphs/.complete
        for CORPUS in android tika hive kotlin-compiler; do
          test -d "fixture-graphs/${CORPUS}"
        done

    - name: Benchmark PR base then PR resources
      run: |
        mkdir -p benchmark-results
        BASE_JAR=$(find jmh-jars/base -name '*-jmh.jar' -print -quit)
        CANDIDATE_JAR=$(find jmh-jars/candidate -name '*-jmh.jar' -print -quit)
        test -n "${BASE_JAR}" && test -n "${CANDIDATE_JAR}"
        FILTER='io.johnsonlee.graphite.webgraph.AllFixtureWrappedDiscoveryResourceBenchmark.allFixtureThirtySixGraphFootprint'
        GRAPH_JVM_ARGS="-Dandroid.graph.path=${PWD}/fixture-graphs/android \
          -Dtika.graph.path=${PWD}/fixture-graphs/tika \
          -Dhive.graph.path=${PWD}/fixture-graphs/hive \
          -Dkotlin.compiler.graph.path=${PWD}/fixture-graphs/kotlin-compiler"
        java -jar "${BASE_JAR}" "${FILTER}" -jvmArgsAppend "${GRAPH_JVM_ARGS}" \
          -foe true -prof gc -rf json -rff "${PWD}/benchmark-results/base-latency-resources.json"
        java -jar "${CANDIDATE_JAR}" "${FILTER}" -jvmArgsAppend "${GRAPH_JVM_ARGS}" \
          -foe true -prof gc -rf json -rff "${PWD}/benchmark-results/candidate-latency-resources.json"

    - name: Enforce resource integrity and allocation/GC guardrails
      env:
        CANDIDATE_GATE_TEST_JOB: ${{ needs.candidate-gate-tests.result }}
      run: |
        # Apply the reviewed resource policy to the unchanged base-owned paired harness.
        test "${CANDIDATE_GATE_TEST_JOB}" = success
        test "$(sha256sum candidate/.github/scripts/benchmark-gate.mjs | cut -d ' ' -f 1)" = \
          "${WRAPPED_QUERY_RESOURCE_COMPARATOR_SHA256}"
        MANIFEST=.github/scripts/multigraph-correctness-controls.sha256
        test "$(sha256sum "candidate/${MANIFEST}" | cut -d' ' -f1)" = "${MULTIGRAPH_CORRECTNESS_CONTROLS_SHA256}"
        (cd candidate && sha256sum -c "${MANIFEST}")
        COMPARATOR=candidate/.github/scripts/benchmark-gate.mjs
        if node "${COMPARATOR}" compare-latency-resources \
          --base benchmark-results/base-latency-resources.json \
          --candidate benchmark-results/candidate-latency-resources.json \
          --report benchmark-results/initial-latency-resource-report.md \
          --status benchmark-results/initial-latency-resource-status.json; then
          mv benchmark-results/initial-latency-resource-report.md benchmark-results/latency-resource-report.md
          mv benchmark-results/initial-latency-resource-status.json benchmark-results/latency-resource-status.json
        else
          BASE_JAR=$(find jmh-jars/base -name '*-jmh.jar' -print -quit)
          CANDIDATE_JAR=$(find jmh-jars/candidate -name '*-jmh.jar' -print -quit)
          FILTER='io.johnsonlee.graphite.webgraph.AllFixtureWrappedDiscoveryResourceBenchmark.allFixtureThirtySixGraphFootprint'
          GRAPH_JVM_ARGS="-Dandroid.graph.path=${PWD}/fixture-graphs/android \
            -Dtika.graph.path=${PWD}/fixture-graphs/tika \
            -Dhive.graph.path=${PWD}/fixture-graphs/hive \
            -Dkotlin.compiler.graph.path=${PWD}/fixture-graphs/kotlin-compiler"
          java -jar "${CANDIDATE_JAR}" "${FILTER}" -jvmArgsAppend "${GRAPH_JVM_ARGS}" \
            -foe true -prof gc -rf json \
            -rff "${PWD}/benchmark-results/candidate-latency-resources-confirmation.json"
          java -jar "${BASE_JAR}" "${FILTER}" -jvmArgsAppend "${GRAPH_JVM_ARGS}" \
            -foe true -prof gc -rf json \
            -rff "${PWD}/benchmark-results/base-latency-resources-confirmation.json"
          node "${COMPARATOR}" confirm-latency-resources \
            --initial benchmark-results/initial-latency-resource-status.json \
            --base benchmark-results/base-latency-resources-confirmation.json \
            --candidate benchmark-results/candidate-latency-resources-confirmation.json \
            --report benchmark-results/latency-resource-report.md \
            --status benchmark-results/latency-resource-status.json
        fi

    - name: Upload resource results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-latency-resources-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
        path: benchmark-results/
        if-no-files-found: warn
        retention-days: 14

  prepare-fixture64:
    name: prepare-fixture64
    runs-on: ubuntu-latest
    # A cache miss generates the corpus twice (the second copy proves reproducibility):
    # about 16 minutes on a hosted runner before the build, cache save and upload.
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
    - name: Checkout exact candidate fixture builder
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: candidate
        persist-credentials: false

    - name: Set up Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: true

    - name: Build candidate fixture generator and pinned fixture JARs
      run: |
        candidate/gradlew -p candidate \
          :webgraph:jmhJar :webgraph:prepareBenchmarkFixtures --no-daemon

    # The cache holds the corpus and the reproducibility receipt that was earned when it was
    # generated. The key covers everything the generator reads (its sources, the pinned
    # fixture JARs, the scripts), so a hit is a corpus this exact generator already produced
    # twice with identical semantics; a hit re-verifies it below instead of regenerating the
    # second copy. The repeat copy itself is never cached: it only exists to be compared.
    - name: Restore fixture64 graph cache
      id: fixture64-cache
      uses: actions/cache/restore@v5
      with:
        path: |
          shared-fixture64/graphs
          shared-fixture64/fixture-reproducibility.json
        key: >-
          ${{ runner.os }}-${{ runner.arch }}-fixture64-real-v2-temurin17-${{
          hashFiles('candidate/frontend/jvm/webgraph/build/benchmark-fixtures/*.jar',
          'candidate/gradle/libs.versions.toml', 'candidate/gradle/wrapper/gradle-wrapper.properties',
          'candidate/settings.gradle.kts', 'candidate/build.gradle.kts',
          'candidate/**/build.gradle.kts', 'candidate/frontend/jvm/core/src/main/**',
          'candidate/frontend/jvm/sootup/src/main/**',
          'candidate/frontend/jvm/webgraph/src/main/kotlin/io/johnsonlee/graphite/webgraph/BinaryEncoding.kt',
          'candidate/frontend/jvm/webgraph/src/main/kotlin/io/johnsonlee/graphite/webgraph/CallSiteIndexPersistenceInput.kt',
          'candidate/frontend/jvm/webgraph/src/main/kotlin/io/johnsonlee/graphite/webgraph/ClassOverviewStore.kt',
          'candidate/frontend/jvm/webgraph/src/main/kotlin/io/johnsonlee/graphite/webgraph/GraphStore.kt',
          'candidate/frontend/jvm/webgraph/src/main/kotlin/io/johnsonlee/graphite/webgraph/MappedCallSiteStringIndex.kt',
          'candidate/frontend/jvm/webgraph/src/main/kotlin/io/johnsonlee/graphite/webgraph/NodeSerializer.kt',
          'candidate/frontend/jvm/webgraph/src/main/kotlin/io/johnsonlee/graphite/webgraph/PersistedResourceAccessor.kt',
          'candidate/frontend/jvm/webgraph/src/main/kotlin/io/johnsonlee/graphite/webgraph/StringTable.kt',
          'candidate/frontend/jvm/webgraph/src/main/kotlin/io/johnsonlee/graphite/webgraph/WebGraphBackedGraph.kt',
          'candidate/frontend/jvm/webgraph/src/jmh/kotlin/io/johnsonlee/graphite/webgraph/BenchmarkCorpus.kt',
          'candidate/frontend/jvm/webgraph/src/jmh/kotlin/io/johnsonlee/graphite/webgraph/Fixture64GraphPreparation.kt',
          'candidate/.github/scripts/prepare-fixture64-graphs.sh',
          'candidate/.github/scripts/test-fixture64-reproducibility.sh',
          'candidate/.github/scripts/verify-fixture64-corpus.sh') }}

    - name: Generate and authenticate one shared fixture64 artifact
      env:
        CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        FIXTURE64_CACHE_HIT: ${{ steps.fixture64-cache.outputs.cache-hit }}
      run: |
        CANDIDATE_JAR=$(find candidate/frontend/jvm/webgraph/build/libs \
          -maxdepth 1 -name '*-jmh.jar' -print -quit)
        FIXTURE_DIR=candidate/frontend/jvm/webgraph/build/benchmark-fixtures
        test -f "${CANDIDATE_JAR}"
        mkdir -p shared-fixture64
        if [[ "${FIXTURE64_CACHE_HIT}" == true ]]; then
          test -f shared-fixture64/fixture-reproducibility.json
          candidate/.github/scripts/verify-fixture64-corpus.sh \
            "${CANDIDATE_JAR}" "${FIXTURE_DIR}" shared-fixture64/graphs \
            shared-fixture64/fixture-reproducibility.json
        else
          candidate/.github/scripts/prepare-fixture64-graphs.sh \
            "${CANDIDATE_JAR}" "${FIXTURE_DIR}" shared-fixture64/graphs
          candidate/.github/scripts/test-fixture64-reproducibility.sh \
            "${CANDIDATE_JAR}" "${FIXTURE_DIR}" shared-fixture64/graphs \
            "${RUNNER_TEMP}/fixture64-repeat" shared-fixture64/fixture-reproducibility.json
        fi
        mapfile -t FIXTURE_JARS < <(find "${FIXTURE_DIR}" -maxdepth 1 -type f -name '*.jar' -print | sort)
        test "${#FIXTURE_JARS[@]}" -eq 4
        FIXTURE_JAR_SET_SHA=$(
          for FIXTURE_JAR in "${FIXTURE_JARS[@]}"; do
            printf '%s\t%s\n' "$(basename "${FIXTURE_JAR}")" \
              "$(sha256sum "${FIXTURE_JAR}" | awk '{print $1}')"
          done | sha256sum | awk '{print $1}'
        )
        jq -n \
          --arg schema graphite-shared-fixture64-v1 \
          --arg candidateSha "${CANDIDATE_SHA}" \
          --arg fixtureJarSetSha256 "${FIXTURE_JAR_SET_SHA}" \
          --arg manifestSha256 "$(sha256sum shared-fixture64/graphs/graphs.tsv | awk '{print $1}')" \
          --arg provenanceSha256 \
            "$(sha256sum shared-fixture64/graphs/fixture-provenance.tsv | awk '{print $1}')" \
          --arg receiptSha256 \
            "$(sha256sum shared-fixture64/fixture-reproducibility.json | awk '{print $1}')" \
          '{schema: $schema, complete: true, candidateSha: $candidateSha,
            fixtureJarSetSha256: $fixtureJarSetSha256, manifestSha256: $manifestSha256,
            provenanceSha256: $provenanceSha256, receiptSha256: $receiptSha256}' \
          > shared-fixture64/fixture64.complete.json

    - name: Save fixture64 graph cache
      if: steps.fixture64-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: |
          shared-fixture64/graphs
          shared-fixture64/fixture-reproducibility.json
        key: ${{ steps.fixture64-cache.outputs.cache-primary-key }}

    - name: Upload shared fixture64 corpus
      uses: actions/upload-artifact@v7
      with:
        name: shared-fixture64-${{ github.event.pull_request.head.sha }}
        path: shared-fixture64/
        if-no-files-found: error
        overwrite: true
        retention-days: 1

  graph-routing-pressure-evidence:
    name: graph-routing-pressure-evidence
    needs: [prepare-fixture64]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
    - name: Checkout exact candidate graph-routing implementation
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: candidate
        persist-credentials: false

    - name: Set up Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: true

    - name: Build candidate fixture generator and pinned fixture JARs
      run: |
        candidate/gradlew -p candidate \
          :webgraph:jmhJar :webgraph:prepareBenchmarkFixtures --no-daemon

    - name: Download shared fixture64 corpus
      uses: actions/download-artifact@v8
      with:
        name: shared-fixture64-${{ github.event.pull_request.head.sha }}
        path: shared-fixture64

    - name: Verify restored fixture64 corpus and provenance
      run: |
        CANDIDATE_JAR=$(find candidate/frontend/jvm/webgraph/build/libs \
          -maxdepth 1 -name '*-jmh.jar' -print -quit)
        test -f "${CANDIDATE_JAR}"
        candidate/.github/scripts/verify-shared-fixture64.sh \
          "${CANDIDATE_JAR}" \
          candidate/frontend/jvm/webgraph/build/benchmark-fixtures \
          shared-fixture64 \
          "${{ github.event.pull_request.head.sha }}"

    - name: Build and execute trusted graph-routing states
      env:
        GH_TOKEN: ${{ github.token }}
        GRAPHITE_PRESSURE_PUBLISH_EVIDENCE: false
        GRAPHITE_FIXTURE64_REPRODUCIBILITY_RECEIPT: ../shared-fixture64/fixture-reproducibility.json
      run: |
        cd candidate
        .github/scripts/run-real64-graph-routing.sh \
          ../shared-fixture64/graphs/graphs.tsv \
          frontend/jvm/webgraph/build/benchmark-fixtures \
          "${{ github.event.pull_request.base.sha }}" \
          "${{ github.event.pull_request.head.sha }}" \
          "${{ github.repository }}" \
          ../benchmark-results

    - name: Upload trusted graph-routing result
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-graph-routing-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
        path: benchmark-results/
        if-no-files-found: error
        retention-days: 14

    - name: Enforce trusted graph-routing result
      if: always()
      run: |
        jq -e '.passed == true' benchmark-results/graph-routing-status.json >/dev/null

  graph-routing-pressure-external-evidence-disabled:
    name: legacy-graph-routing-external-evidence-disabled
    if: ${{ github.repository == 'disabled/legacy-graph-routing-evidence' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: read

    steps:
    - name: Checkout exact candidate evidence verifier
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: evidence-candidate
        persist-credentials: false

    - name: Verify complete candidate evidence comparator closure
      run: |
        set -euo pipefail
        MANIFEST=.github/scripts/multigraph-correctness-controls.sha256
        test "$(sha256sum "evidence-candidate/${MANIFEST}" | cut -d' ' -f1)" = "${MULTIGRAPH_CORRECTNESS_CONTROLS_SHA256}"
        (cd evidence-candidate && sha256sum -c "${MANIFEST}")

    - name: Verify trusted fixture64 graph evidence status
      uses: actions/github-script@v9
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        TRUSTED_EVIDENCE_ACTOR: johnsonlee
        EVIDENCE_CONTEXT: graphite/fixture64-graph-routing
      with:
        script: |
          const crypto = require('crypto');
          const fs = require('fs');
          const path = require('path');
          const { pathToFileURL } = require('url');
          const { materializeGistFiles } = await import(pathToFileURL(path.resolve(
            'evidence-candidate/.github/scripts/gist-evidence.mjs'
          )).href);
          const { canonicalCorrectnessManifest } = await import(pathToFileURL(path.resolve(
            'evidence-candidate/.github/scripts/benchmark-gate.mjs'
          )).href);
          const errors = [];
          const { data: statuses } = await github.rest.repos.listCommitStatusesForRef({
            owner: context.repo.owner,
            repo: context.repo.repo,
            ref: process.env.CANDIDATE_SHA,
            per_page: 100
          });
          const status = statuses.find(item => item.context === process.env.EVIDENCE_CONTEXT);
          if (!status) errors.push(`Missing ${process.env.EVIDENCE_CONTEXT} status for candidate SHA`);
          if (status && status.state !== 'success') errors.push(`External evidence state is ${status.state}`);
          if (status && status.creator?.login !== process.env.TRUSTED_EVIDENCE_ACTOR) {
            errors.push(`External evidence actor is ${status.creator?.login || 'unknown'}`);
          }
          const pattern = /^fixture64 base=([0-9a-f]{12}) cold=([0-9]+(?:\.[0-9]+)?)\/([0-9]+(?:\.[0-9]+)?)x warm=([0-9]+(?:\.[0-9]+)?)\/([0-9]+(?:\.[0-9]+)?)x startup=([0-9]+(?:\.[0-9]+)?)\/([0-9]+(?:\.[0-9]+)?)x correct=pass$/;
          const match = status?.description?.match(pattern);
          if (!match) errors.push('External evidence description has an invalid contract');
          const expectedBase = process.env.BASE_SHA.slice(0, 12);
          if (match && match[1] !== expectedBase) {
            errors.push(`External evidence base ${match[1]} does not match ${expectedBase}`);
          }
          const speedups = match ? match.slice(2).map(Number) : [];
          if (speedups.length !== 6 || speedups.some(value => !Number.isFinite(value) || value <= 0)) {
            errors.push(`Every reported cold/warm/startup speedup must be finite and positive: ${speedups.join(', ')}`);
          }
          const evidenceMatch = status?.target_url?.match(
            /^https:\/\/gist\.github\.com\/johnsonlee\/([0-9a-f]+)\/revisions\/([0-9a-f]{40})$/
          );
          if (!evidenceMatch) errors.push('Status target_url is not an immutable johnsonlee Gist revision');
          let evidence;
          if (evidenceMatch) {
            try {
              const response = await fetch(
                `https://api.github.com/gists/${evidenceMatch[1]}/${evidenceMatch[2]}`,
                { headers: { accept: 'application/vnd.github+json' } }
              );
              if (!response.ok) throw new Error(`public Gist API returned HTTP ${response.status}`);
              evidence = await response.json();
              if (evidence.owner?.login !== process.env.TRUSTED_EVIDENCE_ACTOR) {
                errors.push(`Evidence owner is ${evidence.owner?.login || 'unknown'}`);
              }
            } catch (error) {
              errors.push(`Unable to load immutable Gist evidence: ${error.message}`);
            }
          }
          const directory = 'benchmark-results/evidence';
          let files = {};
          try {
            files = await materializeGistFiles({
              files: evidence?.files || {},
              gistId: evidenceMatch?.[1],
              owner: process.env.TRUSTED_EVIDENCE_ACTOR,
              directory,
              request: async options => {
                const response = await fetch(options.url, { headers: options.headers });
                if (!response.ok) throw new Error(`public Gist raw URL returned HTTP ${response.status}`);
                return { data: await response.text() };
              }
            });
          } catch (error) {
            errors.push(`Unable to materialize immutable Gist evidence: ${error.message}`);
          }
          let manifest;
          try {
            manifest = JSON.parse(fs.readFileSync(path.join(directory, 'evidence-manifest.json'), 'utf8'));
          } catch (error) {
            errors.push(`Evidence manifest is invalid: ${error.message}`);
          }
          const requiredFiles = [
            'provenance.json', 'graphs.tsv', 'fixture-provenance.tsv',
            'fixture-reproducibility.json',
            'base-single-source-reference.json', 'base-single-source-reference.tsv',
            'base-single-source-reference.manifest',
            'base-single-source-oracle.manifest',
            ...['cold', 'warm', 'startup-prepared'].flatMap(state => [
              `base-graph-routing-${state}.json`, `base-graph-routing-${state}.tsv`,
              `base-graph-routing-${state}.correctness`,
              `candidate-graph-routing-${state}.json`, `candidate-graph-routing-${state}.tsv`,
              `candidate-graph-routing-${state}.correctness`,
              `graph-routing-${state}-report.md`, `graph-routing-${state}-status.json`
            ])
          ];
          if (manifest) {
            if (manifest.schema !== 'graphite-fixture64-evidence-v8' ||
                manifest.repository !== `${context.repo.owner}/${context.repo.repo}` ||
                manifest.baseSha !== process.env.BASE_SHA ||
                manifest.candidateSha !== process.env.CANDIDATE_SHA ||
                manifest.statusContext !== process.env.EVIDENCE_CONTEXT ||
                manifest.description !== status?.description) {
              errors.push('Evidence manifest identity does not match the PR status');
            }
            for (const name of requiredFiles) {
              const content = files[name];
              const expectedHash = manifest.files?.[name];
              const actualHash = typeof content === 'string'
                ? crypto.createHash('sha256').update(content).digest('hex')
                : null;
              if (!/^[0-9a-f]{64}$/.test(expectedHash || '') || actualHash !== expectedHash) {
                errors.push(`Evidence digest mismatch for ${name}`);
              }
            }
          }
          try {
            const provenance = JSON.parse(fs.readFileSync(path.join(directory, 'provenance.json'), 'utf8'));
            if (provenance.baseSha !== process.env.BASE_SHA ||
                provenance.candidateSha !== process.env.CANDIDATE_SHA ||
                provenance.repository !== `${context.repo.owner}/${context.repo.repo}` ||
                provenance.oracleSource !== 'base-single-source') {
              errors.push('Evidence provenance identity is invalid');
            }
            const evidenceSha256 = name => crypto.createHash('sha256')
              .update(fs.readFileSync(path.join(directory, name))).digest('hex');
            for (const [field, name] of [
              ['manifestSha256', 'graphs.tsv'],
              ['fixtureProvenanceSha256', 'fixture-provenance.tsv'],
              ['oracleSha256', 'base-single-source-oracle.manifest']
            ]) {
              if (provenance[field] !== evidenceSha256(name)) {
                errors.push(`Evidence provenance ${field} does not match ${name}`);
              }
            }
            const reproducibility = JSON.parse(fs.readFileSync(
              path.join(directory, 'fixture-reproducibility.json'), 'utf8'
            ));
            if (!reproducibility.passed ||
                reproducibility.firstProvenanceSha256 !== reproducibility.repeatedProvenanceSha256 ||
                reproducibility.firstManifestSemanticSha256 !==
                  reproducibility.repeatedManifestSemanticSha256) {
              errors.push('Repeated fixture-JAR preparation is not reproducible');
            }
            for (const [stateIndex, state] of ['cold', 'warm', 'startup-prepared'].entries()) {
              const result = JSON.parse(fs.readFileSync(
                path.join(directory, `graph-routing-${state}-status.json`), 'utf8'
              ));
              if (!result.passed) {
                errors.push(`${state} comparator status does not pass its state-specific gate`);
              }
              const reported = speedups.slice(stateIndex * 2, stateIndex * 2 + 2);
              const measured = [result.gateP50Speedup, result.gateP95Speedup]
                .map(value => Number(Number(value).toFixed(2)));
              if (reported.length !== 2 || reported.some((value, index) => value !== measured[index])) {
                errors.push(`${state} commit-status speedups ${reported.join('/')} do not equal ` +
                  `the recomputed evidence ${measured.join('/')}`);
              }
              const correctness = fs.readFileSync(
                path.join(directory, `candidate-graph-routing-${state}.correctness`), 'utf8'
              );
              const oracle = fs.readFileSync(
                path.join(directory, 'base-single-source-oracle.manifest'), 'utf8'
              );
              if (canonicalCorrectnessManifest(correctness, `${state} candidate`) !==
                  canonicalCorrectnessManifest(oracle, 'single-source oracle')) {
                errors.push(`${state} candidate correctness differs from the oracle`);
              }
            }
          } catch (error) {
            errors.push(`Evidence payload is invalid: ${error.message}`);
          }
          const passed = errors.length === 0;
          const report = [
            '##### 64 fixture-derived graph routing pressure',
            '',
            passed ? '**PASS**' : '**FAIL**',
            '',
            status?.description || 'No trusted external evidence status was found.',
            '',
            ...(errors.length ? ['', 'Errors:', ...errors.map(error => `- ${error}`)] : [])
          ].join('\n') + '\n';
          fs.mkdirSync('benchmark-results', { recursive: true });
          fs.writeFileSync('benchmark-results/graph-routing-report.md', report);
          fs.writeFileSync('benchmark-results/graph-routing-status.json', JSON.stringify({
            passed,
            errors,
            baseSha: process.env.BASE_SHA,
            candidateSha: process.env.CANDIDATE_SHA,
            evidenceActor: status?.creator?.login || null,
            coldP50Speedup: speedups[0] ?? null,
            coldP95Speedup: speedups[1] ?? null,
            warmP50Speedup: speedups[2] ?? null,
            warmP95Speedup: speedups[3] ?? null,
            startupPreparedP50Speedup: speedups[4] ?? null,
            startupPreparedP95Speedup: speedups[5] ?? null
          }, null, 2) + '\n');

    - name: Checkout exact base build inputs
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: evidence-base
        persist-credentials: false

    - name: Independently recompute fixture64 comparisons
      run: |
        jq -e '.passed == true' benchmark-results/graph-routing-status.json >/dev/null
        PROVENANCE=benchmark-results/evidence/provenance.json
        sha256_file() { sha256sum "$1" | cut -d' ' -f1; }
        assert_provenance_hash() {
          test "$(sha256_file "$2")" = "$(jq -r ".$1" "${PROVENANCE}")"
        }
        assert_provenance_hash harnessSha256 \
          evidence-candidate/frontend/jvm/webgraph/src/jmh/kotlin/io/johnsonlee/graphite/webgraph/LargeBroadQueryPressureBenchmark.kt
        assert_provenance_hash correctnessManifestSha256 \
          evidence-candidate/frontend/jvm/webgraph/src/main/kotlin/io/johnsonlee/graphite/webgraph/QueryCorrectnessManifest.kt
        assert_provenance_hash fixtureVerifierSha256 \
          evidence-candidate/frontend/jvm/webgraph/src/jmh/kotlin/io/johnsonlee/graphite/webgraph/Fixture64GraphPreparation.kt
        assert_provenance_hash comparatorSha256 evidence-candidate/.github/scripts/benchmark-gate.mjs
        assert_provenance_hash scriptSha256 evidence-candidate/.github/scripts/run-real64-graph-routing.sh
        assert_provenance_hash reproducibilityScriptSha256 \
          evidence-candidate/.github/scripts/test-fixture64-reproducibility.sh
        assert_provenance_hash zipHasherSha256 evidence-candidate/.github/scripts/canonical-zip-sha256.py
        assert_provenance_hash gistEvidenceSha256 evidence-candidate/.github/scripts/gist-evidence.mjs
        assert_provenance_hash fixturePreparationScriptSha256 \
          evidence-candidate/.github/scripts/prepare-fixture64-graphs.sh
        assert_provenance_hash workloadVerifierSha256 \
          evidence-candidate/.github/scripts/verify-fixture64-workload.sh
        assert_provenance_hash manifestSha256 benchmark-results/evidence/graphs.tsv
        assert_provenance_hash fixtureProvenanceSha256 benchmark-results/evidence/fixture-provenance.tsv
        assert_provenance_hash oracleSha256 benchmark-results/evidence/base-single-source-oracle.manifest
        NORMALIZED_PROVENANCE_SHA=$(cut -f1-18 benchmark-results/evidence/fixture-provenance.tsv | sha256sum | cut -d' ' -f1)
        NORMALIZED_MANIFEST_SHA=$(awk -F '\t' 'BEGIN { OFS="\t" } /^#/ { print; next } { print $1, $3, $4, $5, $6 }' \
          benchmark-results/evidence/graphs.tsv | sha256sum | cut -d' ' -f1)
        RECEIPT=benchmark-results/evidence/fixture-reproducibility.json
        test "$(jq -r .firstProvenanceSha256 "${RECEIPT}")" = "${NORMALIZED_PROVENANCE_SHA}"
        test "$(jq -r .repeatedProvenanceSha256 "${RECEIPT}")" = "${NORMALIZED_PROVENANCE_SHA}"
        test "$(jq -r .firstManifestSemanticSha256 "${RECEIPT}")" = "${NORMALIZED_MANIFEST_SHA}"
        test "$(jq -r .repeatedManifestSemanticSha256 "${RECEIPT}")" = "${NORMALIZED_MANIFEST_SHA}"
        jvm() { if [[ -d "$1/frontend/jvm/$2" ]]; then echo "$1/frontend/jvm/$2"; else echo "$1/graphite-$2"; fi; }
        BASE_WEBGRAPH=$(jvm evidence-base webgraph)
        EXPECTED_BASE_INSTRUMENTATION=$(
          for INSTRUMENTATION_PATH in \
            src/jmh/kotlin/io/johnsonlee/graphite/webgraph/LargeBroadQueryPressureBenchmark.kt \
            src/main/kotlin/io/johnsonlee/graphite/webgraph/QueryCorrectnessManifest.kt; do
            if ! cmp -s \
              "${BASE_WEBGRAPH}/${INSTRUMENTATION_PATH}" \
              "evidence-candidate/frontend/jvm/webgraph/${INSTRUMENTATION_PATH}"; then
              printf '%s\n' "${BASE_WEBGRAPH#evidence-base/}/${INSTRUMENTATION_PATH}"
            fi
          done | sort
        )
        cp \
          evidence-candidate/frontend/jvm/webgraph/src/jmh/kotlin/io/johnsonlee/graphite/webgraph/LargeBroadQueryPressureBenchmark.kt \
          "${BASE_WEBGRAPH}/src/jmh/kotlin/io/johnsonlee/graphite/webgraph/LargeBroadQueryPressureBenchmark.kt"
        cp \
          evidence-candidate/frontend/jvm/webgraph/src/main/kotlin/io/johnsonlee/graphite/webgraph/QueryCorrectnessManifest.kt \
          "${BASE_WEBGRAPH}/src/main/kotlin/io/johnsonlee/graphite/webgraph/QueryCorrectnessManifest.kt"
        test "$(git -C evidence-base diff --name-only | sort)" = "${EXPECTED_BASE_INSTRUMENTATION}"
        evidence-base/gradlew -p evidence-base :webgraph:jmhJar --no-daemon
        evidence-candidate/gradlew -p evidence-candidate \
          :webgraph:jmhJar :webgraph:prepareBenchmarkFixtures --no-daemon
        BASE_JAR=$(find "${BASE_WEBGRAPH}/build/libs" -maxdepth 1 -name '*-jmh.jar' -print -quit)
        CANDIDATE_JAR=$(find evidence-candidate/frontend/jvm/webgraph/build/libs -maxdepth 1 -name '*-jmh.jar' -print -quit)
        python3 -c 'import sys; assert sys.version_info >= (3, 12), sys.version'
        test "$(python3 evidence-candidate/.github/scripts/canonical-zip-sha256.py "${BASE_JAR}")" = \
          "$(jq -r .baseJarContentSha256 "${PROVENANCE}")"
        test "$(python3 evidence-candidate/.github/scripts/canonical-zip-sha256.py "${CANDIDATE_JAR}")" = \
          "$(jq -r .candidateJarContentSha256 "${PROVENANCE}")"
        FIXTURE_DIR=evidence-candidate/frontend/jvm/webgraph/build/benchmark-fixtures
        for FIXTURE_JAR in "${FIXTURE_DIR}"/*.jar; do
          FIXTURE_NAME=$(basename "${FIXTURE_JAR}")
          FIXTURE_SHA=$(sha256_file "${FIXTURE_JAR}")
          test "$(awk -F '\t' -v name="${FIXTURE_NAME}" -v sha="${FIXTURE_SHA}" \
            'NR > 1 && $4 == name && $5 == sha { count++ } END { print count + 0 }' \
            benchmark-results/evidence/fixture-provenance.tsv)" -eq 16
        done
        RECOMPUTED_FIXTURE64=${RUNNER_TEMP}/recomputed-fixture64
        evidence-candidate/.github/scripts/prepare-fixture64-graphs.sh \
          "${CANDIDATE_JAR}" "${FIXTURE_DIR}" "${RECOMPUTED_FIXTURE64}"
        evidence-candidate/.github/scripts/verify-fixture64-workload.sh \
          benchmark-results/evidence "${RECOMPUTED_FIXTURE64}" \
          benchmark-results/evidence/base-single-source-reference.tsv \
          benchmark-results/evidence/base-single-source-reference.manifest \
          benchmark-results/evidence/base-single-source-oracle.manifest \
          benchmark-results/evidence/base-graph-routing-cold.tsv \
          benchmark-results/evidence/base-graph-routing-cold.correctness \
          benchmark-results/evidence/candidate-graph-routing-cold.tsv \
          benchmark-results/evidence/candidate-graph-routing-cold.correctness \
          benchmark-results/evidence/base-graph-routing-warm.tsv \
          benchmark-results/evidence/base-graph-routing-warm.correctness \
          benchmark-results/evidence/candidate-graph-routing-warm.tsv \
          benchmark-results/evidence/candidate-graph-routing-warm.correctness \
          benchmark-results/evidence/base-graph-routing-startup-prepared.tsv \
          benchmark-results/evidence/base-graph-routing-startup-prepared.correctness \
          benchmark-results/evidence/candidate-graph-routing-startup-prepared.tsv \
          benchmark-results/evidence/candidate-graph-routing-startup-prepared.correctness
        node evidence-candidate/.github/scripts/benchmark-gate.mjs derive-graph-routing-oracle \
          --references benchmark-results/evidence/base-single-source-reference.manifest \
          --oracle benchmark-results/recomputed-base-single-source-oracle.manifest
        cmp benchmark-results/recomputed-base-single-source-oracle.manifest \
          benchmark-results/evidence/base-single-source-oracle.manifest
        for STATE in cold warm startup-prepared; do
          case "${STATE}" in
            cold) BASE_CORRECTNESS_ORACLE=benchmark-results/evidence/base-graph-routing-warm.correctness ;;
            warm|startup-prepared) \
              BASE_CORRECTNESS_ORACLE=benchmark-results/evidence/base-graph-routing-cold.correctness ;;
          esac
          node evidence-candidate/.github/scripts/benchmark-gate.mjs compare-graph-id-pressure \
            --base "benchmark-results/evidence/base-graph-routing-${STATE}.json" \
            --candidate "benchmark-results/evidence/candidate-graph-routing-${STATE}.json" \
            --base-observations "benchmark-results/evidence/base-graph-routing-${STATE}.tsv" \
            --candidate-observations "benchmark-results/evidence/candidate-graph-routing-${STATE}.tsv" \
            --base-correctness "${BASE_CORRECTNESS_ORACLE}" \
            --candidate-correctness benchmark-results/evidence/base-single-source-oracle.manifest \
            --minimum-speedup 10 \
            --report "benchmark-results/recomputed-${STATE}-report.md" \
            --status "benchmark-results/recomputed-${STATE}-status.json"
          cmp "benchmark-results/recomputed-${STATE}-report.md" \
            "benchmark-results/evidence/graph-routing-${STATE}-report.md"
          cmp "benchmark-results/recomputed-${STATE}-status.json" \
            "benchmark-results/evidence/graph-routing-${STATE}-status.json"
        done

    - name: Upload graph-routing evidence result
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-graph-routing-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
        path: benchmark-results/
        if-no-files-found: error
        retention-days: 14

    - name: Enforce graph-routing evidence
      if: always()
      run: jq -e '.passed == true' benchmark-results/graph-routing-status.json >/dev/null

  global-wide-pressure-evidence:
    name: global-wide-pressure-evidence
    needs: [prepare-fixture64]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
    - name: Checkout exact candidate benchmark implementation
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: candidate
        persist-credentials: false

    - name: Set up Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: true

    - name: Build candidate fixture generator and pinned fixture JARs
      run: |
        candidate/gradlew -p candidate \
          :webgraph:jmhJar :webgraph:prepareBenchmarkFixtures --no-daemon

    - name: Download shared fixture64 corpus
      uses: actions/download-artifact@v8
      with:
        name: shared-fixture64-${{ github.event.pull_request.head.sha }}
        path: shared-fixture64

    - name: Verify restored fixture64 corpus and provenance
      run: |
        CANDIDATE_JAR=$(find candidate/frontend/jvm/webgraph/build/libs \
          -maxdepth 1 -name '*-jmh.jar' -print -quit)
        test -f "${CANDIDATE_JAR}"
        candidate/.github/scripts/verify-shared-fixture64.sh \
          "${CANDIDATE_JAR}" \
          candidate/frontend/jvm/webgraph/build/benchmark-fixtures \
          shared-fixture64 \
          "${{ github.event.pull_request.head.sha }}"

    - name: Build and execute three trusted paired global-wide forks
      env:
        GH_TOKEN: ${{ github.token }}
        GRAPHITE_PRESSURE_PUBLISH_EVIDENCE: false
        GRAPHITE_PRESSURE_COLD_DIAGNOSTICS_ONLY: true
        GRAPHITE_FIXTURE64_REPRODUCIBILITY_RECEIPT: ../shared-fixture64/fixture-reproducibility.json
      run: |
        cd candidate
        .github/scripts/run-real64-global-wide.sh \
          ../shared-fixture64/graphs/graphs.tsv \
          frontend/jvm/webgraph/build/benchmark-fixtures \
          "${{ github.event.pull_request.base.sha }}" \
          "${{ github.event.pull_request.head.sha }}" \
          "${{ github.repository }}" \
          ../benchmark-results

    - name: Upload trusted global-wide result
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-global-wide-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
        path: benchmark-results/
        if-no-files-found: error
        retention-days: 14

    - name: Enforce trusted global-wide result
      if: always()
      run: jq -e '.passed == true' benchmark-results/global-wide-status.json >/dev/null

  global-wide-pressure-external-evidence-disabled:
    name: legacy-global-wide-external-evidence-disabled
    if: ${{ github.repository == 'disabled/legacy-global-wide-evidence' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: read

    steps:
    - name: Checkout exact candidate evidence verifier
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: candidate
        persist-credentials: false

    - name: Materialize and authenticate immutable global-wide evidence
      uses: actions/github-script@v9
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        EVIDENCE_CONTEXT: graphite/fixture64-global-wide
        TRUSTED_EVIDENCE_ACTOR: johnsonlee
      with:
        script: |
          const crypto = require('crypto');
          const fs = require('fs');
          const path = require('path');
          const { pathToFileURL } = require('url');
          const { materializeGistFiles } = await import(pathToFileURL(path.resolve(
            'candidate/.github/scripts/gist-evidence.mjs'
          )).href);
          const errors = [];
          const { data: statuses } = await github.rest.repos.listCommitStatusesForRef({
            owner: context.repo.owner, repo: context.repo.repo,
            ref: process.env.CANDIDATE_SHA, per_page: 100
          });
          const status = statuses.find(item => item.context === process.env.EVIDENCE_CONTEXT);
          if (!status || status.state !== 'success') errors.push('Missing successful global-wide evidence status');
          if (status?.creator?.login !== process.env.TRUSTED_EVIDENCE_ACTOR) {
            errors.push(`Untrusted evidence actor ${status?.creator?.login || 'missing'}`);
          }
          const descriptionPattern =
            /^fixture64-wide base=([0-9a-f]{12}) p50=([0-9]+(?:\.[0-9]+)?)x p95=([0-9]+(?:\.[0-9]+)?)x pairs=3 correct=pass$/;
          const descriptionMatch = status?.description?.match(descriptionPattern);
          if (!descriptionMatch || descriptionMatch[1] !== process.env.BASE_SHA.slice(0, 12)) {
            errors.push('Evidence description is not bound to the exact base SHA');
          }
          const evidenceMatch = status?.target_url?.match(
            /^https:\/\/gist\.github\.com\/johnsonlee\/([0-9a-f]+)\/revisions\/([0-9a-f]{40})$/
          );
          if (!evidenceMatch) errors.push('Evidence URL is not an immutable trusted Gist revision');
          let evidence;
          if (evidenceMatch) {
            const response = await fetch(`https://api.github.com/gists/${evidenceMatch[1]}/${evidenceMatch[2]}`,
              { headers: { accept: 'application/vnd.github+json' } });
            if (!response.ok) errors.push(`Unable to fetch Gist: HTTP ${response.status}`);
            else evidence = await response.json();
          }
          if (evidence?.owner?.login !== process.env.TRUSTED_EVIDENCE_ACTOR) {
            errors.push('Immutable evidence owner is not trusted');
          }
          const directory = 'benchmark-results/evidence-global-wide';
          let files = {};
          try {
            files = await materializeGistFiles({
              files: evidence?.files || {}, gistId: evidenceMatch?.[1],
              owner: process.env.TRUSTED_EVIDENCE_ACTOR, directory,
              request: async options => {
                const response = await fetch(options.url, { headers: options.headers });
                if (!response.ok) throw new Error(`raw evidence HTTP ${response.status}`);
                return { data: await response.text() };
              }
            });
          } catch (error) { errors.push(`Unable to materialize evidence: ${error.message}`); }
          let manifest;
          try { manifest = JSON.parse(files['evidence-manifest.json']); }
          catch (error) { errors.push(`Invalid evidence manifest: ${error.message}`); }
          const required = [
            'provenance.json', 'graphs.tsv', 'fixture-provenance.tsv',
            'fixture-reproducibility.json', 'base-global-wide-oracle-seed.correctness',
            'global-wide-report.md', 'global-wide-status.json',
            ...[1, 2, 3].flatMap(index => [
              `base-global-wide-${index}.json`, `base-global-wide-${index}.tsv`,
              `candidate-global-wide-${index}.json`, `candidate-global-wide-${index}.tsv`
            ])
          ];
          if (!manifest || manifest.schema !== 'graphite-fixture64-global-wide-evidence-v2' ||
              manifest.repository !== `${context.repo.owner}/${context.repo.repo}` ||
              manifest.baseSha !== process.env.BASE_SHA || manifest.candidateSha !== process.env.CANDIDATE_SHA ||
              manifest.statusContext !== process.env.EVIDENCE_CONTEXT ||
              manifest.description !== status?.description) {
            errors.push('Evidence manifest identity does not match the PR status');
          }
          for (const name of required) {
            const actual = typeof files[name] === 'string'
              ? crypto.createHash('sha256').update(files[name]).digest('hex') : null;
            if (!/^[0-9a-f]{64}$/.test(manifest?.files?.[name] || '') ||
                manifest.files[name] !== actual) errors.push(`Evidence digest mismatch for ${name}`);
          }
          try {
            const provenance = JSON.parse(files['provenance.json']);
            const digest = value => crypto.createHash('sha256').update(value).digest('hex');
            if (provenance.repository !== `${context.repo.owner}/${context.repo.repo}` ||
                provenance.baseSha !== process.env.BASE_SHA || provenance.candidateSha !== process.env.CANDIDATE_SHA ||
                provenance.fixtureSource !== 'four-pinned-fixture-jars' ||
                provenance.runOrder !== 'candidate-base,base-candidate,candidate-base' ||
                provenance.manifestSha256 !== digest(files['graphs.tsv']) ||
                provenance.fixtureProvenanceSha256 !== digest(files['fixture-provenance.tsv']) ||
                provenance.oracleSha256 !== digest(files['base-global-wide-oracle-seed.correctness'])) {
              errors.push('Evidence provenance is incomplete or inconsistent');
            }
            for (const [field, relative] of [
              ['harnessSha256', 'frontend/jvm/webgraph/src/jmh/kotlin/io/johnsonlee/graphite/webgraph/LargeBroadQueryPressureBenchmark.kt'],
              ['correctnessSha256', 'frontend/jvm/webgraph/src/main/kotlin/io/johnsonlee/graphite/webgraph/QueryCorrectnessManifest.kt'],
              ['fixtureVerifierSha256', 'frontend/jvm/webgraph/src/jmh/kotlin/io/johnsonlee/graphite/webgraph/Fixture64GraphPreparation.kt'],
              ['comparatorSha256', '.github/scripts/benchmark-gate.mjs'],
              ['scriptSha256', '.github/scripts/run-real64-global-wide.sh']
            ]) {
              if (provenance[field] !== digest(fs.readFileSync(path.join('candidate', relative)))) {
                errors.push(`Candidate source digest mismatch for ${field}`);
              }
            }
            const reproducibility = JSON.parse(files['fixture-reproducibility.json']);
            if (!reproducibility.passed ||
                reproducibility.firstProvenanceSha256 !== reproducibility.repeatedProvenanceSha256 ||
                reproducibility.firstManifestSemanticSha256 !== reproducibility.repeatedManifestSemanticSha256) {
              errors.push('Fixture-JAR graph preparation is not reproducible');
            }
            if (files['graphs.tsv'].trim().split(/\r?\n/).filter(line => !line.startsWith('#')).length !== 64 ||
                files['fixture-provenance.tsv'].trim().split(/\r?\n/).length !== 65) {
              errors.push('Fixture evidence does not describe exactly 64 real graph shards');
            }
          } catch (error) { errors.push(`Invalid evidence payload: ${error.message}`); }
          if (errors.length) core.setFailed(errors.join('\n'));

    - name: Recompute the three paired comparisons
      run: |
        set -euo pipefail
        MANIFEST=.github/scripts/multigraph-correctness-controls.sha256
        test "$(sha256sum "candidate/${MANIFEST}" | cut -d' ' -f1)" = "${MULTIGRAPH_CORRECTNESS_CONTROLS_SHA256}"
        (cd candidate && sha256sum -c "${MANIFEST}")
        E=benchmark-results/evidence-global-wide
        BASES=$(printf '%s,' "${E}"/base-global-wide-{1,2,3}.json); BASES=${BASES%,}
        CANDIDATES=$(printf '%s,' "${E}"/candidate-global-wide-{1,2,3}.json); CANDIDATES=${CANDIDATES%,}
        BASE_OBSERVATIONS=$(printf '%s,' "${E}"/base-global-wide-{1,2,3}.tsv); BASE_OBSERVATIONS=${BASE_OBSERVATIONS%,}
        CANDIDATE_OBSERVATIONS=$(printf '%s,' "${E}"/candidate-global-wide-{1,2,3}.tsv); CANDIDATE_OBSERVATIONS=${CANDIDATE_OBSERVATIONS%,}
        node candidate/.github/scripts/benchmark-gate.mjs compare-global-wide-pressure \
          --bases "${BASES}" --candidates "${CANDIDATES}" \
          --base-observations "${BASE_OBSERVATIONS}" \
          --candidate-observations "${CANDIDATE_OBSERVATIONS}" \
          --run-orders candidate-base,base-candidate,candidate-base \
          --graph-manifest "${E}/graphs.tsv" \
          --correctness-oracle "${E}/base-global-wide-oracle-seed.correctness" \
          --minimum-speedup 5 --report benchmark-results/global-wide-report.md \
          --status benchmark-results/global-wide-status.json
        cmp benchmark-results/global-wide-report.md "${E}/global-wide-report.md"
        cmp benchmark-results/global-wide-status.json "${E}/global-wide-status.json"

    - name: Upload global-wide evidence result
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-global-wide-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
        path: benchmark-results/
        if-no-files-found: error
        retention-days: 14

    - name: Enforce global-wide evidence
      if: always()
      run: jq -e '.passed == true' benchmark-results/global-wide-status.json >/dev/null

  rust-latency:
    name: rust-latency-gate
    needs: [candidate-gate-tests, prepare-fixture64]
    runs-on: ubuntu-latest
    # Build each pressure arm and its own real64 corpus sequentially. Independent
    # audits/oracles must complete before any pressure plan can become executable.
    # Full64 proof and six cells per operation need a larger job budget; individual
    # request/process deadlines, heap limits and all acceptance gates stay unchanged.
    timeout-minutes: 360
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    permissions:
      contents: read

    steps:
    - name: Checkout base
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: base
        persist-credentials: false

    - name: Checkout PR
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: candidate
        persist-credentials: false

    - name: Checkout accepted baseline when distinct from PR base
      if: github.event.pull_request.base.sha != '4f2ccf33b969e684972e56b5e810034e6e67c1b3'
      uses: actions/checkout@v7
      with:
        ref: 4f2ccf33b969e684972e56b5e810034e6e67c1b3
        path: accepted
        persist-credentials: false

    - name: Set up Java for independent fixture writers
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          base
          candidate

    # The engines under test are the same `graphite` binary a release ships, one per revision.
    - name: Build the base and candidate engines
      run: |
        cargo build --release --locked -p graphite-cli --manifest-path base/Cargo.toml
        cargo build --release --locked -p graphite-cli --manifest-path candidate/Cargo.toml
        base/target/release/graphite --version
        candidate/target/release/graphite --version

    - name: Download shared fixture64 corpus
      uses: actions/download-artifact@v8
      with:
        name: shared-fixture64-${{ github.event.pull_request.head.sha }}
        path: shared-fixture64

    - name: Verify the shared fixture64 corpus
      env:
        CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        COMPLETE=shared-fixture64/fixture64.complete.json
        jq -e --arg sha "${CANDIDATE_SHA}" \
          '.schema == "graphite-shared-fixture64-v1" and .complete == true and .candidateSha == $sha' \
          "${COMPLETE}" >/dev/null
        test "$(sha256sum shared-fixture64/graphs/graphs.tsv | cut -d' ' -f1)" = \
          "$(jq -r .manifestSha256 "${COMPLETE}")"
        test "$(sha256sum shared-fixture64/graphs/fixture-provenance.tsv | cut -d' ' -f1)" = \
          "$(jq -r .provenanceSha256 "${COMPLETE}")"
        test "$(sha256sum shared-fixture64/fixture-reproducibility.json | cut -d' ' -f1)" = \
          "$(jq -r .receiptSha256 "${COMPLETE}")"

    # The harness is the base's own snapshot script, run identically against both engines.
    # The comparator is base-owned too; until main carries the Rust gate the candidate copy
    # stands in, pinned to the reviewed hash and only after the candidate's own tests passed.
    - name: Select the base-owned harness and comparator
      id: controls
      env:
        CANDIDATE_GATE_TEST_JOB: ${{ needs.candidate-gate-tests.result }}
      run: |
        set -euo pipefail
        HARNESS=base/backend/bench/snapshot.py
        # Until main has the broad suite, use the reviewed candidate harness and all
        # its imported query definitions for both engines, never one plan per revision.
        if [[ ! -f "${HARNESS}" ]] || ! grep -q 'MULTIGRAPH_QUERY_SUITE_V2' "${HARNESS}"; then
          test "${CANDIDATE_GATE_TEST_JOB}" = success
          test "$(sha256sum candidate/backend/bench/snapshot.py | cut -d' ' -f1)" = \
            "${RUST_LATENCY_TRANSITION_HARNESS_SHA256}"
          test "$(sha256sum candidate/backend/bench/shapes.py | cut -d' ' -f1)" = \
            "${RUST_LATENCY_TRANSITION_SHAPES_SHA256}"
          test "$(sha256sum candidate/backend/bench/fixture64.py | cut -d' ' -f1)" = \
            "${RUST_LATENCY_TRANSITION_FIXTURE_SHA256}"
          HARNESS=candidate/backend/bench/snapshot.py
        fi
        test -f "${HARNESS}"
        COMPARATOR=base/.github/scripts/benchmark-gate.mjs
        if ! grep -q 'RUST_MULTIGRAPH_COVERAGE_V2' "${COMPARATOR}"; then
          test "${CANDIDATE_GATE_TEST_JOB}" = success
          test "$(sha256sum candidate/.github/scripts/benchmark-gate.mjs | cut -d' ' -f1)" = \
            "${BENCHMARK_REPORT_TRANSITION_SHA256}"
          MANIFEST=.github/scripts/multigraph-correctness-controls.sha256
          test "$(sha256sum "candidate/${MANIFEST}" | cut -d' ' -f1)" = "${MULTIGRAPH_CORRECTNESS_CONTROLS_SHA256}"
          (cd candidate && sha256sum -c "${MANIFEST}")
          COMPARATOR=candidate/.github/scripts/benchmark-gate.mjs
        fi
        RESPONSE_TRANSITION=false
        # The exact two additive answers were independently audited against raw declaration
        # bindings and original Android classfiles. No timing/resource threshold changes.
        if ! grep -q 'RUST_DECLARED_TYPES_RESPONSE_TRANSITION' "${COMPARATOR}"; then
          test "${CANDIDATE_GATE_TEST_JOB}" = success
          test "$(sha256sum candidate/.github/scripts/benchmark-gate.mjs | cut -d' ' -f1)" = \
            "${RUST_DECLARED_TYPES_COMPARATOR_SHA256}"
          MANIFEST=.github/scripts/multigraph-correctness-controls.sha256
          test "$(sha256sum "candidate/${MANIFEST}" | cut -d' ' -f1)" = "${MULTIGRAPH_CORRECTNESS_CONTROLS_SHA256}"
          (cd candidate && sha256sum -c "${MANIFEST}")
          COMPARATOR=candidate/.github/scripts/benchmark-gate.mjs
          RESPONSE_TRANSITION=true
        fi
        echo "response-transition=${RESPONSE_TRANSITION}" >> "${GITHUB_OUTPUT}"
        echo "harness=${HARNESS}" >> "${GITHUB_OUTPUT}"
        echo "comparator=${COMPARATOR}" >> "${GITHUB_OUTPUT}"

    # Keep actual executable identity: equal Rust sources need not yield equal ELF files.
    # This evidence does not change the paired measurements or their gate decision.
    - name: Archive Rust latency provenance
      env:
        HARNESS: ${{ steps.controls.outputs.harness }}
        COMPARATOR: ${{ steps.controls.outputs.comparator }}
      run: |
        python3 - <<'PY'
        import hashlib, json, os, pathlib, shutil, subprocess
        out = pathlib.Path("benchmark-results/rust-provenance")
        out.mkdir(parents=True, exist_ok=True)
        def digest(path):
            with path.open("rb") as stream:
                return hashlib.file_digest(stream, "sha256").hexdigest()
        flags = ("RUSTFLAGS", "CARGO_ENCODED_RUSTFLAGS", "CARGO_BUILD_TARGET", "CARGO_INCREMENTAL",
                 "RUSTC_WRAPPER", "CC", "CXX", "AR", "CFLAGS", "CXXFLAGS", "LDFLAGS",
                 "GRAPHITE_VERSION", "GRAPHITE_COMMIT", "GRAPHITE_NO_FASTPATH",
                 "RAYON_NUM_THREADS", "MALLOC_CONF", "_RJEM_MALLOC_CONF", "LD_PRELOAD", "LD_LIBRARY_PATH")
        data = {"environment": {name: os.environ.get(name) for name in flags}, "files": {}, "commands": []}
        paths = [pathlib.Path(os.environ["HARNESS"]), pathlib.Path(os.environ["COMPARATOR"]),
                 pathlib.Path(os.environ["HARNESS"]).with_name("fixture64.py"),
                 pathlib.Path(os.environ["HARNESS"]).with_name("shapes.py")]
        paths += [pathlib.Path("shared-fixture64") / name for name in
                  ("fixture64.complete.json", "fixture-reproducibility.json", "graphs/graphs.tsv", "graphs/fixture-provenance.tsv")]
        for revision in ("base", "candidate"):
            binary = pathlib.Path(revision) / "target/release/graphite"
            archived = out / (revision + "-graphite")
            shutil.copy2(binary, archived)
            assert digest(binary) == digest(archived), "Binary changed during archive"
            paths += [binary, archived, pathlib.Path(revision) / "Cargo.toml", pathlib.Path(revision) / "Cargo.lock"]
        # Cargo config can contain credentials; archive only hashes, never contents.
        dirs = [pathlib.Path.cwd(), *pathlib.Path.cwd().parents, pathlib.Path("base"), pathlib.Path("candidate")]
        paths += [directory / ".cargo" / name for directory in dirs for name in ("config", "config.toml")]
        paths += [pathlib.Path(os.environ.get("CARGO_HOME", str(pathlib.Path.home() / ".cargo"))) / name
                  for name in ("config", "config.toml")]
        data["files"] = {str(path): digest(path) if path.is_file() else None for path in paths}
        commands = [["rustc", "--version", "--verbose"], ["cargo", "--version"]]
        for revision in ("base", "candidate"):
            commands += [["git", "-C", revision, "rev-parse", "HEAD", "HEAD:backend", "HEAD:cli"],
                         ["readelf", "-h", "-n", "-S", "-W", revision + "/target/release/graphite"]]
        for command in commands:
            data["commands"].append({"command": command, "output": subprocess.check_output(command, text=True)})
        (out / "provenance.json").write_text(json.dumps(data, indent=2) + "\n")
        PY

    - name: Resolve the same pinned source JARs for independent writers
      run: |
        candidate/gradlew -p candidate :webgraph:prepareBenchmarkFixtures \
          --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx4g -XX:ActiveProcessorCount=4'
        python3 - <<'PYINPUTS'
        import hashlib, json, pathlib
        root = pathlib.Path('candidate/frontend/jvm/webgraph/build/benchmark-fixtures')
        def digest(p):
            with p.open('rb') as stream:
                return hashlib.file_digest(stream, 'sha256').hexdigest()
        jars = []
        for corpus, pattern in [('android', 'android-all-*.jar'), ('tika', 'tika-app-*.jar'),
                                ('hive', 'hive-exec-*.jar'), ('kotlin-compiler', 'kotlin-compiler-embeddable-*.jar')]:
            matches = list(root.glob(pattern))
            assert len(matches) == 1, (corpus, matches)
            jars.append({'corpus': corpus, 'path': str(matches[0].resolve()), 'sha256': digest(matches[0])})
        provenance = pathlib.Path('shared-fixture64/graphs/fixture-provenance.tsv').resolve()
        out = pathlib.Path('native-pressure-artifacts')
        out.mkdir()
        (out / 'source-inputs.json').write_text(json.dumps({
            'schema': 'graphite.fixture64-source-inputs.v1', 'jars': jars,
            'referenceProvenance': {'path': str(provenance), 'sha256': digest(provenance)}}, indent=2) + '\n')
        PYINPUTS

    - name: Build exact-revision runtimes and their own real64 graphs sequentially
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        test "$(sha256sum candidate/.github/scripts/multigraph-pressure-preparation-controls.sha256 | cut -d' ' -f1)" = "${MULTIGRAPH_PRESSURE_PREPARATION_CONTROLS_SHA256}"
        (cd candidate && sha256sum -c .github/scripts/multigraph-pressure-preparation-controls.sha256)
        JAVA_EXE=$(readlink -f "${JAVA_HOME}/bin/java")
        CARGO_EXE=$(rustup which cargo)
        RUSTC_EXE=$(rustup which rustc)
        ACCEPTED_SHA=4f2ccf33b969e684972e56b5e810034e6e67c1b3
        ACCEPTED_CHECKOUT=accepted
        if [[ "${BASE_SHA}" = "${ACCEPTED_SHA}" ]]; then ACCEPTED_CHECKOUT=base; fi
        python3 candidate/.github/scripts/native_portable_oracles.py \
          --source-inputs native-pressure-artifacts/source-inputs.json \
          --output native-pressure-artifacts/portable-expectations.json
        produce_arm() {
          python3 candidate/.github/scripts/produce_native_pressure_artifacts.py \
            --checkout "$1" --revision "$2" --role "$3" --output "native-pressure-artifacts/$4" \
            --fixture-manifest native-pressure-artifacts/source-inputs.json \
            --java "${JAVA_EXE}" --cargo "${CARGO_EXE}" --rustc "${RUSTC_EXE}" --construction-metrics
          python3 candidate/.github/scripts/audit_native_pressure_artifacts.py \
            --packet "native-pressure-artifacts/$4/packet.json" \
            --checkout "$1" --revision "$2" --role "$3" \
            --source-inputs native-pressure-artifacts/source-inputs.json \
            --java "${JAVA_EXE}" --cargo "${CARGO_EXE}" --rustc "${RUSTC_EXE}" \
            --output "native-pressure-artifacts/$4/artifact-audit.json" --require-construction-metrics
          local correctness_port
          case "$4" in C) correctness_port=22830 ;; A) correctness_port=22831 ;; B) correctness_port=22832 ;; esac
          python3 candidate/.github/scripts/run_native_query_correctness.py \
            --artifact-audit "native-pressure-artifacts/$4/artifact-audit.json" \
            --source-inputs native-pressure-artifacts/source-inputs.json \
            --revision "$2" --role "$3" --port "${correctness_port}" \
            --output "native-pressure-artifacts/$4/query-correctness"
          python3 candidate/.github/scripts/audit_native_query_correctness.py \
            --directory "native-pressure-artifacts/$4/query-correctness" \
            --output "native-pressure-artifacts/$4/query-correctness-audit.json"
          python3 candidate/.github/scripts/export_native_core_strings.py \
            --artifact-audit "native-pressure-artifacts/$4/artifact-audit.json" \
            --source-inputs native-pressure-artifacts/source-inputs.json \
            --output "native-pressure-artifacts/$4/core-string-exports"
        }
        produce_arm "${ACCEPTED_CHECKOUT}" "${ACCEPTED_SHA}" accepted-baseline C
        if [[ "${BASE_SHA}" != "${ACCEPTED_SHA}" ]]; then
          produce_arm base "${BASE_SHA}" parent A
        fi
        produce_arm candidate "${CANDIDATE_SHA}" candidate B
        for ARM in A B; do
          if [[ "${ARM}" == A && "${BASE_SHA}" == "${ACCEPTED_SHA}" ]]; then
            continue
          fi
          python3 candidate/.github/scripts/export_native_core_marker.py \
            --reference-audit native-pressure-artifacts/C/artifact-audit.json \
            --actual-audit "native-pressure-artifacts/${ARM}/artifact-audit.json" \
            --source-inputs native-pressure-artifacts/source-inputs.json \
            --output "native-pressure-artifacts/${ARM}/core-marker"
          python3 candidate/.github/scripts/bind_native_core_formatter.py \
            --marker-audit "native-pressure-artifacts/${ARM}/core-marker/audit.json" \
            --output "native-pressure-artifacts/${ARM}/core-formatter-source"
          python3 candidate/.github/scripts/run_native_formatter_tests.py \
            --artifact-audit "native-pressure-artifacts/${ARM}/artifact-audit.json" \
            --source-inputs native-pressure-artifacts/source-inputs.json \
            --output "native-pressure-artifacts/${ARM}/formatter-tests"
        done
        python3 - <<'PYARMS'
        import json, os, pathlib
        accepted = '4f2ccf33b969e684972e56b5e810034e6e67c1b3'
        aliases = {'C': 'C', 'A': 'C' if os.environ['BASE_SHA'] == accepted else 'A', 'B': 'B'}
        root = pathlib.Path('native-pressure-artifacts')
        (root / 'arm-directories.json').write_text(json.dumps({
            'schema': 'graphite.native-artifact-arm-directories.v1', 'directories': aliases,
            'acceptedRevision': accepted, 'baseRevision': os.environ['BASE_SHA'],
            'candidateRevision': os.environ['CANDIDATE_SHA'],
            'status': 'ARTIFACTS_ONLY_INDEPENDENT_PROOFS_REQUIRED', 'performanceAcceptance': False}, indent=2) + '\n')
        PYARMS

    - name: Execute complete native core topology and index migration checks
      continue-on-error: true
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        set -euo pipefail
        for ARM in A B; do
          if [[ "${ARM}" == A && "${BASE_SHA}" == 4f2ccf33b969e684972e56b5e810034e6e67c1b3 ]]; then
            continue
          fi
          code=0
          python3 candidate/.github/scripts/run_native_core_equivalence.py \
            --reference native-pressure-artifacts/C \
            --actual "native-pressure-artifacts/${ARM}" \
            --raw-local-types --raw-edges \
            --output "native-pressure-artifacts/${ARM}/core-equivalence" || code=$?
          if [[ "${code}" != 0 ]]; then
            python3 - "native-pressure-artifacts/${ARM}/core-equivalence" <<'PYERRORS'
        import json, pathlib, sys
        root = pathlib.Path(sys.argv[1])
        for record in sorted(root.glob('*/record.json')):
            value = json.loads(record.read_text())
            if value.get('status') == 'FAIL':
                print(f"::group::Core proof failure: {record.parent.name}")
                print(json.dumps(value.get('errors', [])))
                stderr = record.parent / 'stderr.log'
                if stderr.is_file():
                    with stderr.open('rb') as stream:
                        stream.seek(max(0, stderr.stat().st_size - 8192))
                        print(stream.read().decode('utf-8', errors='replace'))
                print('::endgroup::')
        PYERRORS
            exit "${code}"
          fi
        done

    - name: Derive and independently check JVM responses on each real64 writer corpus
      continue-on-error: true
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        set -euo pipefail
        test "$(sha256sum candidate/.github/scripts/multigraph-pressure-preparation-controls.sha256 | cut -d' ' -f1)" = "${MULTIGRAPH_PRESSURE_PREPARATION_CONTROLS_SHA256}"
        (cd candidate && sha256sum -c .github/scripts/multigraph-pressure-preparation-controls.sha256)
        for ARM in C A B; do
          if [[ "${ARM}" == A && "${BASE_SHA}" == 4f2ccf33b969e684972e56b5e810034e6e67c1b3 ]]; then
            continue
          fi
          case "${ARM}" in
            C) CORE_ARM=B; EXPECTATION_ARM=C; JVM_PORT=22840 ;;
            A) CORE_ARM=A; EXPECTATION_ARM=B; JVM_PORT=22841 ;;
            B) CORE_ARM=B; EXPECTATION_ARM=B; JVM_PORT=22842 ;;
          esac
          python3 -B candidate/.github/scripts/derive_jvm_pressure_oracles.py \
            --producer-root "native-pressure-artifacts/${ARM}" \
            --core-root "native-pressure-artifacts/${CORE_ARM}/core-equivalence" \
            --arm "${EXPECTATION_ARM}" \
            --output "native-pressure-artifacts/${ARM}/jvm-raw-derivation"
          python3 -B candidate/.github/scripts/jvm_query_correctness.py \
            --raw-derivation "native-pressure-artifacts/${ARM}/jvm-raw-derivation" \
            --output "native-pressure-artifacts/${ARM}/jvm-query-correctness" --port "${JVM_PORT}"
          python3 -B candidate/.github/scripts/jvm_query_correctness.py \
            --output "native-pressure-artifacts/${ARM}/jvm-query-correctness" --audit-only \
            > "native-pressure-artifacts/${ARM}/jvm-query-correctness/audit.json.tmp"
          mv "native-pressure-artifacts/${ARM}/jvm-query-correctness/audit.json.tmp" \
            "native-pressure-artifacts/${ARM}/jvm-query-correctness/audit.json"
        done

    - name: Assemble audited native producer evidence
      continue-on-error: true
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        python3 candidate/.github/scripts/assemble_native_pressure_producers.py \
          --artifacts native-pressure-artifacts \
          --base-sha "${BASE_SHA}" --candidate-sha "${CANDIDATE_SHA}" \
          --output native-pressure-producers

    - name: Retain raw independent artifact production evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: native-pressure-artifacts-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
        if-no-files-found: warn
        retention-days: 14
        include-hidden-files: true
        path: |
          native-pressure-artifacts/*.json
          native-pressure-artifacts/*/*.json
          native-pressure-artifacts/*/*/*.json
          native-pressure-artifacts/*/*/*.log
          native-pressure-artifacts/*/query-correctness/**
          native-pressure-artifacts/*/jvm-raw-derivation/**
          native-pressure-artifacts/*/jvm-query-correctness/**
          native-pressure-artifacts/*/core-string-exports/**
          native-pressure-artifacts/*/core-marker/**
          native-pressure-artifacts/*/core-formatter-source/**
          native-pressure-artifacts/*/formatter-tests/**
          native-pressure-artifacts/*/core-equivalence/**
          native-pressure-artifacts/*/runtime/**
          native-pressure-artifacts/*/graphs/**
          native-pressure-producers/**

    # Archive an honest preparation result from outputs actually available in this job.
    # The candidate-only corpus cannot be used as the accepted4f fixture. Missing producer
    # evidence remains UNAVAILABLE in the required operation gate; correctness still runs.
    - name: Prepare matched native continuous-pressure plan
      continue-on-error: true
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        test "$(sha256sum candidate/.github/scripts/multigraph-pressure-preparation-controls.sha256 | cut -d' ' -f1)" = "${MULTIGRAPH_PRESSURE_PREPARATION_CONTROLS_SHA256}"
        (cd candidate && sha256sum -c .github/scripts/multigraph-pressure-preparation-controls.sha256)
        code=0
        python3 candidate/.github/scripts/prepare_native_pressure_plan.py \
          --base-sha "${BASE_SHA}" --candidate-sha "${CANDIDATE_SHA}" \
          --provenance benchmark-results/rust-provenance/provenance.json \
          --fixture shared-fixture64/fixture64.complete.json \
          --producers native-pressure-producers/packet.json \
          --output benchmark-results/native-pressure-preparation || code=$?
        cp benchmark-results/native-pressure-preparation/multigraph-native-query-status.json \
          benchmark-results/multigraph-native-query-status.json
        exit "${code}"

    - name: Execute and audit matched native continuous pressure
      continue-on-error: true
      run: |
        set -euo pipefail
        test "$(sha256sum candidate/.github/scripts/multigraph-pressure-preparation-controls.sha256 | cut -d' ' -f1)" = "${MULTIGRAPH_PRESSURE_PREPARATION_CONTROLS_SHA256}"
        (cd candidate && sha256sum -c .github/scripts/multigraph-pressure-preparation-controls.sha256)
        python3 candidate/.github/scripts/run_prepared_native_pressure.py \
          --preparation benchmark-results/native-pressure-preparation \
          --output benchmark-results/native-pressure-cells \
          --prefix benchmark-results/multigraph-native-query

    - name: Prepare matched JVM continuous-pressure plan
      continue-on-error: true
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        test "$(sha256sum candidate/.github/scripts/multigraph-pressure-preparation-controls.sha256 | cut -d' ' -f1)" = "${MULTIGRAPH_PRESSURE_PREPARATION_CONTROLS_SHA256}"
        (cd candidate && sha256sum -c .github/scripts/multigraph-pressure-preparation-controls.sha256)
        PARENT_ARM=A
        if [[ "${BASE_SHA}" == 4f2ccf33b969e684972e56b5e810034e6e67c1b3 ]]; then PARENT_ARM=C; fi
        python3 -B candidate/.github/scripts/prepare_jvm_pressure_plan.py \
          --c native-pressure-artifacts/C/jvm-query-correctness \
          --a "native-pressure-artifacts/${PARENT_ARM}/jvm-query-correctness" \
          --b native-pressure-artifacts/B/jvm-query-correctness \
          --base-sha "${BASE_SHA}" --candidate-sha "${CANDIDATE_SHA}" \
          --output benchmark-results/jvm-pressure-preparation

    - name: Execute and audit matched JVM continuous pressure
      continue-on-error: true
      run: |
        set -euo pipefail
        test "$(sha256sum candidate/.github/scripts/multigraph-pressure-preparation-controls.sha256 | cut -d' ' -f1)" = "${MULTIGRAPH_PRESSURE_PREPARATION_CONTROLS_SHA256}"
        (cd candidate && sha256sum -c .github/scripts/multigraph-pressure-preparation-controls.sha256)
        python3 -B candidate/.github/scripts/run_prepared_native_pressure.py --engine jvm \
          --preparation benchmark-results/jvm-pressure-preparation \
          --output benchmark-results/jvm-pressure-cells \
          --prefix benchmark-results/multigraph-jvm-query

    # Complete query gates before independent loading and build/save measurements.
    # Keep collecting operation evidence after a query failure without clearing that failure.
    - name: Measure base then PR
      env:
        HARNESS: ${{ steps.controls.outputs.harness }}
      run: |
        set -euo pipefail
        mkdir -p benchmark-results
        for REVISION in base candidate; do
          python3 "${HARNESS}" \
            --manifest shared-fixture64/graphs/graphs.tsv \
            --binary "${REVISION}/target/release/graphite" \
            --port 18080 --suite all --repetitions 5 --timeout 60 --overall-timeout 600 \
            --responses-dir "benchmark-results/${REVISION}-rust-responses" \
            --server-log "benchmark-results/${REVISION}-rust-serve.log" \
            --out "benchmark-results/${REVISION}-rust.json"
        done

    - name: Compare Rust engine latency
      id: rust_comparison
      env:
        HARNESS: ${{ steps.controls.outputs.harness }}
        COMPARATOR: ${{ steps.controls.outputs.comparator }}
        RESPONSE_TRANSITION: ${{ steps.controls.outputs.response-transition }}
      run: |
        set -euo pipefail
        RESPONSE_ARGS=()
        if [[ "${RESPONSE_TRANSITION}" = true ]]; then RESPONSE_ARGS+=(--declared-types-transition); fi
        if node "${COMPARATOR}" compare-rust-latency \
          --base benchmark-results/base-rust.json \
          --candidate benchmark-results/candidate-rust.json \
          --threshold 15 --minimum 1 "${RESPONSE_ARGS[@]}" \
          --report benchmark-results/initial-rust-latency-report.md \
          --status benchmark-results/initial-rust-latency-status.json; then
          mv benchmark-results/initial-rust-latency-report.md benchmark-results/rust-latency-report.md
          mv benchmark-results/initial-rust-latency-status.json benchmark-results/rust-latency-status.json
        else
          # Repeating cannot repair missing evidence or different query answers.
          if jq -e '.errors | length > 0' benchmark-results/initial-rust-latency-status.json >/dev/null; then
            mv benchmark-results/initial-rust-latency-report.md benchmark-results/rust-latency-report.md
            mv benchmark-results/initial-rust-latency-status.json benchmark-results/rust-latency-status.json
            exit 1
          fi
          for REVISION in candidate base; do
            python3 "${HARNESS}" \
              --manifest shared-fixture64/graphs/graphs.tsv \
              --binary "${REVISION}/target/release/graphite" \
              --port 18081 --suite all --repetitions 5 --timeout 60 --overall-timeout 600 \
              --responses-dir "benchmark-results/${REVISION}-rust-confirmation-responses" \
              --server-log "benchmark-results/${REVISION}-rust-confirmation-serve.log" \
              --out "benchmark-results/${REVISION}-rust-confirmation.json"
          done
          node "${COMPARATOR}" confirm-rust-latency \
            --initial benchmark-results/initial-rust-latency-status.json \
            --base benchmark-results/base-rust-confirmation.json \
            --candidate benchmark-results/candidate-rust-confirmation.json \
            --threshold 15 --minimum 1 "${RESPONSE_ARGS[@]}" \
            --report benchmark-results/rust-latency-report.md \
            --status benchmark-results/rust-latency-status.json
        fi

    # A confirmed failure stays failed. This one extra candidate run is attribution
    # evidence only; its metrics-enabled results never enter either comparator.
    - name: Diagnose confirmed Rust shape regression
      if: ${{ failure() && steps.rust_comparison.outcome == 'failure' }}
      env:
        CANDIDATE_GATE_TEST_JOB: ${{ needs.candidate-gate-tests.result }}
      run: |
        set -euo pipefail
        test "${CANDIDATE_GATE_TEST_JOB}" = success
        test "$(sha256sum candidate/backend/bench/snapshot.py | cut -d' ' -f1)" = "${RUST_LATENCY_TRANSITION_HARNESS_SHA256}"
        test "$(sha256sum candidate/backend/bench/fixture64.py | cut -d' ' -f1)" = "${RUST_LATENCY_TRANSITION_FIXTURE_SHA256}"
        test "$(sha256sum candidate/backend/bench/shapes.py | cut -d' ' -f1)" = "${RUST_LATENCY_TRANSITION_SHAPES_SHA256}"
        test "$(sha256sum candidate/backend/bench/metrics_capture.py | cut -d' ' -f1)" = "${RUST_LATENCY_DIAGNOSTIC_METRICS_SHA256}"
        DIAG=benchmark-results/rust-failure-diagnostic
        mkdir -p "${DIAG}/harness"
        cp candidate/backend/bench/{snapshot,fixture64,shapes,metrics_capture}.py "${DIAG}/harness/"
        python3 - <<'PY'
        import hashlib, json, pathlib, sys
        out = pathlib.Path("benchmark-results/rust-failure-diagnostic")
        sys.path.insert(0, str(out / "harness"))
        from snapshot import confirmed_diagnostic_shape
        status = pathlib.Path("benchmark-results/rust-latency-status.json")
        result = json.loads(status.read_text()) if status.is_file() else {}
        selected = confirmed_diagnostic_shape(result)
        def digest(path):
            return hashlib.sha256(path.read_bytes()).hexdigest()
        files = [*sorted((out / "harness").glob("*.py")),
                 pathlib.Path("candidate/target/release/graphite"),
                 pathlib.Path("shared-fixture64/graphs/graphs.tsv"),
                 pathlib.Path("shared-fixture64/graphs/fixture-provenance.tsv")]
        if status.is_file():
            files.append(status)
        provenance = {"diagnosticOnly": True, "selectedShape": selected,
                      "selection": "largest absoluteDeltaMs among confirmed blocked original broad shapes",
                      "originalGateStatusUntouched": True,
                      "scope": "candidate-only metrics-enabled full73x5; not a gate confirmation or retry",
                      "files": {str(path): digest(path) for path in files}}
        (out / "provenance.json").write_text(json.dumps(provenance, indent=2) + "\n")
        if selected is not None:
            (out / "selected-shape.txt").write_text(selected + "\n")
        PY
        if [[ ! -f "${DIAG}/selected-shape.txt" ]]; then
          echo "No eligible confirmed broad-shape failure; no diagnostic server started"
          exit 0
        fi
        code=0
        python3 "${DIAG}/harness/snapshot.py" \
          --manifest shared-fixture64/graphs/graphs.tsv \
          --binary candidate/target/release/graphite \
          --port 18082 --suite all --repetitions 5 --timeout 60 --overall-timeout 600 \
          --diagnostic-metrics-case "$(cat "${DIAG}/selected-shape.txt")" \
          --responses-dir "${DIAG}/responses" \
          --server-log "${DIAG}/serve.log" \
          --out "${DIAG}/candidate-rust-diagnostic.json" || code=$?
        printf '{"exitCode":%s,"diagnosticOnly":true}\n' "${code}" > "${DIAG}/execution.json"
        exit "${code}"

    - name: Upload Rust engine latency results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-rust-latency-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
        path: benchmark-results/
        if-no-files-found: warn
        retention-days: 14

    - name: Measure and audit six JVM real64 zero-query loads
      if: ${{ !cancelled() }}
      continue-on-error: true
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        test "$(sha256sum candidate/.github/scripts/multigraph-pressure-preparation-controls.sha256 | cut -d' ' -f1)" = "${MULTIGRAPH_PRESSURE_PREPARATION_CONTROLS_SHA256}"
        (cd candidate && sha256sum -c .github/scripts/multigraph-pressure-preparation-controls.sha256)
        python3 candidate/.github/scripts/run_real64_loading.py \
          --producers native-pressure-producers/packet.json \
          --base-sha "${BASE_SHA}" --candidate-sha "${CANDIDATE_SHA}" \
          --output benchmark-results/real64-loading \
          --prefix benchmark-results/multigraph-loading

    - name: Measure and audit six real64 usable-save constructions
      if: ${{ !cancelled() }}
      continue-on-error: true
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        test "$(sha256sum candidate/.github/scripts/multigraph-pressure-preparation-controls.sha256 | cut -d' ' -f1)" = "${MULTIGRAPH_PRESSURE_PREPARATION_CONTROLS_SHA256}"
        (cd candidate && sha256sum -c .github/scripts/multigraph-pressure-preparation-controls.sha256)
        python3 candidate/.github/scripts/run_real64_construction.py \
          --producers native-pressure-producers/packet.json \
          --base-sha "${BASE_SHA}" --candidate-sha "${CANDIDATE_SHA}" \
          --output benchmark-results/real64-construction \
          --prefix benchmark-results/multigraph-construction

    - name: Upload Rust job lifecycle results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-rust-lifecycle-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
        path: |
          benchmark-results/real64-loading/**
          benchmark-results/real64-construction/**
          benchmark-results/multigraph-loading*
          benchmark-results/multigraph-construction*
        if-no-files-found: warn
        retention-days: 14

  slow-query-shapes:
    name: slow-query-shapes
    needs: [candidate-gate-tests, prepare-latency-fixtures]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Checkout base-owned controls
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: gate
        persist-credentials: false
    - name: Checkout base implementation
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: base
        persist-credentials: false
    - name: Checkout candidate implementation
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: candidate
        persist-credentials: false
    - name: Checkout candidate bootstrap controls
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: controls
        persist-credentials: false
    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: true
    - name: Select trusted slow-shape controls
      id: slow-controls
      env:
        CANDIDATE_GATE_TEST_JOB: ${{ needs.candidate-gate-tests.result }}
      run: |
        set -euo pipefail
        OWNER=controls
        MANIFEST=.github/scripts/benchmark-slow-query-shapes-controls.sha256
        test "${CANDIDATE_GATE_TEST_JOB}" = success
        test ! -L "${OWNER}/${MANIFEST}"
        test "$(sha256sum "${OWNER}/${MANIFEST}" | cut -d' ' -f1)" = \
          "${SLOW_QUERY_SHAPES_CONTROLS_SHA256}"
        (cd "${OWNER}" && sha256sum -c "${MANIFEST}")
        echo "directory=${OWNER}" >> "${GITHUB_OUTPUT}"
    - name: Restore real persisted fixture graphs
      uses: actions/cache/restore@v5
      with:
        path: fixture-graphs
        key: ${{ runner.os }}-${{ runner.arch }}-wrapped-query-fixtures-v2-${{ hashFiles('candidate/gradle/libs.versions.toml', 'candidate/gradle/wrapper/gradle-wrapper.properties', 'candidate/settings.gradle.kts', 'candidate/**/build.gradle.kts', 'candidate/frontend/jvm/core/src/main/**', 'candidate/frontend/jvm/sootup/src/main/**', 'candidate/frontend/jvm/webgraph/src/main/**', 'candidate/frontend/jvm/webgraph/src/jmh/kotlin/io/johnsonlee/graphite/webgraph/BenchmarkCorpus.kt', 'candidate/frontend/jvm/webgraph/src/jmh/kotlin/io/johnsonlee/graphite/webgraph/AllFixtureBenchmarkGraphPreparation.kt') }}
    - name: Compare all five real slow-query families
      env:
        CANDIDATE_GATE_TEST_JOB: ${{ needs.candidate-gate-tests.result }}
      run: |
        set -euo pipefail
        test -f fixture-graphs/.complete
        test -f fixture-graphs/android/graph.metadata
        test -f fixture-graphs/android/graph.nodedata
        jvm() { if [[ -d "$1/frontend/jvm/$2" ]]; then echo "$1/frontend/jvm/$2"; else echo "$1/graphite-$2"; fi; }
        CORPUS='src/jmh/kotlin/io/johnsonlee/graphite/webgraph/BenchmarkCorpus.kt'
        # One-time graph-shape transition (see build-wrapped-query-jmh): the fixture graph was built
        # by the candidate, so the pinned candidate BenchmarkCorpus.kt, which differs from the
        # pinned base one only in expected node counts, stands in for the base copy the script
        # installs. Every other base-owned control is used unchanged.
        SLOW_GATE=gate
        if [[ "$(sha256sum "$(jvm gate webgraph)/${CORPUS}" | cut -d' ' -f1)" = \
            "${WRAPPED_QUERY_SHAPE_BASE_CORPUS_SHA256}" && \
          "$(sha256sum "$(jvm controls webgraph)/${CORPUS}" | cut -d' ' -f1)" = \
            "${WRAPPED_QUERY_SHAPE_CANDIDATE_CORPUS_SHA256}" && \
          "${CANDIDATE_GATE_TEST_JOB}" = success ]]; then
          test ! -L "$(jvm controls webgraph)/${CORPUS}"
          SLOW_GATE="${RUNNER_TEMP}/slow-shape-gate"
          rm -rf -- "${SLOW_GATE}"
          cp -a gate "${SLOW_GATE}"
          rm -f -- "$(jvm "${SLOW_GATE}" webgraph)/${CORPUS}"
          install -m 0644 "$(jvm controls webgraph)/${CORPUS}" "$(jvm "${SLOW_GATE}" webgraph)/${CORPUS}"
          cmp "$(jvm controls webgraph)/${CORPUS}" "$(jvm "${SLOW_GATE}" webgraph)/${CORPUS}"
        fi
        bash '${{ steps.slow-controls.outputs.directory }}/.github/scripts/benchmark-slow-query-shapes.sh' \
          '${{ steps.slow-controls.outputs.directory }}' "${SLOW_GATE}" base candidate \
          fixture-graphs/android benchmark-results/slow-shapes
    - name: Upload slow-query evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-slow-query-shapes-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
        path: |
          benchmark-results/slow-shapes/*.json
          benchmark-results/slow-shapes/*.log
          benchmark-results/slow-shapes/*.md
          benchmark-results/slow-shapes/*.patch
          benchmark-results/slow-shapes/*.kt
          benchmark-results/slow-shapes/*.sha256
        if-no-files-found: error
        retention-days: 14

  benchmark-regression-gate:
    name: benchmark-regression-gate
    if: always()
    needs: [candidate-gate-tests, rust-latency, method-level, explorer, method-compatibility, cypher-capacity, budgeted-collection, budgeted-mapped-string, large-corpus, wrapped-query-latency, wrapped-query-resources, graph-routing-pressure-evidence, global-wide-pressure-evidence, validate-cpu-accounting, slow-query-shapes]
    runs-on: ubuntu-latest

    steps:
    - name: Checkout base reporting code
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        persist-credentials: false

    - name: Checkout candidate reporting code for taxonomy rollout
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: reporter
        persist-credentials: false

    - name: Verify reviewed correctness and comparison control closure
      run: |
        set -euo pipefail
        MANIFEST=.github/scripts/multigraph-correctness-controls.sha256
        test ! -L "reporter/${MANIFEST}"
        test "$(sha256sum "reporter/${MANIFEST}" | cut -d' ' -f1)" = "${MULTIGRAPH_CORRECTNESS_CONTROLS_SHA256}"
        (cd reporter && sha256sum -c "${MANIFEST}")

    - name: Select additive slow-shape report controls
      id: slow-report-controls
      env:
        CANDIDATE_GATE_TEST_JOB: ${{ needs.candidate-gate-tests.result }}
      run: |
        set -euo pipefail
        OWNER=reporter
        MANIFEST=.github/scripts/benchmark-slow-query-shapes-controls.sha256
        test "${CANDIDATE_GATE_TEST_JOB}" = success
        test ! -L "${OWNER}/${MANIFEST}"
        test "$(sha256sum "${OWNER}/${MANIFEST}" | cut -d' ' -f1)" = \
          "${SLOW_QUERY_SHAPES_CONTROLS_SHA256}"
        (cd "${OWNER}" && sha256sum -c "${MANIFEST}")
        echo "directory=${OWNER}" >> "${GITHUB_OUTPUT}"

    - name: Download method-level results
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        pattern: benchmark-*-${{ github.event.pull_request.number }}-*
        path: downloaded-benchmark-results

    - name: Select latest successful benchmark artifacts
      continue-on-error: true
      run: |
        node .github/scripts/benchmark-gate.mjs stage-artifacts \
          --directory downloaded-benchmark-results \
          --output benchmark-results

    - name: Build benchmark report
      if: always()
      env:
        CANDIDATE_GATE_TEST_JOB: ${{ needs.candidate-gate-tests.result }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        BENCHMARK_RUNNER: ${{ runner.os }}-${{ runner.arch }}
        BENCHMARK_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        mkdir -p benchmark-results
        test "${CANDIDATE_GATE_TEST_JOB}" = success
        test "$(sha256sum reporter/.github/scripts/benchmark-gate.mjs | cut -d' ' -f1)" = \
          "${BENCHMARK_REPORT_TRANSITION_SHA256}"
        COMPARATOR=reporter/.github/scripts/benchmark-gate.mjs
        node '${{ steps.slow-report-controls.outputs.directory }}/.github/scripts/benchmark-slow-query-shapes.mjs' aggregate \
          --base-comparator "${COMPARATOR}" \
          --directory benchmark-results \
          --base-sha "${BASE_SHA}" \
          --candidate-sha "${CANDIDATE_SHA}" \
          --runner "${BENCHMARK_RUNNER}" \
          --run-url "${BENCHMARK_RUN_URL}" \
          --report benchmark-results/benchmark-authoritative-report.md \
          --status benchmark-results/benchmark-authoritative-status.json
        node -e "const fs=require('fs');const p='./benchmark-results/benchmark-authoritative-status.json';const body=fs.readFileSync('./benchmark-results/benchmark-authoritative-report.md','utf8');const s=JSON.parse(fs.readFileSync(p));if(s.body!==body)process.exit(1);Object.assign(s,{baseSha:process.env.BASE_SHA,candidateSha:process.env.CANDIDATE_SHA,runner:process.env.BENCHMARK_RUNNER,runUrl:process.env.BENCHMARK_RUN_URL});fs.writeFileSync(p,JSON.stringify(s,null,2)+'\\n')"
        if grep -q '^### Coverage summary$' benchmark-results/benchmark-authoritative-report.md; then
          install -m 0644 benchmark-results/benchmark-authoritative-report.md \
            benchmark-results/benchmark-report.md
          install -m 0644 benchmark-results/benchmark-authoritative-status.json \
            benchmark-results/benchmark-status.json
          install -m 0644 benchmark-results/benchmark-authoritative-status.json \
            benchmark-results/benchmark-render-status.json
        else
          test "${CANDIDATE_GATE_TEST_JOB}" = success
          test "$(sha256sum reporter/.github/scripts/benchmark-gate.mjs | cut -d' ' -f1)" = \
            "${BENCHMARK_REPORT_TRANSITION_SHA256}"
          node '${{ steps.slow-report-controls.outputs.directory }}/.github/scripts/benchmark-slow-query-shapes.mjs' aggregate \
            --base-comparator reporter/.github/scripts/benchmark-gate.mjs \
            --directory benchmark-results \
            --base-sha "${BASE_SHA}" \
            --candidate-sha "${CANDIDATE_SHA}" \
            --runner "${BENCHMARK_RUNNER}" \
            --run-url "${BENCHMARK_RUN_URL}" \
            --report benchmark-results/benchmark-report.md \
            --status benchmark-results/benchmark-render-status.json
          node -e "const a=require('./benchmark-results/benchmark-authoritative-status.json');const r=require('./benchmark-results/benchmark-render-status.json');for(const k of ['passed','baseSha','candidateSha','runner','runUrl'])if(a[k]!==r[k])process.exit(1);if(JSON.stringify(a.errors)!==JSON.stringify(r.errors)||r.body!==require('fs').readFileSync('./benchmark-results/benchmark-report.md','utf8'))process.exit(1)"
          install -m 0644 benchmark-results/benchmark-render-status.json \
            benchmark-results/benchmark-status.json
        fi

    - name: Upload aggregate benchmark report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-report-${{ github.event.pull_request.number }}
        path: |
          benchmark-results/benchmark-report.md
          benchmark-results/benchmark-status.json
          benchmark-results/benchmark-authoritative-report.md
          benchmark-results/benchmark-authoritative-status.json
          benchmark-results/benchmark-render-status.json
        if-no-files-found: error
        overwrite: true
        retention-days: 14

    - name: Enforce benchmark gate
      if: always()
      env:
        CANDIDATE_GATE_TEST_JOB: ${{ needs.candidate-gate-tests.result }}
        RUST_LATENCY_JOB: ${{ needs.rust-latency.result }}
        METHOD_JOB: ${{ needs.method-level.result }}
        EXPLORER_JOB: ${{ needs.explorer.result }}
        METHOD_COMPATIBILITY_JOB: ${{ needs.method-compatibility.result }}
        CYPHER_CAPACITY_JOB: ${{ needs.cypher-capacity.result }}
        BUDGETED_COLLECTION_JOB: ${{ needs.budgeted-collection.result }}
        BUDGETED_STRING_JOB: ${{ needs.budgeted-mapped-string.result }}
        LARGE_CORPUS_JOB: ${{ needs.large-corpus.result }}
        LATENCY_JOB: ${{ needs.wrapped-query-latency.result }}
        LATENCY_RESOURCES_JOB: ${{ needs.wrapped-query-resources.result }}
        GRAPH_ROUTING_JOB: ${{ needs.graph-routing-pressure-evidence.result }}
        GLOBAL_WIDE_JOB: ${{ needs.global-wide-pressure-evidence.result }}
        CPU_ACCOUNTING_SMOKE_JOB: ${{ needs.validate-cpu-accounting.result }}
        SLOW_QUERY_SHAPES_JOB: ${{ needs.slow-query-shapes.result }}
      run: |
        # Correctness and existing genuine multi-graph constraints all remain blocking.
        for JOB in CANDIDATE_GATE_TEST_JOB RUST_LATENCY_JOB METHOD_JOB EXPLORER_JOB \
          METHOD_COMPATIBILITY_JOB CYPHER_CAPACITY_JOB BUDGETED_COLLECTION_JOB BUDGETED_STRING_JOB \
          LARGE_CORPUS_JOB LATENCY_JOB LATENCY_RESOURCES_JOB GRAPH_ROUTING_JOB GLOBAL_WIDE_JOB \
          CPU_ACCOUNTING_SMOKE_JOB SLOW_QUERY_SHAPES_JOB; do
          if [ "${!JOB}" != success ]; then
            echo "::error::Required job ${JOB} finished with ${!JOB}"
            exit 1
          fi
        done
        node -e "const s=require('./benchmark-results/benchmark-authoritative-status.json'); if(!s.passed) process.exit(1)"

  benchmark-comment:
    name: benchmark-comment
    if: always()
    needs: [benchmark-regression-gate]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write

    steps:
    - name: Download aggregate benchmark report
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: benchmark-report-${{ github.event.pull_request.number }}
        path: benchmark-results

    - name: Attach benchmark report to PR
      if: always()
      continue-on-error: true
      uses: actions/github-script@v9
      with:
        script: |
          const fs = require('fs');
          const marker = '<!-- graphite-benchmark-regression-gate -->';
          let body;
          try {
            body = fs.readFileSync('benchmark-results/benchmark-report.md', 'utf8');
          } catch (error) {
            body = `${marker}\n## Benchmark Regression Gate\n\n**FAIL**\n\nReport generation failed. ` +
              `[View logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
          }

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            per_page: 100
          });
          const existing = comments.find((comment) => comment.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
          }
