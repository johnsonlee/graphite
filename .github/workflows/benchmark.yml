      run: |
        set -euo pipefail
        MANIFEST=.github/scripts/multigraph-correctness-controls.sha256
        test ! -L "candidate/${MANIFEST}"
        test "$(sha256sum "candidate/${MANIFEST}" | cut -d' ' -f1)" = "${MULTIGRAPH_CORRECTNESS_CONTROLS_SHA256}"
        (cd candidate && sha256sum -c "${MANIFEST}")

    - name: Install pinned assertion-only entry point
      run: |
        jvm() { if [[ -d "$1/frontend/jvm/$2" ]]; then echo "$1/frontend/jvm/$2"; else echo "$1/graphite-$2"; fi; }
        SOURCE='frontend/jvm/cypher/src/jmh/kotlin/io/johnsonlee/graphite/cypher/BudgetedQueryCorrectness.kt'
        test "$(sha256sum "candidate/${SOURCE}" | cut -d' ' -f1)" = 'aa6757f2caea21d1f7b6bedb4a040e7f859b77d05889f360b33bf99882ba3349'
        RELATIVE='src/jmh/kotlin/io/johnsonlee/graphite/cypher/BudgetedQueryCorrectness.kt'
        install -m 0644 "candidate/${SOURCE}" "$(jvm baseline cypher)/${RELATIVE}"

    - name: Build budgeted collection JMH jars
      run: |
        jvm() { if [[ -d "$1/frontend/jvm/$2" ]]; then echo "$1/frontend/jvm/$2"; else echo "$1/graphite-$2"; fi; }
        CONTROL_DIR=gate
        INIT='.github/scripts/benchmark-jmh-isolation.init.gradle'
        VERIFIER='.github/scripts/verify-jmh-jar-isolation.sh'
        if [[ ! -f "${CONTROL_DIR}/${INIT}" || ! -f "${CONTROL_DIR}/${VERIFIER}" ]]; then
          CONTROL_DIR=candidate
          test "$(sha256sum "${CONTROL_DIR}/${INIT}" | cut -d' ' -f1)" = \
            "${JMH_ISOLATION_INIT_SHA256}"
          test "$(sha256sum "${CONTROL_DIR}/${VERIFIER}" | cut -d' ' -f1)" = \
            "${JMH_ISOLATION_VERIFIER_SHA256}"
        fi
        for REVISION in baseline candidate; do
          "${REVISION}/gradlew" -p "${REVISION}" -I "${PWD}/${CONTROL_DIR}/${INIT}" \
            :cypher:testClasses :cypher:jmhJar --no-daemon
          JAR=$(find "$(jvm "${REVISION}" cypher)/build/libs" -name '*-jmh.jar' -print -quit)
          test -n "${JAR}"
          bash "${CONTROL_DIR}/${VERIFIER}" "$(jvm "${REVISION}" cypher)" "${JAR}"
        done

    - name: Run complete untimed assertions
      run: |
        set -euo pipefail
        mkdir -p benchmark-results
        jvm() { if [[ -d "$1/frontend/jvm/$2" ]]; then echo "$1/frontend/jvm/$2"; else echo "$1/graphite-$2"; fi; }
        for REVISION in baseline candidate; do
          JAR=$(find "$(jvm "${REVISION}" cypher)/build/libs" -name '*-jmh.jar' -print -quit)
          test -n "${JAR}"
          java -Xmx512m -XX:ActiveProcessorCount=4 -cp "${JAR}" \
            io.johnsonlee.graphite.cypher.BudgetedQueryCorrectness | tee "benchmark-results/${REVISION}-budgeted-collection.log"
        done
        node candidate/.github/scripts/benchmark-correctness.mjs budgeted-collection \
          benchmark-results/budgeted-collection benchmark-results/baseline-budgeted-collection.log \
          benchmark-results/candidate-budgeted-collection.log budgetedGeneralRegex budgetedListConcatenation budgetedListMembership

    - name: Upload budgeted collection results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-budgeted-collection-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
        path: benchmark-results/
        if-no-files-found: warn
        retention-days: 14

  budgeted-mapped-string:
