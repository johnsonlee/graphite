  BUDGETED_COLLECTION_BASELINE_SHA: e070eb8183b55665863a4f8496b9515163575560
  SLOW_QUERY_SHAPES_CONTROLS_SHA256: f87c6908dc1def29ec7f9279c9a928acc83c23437d36c712ee474b25df079cd2

jobs:
  candidate-gate-tests:
    name: candidate-gate-tests
    runs-on: ubuntu-latest
    # Full oracle and audit protocol coverage exceeds the former five-minute budget.
    timeout-minutes: 15

    steps:
    - name: Checkout PR gate tests
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: candidate
        persist-credentials: false

    - name: Test candidate benchmark gate logic
      run: node --test candidate/.github/scripts/benchmark-*.test.mjs

    - name: Test continuous multi-graph pressure controls
      run: python3 -m unittest discover -s candidate/.github/scripts -p 'test_multigraph_pressure.py'

    - name: Test legal multiset response validation without child processes
      run: python3 -m unittest discover -s candidate/.github/scripts -p 'test_native_legal_response.py'

    - name: Test native pressure plan preparation without child processes
      run: python3 -m unittest discover -s candidate/.github/scripts -p 'test_prepare_native_pressure_plan.py'

    - name: Test independently audited JVM pressure plan preparation without child processes
      run: python3 -B -m unittest discover -s candidate/.github/scripts -p 'test_prepare_jvm_pressure_plan.py'

    - name: Test prepared pressure orchestration without starting servers
      run: python3 -m unittest discover -s candidate/.github/scripts -p 'test_run_prepared_native_pressure.py'

    - name: Test six-cell construction and independent audit without child processes
      run: python3 -m unittest discover -s candidate/.github/scripts -p 'test_real64_construction.py'

    - name: Test zero-query loading bounds and owned cleanup without child processes
      run: python3 -m unittest discover -s candidate/.github/scripts -p 'test_real64_loading.py'

    - name: Test JVM pressure oracles from saved node and type tables
      run: python3 -m unittest discover -s candidate/.github/scripts -p 'test_jvm_pressure_oracles.py'

    - name: Test original JVM pressure node and edge decoding
      run: python3 -B -m unittest discover -s candidate/.github/scripts -p 'test_jvm_pressure_inputs.py'

    - name: Test independent JVM pressure predicates and projections
      run: python3 -B -m unittest discover -s candidate/.github/scripts -p 'test_jvm_pressure_derivation.py'

    - name: Test JVM DISTINCT groups and whole-row representatives
      run: python3 -B -m unittest discover -s candidate/.github/scripts -p 'test_jvm_pressure_distinct.py'

    - name: Test bound JVM primitive conversion receipts
      run: python3 -B -m unittest discover -s candidate/.github/scripts -p 'test_jvm_primitive_facts.py'

    - name: Test JVM raw-oracle orchestration without child processes
      run: python3 -B -m unittest discover -s candidate/.github/scripts -p 'test_derive_jvm_pressure_oracles.py'

    - name: Test exact JVM source-rule applicability without child processes
      run: python3 -B -m unittest discover -s candidate/.github/scripts -p 'test_jvm_pressure_source_rules.py'

    - name: Test JVM full-response correctness execution and audit without child processes
      run: python3 -B -m unittest discover -s candidate/.github/scripts -p 'test_jvm_query_correctness.py'

    - name: Test exact-revision native artifact production without child processes
      run: python3 -m unittest discover -s candidate/.github/scripts -p 'test_produce_native_pressure_artifacts.py'

    - name: Test independent native artifact audit without child processes
      run: python3 -m unittest discover -s candidate/.github/scripts -p 'test_audit_native_pressure_artifacts.py'

    - name: Test portable native query expectations without child processes
      run: python3 -m unittest discover -s candidate/.github/scripts -p 'test_native_portable_oracles.py'

    - name: Test native correctness execution and independent audit without child processes
      run: python3 -m unittest discover -s candidate/.github/scripts -p 'test_native_query_correctness.py'

    - name: Test native producer evidence assembly without child processes
      run: python3 -m unittest discover -s candidate/.github/scripts -p 'test_assemble_native_pressure_producers.py'

    - name: Test native complete core proof protocol
      run: python3 -m unittest discover -s candidate/.github/scripts -p 'test_run_native_core_equivalence.py'
    - name: Test portable oracle and fresh response normalization without child processes
      run: python3 -m unittest discover -s candidate/.github/scripts -p 'test_normalize_native_pressure_oracles.py'

    - name: Test independent native core proof package without child processes
      run: >-
        python3 -m unittest discover
        -s candidate/.github/scripts/native_core_proof
        -t candidate/.github/scripts
        -p '*_test.py'

    - name: Test fresh native dictionary export and audit without child processes
      run: python3 -m unittest discover -s candidate/.github/scripts -p 'test_export_native_core_strings.py'

    - name: Test native bootstrap marker export protocol
      run: python3 -m unittest discover -s candidate/.github/scripts -p 'test_export_native_core_marker.py'

    - name: Test native formatter source binding protocol
      run: python3 -m unittest discover -s candidate/.github/scripts -p 'test_bind_native_core_formatter.py'

    - name: Test production formatter execution protocol
      run: python3 -m unittest discover -s candidate/.github/scripts -p 'test_run_native_formatter_tests.py'

    - name: Test native multi-graph snapshot harness
      run: python3 -m unittest discover -s candidate/backend/bench -p 'test_snapshot*.py'

  build-explore-jmh:
    name: build-explore-jmh-${{ matrix.revision }}
    needs: [candidate-gate-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        revision: [base, candidate]

    steps:
    - name: Checkout base-owned benchmark harness
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: gate
        persist-credentials: false

    - name: Checkout benchmark revision
      uses: actions/checkout@v7
      with:
        ref: ${{ matrix.revision == 'base' && github.event.pull_request.base.sha || github.event.pull_request.head.sha }}
        path: source
        persist-credentials: false

    - name: Checkout candidate build controls
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: controls
        persist-credentials: false

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: true

    - name: Install reviewed assertion-only Explorer controls
      run: |
        set -euo pipefail
        MANIFEST=.github/scripts/multigraph-correctness-controls.sha256
        test "$(sha256sum "controls/$MANIFEST" | cut -d' ' -f1)" = "$MULTIGRAPH_CORRECTNESS_CONTROLS_SHA256"
        (cd controls && sha256sum -c "$MANIFEST")
        jvm() { if [[ -d "$1/frontend/jvm/$2" ]]; then echo "$1/frontend/jvm/$2"; else echo "$1/graphite-$2"; fi; }
        for HARNESS in ExplorerMemoryBenchmark.kt CypherCapacityBenchmark.kt SingleGraphCorrectness.kt; do
          REL="src/jmh/kotlin/io/johnsonlee/graphite/cli/$HARNESS"
          test ! -L "$(jvm source explore)/$REL"
          install -m 0644 "$(jvm controls explore)/$REL" "$(jvm source explore)/$REL"
        done
        # The pre-existing CPU-accounting contract remains base-owned and separately tested.
        REL=src/jmh/kotlin/io/johnsonlee/graphite/cli/RequestCpuAccounting.kt
        test ! -L "$(jvm source explore)/$REL"
        install -m 0644 "$(jvm gate explore)/$REL" "$(jvm source explore)/$REL"

    - name: Build comparable Explorer JMH JAR
      run: |
        CONTROL_DIR=gate
        INIT='.github/scripts/benchmark-jmh-isolation.init.gradle'
        VERIFIER='.github/scripts/verify-jmh-jar-isolation.sh'
        if [[ ! -f "${CONTROL_DIR}/${INIT}" || ! -f "${CONTROL_DIR}/${VERIFIER}" ]]; then
          CONTROL_DIR=controls
          test "$(sha256sum "${CONTROL_DIR}/${INIT}" | cut -d' ' -f1)" = \
            "${JMH_ISOLATION_INIT_SHA256}"
          test "$(sha256sum "${CONTROL_DIR}/${VERIFIER}" | cut -d' ' -f1)" = \
            "${JMH_ISOLATION_VERIFIER_SHA256}"
        fi
        source/gradlew -p source -I "${PWD}/${CONTROL_DIR}/${INIT}" \
          :explore:testClasses :explore:jmhJar --no-daemon
        jvm() { if [[ -d "$1/frontend/jvm/$2" ]]; then echo "$1/frontend/jvm/$2"; else echo "$1/graphite-$2"; fi; }
        mapfile -t JARS < <(find "$(jvm source explore)/build/libs" -name '*-jmh.jar' -type f)
        test "${#JARS[@]}" -eq 1
        jar tf "${JARS[0]}" >/dev/null
        bash "${CONTROL_DIR}/${VERIFIER}" "$(jvm source explore)" "${JARS[0]}"
        mkdir -p jmh-artifact
        install -m 0644 "${JARS[0]}" "jmh-artifact/${{ matrix.revision }}-explore-jmh.jar"
        cd jmh-artifact
        sha256sum "${{ matrix.revision }}-explore-jmh.jar" \
          > "${{ matrix.revision }}-explore-jmh.jar.sha256"

    - name: Upload comparable Explorer JMH JAR
      uses: actions/upload-artifact@v7
      with:
        name: jmh-explore-${{ matrix.revision }}-${{ github.event.pull_request.number }}
        path: jmh-artifact/
        if-no-files-found: error
        overwrite: true
        retention-days: 2

  build-wrapped-query-jmh:
    name: build-wrapped-query-jmh-${{ matrix.revision }}
    needs: [candidate-gate-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        revision: [reference, base, candidate]

    steps:
    - name: Checkout base-owned benchmark harness
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: gate
        persist-credentials: false

    - name: Checkout benchmark revision
      uses: actions/checkout@v7
      with:
        ref: ${{ matrix.revision == 'reference' && env.WRAPPED_QUERY_REFERENCE_SHA || matrix.revision == 'base' && github.event.pull_request.base.sha || github.event.pull_request.head.sha }}
        path: source
        persist-credentials: false

    - name: Checkout candidate build controls
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: controls
        persist-credentials: false

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: true

    - name: Install base-owned wrapped-query harnesses
      run: |
        jvm() { if [[ -d "$1/frontend/jvm/$2" ]]; then echo "$1/frontend/jvm/$2"; else echo "$1/graphite-$2"; fi; }
        digest() { sha256sum "$(jvm "$1" webgraph)/src/jmh/kotlin/io/johnsonlee/graphite/webgraph/$2" | cut -d ' ' -f 1; }
        # One-time graph-shape transition: every revision queries the fixture graphs the candidate
        # built, so the harness pins that graph's node counts and search-target distributions. Only
        # the exact pre-transition base harnesses and the exact pinned candidate harnesses, which
        # differ in those expected values alone, select the candidate copies, for every revision.
        # Once main carries them the base digests no longer match and base ownership resumes.
        SHAPE_OWNER=gate
        if [[ "$(digest gate BenchmarkCorpus.kt)" = "${WRAPPED_QUERY_SHAPE_BASE_CORPUS_SHA256}" && \
          "$(digest gate AllFixtureWrappedDiscoveryLatencyBenchmark.kt)" = "${WRAPPED_QUERY_SHAPE_BASE_LATENCY_HARNESS_SHA256}" && \
          "$(digest controls BenchmarkCorpus.kt)" = "${WRAPPED_QUERY_SHAPE_CANDIDATE_CORPUS_SHA256}" && \
          "$(digest controls AllFixtureWrappedDiscoveryLatencyBenchmark.kt)" = \
            "${WRAPPED_QUERY_SHAPE_CANDIDATE_LATENCY_HARNESS_SHA256}" && \
          "${{ needs.candidate-gate-tests.result }}" = success ]]; then
          SHAPE_OWNER=controls
        fi
        for HARNESS in \
          BenchmarkCorpus.kt \
          AllFixtureBenchmarkGraphPreparation.kt \
          AllFixtureWrappedDiscoveryLatencyBenchmark.kt \
          WrappedDiscoveryResourceBenchmark.kt; do
          SOURCE="src/jmh/kotlin/io/johnsonlee/graphite/webgraph/${HARNESS}"
          HARNESS_SOURCE="$(jvm gate webgraph)/${SOURCE}"
          if [ "${HARNESS}" = BenchmarkCorpus.kt ] || [ "${HARNESS}" = AllFixtureWrappedDiscoveryLatencyBenchmark.kt ]; then
            test ! -L "$(jvm "${SHAPE_OWNER}" webgraph)/${SOURCE}"
            HARNESS_SOURCE="$(jvm "${SHAPE_OWNER}" webgraph)/${SOURCE}"
          fi
          if [ "${HARNESS}" = WrappedDiscoveryResourceBenchmark.kt ] && \
            grep -q 'SingleGraphWrappedDiscoveryResourceBenchmark' "${HARNESS_SOURCE}"; then
            test "${{ needs.candidate-gate-tests.result }}" = success
            HARNESS_SOURCE="$(jvm controls webgraph)/${SOURCE}"
            test "$(sha256sum "${HARNESS_SOURCE}" | cut -d ' ' -f 1)" = \
              "${REAL_ONLY_RESOURCE_HARNESS_SHA256}"
            if grep -q 'SingleGraphWrappedDiscoveryResourceBenchmark' "${HARNESS_SOURCE}"; then exit 1; fi
          fi
          TARGET="$(jvm source webgraph)/${SOURCE}"
          test ! -L "${TARGET}"
          rm -f -- "${TARGET}"
          install -m 0644 "${HARNESS_SOURCE}" "${TARGET}"
          cmp "${HARNESS_SOURCE}" "${TARGET}"
        done

    - name: Select trusted JMH isolation controls
      id: jmh-isolation-controls
      run: |
        CONTROL_DIR=gate
        INIT='.github/scripts/benchmark-jmh-isolation.init.gradle'
        VERIFIER='.github/scripts/verify-jmh-jar-isolation.sh'
        if [[ ! -f "${CONTROL_DIR}/${INIT}" || ! -f "${CONTROL_DIR}/${VERIFIER}" ]]; then
          CONTROL_DIR=controls
          test "$(sha256sum "${CONTROL_DIR}/${INIT}" | cut -d' ' -f1)" = \
            "${JMH_ISOLATION_INIT_SHA256}"
          test "$(sha256sum "${CONTROL_DIR}/${VERIFIER}" | cut -d' ' -f1)" = \
            "${JMH_ISOLATION_VERIFIER_SHA256}"
        fi
        echo "directory=${CONTROL_DIR}" >> "${GITHUB_OUTPUT}"

    - name: Build comparable wrapped-query JMH JAR
      run: |
        CONTROL_DIR='${{ steps.jmh-isolation-controls.outputs.directory }}'
        source/gradlew -p source \
          -I "${PWD}/${CONTROL_DIR}/.github/scripts/benchmark-jmh-isolation.init.gradle" \
          :webgraph:testClasses :webgraph:jmhJar --no-daemon
        jvm() { if [[ -d "$1/frontend/jvm/$2" ]]; then echo "$1/frontend/jvm/$2"; else echo "$1/graphite-$2"; fi; }
        mapfile -t JARS < <(find "$(jvm source webgraph)/build/libs" -name '*-jmh.jar' -type f)
        test "${#JARS[@]}" -eq 1
        jar tf "${JARS[0]}" >/dev/null
        bash "${CONTROL_DIR}/.github/scripts/verify-jmh-jar-isolation.sh" \
          "$(jvm source webgraph)" "${JARS[0]}"
        mkdir -p jmh-artifact
        install -m 0644 "${JARS[0]}" "jmh-artifact/${{ matrix.revision }}-webgraph-jmh.jar"
        cd jmh-artifact
        sha256sum "${{ matrix.revision }}-webgraph-jmh.jar" \
          > "${{ matrix.revision }}-webgraph-jmh.jar.sha256"

    - name: Upload comparable wrapped-query JMH JAR
      uses: actions/upload-artifact@v7
      with:
        name: jmh-wrapped-query-${{ matrix.revision }}-${{ github.event.pull_request.number }}
        path: jmh-artifact/
        if-no-files-found: error
        overwrite: true
        retention-days: 2

  method-level:
    name: synthetic-query-correctness
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout base
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: base
        persist-credentials: false

    - name: Checkout PR
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: candidate
        persist-credentials: false

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: true

    - name: Test base benchmark gate logic
      run: node --test base/.github/scripts/benchmark-gate.test.mjs

    - name: Verify reviewed correctness and comparison control closure
      run: |
        set -euo pipefail
        MANIFEST=.github/scripts/multigraph-correctness-controls.sha256
        test ! -L "candidate/${MANIFEST}"
        test "$(sha256sum "candidate/${MANIFEST}" | cut -d' ' -f1)" = "${MULTIGRAPH_CORRECTNESS_CONTROLS_SHA256}"
        (cd candidate && sha256sum -c "${MANIFEST}")

    - name: Install pinned assertion-only entry point
      run: |
        jvm() { if [[ -d "$1/frontend/jvm/$2" ]]; then echo "$1/frontend/jvm/$2"; else echo "$1/graphite-$2"; fi; }
        SOURCE='frontend/jvm/cypher/src/jmh/kotlin/io/johnsonlee/graphite/cypher/BudgetedQueryCorrectness.kt'
        test "$(sha256sum "candidate/${SOURCE}" | cut -d' ' -f1)" = 'aa6757f2caea21d1f7b6bedb4a040e7f859b77d05889f360b33bf99882ba3349'
        RELATIVE='src/jmh/kotlin/io/johnsonlee/graphite/cypher/BudgetedQueryCorrectness.kt'
        install -m 0644 "candidate/${SOURCE}" "$(jvm base cypher)/${RELATIVE}"
        SOURCE='frontend/jvm/cypher/src/jmh/kotlin/io/johnsonlee/graphite/cypher/SyntheticQueryCorrectness.kt'
        test "$(sha256sum "candidate/${SOURCE}" | cut -d' ' -f1)" = '522d2a5b3241bae8a8f0f3f48b410ef98de07eedd2b15885f8edc389a00e787f'
        RELATIVE='src/jmh/kotlin/io/johnsonlee/graphite/cypher/SyntheticQueryCorrectness.kt'
        install -m 0644 "candidate/${SOURCE}" "$(jvm base cypher)/${RELATIVE}"

    - name: Build JMH jars
      run: |
        jvm() { if [[ -d "$1/frontend/jvm/$2" ]]; then echo "$1/frontend/jvm/$2"; else echo "$1/graphite-$2"; fi; }
        for HARNESS in CypherBenchmark.kt BudgetedCypherBenchmark.kt; do
          SOURCE="src/jmh/kotlin/io/johnsonlee/graphite/cypher/${HARNESS}"
          test ! -L "$(jvm candidate cypher)/${SOURCE}"
          rm -f -- "$(jvm candidate cypher)/${SOURCE}"
          install -m 0644 "$(jvm base cypher)/${SOURCE}" "$(jvm candidate cypher)/${SOURCE}"
          cmp "$(jvm base cypher)/${SOURCE}" "$(jvm candidate cypher)/${SOURCE}"
        done
        CONTROL_DIR=base
        INIT='.github/scripts/benchmark-jmh-isolation.init.gradle'
        VERIFIER='.github/scripts/verify-jmh-jar-isolation.sh'
        if [[ ! -f "${CONTROL_DIR}/${INIT}" || ! -f "${CONTROL_DIR}/${VERIFIER}" ]]; then
          CONTROL_DIR=candidate
          test "$(sha256sum "${CONTROL_DIR}/${INIT}" | cut -d' ' -f1)" = \
            "${JMH_ISOLATION_INIT_SHA256}"
          test "$(sha256sum "${CONTROL_DIR}/${VERIFIER}" | cut -d' ' -f1)" = \
            "${JMH_ISOLATION_VERIFIER_SHA256}"
        fi
        for REVISION in base candidate; do
          "${REVISION}/gradlew" -p "${REVISION}" -I "${PWD}/${CONTROL_DIR}/${INIT}" \
            :cypher:testClasses :cypher:jmhJar --no-daemon
          JAR=$(find "$(jvm "${REVISION}" cypher)/build/libs" -name '*-jmh.jar' -print -quit)
          test -n "${JAR}"
          bash "${CONTROL_DIR}/${VERIFIER}" "$(jvm "${REVISION}" cypher)" "${JAR}"
        done

    - name: Run complete untimed assertions
      run: |
        set -euo pipefail
        mkdir -p benchmark-results
        jvm() { if [[ -d "$1/frontend/jvm/$2" ]]; then echo "$1/frontend/jvm/$2"; else echo "$1/graphite-$2"; fi; }
        for REVISION in base candidate; do
          JAR=$(find "$(jvm "${REVISION}" cypher)/build/libs" -name '*-jmh.jar' -print -quit)
          test -n "${JAR}"
          java -Xmx512m -XX:ActiveProcessorCount=4 -cp "${JAR}" \
            io.johnsonlee.graphite.cypher.SyntheticQueryCorrectness | tee "benchmark-results/${REVISION}-method.log"
        done
        node candidate/.github/scripts/benchmark-correctness.mjs method \
          benchmark-results/method benchmark-results/base-method.log \
          benchmark-results/candidate-method.log \
          simpleNodeMatch nodeMatchWithWhere regexFilter singleHopRelationship \
          filteredSingleHopRelationship orderedFilteredSingleHopRelationship aggregationCountGroupBy variableLengthPath \
          filteredVariableLengthPath returnDistinct withPipeline functionCalls \
          countStar budgetedGeneralRegex budgetedListConcatenation budgetedListMembership

    - name: Upload method-level results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-method-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
        path: benchmark-results/
        if-no-files-found: warn
        retention-days: 14

