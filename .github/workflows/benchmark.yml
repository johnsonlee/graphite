          JAR=$(find "$(jvm "${REVISION}" webgraph)/build/libs" -name '*-jmh.jar' -print -quit)
          test -n "${JAR}"
          bash "${CONTROL_DIR}/${VERIFIER}" "$(jvm "${REVISION}" webgraph)" "${JAR}"
