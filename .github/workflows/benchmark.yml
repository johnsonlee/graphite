        MANIFEST=.github/scripts/multigraph-correctness-controls.sha256
        test ! -L "./${MANIFEST}"
        test "$(sha256sum "./${MANIFEST}" | cut -d' ' -f1)" = "${MULTIGRAPH_CORRECTNESS_CONTROLS_SHA256}"
        (cd . && sha256sum -c "${MANIFEST}")

    - name: Select latest successful Method shard artifacts
      run: |
        node .github/scripts/benchmark-gate.mjs stage-artifacts \
          --directory downloaded-method-shards \
          --output benchmark-results

    - name: Aggregate complete 33-scenario correctness
      env:
        SHARD_JOB: ${{ needs.method-compatibility-shard.result }}
      run: |
        set -euo pipefail
        test "${SHARD_JOB}" = success
        for REVISION in base candidate; do
          test "$(find benchmark-results -name "${REVISION}-method-compatibility-*.log" | wc -l)" -eq 12
          cat benchmark-results/${REVISION}-method-compatibility-*.log > "benchmark-results/${REVISION}-all-methods.log"
          cat benchmark-results/${REVISION}-method-compatibility-*.txt | sort > "benchmark-results/${REVISION}-all-methods.txt"
          test "$(wc -l < "benchmark-results/${REVISION}-all-methods.txt")" -eq 33
        done
        diff -u benchmark-results/base-all-methods.txt benchmark-results/candidate-all-methods.txt
        EXPECTED=()
        for COUNT in 4 17 36; do
          for SCENARIO in contains count early late middle or order prefix regex suffix zero; do
            EXPECTED+=("$(printf 'methods\t%s\t%s' "${COUNT}" "${SCENARIO}")")
          done
        done
        node .github/scripts/benchmark-correctness.mjs method-compatibility \
          benchmark-results/method-compatibility benchmark-results/base-all-methods.log \
          benchmark-results/candidate-all-methods.log "${EXPECTED[@]}"

    - name: Upload Method compatibility results
