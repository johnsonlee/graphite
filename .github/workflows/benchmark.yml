        if [[ ! -f "${CONTROL_DIR}/${INIT}" || ! -f "${CONTROL_DIR}/${VERIFIER}" ]]; then
          CONTROL_DIR=candidate
          test "$(sha256sum "${CONTROL_DIR}/${INIT}" | cut -d' ' -f1)" = \
