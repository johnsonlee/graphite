name: Benchmark regression

on:
  pull_request:
    branches: ['*']

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  JAVA_OPTS: -Xmx2g -XX:MetaspaceSize=512m -Dfile.encoding=UTF-8
  JVM_OPTS: -Xmx2g -XX:MetaspaceSize=512m -Dfile.encoding=UTF-8
  WRAPPED_QUERY_REFERENCE_SHA: 0b421f8a25800193fd86a7e4aebf72aa9e9d6cc6
  ANCHOR_BOOTSTRAP_COMPARATOR_SHA256: 958523660e5a875505d591534745e7b4cc3e0b7e1cb45145fe069086f716e7bd
  LARGE_CORPUS_LEGACY_HARNESS_SHA256: 9c439a7a0b6254421000e74678af3bdfc82bfe7ab7e5577dee85eabc90d65b80
  LARGE_CORPUS_TRANSITION_HARNESS_SHA256: 97c5f0be36d2531de0e10aa2766aa4f33aa3c3bf9f3e14990910403d113f4775
  LARGE_CORPUS_TRANSITION_COMPARATOR_SHA256: 859cc30fe4e4aef9f3525187986e0ed71f7b4902cae9bf3a1f3ca47f7418e770
  BENCHMARK_REPORT_TRANSITION_SHA256: 859cc30fe4e4aef9f3525187986e0ed71f7b4902cae9bf3a1f3ca47f7418e770
  REAL_ONLY_LATENCY_COMPARATOR_SHA256: 859cc30fe4e4aef9f3525187986e0ed71f7b4902cae9bf3a1f3ca47f7418e770
  LATENCY_POINT_ESTIMATE_COMPARATOR_SHA256: 859cc30fe4e4aef9f3525187986e0ed71f7b4902cae9bf3a1f3ca47f7418e770
  REAL_ONLY_RESOURCE_HARNESS_SHA256: 8ff5f47c264b4502589b40630039003424b75383ab4349e7080ac5f8619d0739
  JMH_ISOLATION_INIT_SHA256: 4d4f310a6f1c70894cdc4bc66c85ce189430a3af4f9e7661ac23a88b1fbd652f
  JMH_ISOLATION_VERIFIER_SHA256: 15308f60de8e8e948870e04cd162a32a549f1ba40c5c320a9ec0e28da9cba29e
  BUDGETED_LOOKUP_BASELINE_SHA: 87c74c2cae0685e40e32fb2eb46b33987ec1a7a0
  BUDGETED_COLLECTION_BASELINE_SHA: e070eb8183b55665863a4f8496b9515163575560

jobs:
  candidate-gate-tests:
    name: candidate-gate-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout PR gate tests
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: candidate
        persist-credentials: false

    - name: Test candidate benchmark gate logic
      run: node --test candidate/.github/scripts/benchmark-*.test.mjs

  build-explore-jmh:
    name: build-explore-jmh-${{ matrix.revision }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        revision: [base, candidate]

    steps:
    - name: Checkout base-owned benchmark harness
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: gate
        persist-credentials: false

    - name: Checkout benchmark revision
      uses: actions/checkout@v7
      with:
        ref: ${{ matrix.revision == 'base' && github.event.pull_request.base.sha || github.event.pull_request.head.sha }}
        path: source
        persist-credentials: false

    - name: Checkout candidate build controls
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: controls
        persist-credentials: false

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: true

    - name: Install base-owned Explorer harnesses
      run: |
        for HARNESS in ExplorerMemoryBenchmark.kt CypherCapacityBenchmark.kt; do
          SOURCE="graphite-explore/src/jmh/kotlin/io/johnsonlee/graphite/cli/${HARNESS}"
          test ! -L "source/${SOURCE}"
          rm -f -- "source/${SOURCE}"
          install -m 0644 "gate/${SOURCE}" "source/${SOURCE}"
          cmp "gate/${SOURCE}" "source/${SOURCE}"
        done

    - name: Build comparable Explorer JMH JAR
      run: |
        CONTROL_DIR=gate
        INIT='.github/scripts/benchmark-jmh-isolation.init.gradle'
        VERIFIER='.github/scripts/verify-jmh-jar-isolation.sh'
        if [[ ! -f "${CONTROL_DIR}/${INIT}" || ! -f "${CONTROL_DIR}/${VERIFIER}" ]]; then
          CONTROL_DIR=controls
          test "$(sha256sum "${CONTROL_DIR}/${INIT}" | cut -d' ' -f1)" = \
            "${JMH_ISOLATION_INIT_SHA256}"
          test "$(sha256sum "${CONTROL_DIR}/${VERIFIER}" | cut -d' ' -f1)" = \
            "${JMH_ISOLATION_VERIFIER_SHA256}"
        fi
        source/gradlew -p source -I "${PWD}/${CONTROL_DIR}/${INIT}" \
          :explore:testClasses :explore:jmhJar --no-daemon
        mapfile -t JARS < <(find source/graphite-explore/build/libs -name '*-jmh.jar' -type f)
        test "${#JARS[@]}" -eq 1
        jar tf "${JARS[0]}" >/dev/null
        bash "${CONTROL_DIR}/${VERIFIER}" source/graphite-explore "${JARS[0]}"
        mkdir -p jmh-artifact
        install -m 0644 "${JARS[0]}" "jmh-artifact/${{ matrix.revision }}-explore-jmh.jar"
        cd jmh-artifact
        sha256sum "${{ matrix.revision }}-explore-jmh.jar" \
          > "${{ matrix.revision }}-explore-jmh.jar.sha256"

    - name: Upload comparable Explorer JMH JAR
      uses: actions/upload-artifact@v7
      with:
        name: jmh-explore-${{ matrix.revision }}-${{ github.event.pull_request.number }}
        path: jmh-artifact/
        if-no-files-found: error
        overwrite: true
        retention-days: 2

  build-wrapped-query-jmh:
    name: build-wrapped-query-jmh-${{ matrix.revision }}
    needs: [candidate-gate-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        revision: [reference, base, candidate]

    steps:
    - name: Checkout base-owned benchmark harness
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: gate
        persist-credentials: false

    - name: Checkout benchmark revision
      uses: actions/checkout@v7
      with:
        ref: ${{ matrix.revision == 'reference' && env.WRAPPED_QUERY_REFERENCE_SHA || matrix.revision == 'base' && github.event.pull_request.base.sha || github.event.pull_request.head.sha }}
        path: source
        persist-credentials: false

    - name: Checkout candidate build controls
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: controls
        persist-credentials: false

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: true

    - name: Install base-owned wrapped-query harnesses
      run: |
        for HARNESS in \
          BenchmarkCorpus.kt \
          AllFixtureBenchmarkGraphPreparation.kt \
          AllFixtureWrappedDiscoveryLatencyBenchmark.kt \
          WrappedDiscoveryResourceBenchmark.kt; do
          SOURCE="graphite-webgraph/src/jmh/kotlin/io/johnsonlee/graphite/webgraph/${HARNESS}"
          HARNESS_SOURCE="gate/${SOURCE}"
          if [ "${HARNESS}" = WrappedDiscoveryResourceBenchmark.kt ] && \
            grep -q 'SingleGraphWrappedDiscoveryResourceBenchmark' "${HARNESS_SOURCE}"; then
            test "${{ needs.candidate-gate-tests.result }}" = success
            HARNESS_SOURCE="controls/${SOURCE}"
            test "$(sha256sum "${HARNESS_SOURCE}" | cut -d ' ' -f 1)" = \
              "${REAL_ONLY_RESOURCE_HARNESS_SHA256}"
            if grep -q 'SingleGraphWrappedDiscoveryResourceBenchmark' "${HARNESS_SOURCE}"; then exit 1; fi
          fi
          test ! -L "source/${SOURCE}"
          rm -f -- "source/${SOURCE}"
          install -m 0644 "${HARNESS_SOURCE}" "source/${SOURCE}"
          cmp "${HARNESS_SOURCE}" "source/${SOURCE}"
        done

    - name: Select trusted JMH isolation controls
      id: jmh-isolation-controls
      run: |
        CONTROL_DIR=gate
        INIT='.github/scripts/benchmark-jmh-isolation.init.gradle'
        VERIFIER='.github/scripts/verify-jmh-jar-isolation.sh'
        if [[ ! -f "${CONTROL_DIR}/${INIT}" || ! -f "${CONTROL_DIR}/${VERIFIER}" ]]; then
          CONTROL_DIR=controls
          test "$(sha256sum "${CONTROL_DIR}/${INIT}" | cut -d' ' -f1)" = \
            "${JMH_ISOLATION_INIT_SHA256}"
          test "$(sha256sum "${CONTROL_DIR}/${VERIFIER}" | cut -d' ' -f1)" = \
            "${JMH_ISOLATION_VERIFIER_SHA256}"
        fi
        echo "directory=${CONTROL_DIR}" >> "${GITHUB_OUTPUT}"

    - name: Build comparable wrapped-query JMH JAR
      run: |
        CONTROL_DIR='${{ steps.jmh-isolation-controls.outputs.directory }}'
        source/gradlew -p source \
          -I "${PWD}/${CONTROL_DIR}/.github/scripts/benchmark-jmh-isolation.init.gradle" \
          :webgraph:testClasses :webgraph:jmhJar --no-daemon
        mapfile -t JARS < <(find source/graphite-webgraph/build/libs -name '*-jmh.jar' -type f)
        test "${#JARS[@]}" -eq 1
        jar tf "${JARS[0]}" >/dev/null
        bash "${CONTROL_DIR}/.github/scripts/verify-jmh-jar-isolation.sh" \
          source/graphite-webgraph "${JARS[0]}"
        mkdir -p jmh-artifact
        install -m 0644 "${JARS[0]}" "jmh-artifact/${{ matrix.revision }}-webgraph-jmh.jar"
        cd jmh-artifact
        sha256sum "${{ matrix.revision }}-webgraph-jmh.jar" \
          > "${{ matrix.revision }}-webgraph-jmh.jar.sha256"

    - name: Upload comparable wrapped-query JMH JAR
      uses: actions/upload-artifact@v7
      with:
        name: jmh-wrapped-query-${{ matrix.revision }}-${{ github.event.pull_request.number }}
        path: jmh-artifact/
        if-no-files-found: error
        overwrite: true
        retention-days: 2

  method-level:
    name: method-level-benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout base
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: base
        persist-credentials: false

    - name: Checkout PR
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: candidate
        persist-credentials: false

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: true

    - name: Test base benchmark gate logic
      run: node --test base/.github/scripts/benchmark-gate.test.mjs

    - name: Build JMH jars
      run: |
        for HARNESS in CypherBenchmark.kt BudgetedCypherBenchmark.kt; do
          SOURCE="graphite-cypher/src/jmh/kotlin/io/johnsonlee/graphite/cypher/${HARNESS}"
          test ! -L "candidate/${SOURCE}"
          rm -f -- "candidate/${SOURCE}"
          install -m 0644 "base/${SOURCE}" "candidate/${SOURCE}"
          cmp "base/${SOURCE}" "candidate/${SOURCE}"
        done
        CONTROL_DIR=base
        INIT='.github/scripts/benchmark-jmh-isolation.init.gradle'
        VERIFIER='.github/scripts/verify-jmh-jar-isolation.sh'
        if [[ ! -f "${CONTROL_DIR}/${INIT}" || ! -f "${CONTROL_DIR}/${VERIFIER}" ]]; then
          CONTROL_DIR=candidate
          test "$(sha256sum "${CONTROL_DIR}/${INIT}" | cut -d' ' -f1)" = \
            "${JMH_ISOLATION_INIT_SHA256}"
          test "$(sha256sum "${CONTROL_DIR}/${VERIFIER}" | cut -d' ' -f1)" = \
            "${JMH_ISOLATION_VERIFIER_SHA256}"
        fi
        for REVISION in base candidate; do
          "${REVISION}/gradlew" -p "${REVISION}" -I "${PWD}/${CONTROL_DIR}/${INIT}" \
            :cypher:testClasses :cypher:jmhJar --no-daemon
          JAR=$(find "${REVISION}/graphite-cypher/build/libs" -name '*-jmh.jar' -print -quit)
          test -n "${JAR}"
          bash "${CONTROL_DIR}/${VERIFIER}" "${REVISION}/graphite-cypher" "${JAR}"
        done

    - name: Benchmark base
      run: |
        mkdir -p benchmark-results
        JMH_JAR=$(find base/graphite-cypher/build/libs -name '*-jmh.jar' -print -quit)
        test -n "${JMH_JAR}"
        java -jar "${JMH_JAR}" \
          'io.johnsonlee.graphite.cypher.(CypherBenchmark.*|BudgetedCypherBenchmark.budgetedGeneralRegex)' \
          -foe true -rf json -rff "${PWD}/benchmark-results/base-jmh.json"

    - name: Benchmark PR
      run: |
        JMH_JAR=$(find candidate/graphite-cypher/build/libs -name '*-jmh.jar' -print -quit)
        test -n "${JMH_JAR}"
        java -jar "${JMH_JAR}" \
          'io.johnsonlee.graphite.cypher.(CypherBenchmark.*|BudgetedCypherBenchmark.budgetedGeneralRegex)' \
          -foe true -rf json -rff "${PWD}/benchmark-results/candidate-jmh.json"

    - name: Compare method-level results
      run: |
        if node base/.github/scripts/benchmark-gate.mjs compare-jmh \
          --base benchmark-results/base-jmh.json \
          --candidate benchmark-results/candidate-jmh.json \
          --threshold 15 \
          --report benchmark-results/initial-method-report.md \
          --status benchmark-results/initial-method-status.json; then
          mv benchmark-results/initial-method-report.md benchmark-results/method-report.md
          mv benchmark-results/initial-method-status.json benchmark-results/method-status.json
        else
          CANDIDATE_JAR=$(find candidate/graphite-cypher/build/libs -name '*-jmh.jar' -print -quit)
          BASE_JAR=$(find base/graphite-cypher/build/libs -name '*-jmh.jar' -print -quit)
          java -jar "${CANDIDATE_JAR}" \
            'io.johnsonlee.graphite.cypher.(CypherBenchmark.*|BudgetedCypherBenchmark.budgetedGeneralRegex)' \
            -foe true -rf json -rff "${PWD}/benchmark-results/candidate-jmh-confirmation.json"
          java -jar "${BASE_JAR}" \
            'io.johnsonlee.graphite.cypher.(CypherBenchmark.*|BudgetedCypherBenchmark.budgetedGeneralRegex)' \
            -foe true -rf json -rff "${PWD}/benchmark-results/base-jmh-confirmation.json"
          node base/.github/scripts/benchmark-gate.mjs confirm-jmh \
            --initial benchmark-results/initial-method-status.json \
            --base benchmark-results/base-jmh-confirmation.json \
            --candidate benchmark-results/candidate-jmh-confirmation.json \
            --threshold 15 \
            --report benchmark-results/method-report.md \
            --status benchmark-results/method-status.json
        fi

    - name: Upload method-level results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-method-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
        path: benchmark-results/
        if-no-files-found: warn
        retention-days: 14

  explorer:
    name: explorer-benchmarks
    needs: [prepare-latency-fixtures, build-explore-jmh]
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout base
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: base
        persist-credentials: false

    - name: Checkout PR
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: candidate
        persist-credentials: false

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Download base Explorer JMH JAR
      uses: actions/download-artifact@v8
      with:
        name: jmh-explore-base-${{ github.event.pull_request.number }}
        path: jmh-jars/base

    - name: Download candidate Explorer JMH JAR
      uses: actions/download-artifact@v8
      with:
        name: jmh-explore-candidate-${{ github.event.pull_request.number }}
        path: jmh-jars/candidate

    - name: Verify Explorer JMH artifacts
      run: |
        for REVISION in base candidate; do
          test -f "jmh-jars/${REVISION}/${REVISION}-explore-jmh.jar"
          test -f "jmh-jars/${REVISION}/${REVISION}-explore-jmh.jar.sha256"
          (cd "jmh-jars/${REVISION}" && sha256sum -c "${REVISION}-explore-jmh.jar.sha256")
          jar tf "jmh-jars/${REVISION}/${REVISION}-explore-jmh.jar" >/dev/null
        done

    - name: Restore persisted fixture graphs
      uses: actions/cache/restore@v5
      with:
        path: fixture-graphs
        key: ${{ runner.os }}-${{ runner.arch }}-wrapped-query-fixtures-v2-${{ hashFiles('candidate/gradle/libs.versions.toml', 'candidate/gradle/wrapper/gradle-wrapper.properties', 'candidate/settings.gradle.kts', 'candidate/**/build.gradle.kts', 'candidate/graphite-core/src/main/**', 'candidate/graphite-sootup/src/main/**', 'candidate/graphite-webgraph/src/main/**', 'candidate/graphite-webgraph/src/jmh/kotlin/io/johnsonlee/graphite/webgraph/BenchmarkCorpus.kt', 'candidate/graphite-webgraph/src/jmh/kotlin/io/johnsonlee/graphite/webgraph/AllFixtureBenchmarkGraphPreparation.kt') }}

    - name: Verify restored real graphs
      run: |
        test -f fixture-graphs/.complete
        for CORPUS in android tika hive kotlin-compiler; do
          test -f "fixture-graphs/${CORPUS}/graph.metadata"
          test -f "fixture-graphs/${CORPUS}/graph.nodedata"
        done

    - name: Benchmark base then PR
      run: |
        mkdir -p benchmark-results
        BASE_JAR=$(find jmh-jars/base -name '*-jmh.jar' -print -quit)
        CANDIDATE_JAR=$(find jmh-jars/candidate -name '*-jmh.jar' -print -quit)
        test -n "${BASE_JAR}"
        test -n "${CANDIDATE_JAR}"
        GRAPH_ARG="-Dandroid.graph.path=${PWD}/fixture-graphs/android"
        # Hosted-runner RSS has enough allocator noise to make the benchmark's
        # 64 MiB local waterline flaky before paired results can be compared.
        # Apply the same ceiling to both revisions; the 15% paired latency gate
        # and the remaining heap/waterline checks still fail closed.
        JMH_ARGS=(-wi 0 -i 1 -f 3 -t 1 -foe true -rf json \
          -p stableResidentGrowthLimitBytes=134217728)
        java -jar "${BASE_JAR}" \
          'io.johnsonlee.graphite.cli.ExplorerMemoryBenchmark.*' "${JMH_ARGS[@]}" \
          -jvmArgsAppend "${GRAPH_ARG}" \
          -rff "${PWD}/benchmark-results/base-explorer.json"
        java -jar "${CANDIDATE_JAR}" \
          'io.johnsonlee.graphite.cli.ExplorerMemoryBenchmark.*' "${JMH_ARGS[@]}" \
          -jvmArgsAppend "${GRAPH_ARG}" \
          -rff "${PWD}/benchmark-results/candidate-explorer.json"

    - name: Compare Explorer results
      run: |
        EXPECTED='io.johnsonlee.graphite.cli.ExplorerMemoryBenchmark.'
        for FILE in benchmark-results/base-explorer.json benchmark-results/candidate-explorer.json; do
          jq -e --arg expected "${EXPECTED}" \
            'length == 4 and all(.[]; (.benchmark | startswith($expected)) and
              .mode == "ss" and .primaryMetric.score > 0)' \
            "${FILE}" >/dev/null
        done
        if node base/.github/scripts/benchmark-gate.mjs compare-jmh \
          --base benchmark-results/base-explorer.json \
          --candidate benchmark-results/candidate-explorer.json \
          --threshold 15 \
          --threshold-only \
          --title 'Explorer HTTP sessions' \
          --report benchmark-results/initial-explorer-report.md \
          --status benchmark-results/initial-explorer-status.json; then
          mv benchmark-results/initial-explorer-report.md benchmark-results/explorer-report.md
          mv benchmark-results/initial-explorer-status.json benchmark-results/explorer-status.json
        else
          BASE_JAR=$(find jmh-jars/base -name '*-jmh.jar' -print -quit)
          CANDIDATE_JAR=$(find jmh-jars/candidate -name '*-jmh.jar' -print -quit)
          GRAPH_ARG="-Dandroid.graph.path=${PWD}/fixture-graphs/android"
          JMH_ARGS=(-wi 0 -i 1 -f 3 -t 1 -foe true -rf json \
            -p stableResidentGrowthLimitBytes=134217728)
          java -jar "${CANDIDATE_JAR}" \
            'io.johnsonlee.graphite.cli.ExplorerMemoryBenchmark.*' "${JMH_ARGS[@]}" \
            -jvmArgsAppend "${GRAPH_ARG}" \
            -rff "${PWD}/benchmark-results/candidate-explorer-confirmation.json"
          java -jar "${BASE_JAR}" \
            'io.johnsonlee.graphite.cli.ExplorerMemoryBenchmark.*' "${JMH_ARGS[@]}" \
            -jvmArgsAppend "${GRAPH_ARG}" \
            -rff "${PWD}/benchmark-results/base-explorer-confirmation.json"
          node base/.github/scripts/benchmark-gate.mjs confirm-jmh \
            --initial benchmark-results/initial-explorer-status.json \
            --base benchmark-results/base-explorer-confirmation.json \
            --candidate benchmark-results/candidate-explorer-confirmation.json \
            --threshold 15 \
            --threshold-only \
            --title 'Explorer HTTP sessions' \
            --report benchmark-results/explorer-report.md \
            --status benchmark-results/explorer-status.json
        fi

    - name: Upload Explorer results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-explorer-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
        path: benchmark-results/
        if-no-files-found: warn
        retention-days: 14

  method-compatibility-shard:
    name: method-compatibility-${{ matrix.graph_count }}-${{ matrix.group }}
    needs: [prepare-latency-fixtures, build-explore-jmh]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
        - graph_count: 4
          group: position
          scenarios: zero,early,middle
        - graph_count: 4
          group: string
          scenarios: late,prefix,suffix
        - graph_count: 4
          group: scan
          scenarios: contains,regex,or
        - graph_count: 4
          group: aggregate
          scenarios: count,order
        - graph_count: 17
          group: position
          scenarios: zero,early,middle
        - graph_count: 17
          group: string
          scenarios: late,prefix,suffix
        - graph_count: 17
          group: scan
          scenarios: contains,regex,or
        - graph_count: 17
          group: aggregate
          scenarios: count,order
        - graph_count: 36
          group: position
          scenarios: zero,early,middle
        - graph_count: 36
          group: string
          scenarios: late,prefix,suffix
        - graph_count: 36
          group: scan
          scenarios: contains,regex,or
        - graph_count: 36
          group: aggregate
          scenarios: count,order

    steps:
    - name: Checkout base
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: base
        persist-credentials: false

    - name: Checkout PR
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: candidate
        persist-credentials: false

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Download base Explorer JMH JAR
      uses: actions/download-artifact@v8
      with:
        name: jmh-explore-base-${{ github.event.pull_request.number }}
        path: jmh-jars/base

    - name: Download candidate Explorer JMH JAR
      uses: actions/download-artifact@v8
      with:
        name: jmh-explore-candidate-${{ github.event.pull_request.number }}
        path: jmh-jars/candidate

    - name: Verify Explorer JMH artifacts
      run: |
        for REVISION in base candidate; do
          test -f "jmh-jars/${REVISION}/${REVISION}-explore-jmh.jar"
          test -f "jmh-jars/${REVISION}/${REVISION}-explore-jmh.jar.sha256"
          (cd "jmh-jars/${REVISION}" && sha256sum -c "${REVISION}-explore-jmh.jar.sha256")
          jar tf "jmh-jars/${REVISION}/${REVISION}-explore-jmh.jar" >/dev/null
        done

    - name: Restore persisted fixture graphs
      uses: actions/cache/restore@v5
      with:
        path: fixture-graphs
        key: ${{ runner.os }}-${{ runner.arch }}-wrapped-query-fixtures-v2-${{ hashFiles('candidate/gradle/libs.versions.toml', 'candidate/gradle/wrapper/gradle-wrapper.properties', 'candidate/settings.gradle.kts', 'candidate/**/build.gradle.kts', 'candidate/graphite-core/src/main/**', 'candidate/graphite-sootup/src/main/**', 'candidate/graphite-webgraph/src/main/**', 'candidate/graphite-webgraph/src/jmh/kotlin/io/johnsonlee/graphite/webgraph/BenchmarkCorpus.kt', 'candidate/graphite-webgraph/src/jmh/kotlin/io/johnsonlee/graphite/webgraph/AllFixtureBenchmarkGraphPreparation.kt') }}

    - name: Verify restored real graphs
      run: |
        test -f fixture-graphs/.complete
        for CORPUS in android tika hive kotlin-compiler; do
          test -f "fixture-graphs/${CORPUS}/graph.metadata"
          test -f "fixture-graphs/${CORPUS}/graph.nodedata"
        done

    - name: Benchmark paired Method shard
      env:
        GRAPH_COUNT: ${{ matrix.graph_count }}
        GROUP: ${{ matrix.group }}
        SCENARIOS: ${{ matrix.scenarios }}
      run: |
        mkdir -p benchmark-results
        BASE_JAR=$(find jmh-jars/base -name '*-jmh.jar' -print -quit)
        CANDIDATE_JAR=$(find jmh-jars/candidate -name '*-jmh.jar' -print -quit)
        test -n "${BASE_JAR}" && test -n "${CANDIDATE_JAR}"
        GRAPH_ARGS="-Dandroid.graph.path=${PWD}/fixture-graphs/android \
          -Dtika.graph.path=${PWD}/fixture-graphs/tika \
          -Dhive.graph.path=${PWD}/fixture-graphs/hive \
          -Dkotlin.compiler.graph.path=${PWD}/fixture-graphs/kotlin-compiler"
        METHOD_ARGS=(-wi 0 -i 1 -f 1 -t 1 -foe true -rf json \
          -p "graphCount=${GRAPH_COUNT}" -p "scenario=${SCENARIOS}")
        java -jar "${BASE_JAR}" \
          'io.johnsonlee.graphite.cli.MethodDiscoveryCompatibilityBenchmark.methodScenarioGate' "${METHOD_ARGS[@]}" \
          -jvmArgsAppend "${GRAPH_ARGS} -Dgraphite.method.compatibility.output=${PWD}/benchmark-results/base-method-compatibility-${GRAPH_COUNT}-${GROUP}.txt" \
          -rff "${PWD}/benchmark-results/base-method-compatibility-${GRAPH_COUNT}-${GROUP}.json"
        java -jar "${CANDIDATE_JAR}" \
          'io.johnsonlee.graphite.cli.MethodDiscoveryCompatibilityBenchmark.methodScenarioGate' "${METHOD_ARGS[@]}" \
          -jvmArgsAppend "${GRAPH_ARGS} -Dgraphite.method.compatibility.output=${PWD}/benchmark-results/candidate-method-compatibility-${GRAPH_COUNT}-${GROUP}.txt" \
          -rff "${PWD}/benchmark-results/candidate-method-compatibility-${GRAPH_COUNT}-${GROUP}.json"

    - name: Validate Method shard
      env:
        GRAPH_COUNT: ${{ matrix.graph_count }}
        GROUP: ${{ matrix.group }}
        SCENARIOS: ${{ matrix.scenarios }}
      run: |
        EXPECTED='io.johnsonlee.graphite.cli.MethodDiscoveryCompatibilityBenchmark.'
        SCENARIO_COUNT=$(tr ',' '\n' <<< "${SCENARIOS}" | wc -l)
        for REVISION in base candidate; do
          FILE="benchmark-results/${REVISION}-method-compatibility-${GRAPH_COUNT}-${GROUP}.json"
          jq -e --arg expected "${EXPECTED}" --arg graph_count "${GRAPH_COUNT}" \
            --arg scenarios "${SCENARIOS}" '
            length == ($scenarios | split(",") | length) and
            all(.[];
              (.benchmark | startswith($expected)) and
              .params.graphCount == $graph_count and
              .mode == "ss" and .primaryMetric.score > 0 and
              .secondaryMetrics.processCpuNanos.score > 0 and
              .secondaryMetrics.residentSetAfterBytes.score > 0 and
              .secondaryMetrics.residentSetDeltaBytes.score >= 0
            ) and
            ([.[].params.scenario] | unique | sort) == ($scenarios | split(",") | sort)' \
            "${FILE}" >/dev/null
          test "$(sort -u "benchmark-results/${REVISION}-method-compatibility-${GRAPH_COUNT}-${GROUP}.txt" | wc -l)" \
            -eq "${SCENARIO_COUNT}"
        done

        gate_metric() {
          local SLUG="$1"
          local METRIC="$2"
          local TITLE="$3"
          local ADVISORY="$4"
          local METRIC_ARG=()
          local ADVISORY_ARG=()
          if [ -n "${METRIC}" ]; then METRIC_ARG=(--metric "${METRIC}"); fi
          if [ "${ADVISORY}" = true ]; then ADVISORY_ARG=(--advisory); fi
          node base/.github/scripts/benchmark-gate.mjs compare-jmh \
            --base "benchmark-results/base-method-compatibility-${GRAPH_COUNT}-${GROUP}.json" \
            --candidate "benchmark-results/candidate-method-compatibility-${GRAPH_COUNT}-${GROUP}.json" \
            "${METRIC_ARG[@]}" \
            "${ADVISORY_ARG[@]}" \
            --threshold 15 \
            --threshold-only \
            --title "Method discovery ${GRAPH_COUNT}-graph ${GROUP} ${TITLE}" \
            --report "benchmark-results/method-compatibility-${GRAPH_COUNT}-${GROUP}-${SLUG}-initial-report.md" \
            --status "benchmark-results/method-compatibility-${GRAPH_COUNT}-${GROUP}-${SLUG}-initial-status.json"
        }

        NEED_CONFIRMATION=0
        gate_metric wall '' 'wall time' false || NEED_CONFIRMATION=1
        gate_metric cpu processCpuNanos 'CPU time' false || NEED_CONFIRMATION=1
        gate_metric rss-after residentSetAfterBytes 'RSS after query' false || NEED_CONFIRMATION=1
        gate_metric rss-delta residentSetDeltaBytes 'RSS query delta (advisory)' true || NEED_CONFIRMATION=1

        if [ "${NEED_CONFIRMATION}" -eq 1 ]; then
          BASE_JAR=$(find jmh-jars/base -name '*-jmh.jar' -print -quit)
          CANDIDATE_JAR=$(find jmh-jars/candidate -name '*-jmh.jar' -print -quit)
          test -n "${BASE_JAR}" && test -n "${CANDIDATE_JAR}"
          GRAPH_ARGS="-Dandroid.graph.path=${PWD}/fixture-graphs/android \
            -Dtika.graph.path=${PWD}/fixture-graphs/tika \
            -Dhive.graph.path=${PWD}/fixture-graphs/hive \
            -Dkotlin.compiler.graph.path=${PWD}/fixture-graphs/kotlin-compiler"
          METHOD_ARGS=(-wi 0 -i 1 -f 1 -t 1 -foe true -rf json \
            -p "graphCount=${GRAPH_COUNT}" -p "scenario=${SCENARIOS}")
          java -jar "${CANDIDATE_JAR}" \
            'io.johnsonlee.graphite.cli.MethodDiscoveryCompatibilityBenchmark.methodScenarioGate' "${METHOD_ARGS[@]}" \
            -jvmArgsAppend "${GRAPH_ARGS} -Dgraphite.method.compatibility.output=${PWD}/benchmark-results/method-confirmation-candidate-${GRAPH_COUNT}-${GROUP}.txt" \
            -rff "${PWD}/benchmark-results/method-confirmation-candidate-${GRAPH_COUNT}-${GROUP}.json"
          java -jar "${BASE_JAR}" \
            'io.johnsonlee.graphite.cli.MethodDiscoveryCompatibilityBenchmark.methodScenarioGate' "${METHOD_ARGS[@]}" \
            -jvmArgsAppend "${GRAPH_ARGS} -Dgraphite.method.compatibility.output=${PWD}/benchmark-results/method-confirmation-base-${GRAPH_COUNT}-${GROUP}.txt" \
            -rff "${PWD}/benchmark-results/method-confirmation-base-${GRAPH_COUNT}-${GROUP}.json"
          test "$(sort -u "benchmark-results/method-confirmation-candidate-${GRAPH_COUNT}-${GROUP}.txt" | wc -l)" \
            -eq "${SCENARIO_COUNT}"
          test "$(sort -u "benchmark-results/method-confirmation-base-${GRAPH_COUNT}-${GROUP}.txt" | wc -l)" \
            -eq "${SCENARIO_COUNT}"
          diff -u \
            <(sort -u "benchmark-results/method-confirmation-base-${GRAPH_COUNT}-${GROUP}.txt") \
            <(sort -u "benchmark-results/method-confirmation-candidate-${GRAPH_COUNT}-${GROUP}.txt")
        fi

        FINAL_FAILURE=0
        for SPEC in \
          'wall::wall time:false' \
          'cpu:processCpuNanos:CPU time:false' \
          'rss-after:residentSetAfterBytes:RSS after query:false' \
          'rss-delta:residentSetDeltaBytes:RSS query delta (advisory):true'; do
          IFS=: read -r SLUG METRIC TITLE ADVISORY <<< "${SPEC}"
          if [ "${NEED_CONFIRMATION}" -eq 0 ] || [ "${ADVISORY}" = true ]; then
            cp "benchmark-results/method-compatibility-${GRAPH_COUNT}-${GROUP}-${SLUG}-initial-report.md" \
              "benchmark-results/method-compatibility-${GRAPH_COUNT}-${GROUP}-${SLUG}-report.md"
            cp "benchmark-results/method-compatibility-${GRAPH_COUNT}-${GROUP}-${SLUG}-initial-status.json" \
              "benchmark-results/method-compatibility-${GRAPH_COUNT}-${GROUP}-${SLUG}-status.json"
          else
            METRIC_ARG=()
            if [ -n "${METRIC}" ]; then METRIC_ARG=(--metric "${METRIC}"); fi
            node base/.github/scripts/benchmark-gate.mjs confirm-jmh \
              --initial "benchmark-results/method-compatibility-${GRAPH_COUNT}-${GROUP}-${SLUG}-initial-status.json" \
              --base "benchmark-results/method-confirmation-base-${GRAPH_COUNT}-${GROUP}.json" \
              --candidate "benchmark-results/method-confirmation-candidate-${GRAPH_COUNT}-${GROUP}.json" \
              "${METRIC_ARG[@]}" \
              --threshold 15 \
              --threshold-only \
              --title "Method discovery ${GRAPH_COUNT}-graph ${GROUP} ${TITLE}" \
              --report "benchmark-results/method-compatibility-${GRAPH_COUNT}-${GROUP}-${SLUG}-report.md" \
              --status "benchmark-results/method-compatibility-${GRAPH_COUNT}-${GROUP}-${SLUG}-status.json" || FINAL_FAILURE=1
          fi
        done
        cat \
          "benchmark-results/method-compatibility-${GRAPH_COUNT}-${GROUP}-wall-report.md" \
          "benchmark-results/method-compatibility-${GRAPH_COUNT}-${GROUP}-cpu-report.md" \
          "benchmark-results/method-compatibility-${GRAPH_COUNT}-${GROUP}-rss-after-report.md" \
          "benchmark-results/method-compatibility-${GRAPH_COUNT}-${GROUP}-rss-delta-report.md" \
          > "benchmark-results/method-compatibility-shard-${GRAPH_COUNT}-${GROUP}-report.md"
        jq -s '{
          passed: all(.[]; .passed == true),
          errors: [.[].errors[]],
          rows: [.[].rows[]]
        }' \
          "benchmark-results/method-compatibility-${GRAPH_COUNT}-${GROUP}-wall-status.json" \
          "benchmark-results/method-compatibility-${GRAPH_COUNT}-${GROUP}-cpu-status.json" \
          "benchmark-results/method-compatibility-${GRAPH_COUNT}-${GROUP}-rss-after-status.json" \
          "benchmark-results/method-compatibility-${GRAPH_COUNT}-${GROUP}-rss-delta-status.json" \
          > "benchmark-results/method-compatibility-shard-${GRAPH_COUNT}-${GROUP}-status.json"
        test "${FINAL_FAILURE}" -eq 0
        jq -e '.passed == true' \
          "benchmark-results/method-compatibility-shard-${GRAPH_COUNT}-${GROUP}-status.json" >/dev/null

    - name: Upload Method shard
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-method-compatibility-shard-${{ matrix.graph_count }}-${{ matrix.group }}-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
        path: benchmark-results/
        if-no-files-found: error
        retention-days: 14

  method-compatibility:
    name: method-compatibility-gate
    if: always()
    needs: [method-compatibility-shard]
    runs-on: ubuntu-latest

    steps:
    - name: Checkout base gate code
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        persist-credentials: false

    - name: Download Method shards
      uses: actions/download-artifact@v8
      with:
        pattern: benchmark-method-compatibility-shard-*-${{ github.event.pull_request.number }}-*
        path: downloaded-method-shards

    - name: Select latest successful Method shard artifacts
      run: |
        node .github/scripts/benchmark-gate.mjs stage-artifacts \
          --directory downloaded-method-shards \
          --output benchmark-results

    - name: Aggregate and gate 33 Method cases
      env:
        SHARD_JOB: ${{ needs.method-compatibility-shard.result }}
      run: |
        test "${SHARD_JOB}" = success
        test "$(find benchmark-results -name 'base-method-compatibility-*.json' | wc -l)" -eq 12
        test "$(find benchmark-results -name 'candidate-method-compatibility-*.json' | wc -l)" -eq 12
        jq -s 'add' benchmark-results/base-method-compatibility-*.json \
          > benchmark-results/base-method-compatibility.json
        jq -s 'add' benchmark-results/candidate-method-compatibility-*.json \
          > benchmark-results/candidate-method-compatibility.json
        cat benchmark-results/base-method-compatibility-*.txt \
          > benchmark-results/base-method-compatibility.txt
        cat benchmark-results/candidate-method-compatibility-*.txt \
          > benchmark-results/candidate-method-compatibility.txt

        EXPECTED='io.johnsonlee.graphite.cli.MethodDiscoveryCompatibilityBenchmark.'
        for FILE in \
          benchmark-results/base-method-compatibility.json \
          benchmark-results/candidate-method-compatibility.json; do
          jq -e --arg expected "${EXPECTED}" '
            length == 33 and
            ([.[].params.graphCount] | unique | sort) == ["17", "36", "4"] and
            ([.[].params.scenario] | unique | sort) ==
              ["contains", "count", "early", "late", "middle", "or", "order", "prefix", "regex", "suffix", "zero"] and
            ([.[] | "\(.params.graphCount):\(.params.scenario)"] | unique | length) == 33 and
            all(.[];
              (.benchmark | startswith($expected)) and
              .mode == "ss" and .primaryMetric.score > 0 and
              .secondaryMetrics.processCpuNanos.score > 0 and
              .secondaryMetrics.residentSetAfterBytes.score > 0 and
              .secondaryMetrics.residentSetDeltaBytes.score >= 0
            )' "${FILE}" >/dev/null
        done

        sort -u benchmark-results/base-method-compatibility.txt \
          > benchmark-results/base-method-compatibility.sorted.txt
        sort -u benchmark-results/candidate-method-compatibility.txt \
          > benchmark-results/candidate-method-compatibility.sorted.txt
        test "$(wc -l < benchmark-results/base-method-compatibility.sorted.txt)" -eq 33
        test "$(wc -l < benchmark-results/candidate-method-compatibility.sorted.txt)" -eq 33
        diff -u \
          benchmark-results/base-method-compatibility.sorted.txt \
          benchmark-results/candidate-method-compatibility.sorted.txt

        test "$(find benchmark-results -name 'method-compatibility-shard-*-status.json' | wc -l)" -eq 12
        cat benchmark-results/method-compatibility-shard-*-report.md \
          > benchmark-results/method-compatibility-report.md
        jq -s '{
          passed: all(.[]; .passed == true),
          errors: [.[].errors[]],
          rows: [.[].rows[]]
        }' benchmark-results/method-compatibility-shard-*-status.json \
          > benchmark-results/method-compatibility-status.json
        jq -e '.passed == true' benchmark-results/method-compatibility-status.json >/dev/null

    - name: Upload Method compatibility results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-method-compatibility-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
        path: benchmark-results/
        if-no-files-found: error
        retention-days: 14

  cypher-capacity:
    name: cypher-capacity-gate
    needs: [prepare-latency-fixtures, build-explore-jmh]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout base
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: base
        persist-credentials: false

    - name: Checkout PR
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: candidate
        persist-credentials: false

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Download base Explorer JMH JAR
      uses: actions/download-artifact@v8
      with:
        name: jmh-explore-base-${{ github.event.pull_request.number }}
        path: jmh-jars/base

    - name: Download candidate Explorer JMH JAR
      uses: actions/download-artifact@v8
      with:
        name: jmh-explore-candidate-${{ github.event.pull_request.number }}
        path: jmh-jars/candidate

    - name: Verify Explorer JMH artifacts
      run: |
        for REVISION in base candidate; do
          test -f "jmh-jars/${REVISION}/${REVISION}-explore-jmh.jar"
          test -f "jmh-jars/${REVISION}/${REVISION}-explore-jmh.jar.sha256"
          (cd "jmh-jars/${REVISION}" && sha256sum -c "${REVISION}-explore-jmh.jar.sha256")
          jar tf "jmh-jars/${REVISION}/${REVISION}-explore-jmh.jar" >/dev/null
        done

    - name: Restore persisted fixture graphs
      uses: actions/cache/restore@v5
      with:
        path: fixture-graphs
        key: ${{ runner.os }}-${{ runner.arch }}-wrapped-query-fixtures-v2-${{ hashFiles('candidate/gradle/libs.versions.toml', 'candidate/gradle/wrapper/gradle-wrapper.properties', 'candidate/settings.gradle.kts', 'candidate/**/build.gradle.kts', 'candidate/graphite-core/src/main/**', 'candidate/graphite-sootup/src/main/**', 'candidate/graphite-webgraph/src/main/**', 'candidate/graphite-webgraph/src/jmh/kotlin/io/johnsonlee/graphite/webgraph/BenchmarkCorpus.kt', 'candidate/graphite-webgraph/src/jmh/kotlin/io/johnsonlee/graphite/webgraph/AllFixtureBenchmarkGraphPreparation.kt') }}

    - name: Verify restored real graphs
      run: |
        test -f fixture-graphs/.complete
        for CORPUS in android tika hive kotlin-compiler; do
          test -f "fixture-graphs/${CORPUS}/graph.metadata"
          test -f "fixture-graphs/${CORPUS}/graph.nodedata"
        done

    - name: Benchmark and normalize Cypher capacity
      run: |
        mkdir -p benchmark-results
        BASE_JAR=$(find jmh-jars/base -name '*-jmh.jar' -print -quit)
        CANDIDATE_JAR=$(find jmh-jars/candidate -name '*-jmh.jar' -print -quit)
        test -n "${BASE_JAR}" && test -n "${CANDIDATE_JAR}"
        GRAPH_ARGS="-Dandroid.graph.path=${PWD}/fixture-graphs/android \
          -Dtika.graph.path=${PWD}/fixture-graphs/tika \
          -Dhive.graph.path=${PWD}/fixture-graphs/hive \
          -Dkotlin.compiler.graph.path=${PWD}/fixture-graphs/kotlin-compiler"
        CAPACITY_FORKS=3
        CAPACITY_ARGS=(-wi 0 -i 1 -f "${CAPACITY_FORKS}" -t 1 -foe true -rf json)
        java -jar "${BASE_JAR}" \
          'io.johnsonlee.graphite.cli.CypherCapacityBenchmark.fourWorstCaseQueriesRejectCancelAndRecover' \
          "${CAPACITY_ARGS[@]}" -jvmArgsAppend "${GRAPH_ARGS}" \
          -rff "${PWD}/benchmark-results/base-cypher-capacity.json"
        java -jar "${CANDIDATE_JAR}" \
          'io.johnsonlee.graphite.cli.CypherCapacityBenchmark.fourWorstCaseQueriesRejectCancelAndRecover' \
          "${CAPACITY_ARGS[@]}" -jvmArgsAppend "${GRAPH_ARGS}" \
          -rff "${PWD}/benchmark-results/candidate-cypher-capacity.json"
        # JMH sums EVENTS auxiliary counters across forks. Normalize every
        # secondary metric to one invocation before asserting the envelope.
        for FILE in \
          benchmark-results/base-cypher-capacity.json \
          benchmark-results/candidate-cypher-capacity.json; do
          jq --argjson forks "${CAPACITY_FORKS}" \
            'map(.secondaryMetrics |= with_entries(.value.score /= $forks))' \
            "${FILE}" > "${FILE}.normalized"
          mv "${FILE}.normalized" "${FILE}"
        done

    - name: Gate Cypher capacity
      run: |
        EXPECTED='io.johnsonlee.graphite.cli.CypherCapacityBenchmark.fourWorstCaseQueriesRejectCancelAndRecover'
        for FILE in \
          benchmark-results/base-cypher-capacity.json \
          benchmark-results/candidate-cypher-capacity.json; do
          jq -e --arg expected "${EXPECTED}" '
            length == 1 and
            .[0].benchmark == $expected and
            .[0].mode == "ss" and
            .[0].primaryMetric.score > 0 and
            .[0].secondaryMetrics.activePeak.score == 4 and
            .[0].secondaryMetrics.concurrencyRejected.score >= 1 and
            .[0].secondaryMetrics.budgetExceeded.score == 3 and
            .[0].secondaryMetrics.cancelled.score == 1 and
            .[0].secondaryMetrics.recoverySucceeded.score == 1 and
            .[0].secondaryMetrics.targetConcurrency.score == 4 and
            .[0].secondaryMetrics.targetWorkBudget.score == 1000000 and
            .[0].secondaryMetrics.processCpuNanos.score > 0 and
            .[0].secondaryMetrics.residentSetBeforeBytes.score > 0 and
            .[0].secondaryMetrics.residentSetAfterBytes.score > 0 and
            .[0].secondaryMetrics.residentSetDeltaBytes.score >= 0 and
            .[0].secondaryMetrics.tailLatencyNanos.score > 0 and
            .[0].secondaryMetrics.cancellationLatencyNanos.score > 0 and
            .[0].secondaryMetrics.cancellationLatencyNanos.score < 2000000000 and
            .[0].secondaryMetrics.concurrentWallNanos.score > 0' \
            "${FILE}" >/dev/null
        done
        jq -n -e \
          --slurpfile base benchmark-results/base-cypher-capacity.json \
          --slurpfile candidate benchmark-results/candidate-cypher-capacity.json '
            ($base[0][0]) as $base_result |
            ($candidate[0][0]) as $candidate_result |
            all(["processCpuNanos", "residentSetAfterBytes", "tailLatencyNanos"][];
              . as $metric |
              ($base_result.secondaryMetrics[$metric].score > 0) and
              ($candidate_result.secondaryMetrics[$metric].score > 0) and
              ($candidate_result.secondaryMetrics[$metric].score <=
                ($base_result.secondaryMetrics[$metric].score * 1.15))
            )' >/dev/null
        node base/.github/scripts/benchmark-gate.mjs compare-jmh \
          --base benchmark-results/base-cypher-capacity.json \
          --candidate benchmark-results/candidate-cypher-capacity.json \
          --threshold 15 \
          --threshold-only \
          --title 'Cypher concurrency and work-budget capacity' \
          --report benchmark-results/cypher-capacity-report.md \
          --status benchmark-results/cypher-capacity-status.json

    - name: Upload Cypher capacity results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-cypher-capacity-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
        path: benchmark-results/
        if-no-files-found: error
        retention-days: 14

  budgeted-collection:
    name: budgeted-collection-latency
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout PR base gate
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: gate
        persist-credentials: false

    - name: Checkout cancellable collection baseline
      uses: actions/checkout@v7
      with:
        ref: ${{ env.BUDGETED_COLLECTION_BASELINE_SHA }}
        path: baseline
        persist-credentials: false

    - name: Checkout PR
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: candidate
        persist-credentials: false

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: true

    - name: Install base-owned budgeted collection harness
      run: |
        HARNESS='graphite-cypher/src/jmh/kotlin/io/johnsonlee/graphite/cypher/BudgetedCypherBenchmark.kt'
        for REVISION in baseline candidate; do
          test ! -L "${REVISION}/${HARNESS}"
          rm -f -- "${REVISION}/${HARNESS}"
          install -m 0644 "gate/${HARNESS}" "${REVISION}/${HARNESS}"
          cmp "gate/${HARNESS}" "${REVISION}/${HARNESS}"
        done

    - name: Build budgeted collection JMH jars
      run: |
        CONTROL_DIR=gate
        INIT='.github/scripts/benchmark-jmh-isolation.init.gradle'
        VERIFIER='.github/scripts/verify-jmh-jar-isolation.sh'
        if [[ ! -f "${CONTROL_DIR}/${INIT}" || ! -f "${CONTROL_DIR}/${VERIFIER}" ]]; then
          CONTROL_DIR=candidate
          test "$(sha256sum "${CONTROL_DIR}/${INIT}" | cut -d' ' -f1)" = \
            "${JMH_ISOLATION_INIT_SHA256}"
          test "$(sha256sum "${CONTROL_DIR}/${VERIFIER}" | cut -d' ' -f1)" = \
            "${JMH_ISOLATION_VERIFIER_SHA256}"
        fi
        for REVISION in baseline candidate; do
          "${REVISION}/gradlew" -p "${REVISION}" -I "${PWD}/${CONTROL_DIR}/${INIT}" \
            :cypher:testClasses :cypher:jmhJar --no-daemon
          JAR=$(find "${REVISION}/graphite-cypher/build/libs" -name '*-jmh.jar' -print -quit)
          test -n "${JAR}"
          bash "${CONTROL_DIR}/${VERIFIER}" "${REVISION}/graphite-cypher" "${JAR}"
        done

    - name: Benchmark baseline then PR
      run: |
        mkdir -p benchmark-results
        BASELINE_JAR=$(find baseline/graphite-cypher/build/libs -name '*-jmh.jar' -print -quit)
        CANDIDATE_JAR=$(find candidate/graphite-cypher/build/libs -name '*-jmh.jar' -print -quit)
        test -n "${BASELINE_JAR}" && test -n "${CANDIDATE_JAR}"
        java -jar "${BASELINE_JAR}" \
          'io.johnsonlee.graphite.cypher.BudgetedCypherBenchmark.budgeted(ListConcatenation|ListMembership)' \
          -foe true -rf json -rff "${PWD}/benchmark-results/baseline-budgeted-collection.json"
        java -jar "${CANDIDATE_JAR}" \
          'io.johnsonlee.graphite.cypher.BudgetedCypherBenchmark.budgeted(ListConcatenation|ListMembership)' \
          -foe true -rf json -rff "${PWD}/benchmark-results/candidate-budgeted-collection.json"

    - name: Compare budgeted collection latency
      run: |
        if node gate/.github/scripts/benchmark-gate.mjs compare-jmh \
          --base benchmark-results/baseline-budgeted-collection.json \
          --candidate benchmark-results/candidate-budgeted-collection.json \
          --threshold 15 \
          --title 'Budgeted collection latency' \
          --report benchmark-results/initial-budgeted-collection-report.md \
          --status benchmark-results/initial-budgeted-collection-status.json; then
          mv benchmark-results/initial-budgeted-collection-report.md \
            benchmark-results/budgeted-collection-report.md
          mv benchmark-results/initial-budgeted-collection-status.json \
            benchmark-results/budgeted-collection-status.json
        else
          BASELINE_JAR=$(find baseline/graphite-cypher/build/libs -name '*-jmh.jar' -print -quit)
          CANDIDATE_JAR=$(find candidate/graphite-cypher/build/libs -name '*-jmh.jar' -print -quit)
          java -jar "${CANDIDATE_JAR}" \
            'io.johnsonlee.graphite.cypher.BudgetedCypherBenchmark.budgeted(ListConcatenation|ListMembership)' \
            -foe true -rf json \
            -rff "${PWD}/benchmark-results/candidate-budgeted-collection-confirmation.json"
          java -jar "${BASELINE_JAR}" \
            'io.johnsonlee.graphite.cypher.BudgetedCypherBenchmark.budgeted(ListConcatenation|ListMembership)' \
            -foe true -rf json \
            -rff "${PWD}/benchmark-results/baseline-budgeted-collection-confirmation.json"
          node gate/.github/scripts/benchmark-gate.mjs confirm-jmh \
            --initial benchmark-results/initial-budgeted-collection-status.json \
            --base benchmark-results/baseline-budgeted-collection-confirmation.json \
            --candidate benchmark-results/candidate-budgeted-collection-confirmation.json \
            --threshold 15 \
            --title 'Budgeted collection latency' \
            --report benchmark-results/budgeted-collection-report.md \
            --status benchmark-results/budgeted-collection-status.json
        fi

    - name: Upload budgeted collection results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-budgeted-collection-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
        path: benchmark-results/
        if-no-files-found: warn
        retention-days: 14

  budgeted-mapped-string:
    name: budgeted-mapped-string-latency
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout PR base gate
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: gate
        persist-credentials: false

    - name: Checkout budgeted lookup baseline
      uses: actions/checkout@v7
      with:
        ref: ${{ env.BUDGETED_LOOKUP_BASELINE_SHA }}
        path: baseline
        persist-credentials: false

    - name: Checkout PR
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: candidate
        persist-credentials: false

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: true

    - name: Install base-owned budgeted lookup harness
      run: |
        HARNESS='graphite-webgraph/src/jmh/kotlin/io/johnsonlee/graphite/webgraph/MappedStringAdmissionBenchmark.kt'
        for REVISION in baseline candidate; do
          test ! -L "${REVISION}/${HARNESS}"
          rm -f -- "${REVISION}/${HARNESS}"
          install -m 0644 "gate/${HARNESS}" "${REVISION}/${HARNESS}"
          cmp "gate/${HARNESS}" "${REVISION}/${HARNESS}"
        done

    - name: Build budgeted lookup JMH jars
      run: |
        CONTROL_DIR=gate
        INIT='.github/scripts/benchmark-jmh-isolation.init.gradle'
        VERIFIER='.github/scripts/verify-jmh-jar-isolation.sh'
        if [[ ! -f "${CONTROL_DIR}/${INIT}" || ! -f "${CONTROL_DIR}/${VERIFIER}" ]]; then
          CONTROL_DIR=candidate
          test "$(sha256sum "${CONTROL_DIR}/${INIT}" | cut -d' ' -f1)" = \
            "${JMH_ISOLATION_INIT_SHA256}"
          test "$(sha256sum "${CONTROL_DIR}/${VERIFIER}" | cut -d' ' -f1)" = \
            "${JMH_ISOLATION_VERIFIER_SHA256}"
        fi
        for REVISION in baseline candidate; do
          "${REVISION}/gradlew" -p "${REVISION}" \
            -I "${PWD}/${CONTROL_DIR}/${INIT}" \
            :webgraph:testClasses :webgraph:jmhJar --no-daemon
          JAR=$(find "${REVISION}/graphite-webgraph/build/libs" -name '*-jmh.jar' -print -quit)
          test -n "${JAR}"
          bash "${CONTROL_DIR}/${VERIFIER}" "${REVISION}/graphite-webgraph" "${JAR}"
        done

    - name: Benchmark baseline then PR
      run: |
        mkdir -p benchmark-results
        BASELINE_JAR=$(find baseline/graphite-webgraph/build/libs -name '*-jmh.jar' -print -quit)
        CANDIDATE_JAR=$(find candidate/graphite-webgraph/build/libs -name '*-jmh.jar' -print -quit)
        test -n "${BASELINE_JAR}" && test -n "${CANDIDATE_JAR}"
        java -jar "${BASELINE_JAR}" \
          'io.johnsonlee.graphite.webgraph.MappedStringAdmissionBenchmark.budgetedTransformedZeroHit' \
          -foe true -rf json -rff "${PWD}/benchmark-results/baseline-budgeted-string.json"
        java -jar "${CANDIDATE_JAR}" \
          'io.johnsonlee.graphite.webgraph.MappedStringAdmissionBenchmark.budgetedTransformedZeroHit' \
          -foe true -rf json -rff "${PWD}/benchmark-results/candidate-budgeted-string.json"

    - name: Compare budgeted lookup latency
      run: |
        if node gate/.github/scripts/benchmark-gate.mjs compare-jmh \
          --base benchmark-results/baseline-budgeted-string.json \
          --candidate benchmark-results/candidate-budgeted-string.json \
          --threshold 15 \
          --threshold-only \
          --title 'Budgeted mapped-string latency' \
          --report benchmark-results/initial-budgeted-string-report.md \
          --status benchmark-results/initial-budgeted-string-status.json; then
          mv benchmark-results/initial-budgeted-string-report.md benchmark-results/budgeted-string-report.md
          mv benchmark-results/initial-budgeted-string-status.json benchmark-results/budgeted-string-status.json
        else
          BASELINE_JAR=$(find baseline/graphite-webgraph/build/libs -name '*-jmh.jar' -print -quit)
          CANDIDATE_JAR=$(find candidate/graphite-webgraph/build/libs -name '*-jmh.jar' -print -quit)
          java -jar "${CANDIDATE_JAR}" \
            'io.johnsonlee.graphite.webgraph.MappedStringAdmissionBenchmark.budgetedTransformedZeroHit' \
            -foe true -rf json -rff "${PWD}/benchmark-results/candidate-budgeted-string-confirmation.json"
          java -jar "${BASELINE_JAR}" \
            'io.johnsonlee.graphite.webgraph.MappedStringAdmissionBenchmark.budgetedTransformedZeroHit' \
            -foe true -rf json -rff "${PWD}/benchmark-results/baseline-budgeted-string-confirmation.json"
          node gate/.github/scripts/benchmark-gate.mjs confirm-jmh \
            --initial benchmark-results/initial-budgeted-string-status.json \
            --base benchmark-results/baseline-budgeted-string-confirmation.json \
            --candidate benchmark-results/candidate-budgeted-string-confirmation.json \
            --threshold 15 \
            --threshold-only \
            --title 'Budgeted mapped-string latency' \
            --report benchmark-results/budgeted-string-report.md \
            --status benchmark-results/budgeted-string-status.json
        fi

    - name: Upload budgeted lookup results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-budgeted-string-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
        path: benchmark-results/
        if-no-files-found: warn
        retention-days: 14

  large-corpus:
    name: large-corpus-benchmarks
    needs: [candidate-gate-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout base
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: base
        persist-credentials: false

    - name: Checkout PR
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: candidate
        persist-credentials: false

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: true

    - name: Select trusted large-corpus controls
      id: large-corpus-controls
      env:
        CANDIDATE_GATE_TEST_JOB: ${{ needs.candidate-gate-tests.result }}
      run: |
        set -euo pipefail
        HARNESS='graphite-webgraph/src/test/kotlin/io/johnsonlee/graphite/webgraph/LargeCorpusPerformanceGateTest.kt'
        COMPARATOR='.github/scripts/benchmark-gate.mjs'
        if grep -Fq 'mappedLoadSamples=' "base/${HARNESS}" && \
          grep -Fq 'productionIndexPrepared=' "base/${HARNESS}" && \
          grep -Fq 'LARGE_CORPUS_MAPPED_LOAD_SAMPLES = 5' "base/${COMPARATOR}"; then
          test ! -L "candidate/${HARNESS}"
          rm -f -- "candidate/${HARNESS}"
          install -m 0644 "base/${HARNESS}" "candidate/${HARNESS}"
          cmp "base/${HARNESS}" "candidate/${HARNESS}"
          echo "comparator=base/${COMPARATOR}" >> "${GITHUB_OUTPUT}"
          echo "mode=base-owned" >> "${GITHUB_OUTPUT}"
        else
          test "${CANDIDATE_GATE_TEST_JOB}" = success
          test "$(sha256sum "base/${HARNESS}" | cut -d' ' -f1)" = \
            "${LARGE_CORPUS_LEGACY_HARNESS_SHA256}"
          test "$(sha256sum "candidate/${HARNESS}" | cut -d' ' -f1)" = \
            "${LARGE_CORPUS_TRANSITION_HARNESS_SHA256}"
          test "$(sha256sum "candidate/${COMPARATOR}" | cut -d' ' -f1)" = \
            "${LARGE_CORPUS_TRANSITION_COMPARATOR_SHA256}"
          mkdir -p trusted-large-corpus
          install -m 0644 "candidate/${HARNESS}" trusted-large-corpus/harness.kt
          for CHECKOUT in base candidate; do
            test ! -L "${CHECKOUT}/${HARNESS}"
            rm -f -- "${CHECKOUT}/${HARNESS}"
            install -m 0644 trusted-large-corpus/harness.kt "${CHECKOUT}/${HARNESS}"
            cmp trusted-large-corpus/harness.kt "${CHECKOUT}/${HARNESS}"
          done
          echo "comparator=candidate/${COMPARATOR}" >> "${GITHUB_OUTPUT}"
          echo "mode=pinned-transition" >> "${GITHUB_OUTPUT}"
        fi

    - name: Benchmark PR large corpora
      run: |
        set -o pipefail
        mkdir -p benchmark-results
        candidate/gradlew -p candidate :webgraph:largeCorpusTest \
          -Dlarge.corpus.record=true --no-daemon 2>&1 \
          | tee benchmark-results/candidate-large-corpus.log

    - name: Benchmark base large corpora
      run: |
        set -o pipefail
        base/gradlew -p base :webgraph:largeCorpusTest \
          -Dlarge.corpus.record=true --no-daemon 2>&1 \
          | tee benchmark-results/base-large-corpus.log

    - name: Compare large-corpus results
      run: |
        if node "${{ steps.large-corpus-controls.outputs.comparator }}" compare-large-corpus \
          --base benchmark-results/base-large-corpus.log \
          --candidate benchmark-results/candidate-large-corpus.log \
          --report benchmark-results/initial-large-corpus-report.md \
          --status benchmark-results/initial-large-corpus-status.json; then
          mv benchmark-results/initial-large-corpus-report.md benchmark-results/large-corpus-report.md
          mv benchmark-results/initial-large-corpus-status.json benchmark-results/large-corpus-status.json
        else
          set -o pipefail
          base/gradlew -p base :webgraph:largeCorpusTest \
            -Dlarge.corpus.record=true --no-daemon 2>&1 \
            | tee benchmark-results/base-large-corpus-confirmation.log
          candidate/gradlew -p candidate :webgraph:largeCorpusTest \
            -Dlarge.corpus.record=true --no-daemon 2>&1 \
            | tee benchmark-results/candidate-large-corpus-confirmation.log
          node "${{ steps.large-corpus-controls.outputs.comparator }}" confirm-large-corpus \
            --initial benchmark-results/initial-large-corpus-status.json \
            --base benchmark-results/base-large-corpus-confirmation.log \
            --candidate benchmark-results/candidate-large-corpus-confirmation.log \
            --report benchmark-results/large-corpus-report.md \
            --status benchmark-results/large-corpus-status.json
        fi

    - name: Upload large-corpus results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-large-corpus-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
        path: benchmark-results/
        if-no-files-found: warn
        retention-days: 14

  prepare-latency-fixtures:
    name: prepare-latency-fixtures
    needs: [build-wrapped-query-jmh]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout PR
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: candidate
        persist-credentials: false

    - name: Restore or save persisted fixture graphs
      id: fixture-cache
      uses: actions/cache@v5
      with:
        path: fixture-graphs
        key: ${{ runner.os }}-${{ runner.arch }}-wrapped-query-fixtures-v2-${{ hashFiles('candidate/gradle/libs.versions.toml', 'candidate/gradle/wrapper/gradle-wrapper.properties', 'candidate/settings.gradle.kts', 'candidate/**/build.gradle.kts', 'candidate/graphite-core/src/main/**', 'candidate/graphite-sootup/src/main/**', 'candidate/graphite-webgraph/src/main/**', 'candidate/graphite-webgraph/src/jmh/kotlin/io/johnsonlee/graphite/webgraph/BenchmarkCorpus.kt', 'candidate/graphite-webgraph/src/jmh/kotlin/io/johnsonlee/graphite/webgraph/AllFixtureBenchmarkGraphPreparation.kt') }}

    - name: Detect complete persisted fixture cache
      id: fixture-cache-state
      run: |
        READY=true
        test -f fixture-graphs/.complete || READY=false
        for CORPUS in android tika hive kotlin-compiler; do
          test -d "fixture-graphs/${CORPUS}" || READY=false
        done
        echo "ready=${READY}" >> "${GITHUB_OUTPUT}"

    - name: Setup Java
      if: steps.fixture-cache-state.outputs.ready != 'true'
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Setup Gradle
      if: steps.fixture-cache-state.outputs.ready != 'true'
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: true

    - name: Download candidate wrapped-query JMH JAR
      if: steps.fixture-cache-state.outputs.ready != 'true'
      uses: actions/download-artifact@v8
      with:
        name: jmh-wrapped-query-candidate-${{ github.event.pull_request.number }}
        path: jmh-jars/candidate

    - name: Resolve fixture source JARs
      if: steps.fixture-cache-state.outputs.ready != 'true'
      run: candidate/gradlew -p candidate :webgraph:prepareBenchmarkFixtures --no-daemon

    - name: Prepare all real fixture graphs
      if: steps.fixture-cache-state.outputs.ready != 'true'
      run: |
        FIXTURE_DIR="${PWD}/candidate/graphite-webgraph/build/benchmark-fixtures"
        ANDROID_JAR=$(find "${FIXTURE_DIR}" -name 'android-all-*.jar' -print -quit)
        TIKA_JAR=$(find "${FIXTURE_DIR}" -name 'tika-app-*.jar' -print -quit)
        HIVE_JAR=$(find "${FIXTURE_DIR}" -name 'hive-exec-*.jar' -print -quit)
        KOTLIN_JAR=$(find "${FIXTURE_DIR}" -name 'kotlin-compiler-embeddable-*.jar' -print -quit)
        (cd jmh-jars/candidate && sha256sum -c candidate-webgraph-jmh.jar.sha256)
        CANDIDATE_JAR=${PWD}/jmh-jars/candidate/candidate-webgraph-jmh.jar
        test -n "${ANDROID_JAR}" && test -n "${TIKA_JAR}" && test -n "${HIVE_JAR}" && \
          test -n "${KOTLIN_JAR}" && test -f "${CANDIDATE_JAR}"
        mkdir -p "${PWD}/fixture-graphs"
        for CORPUS in android tika hive kotlin-compiler; do
          SOURCE_TMP=$(mktemp -d "${RUNNER_TEMP}/graphite-source-${CORPUS}-XXXXXX")
          java -Xmx4g -Djava.io.tmpdir="${SOURCE_TMP}" \
            -Dandroid.jar.path="${ANDROID_JAR}" \
            -Dtika.jar.path="${TIKA_JAR}" \
            -Dhive.jar.path="${HIVE_JAR}" \
            -Dkotlin.compiler.jar.path="${KOTLIN_JAR}" \
            -cp "${CANDIDATE_JAR}" \
            io.johnsonlee.graphite.webgraph.AllFixtureBenchmarkGraphPreparation \
            "${CORPUS}" "${PWD}/fixture-graphs/${CORPUS}"
          rm -rf -- "${SOURCE_TMP}"
        done
        java -Xmx4g -cp "${CANDIDATE_JAR}" \
          io.johnsonlee.graphite.webgraph.AllFixtureBenchmarkDistributionCalibration \
          "${PWD}/fixture-graphs"
        touch "${PWD}/fixture-graphs/.complete"

    - name: Verify persisted fixture graph cache
      run: |
        test -f fixture-graphs/.complete
        for CORPUS in android tika hive kotlin-compiler; do
          test -d "fixture-graphs/${CORPUS}"
        done

  wrapped-query-latency-shard:
    name: wrapped-query-latency-shard-${{ matrix.shard }}
    needs: [candidate-gate-tests, prepare-latency-fixtures, build-wrapped-query-jmh]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
        - shard: real-a
          real: true
          correctness: true
          parameters: ''
          filter: 'io.johnsonlee.graphite.webgraph.AllFixtureWrappedDiscoveryLatencyBenchmark.(zeroHitBroadContainsCaseInsensitiveDiscovery|denseDistributedMethodContainsCaseInsensitiveDiscovery)'
        - shard: real-b
          real: true
          correctness: false
          parameters: ''
          filter: 'io.johnsonlee.graphite.webgraph.AllFixtureWrappedDiscoveryLatencyBenchmark.(earlyGraphClassPrefixCaseInsensitiveDiscovery|middleGraphsClassPrefixCaseInsensitiveDiscovery)'
        - shard: real-c
          real: true
          correctness: false
          parameters: ''
          filter: 'io.johnsonlee.graphite.webgraph.AllFixtureWrappedDiscoveryLatencyBenchmark.(lateGraphClassPrefixCaseInsensitiveDiscovery|broadlyDistributedClassPrefixCaseInsensitiveDiscovery)'
        - shard: real-d
          real: true
          correctness: false
          parameters: ''
          filter: 'io.johnsonlee.graphite.webgraph.AllFixtureWrappedDiscoveryLatencyBenchmark.(firstLastGraphBimodalClassPrefixCaseInsensitiveDiscovery|skewedMixedClassMethodOperatorCaseInsensitiveDiscovery)'
        - shard: real-36
          real: true
          correctness: false
          parameters: ''
          filter: 'io.johnsonlee.graphite.webgraph.RealThirtySixGraphWrappedDiscoveryLatencyBenchmark.zeroHitBroadContainsAcrossThirtySixRealGraphs'

    steps:
    - name: Checkout PR base
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: base
        persist-credentials: false

    - name: Checkout PR
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: candidate
        persist-credentials: false

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Download known-good wrapped-query JMH JAR
      uses: actions/download-artifact@v8
      with:
        name: jmh-wrapped-query-reference-${{ github.event.pull_request.number }}
        path: jmh-jars/reference

    - name: Download base wrapped-query JMH JAR
      uses: actions/download-artifact@v8
      with:
        name: jmh-wrapped-query-base-${{ github.event.pull_request.number }}
        path: jmh-jars/base

    - name: Download candidate wrapped-query JMH JAR
      uses: actions/download-artifact@v8
      with:
        name: jmh-wrapped-query-candidate-${{ github.event.pull_request.number }}
        path: jmh-jars/candidate

    - name: Verify wrapped-query JMH artifacts
      run: |
        for REVISION in reference base candidate; do
          test -f "jmh-jars/${REVISION}/${REVISION}-webgraph-jmh.jar"
          test -f "jmh-jars/${REVISION}/${REVISION}-webgraph-jmh.jar.sha256"
          (cd "jmh-jars/${REVISION}" && sha256sum -c "${REVISION}-webgraph-jmh.jar.sha256")
          jar tf "jmh-jars/${REVISION}/${REVISION}-webgraph-jmh.jar" >/dev/null
        done

    - name: Restore persisted fixture graphs
      if: matrix.real
      uses: actions/cache/restore@v5
      with:
        path: fixture-graphs
        key: ${{ runner.os }}-${{ runner.arch }}-wrapped-query-fixtures-v2-${{ hashFiles('candidate/gradle/libs.versions.toml', 'candidate/gradle/wrapper/gradle-wrapper.properties', 'candidate/settings.gradle.kts', 'candidate/**/build.gradle.kts', 'candidate/graphite-core/src/main/**', 'candidate/graphite-sootup/src/main/**', 'candidate/graphite-webgraph/src/main/**', 'candidate/graphite-webgraph/src/jmh/kotlin/io/johnsonlee/graphite/webgraph/BenchmarkCorpus.kt', 'candidate/graphite-webgraph/src/jmh/kotlin/io/johnsonlee/graphite/webgraph/AllFixtureBenchmarkGraphPreparation.kt') }}

    - name: Verify restored fixture graphs
      if: matrix.real
      run: |
        test -f fixture-graphs/.complete
        for CORPUS in android tika hive kotlin-compiler; do
          test -d "fixture-graphs/${CORPUS}"
        done

    - name: Verify all real-fixture query results
      if: matrix.correctness
      run: |
        set -o pipefail
        mkdir -p benchmark-results
        for REVISION in reference base candidate; do
          JMH_JAR=$(find "jmh-jars/${REVISION}" -name '*-jmh.jar' -print -quit)
          test -n "${JMH_JAR}"
          java -Xmx8g -cp "${JMH_JAR}" \
            io.johnsonlee.graphite.webgraph.AllFixtureBenchmarkQueryCorrectness \
            "${PWD}/fixture-graphs" \
            | tee "benchmark-results/${REVISION}-fixture-correctness.log"
          grep '^ALL_FIXTURE_QUERY_RESULT' \
            "benchmark-results/${REVISION}-fixture-correctness.log" \
            > "benchmark-results/${REVISION}-fixture-correctness.txt"
          test "$(wc -l < "benchmark-results/${REVISION}-fixture-correctness.txt")" -eq 9
        done
        cmp benchmark-results/reference-fixture-correctness.txt \
          benchmark-results/base-fixture-correctness.txt
        cmp benchmark-results/reference-fixture-correctness.txt \
          benchmark-results/candidate-fixture-correctness.txt

    - name: Benchmark known-good reference, PR base, and PR
      env:
        BENCHMARK_FILTER: ${{ matrix.filter }}
        BENCHMARK_PARAMETERS: ${{ matrix.parameters }}
        CANDIDATE_GATE_TEST_JOB: ${{ needs.candidate-gate-tests.result }}
        SHARD: ${{ matrix.shard }}
      run: |
        mkdir -p benchmark-results
        REFERENCE_JAR=$(find jmh-jars/reference -name '*-jmh.jar' -print -quit)
        BASE_JAR=$(find jmh-jars/base -name '*-jmh.jar' -print -quit)
        CANDIDATE_JAR=$(find jmh-jars/candidate -name '*-jmh.jar' -print -quit)
        test -n "${REFERENCE_JAR}" && test -n "${BASE_JAR}" && test -n "${CANDIDATE_JAR}"
        GRAPH_JVM_ARGS="-Dandroid.graph.path=${PWD}/fixture-graphs/android \
          -Dtika.graph.path=${PWD}/fixture-graphs/tika \
          -Dhive.graph.path=${PWD}/fixture-graphs/hive \
          -Dkotlin.compiler.graph.path=${PWD}/fixture-graphs/kotlin-compiler"
        PARAM_ARGS=()
        if [ -n "${BENCHMARK_PARAMETERS}" ]; then
          read -r -a PARAM_ARGS <<< "${BENCHMARK_PARAMETERS}"
        fi
        java -jar "${REFERENCE_JAR}" \
          "${BENCHMARK_FILTER}" "${PARAM_ARGS[@]}" \
          -jvmArgsAppend "${GRAPH_JVM_ARGS}" -foe true -prof gc -rf json \
          -rff "${PWD}/benchmark-results/reference-latency-${SHARD}.json"
        java -jar "${BASE_JAR}" \
          "${BENCHMARK_FILTER}" "${PARAM_ARGS[@]}" \
          -jvmArgsAppend "${GRAPH_JVM_ARGS}" -foe true -prof gc -rf json \
          -rff "${PWD}/benchmark-results/base-latency-${SHARD}.json"
        java -jar "${CANDIDATE_JAR}" \
          "${BENCHMARK_FILTER}" "${PARAM_ARGS[@]}" \
          -jvmArgsAppend "${GRAPH_JVM_ARGS}" -foe true -prof gc -rf json \
          -rff "${PWD}/benchmark-results/candidate-latency-${SHARD}.json"

    - name: Enforce known-good anchor and current-base regression gate
      env:
        BENCHMARK_FILTER: ${{ matrix.filter }}
        BENCHMARK_PARAMETERS: ${{ matrix.parameters }}
        CANDIDATE_GATE_TEST_JOB: ${{ needs.candidate-gate-tests.result }}
        SHARD: ${{ matrix.shard }}
      run: |
        COMPARATOR=base/.github/scripts/benchmark-gate.mjs
        POINT_ESTIMATE_POLICY='const baseComparison = compareJmh(baseResults, candidateResults, regressionThreshold, true);'
        if ! grep -Fq "${POINT_ESTIMATE_POLICY}" "${COMPARATOR}"; then
          # Transition only: the base comparator has the anchor command but still lets
          # confidence overlap suppress a point-estimate regression. Use the reviewed,
          # hash-pinned candidate policy only after its contract tests pass.
          test "${CANDIDATE_GATE_TEST_JOB}" = success
          test "$(sha256sum candidate/.github/scripts/benchmark-gate.mjs | cut -d ' ' -f 1)" = \
            "${LATENCY_POINT_ESTIMATE_COMPARATOR_SHA256}"
          COMPARATOR=candidate/.github/scripts/benchmark-gate.mjs
          grep -Fq "${POINT_ESTIMATE_POLICY}" "${COMPARATOR}"
          grep -Fq \
            'const anchorComparison = compareJmh(anchorResults, candidateResults, anchorThreshold, true);' \
            "${COMPARATOR}"
        fi
        if node "${COMPARATOR}" compare-latency-anchor \
          --anchor "benchmark-results/reference-latency-${SHARD}.json" \
          --base "benchmark-results/base-latency-${SHARD}.json" \
          --candidate "benchmark-results/candidate-latency-${SHARD}.json" \
          --anchor-threshold 50 \
          --threshold 15 \
          --allow-subset \
          --report "benchmark-results/initial-latency-report-${SHARD}.md" \
          --status "benchmark-results/initial-latency-status-${SHARD}.json"; then
          mv "benchmark-results/initial-latency-report-${SHARD}.md" "benchmark-results/latency-report-${SHARD}.md"
          mv "benchmark-results/initial-latency-status-${SHARD}.json" "benchmark-results/latency-status-${SHARD}.json"
        else
          CANDIDATE_JAR=$(find jmh-jars/candidate -name '*-jmh.jar' -print -quit)
          BASE_JAR=$(find jmh-jars/base -name '*-jmh.jar' -print -quit)
          REFERENCE_JAR=$(find jmh-jars/reference -name '*-jmh.jar' -print -quit)
          GRAPH_JVM_ARGS="-Dandroid.graph.path=${PWD}/fixture-graphs/android \
            -Dtika.graph.path=${PWD}/fixture-graphs/tika \
            -Dhive.graph.path=${PWD}/fixture-graphs/hive \
            -Dkotlin.compiler.graph.path=${PWD}/fixture-graphs/kotlin-compiler"
          PARAM_ARGS=()
          if [ -n "${BENCHMARK_PARAMETERS}" ]; then
            read -r -a PARAM_ARGS <<< "${BENCHMARK_PARAMETERS}"
          fi
          java -jar "${CANDIDATE_JAR}" \
            "${BENCHMARK_FILTER}" "${PARAM_ARGS[@]}" \
            -jvmArgsAppend "${GRAPH_JVM_ARGS}" -foe true -prof gc -rf json \
            -rff "${PWD}/benchmark-results/candidate-latency-confirmation-${SHARD}.json"
          java -jar "${BASE_JAR}" \
            "${BENCHMARK_FILTER}" "${PARAM_ARGS[@]}" \
            -jvmArgsAppend "${GRAPH_JVM_ARGS}" -foe true -prof gc -rf json \
            -rff "${PWD}/benchmark-results/base-latency-confirmation-${SHARD}.json"
          java -jar "${REFERENCE_JAR}" \
            "${BENCHMARK_FILTER}" "${PARAM_ARGS[@]}" \
            -jvmArgsAppend "${GRAPH_JVM_ARGS}" -foe true -prof gc -rf json \
            -rff "${PWD}/benchmark-results/reference-latency-confirmation-${SHARD}.json"
          node "${COMPARATOR}" confirm-latency-anchor \
            --initial "benchmark-results/initial-latency-status-${SHARD}.json" \
            --anchor "benchmark-results/reference-latency-confirmation-${SHARD}.json" \
            --base "benchmark-results/base-latency-confirmation-${SHARD}.json" \
            --candidate "benchmark-results/candidate-latency-confirmation-${SHARD}.json" \
            --anchor-threshold 50 \
            --threshold 15 \
            --allow-subset \
            --report "benchmark-results/latency-report-${SHARD}.md" \
            --status "benchmark-results/latency-status-${SHARD}.json"
        fi

    - name: Upload wrapped-query latency results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: latency-shard-${{ matrix.shard }}-${{ github.event.pull_request.number }}
        path: benchmark-results/
        if-no-files-found: warn
        overwrite: true
        retention-days: 14

  wrapped-query-latency:
    name: wrapped-query-latency
    if: always()
    needs: [candidate-gate-tests, wrapped-query-latency-shard]
    runs-on: ubuntu-latest

    steps:
    - name: Checkout base reporting code
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        persist-credentials: false

    - name: Checkout candidate reporting code for anchor rollout
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: candidate-reporting
        persist-credentials: false

    - name: Download real-a results
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: latency-shard-real-a-${{ github.event.pull_request.number }}
        path: shard-results/real-a

    - name: Download real-b results
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: latency-shard-real-b-${{ github.event.pull_request.number }}
        path: shard-results/real-b

    - name: Download real-c results
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: latency-shard-real-c-${{ github.event.pull_request.number }}
        path: shard-results/real-c

    - name: Download real-d results
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: latency-shard-real-d-${{ github.event.pull_request.number }}
        path: shard-results/real-d

    - name: Download real-36 results
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: latency-shard-real-36-${{ github.event.pull_request.number }}
        path: shard-results/real-36

    - name: Combine latency shard results
      if: always()
      env:
        CANDIDATE_GATE_TEST_JOB: ${{ needs.candidate-gate-tests.result }}
      run: |
        mkdir -p benchmark-results
        for SHARD in real-a real-b real-c real-d real-36; do
          for FILE in "latency-report-${SHARD}.md" "latency-status-${SHARD}.json"; do
            SOURCE="shard-results/${SHARD}/${FILE}"
            if [ -f "${SOURCE}" ] && [ ! -L "${SOURCE}" ]; then
              install -m 0644 "${SOURCE}" "benchmark-results/${FILE}"
            fi
          done
        done
        COMBINER=.github/scripts/benchmark-gate.mjs
        # Bootstrap only: a base predating the anchor command cannot render anchor rows,
        # and the first real-only policy revision must not require retired synthetic shards.
        # Candidate execution is allowed only after its comparator contract tests pass;
        # once this workflow is in the base, the base-owned combiner is always selected.
        if ! grep -q 'compare-latency-anchor' "${COMBINER}" || \
          grep -q '"synthetic-1"' "${COMBINER}"; then
          if grep -q '"synthetic-1"' "${COMBINER}"; then
            test "$(sha256sum candidate-reporting/.github/scripts/benchmark-gate.mjs | cut -d ' ' -f 1)" = \
              "${REAL_ONLY_LATENCY_COMPARATOR_SHA256}"
          else
            test "$(sha256sum "${COMBINER}" | cut -d ' ' -f 1)" = \
              "${ANCHOR_BOOTSTRAP_COMPARATOR_SHA256}"
          fi
          test "${CANDIDATE_GATE_TEST_JOB}" = success
          COMBINER=candidate-reporting/.github/scripts/benchmark-gate.mjs
          grep -q 'compare-latency-anchor' "${COMBINER}"
          if grep -q '"synthetic-1"' "${COMBINER}"; then exit 1; fi
        fi
        node "${COMBINER}" combine-latency-shards \
          --directory benchmark-results \
          --report benchmark-results/latency-report.md \
          --status benchmark-results/latency-status.json

    - name: Upload combined wrapped-query latency results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-latency-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
        path: benchmark-results/
        if-no-files-found: error
        retention-days: 14

    - name: Enforce latency shards
      if: always()
      env:
        SHARD_JOB: ${{ needs.wrapped-query-latency-shard.result }}
      run: |
        test "${SHARD_JOB}" = success
        node -e "const s=require('./benchmark-results/latency-status.json'); if(!s.passed) process.exit(1)"

  wrapped-query-resources:
    name: wrapped-query-resources
    needs: [candidate-gate-tests, prepare-latency-fixtures, build-wrapped-query-jmh]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout PR base
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: base
        persist-credentials: false

    - name: Checkout PR
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: candidate
        persist-credentials: false

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Download base wrapped-query JMH JAR
      uses: actions/download-artifact@v8
      with:
        name: jmh-wrapped-query-base-${{ github.event.pull_request.number }}
        path: jmh-jars/base

    - name: Download candidate wrapped-query JMH JAR
      uses: actions/download-artifact@v8
      with:
        name: jmh-wrapped-query-candidate-${{ github.event.pull_request.number }}
        path: jmh-jars/candidate

    - name: Verify wrapped-query JMH artifacts
      run: |
        for REVISION in base candidate; do
          test -f "jmh-jars/${REVISION}/${REVISION}-webgraph-jmh.jar"
          test -f "jmh-jars/${REVISION}/${REVISION}-webgraph-jmh.jar.sha256"
          (cd "jmh-jars/${REVISION}" && sha256sum -c "${REVISION}-webgraph-jmh.jar.sha256")
          jar tf "jmh-jars/${REVISION}/${REVISION}-webgraph-jmh.jar" >/dev/null
        done

    - name: Restore persisted fixture graphs
      uses: actions/cache/restore@v5
      with:
        path: fixture-graphs
        key: ${{ runner.os }}-${{ runner.arch }}-wrapped-query-fixtures-v2-${{ hashFiles('candidate/gradle/libs.versions.toml', 'candidate/gradle/wrapper/gradle-wrapper.properties', 'candidate/settings.gradle.kts', 'candidate/**/build.gradle.kts', 'candidate/graphite-core/src/main/**', 'candidate/graphite-sootup/src/main/**', 'candidate/graphite-webgraph/src/main/**', 'candidate/graphite-webgraph/src/jmh/kotlin/io/johnsonlee/graphite/webgraph/BenchmarkCorpus.kt', 'candidate/graphite-webgraph/src/jmh/kotlin/io/johnsonlee/graphite/webgraph/AllFixtureBenchmarkGraphPreparation.kt') }}

    - name: Verify restored fixture graphs
      run: |
        test -f fixture-graphs/.complete
        for CORPUS in android tika hive kotlin-compiler; do
          test -d "fixture-graphs/${CORPUS}"
        done

    - name: Benchmark PR base then PR resources
      run: |
        mkdir -p benchmark-results
        BASE_JAR=$(find jmh-jars/base -name '*-jmh.jar' -print -quit)
        CANDIDATE_JAR=$(find jmh-jars/candidate -name '*-jmh.jar' -print -quit)
        test -n "${BASE_JAR}" && test -n "${CANDIDATE_JAR}"
        FILTER='io.johnsonlee.graphite.webgraph.AllFixtureWrappedDiscoveryResourceBenchmark.allFixtureThirtySixGraphFootprint'
        GRAPH_JVM_ARGS="-Dandroid.graph.path=${PWD}/fixture-graphs/android \
          -Dtika.graph.path=${PWD}/fixture-graphs/tika \
          -Dhive.graph.path=${PWD}/fixture-graphs/hive \
          -Dkotlin.compiler.graph.path=${PWD}/fixture-graphs/kotlin-compiler"
        java -jar "${BASE_JAR}" "${FILTER}" -jvmArgsAppend "${GRAPH_JVM_ARGS}" \
          -foe true -prof gc -rf json -rff "${PWD}/benchmark-results/base-latency-resources.json"
        java -jar "${CANDIDATE_JAR}" "${FILTER}" -jvmArgsAppend "${GRAPH_JVM_ARGS}" \
          -foe true -prof gc -rf json -rff "${PWD}/benchmark-results/candidate-latency-resources.json"

    - name: Enforce resource guardrails
      env:
        CANDIDATE_GATE_TEST_JOB: ${{ needs.candidate-gate-tests.result }}
      run: |
        COMPARATOR=base/.github/scripts/benchmark-gate.mjs
        if grep -q 'SingleGraphWrappedDiscoveryResourceBenchmark' "${COMPARATOR}"; then
          test "${CANDIDATE_GATE_TEST_JOB}" = success
          test "$(sha256sum candidate/.github/scripts/benchmark-gate.mjs | cut -d ' ' -f 1)" = \
            "${REAL_ONLY_LATENCY_COMPARATOR_SHA256}"
          COMPARATOR=candidate/.github/scripts/benchmark-gate.mjs
          if grep -q 'SingleGraphWrappedDiscoveryResourceBenchmark' "${COMPARATOR}"; then exit 1; fi
        fi
        if node "${COMPARATOR}" compare-latency-resources \
          --base benchmark-results/base-latency-resources.json \
          --candidate benchmark-results/candidate-latency-resources.json \
          --report benchmark-results/initial-latency-resource-report.md \
          --status benchmark-results/initial-latency-resource-status.json; then
          mv benchmark-results/initial-latency-resource-report.md benchmark-results/latency-resource-report.md
          mv benchmark-results/initial-latency-resource-status.json benchmark-results/latency-resource-status.json
        else
          BASE_JAR=$(find jmh-jars/base -name '*-jmh.jar' -print -quit)
          CANDIDATE_JAR=$(find jmh-jars/candidate -name '*-jmh.jar' -print -quit)
          FILTER='io.johnsonlee.graphite.webgraph.AllFixtureWrappedDiscoveryResourceBenchmark.allFixtureThirtySixGraphFootprint'
          GRAPH_JVM_ARGS="-Dandroid.graph.path=${PWD}/fixture-graphs/android \
            -Dtika.graph.path=${PWD}/fixture-graphs/tika \
            -Dhive.graph.path=${PWD}/fixture-graphs/hive \
            -Dkotlin.compiler.graph.path=${PWD}/fixture-graphs/kotlin-compiler"
          java -jar "${CANDIDATE_JAR}" "${FILTER}" -jvmArgsAppend "${GRAPH_JVM_ARGS}" \
            -foe true -prof gc -rf json \
            -rff "${PWD}/benchmark-results/candidate-latency-resources-confirmation.json"
          java -jar "${BASE_JAR}" "${FILTER}" -jvmArgsAppend "${GRAPH_JVM_ARGS}" \
            -foe true -prof gc -rf json \
            -rff "${PWD}/benchmark-results/base-latency-resources-confirmation.json"
          node "${COMPARATOR}" confirm-latency-resources \
            --initial benchmark-results/initial-latency-resource-status.json \
            --base benchmark-results/base-latency-resources-confirmation.json \
            --candidate benchmark-results/candidate-latency-resources-confirmation.json \
            --report benchmark-results/latency-resource-report.md \
            --status benchmark-results/latency-resource-status.json
        fi

    - name: Upload resource results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-latency-resources-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
        path: benchmark-results/
        if-no-files-found: warn
        retention-days: 14

  graph-routing-pressure-evidence:
    name: graph-routing-pressure-evidence
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: read

    steps:
    - name: Checkout exact candidate evidence verifier
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: evidence-candidate
        persist-credentials: false

    - name: Verify trusted fixture64 graph evidence status
      uses: actions/github-script@v9
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        TRUSTED_EVIDENCE_ACTOR: johnsonlee
        EVIDENCE_CONTEXT: graphite/fixture64-graph-routing
      with:
        script: |
          const crypto = require('crypto');
          const fs = require('fs');
          const path = require('path');
          const { pathToFileURL } = require('url');
          const { materializeGistFiles } = await import(pathToFileURL(path.resolve(
            'evidence-candidate/.github/scripts/gist-evidence.mjs'
          )).href);
          const errors = [];
          const { data: statuses } = await github.rest.repos.listCommitStatusesForRef({
            owner: context.repo.owner,
            repo: context.repo.repo,
            ref: process.env.CANDIDATE_SHA,
            per_page: 100
          });
          const status = statuses.find(item => item.context === process.env.EVIDENCE_CONTEXT);
          if (!status) errors.push(`Missing ${process.env.EVIDENCE_CONTEXT} status for candidate SHA`);
          if (status && status.state !== 'success') errors.push(`External evidence state is ${status.state}`);
          if (status && status.creator?.login !== process.env.TRUSTED_EVIDENCE_ACTOR) {
            errors.push(`External evidence actor is ${status.creator?.login || 'unknown'}`);
          }
          const pattern = /^fixture64 base=([0-9a-f]{12}) cold=([0-9]+(?:\.[0-9]+)?)\/([0-9]+(?:\.[0-9]+)?)x warm=([0-9]+(?:\.[0-9]+)?)\/([0-9]+(?:\.[0-9]+)?)x startup=([0-9]+(?:\.[0-9]+)?)\/([0-9]+(?:\.[0-9]+)?)x correct=pass$/;
          const match = status?.description?.match(pattern);
          if (!match) errors.push('External evidence description has an invalid contract');
          const expectedBase = process.env.BASE_SHA.slice(0, 12);
          if (match && match[1] !== expectedBase) {
            errors.push(`External evidence base ${match[1]} does not match ${expectedBase}`);
          }
          const speedups = match ? match.slice(2).map(Number) : [];
          if (speedups.length !== 6 || speedups.some(value => !Number.isFinite(value) || value <= 0)) {
            errors.push(`Every reported cold/warm/startup speedup must be finite and positive: ${speedups.join(', ')}`);
          }
          if (speedups.length === 6 && speedups[5] < 10) {
            errors.push(`Startup-prepared P95 speedup must be >=10x: ${speedups[5]}`);
          }
          const evidenceMatch = status?.target_url?.match(
            /^https:\/\/gist\.github\.com\/johnsonlee\/([0-9a-f]+)\/revisions\/([0-9a-f]{40})$/
          );
          if (!evidenceMatch) errors.push('Status target_url is not an immutable johnsonlee Gist revision');
          let evidence;
          if (evidenceMatch) {
            try {
              const response = await fetch(
                `https://api.github.com/gists/${evidenceMatch[1]}/${evidenceMatch[2]}`,
                { headers: { accept: 'application/vnd.github+json' } }
              );
              if (!response.ok) throw new Error(`public Gist API returned HTTP ${response.status}`);
              evidence = await response.json();
              if (evidence.owner?.login !== process.env.TRUSTED_EVIDENCE_ACTOR) {
                errors.push(`Evidence owner is ${evidence.owner?.login || 'unknown'}`);
              }
            } catch (error) {
              errors.push(`Unable to load immutable Gist evidence: ${error.message}`);
            }
          }
          const directory = 'benchmark-results/evidence';
          let files = {};
          try {
            files = await materializeGistFiles({
              files: evidence?.files || {},
              gistId: evidenceMatch?.[1],
              owner: process.env.TRUSTED_EVIDENCE_ACTOR,
              directory,
              request: async options => {
                const response = await fetch(options.url, { headers: options.headers });
                if (!response.ok) throw new Error(`public Gist raw URL returned HTTP ${response.status}`);
                return { data: await response.text() };
              }
            });
          } catch (error) {
            errors.push(`Unable to materialize immutable Gist evidence: ${error.message}`);
          }
          let manifest;
          try {
            manifest = JSON.parse(fs.readFileSync(path.join(directory, 'evidence-manifest.json'), 'utf8'));
          } catch (error) {
            errors.push(`Evidence manifest is invalid: ${error.message}`);
          }
          const requiredFiles = [
            'provenance.json', 'graphs.tsv', 'fixture-provenance.tsv',
            'fixture-reproducibility.json',
            'base-single-source-reference.json', 'base-single-source-reference.tsv',
            'base-single-source-reference.manifest',
            'base-single-source-oracle.manifest',
            ...['cold', 'warm', 'startup-prepared'].flatMap(state => [
              `base-graph-routing-${state}.json`, `base-graph-routing-${state}.tsv`,
              `base-graph-routing-${state}.correctness`,
              `candidate-graph-routing-${state}.json`, `candidate-graph-routing-${state}.tsv`,
              `candidate-graph-routing-${state}.correctness`,
              `graph-routing-${state}-report.md`, `graph-routing-${state}-status.json`
            ])
          ];
          if (manifest) {
            if (manifest.schema !== 'graphite-fixture64-evidence-v7' ||
                manifest.repository !== `${context.repo.owner}/${context.repo.repo}` ||
                manifest.baseSha !== process.env.BASE_SHA ||
                manifest.candidateSha !== process.env.CANDIDATE_SHA ||
                manifest.statusContext !== process.env.EVIDENCE_CONTEXT ||
                manifest.description !== status?.description) {
              errors.push('Evidence manifest identity does not match the PR status');
            }
            for (const name of requiredFiles) {
              const content = files[name];
              const expectedHash = manifest.files?.[name];
              const actualHash = typeof content === 'string'
                ? crypto.createHash('sha256').update(content).digest('hex')
                : null;
              if (!/^[0-9a-f]{64}$/.test(expectedHash || '') || actualHash !== expectedHash) {
                errors.push(`Evidence digest mismatch for ${name}`);
              }
            }
          }
          try {
            const provenance = JSON.parse(fs.readFileSync(path.join(directory, 'provenance.json'), 'utf8'));
            if (provenance.baseSha !== process.env.BASE_SHA ||
                provenance.candidateSha !== process.env.CANDIDATE_SHA ||
                provenance.repository !== `${context.repo.owner}/${context.repo.repo}` ||
                provenance.oracleSource !== 'base-single-source') {
              errors.push('Evidence provenance identity is invalid');
            }
            const evidenceSha256 = name => crypto.createHash('sha256')
              .update(fs.readFileSync(path.join(directory, name))).digest('hex');
            for (const [field, name] of [
              ['manifestSha256', 'graphs.tsv'],
              ['fixtureProvenanceSha256', 'fixture-provenance.tsv'],
              ['oracleSha256', 'base-single-source-oracle.manifest']
            ]) {
              if (provenance[field] !== evidenceSha256(name)) {
                errors.push(`Evidence provenance ${field} does not match ${name}`);
              }
            }
            const reproducibility = JSON.parse(fs.readFileSync(
              path.join(directory, 'fixture-reproducibility.json'), 'utf8'
            ));
            if (!reproducibility.passed ||
                reproducibility.firstProvenanceSha256 !== reproducibility.repeatedProvenanceSha256 ||
                reproducibility.firstManifestSemanticSha256 !==
                  reproducibility.repeatedManifestSemanticSha256) {
              errors.push('Repeated fixture-JAR preparation is not reproducible');
            }
            const canonicalCorrectness = (content, label) => {
              const records = content.replaceAll('\r\n', '\n').split('\n');
              if (records.at(-1) === '') records.pop();
              if (records.length === 0 || records.some(record => record.length === 0)) {
                throw new Error(`${label} contains empty correctness records`);
              }
              const queryIds = records.map(record => {
                const separator = record.indexOf('|');
                if (separator <= 0) throw new Error(`${label} contains a malformed correctness record`);
                return record.slice(0, separator);
              });
              if (new Set(queryIds).size !== queryIds.length) {
                throw new Error(`${label} contains duplicate query IDs`);
              }
              return records.toSorted().join('\n');
            };
            for (const [stateIndex, state] of ['cold', 'warm', 'startup-prepared'].entries()) {
              const result = JSON.parse(fs.readFileSync(
                path.join(directory, `graph-routing-${state}-status.json`), 'utf8'
              ));
              if (!result.passed ||
                  (state === 'startup-prepared' && result.gateP95Speedup < 10)) {
                errors.push(`${state} comparator status does not pass its state-specific gate`);
              }
              const reported = speedups.slice(stateIndex * 2, stateIndex * 2 + 2);
              const measured = [result.gateP50Speedup, result.gateP95Speedup]
                .map(value => Number(Number(value).toFixed(2)));
              if (reported.length !== 2 || reported.some((value, index) => value !== measured[index])) {
                errors.push(`${state} commit-status speedups ${reported.join('/')} do not equal ` +
                  `the recomputed evidence ${measured.join('/')}`);
              }
              const correctness = fs.readFileSync(
                path.join(directory, `candidate-graph-routing-${state}.correctness`), 'utf8'
              );
              const oracle = fs.readFileSync(
                path.join(directory, 'base-single-source-oracle.manifest'), 'utf8'
              );
              if (canonicalCorrectness(correctness, `${state} candidate`) !==
                  canonicalCorrectness(oracle, 'single-source oracle')) {
                errors.push(`${state} candidate correctness differs from the oracle`);
              }
            }
          } catch (error) {
            errors.push(`Evidence payload is invalid: ${error.message}`);
          }
          const passed = errors.length === 0;
          const report = [
            '##### 64 fixture-derived graph routing pressure',
            '',
            passed ? '**PASS**' : '**FAIL**',
            '',
            status?.description || 'No trusted external evidence status was found.',
            '',
            ...(errors.length ? ['', 'Errors:', ...errors.map(error => `- ${error}`)] : [])
          ].join('\n') + '\n';
          fs.mkdirSync('benchmark-results', { recursive: true });
          fs.writeFileSync('benchmark-results/graph-routing-report.md', report);
          fs.writeFileSync('benchmark-results/graph-routing-status.json', JSON.stringify({
            passed,
            errors,
            baseSha: process.env.BASE_SHA,
            candidateSha: process.env.CANDIDATE_SHA,
            evidenceActor: status?.creator?.login || null,
            coldP50Speedup: speedups[0] ?? null,
            coldP95Speedup: speedups[1] ?? null,
            warmP50Speedup: speedups[2] ?? null,
            warmP95Speedup: speedups[3] ?? null,
            startupPreparedP50Speedup: speedups[4] ?? null,
            startupPreparedP95Speedup: speedups[5] ?? null
          }, null, 2) + '\n');

    - name: Checkout exact base build inputs
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: evidence-base
        persist-credentials: false

    - name: Independently recompute fixture64 comparisons
      run: |
        jq -e '.passed == true' benchmark-results/graph-routing-status.json >/dev/null
        PROVENANCE=benchmark-results/evidence/provenance.json
        sha256_file() { sha256sum "$1" | cut -d' ' -f1; }
        assert_provenance_hash() {
          test "$(sha256_file "$2")" = "$(jq -r ".$1" "${PROVENANCE}")"
        }
        assert_provenance_hash harnessSha256 \
          evidence-candidate/graphite-webgraph/src/jmh/kotlin/io/johnsonlee/graphite/webgraph/LargeBroadQueryPressureBenchmark.kt
        assert_provenance_hash correctnessManifestSha256 \
          evidence-candidate/graphite-webgraph/src/main/kotlin/io/johnsonlee/graphite/webgraph/QueryCorrectnessManifest.kt
        assert_provenance_hash fixtureVerifierSha256 \
          evidence-candidate/graphite-webgraph/src/jmh/kotlin/io/johnsonlee/graphite/webgraph/Fixture64GraphPreparation.kt
        assert_provenance_hash comparatorSha256 evidence-candidate/.github/scripts/benchmark-gate.mjs
        assert_provenance_hash scriptSha256 evidence-candidate/.github/scripts/run-real64-graph-routing.sh
        assert_provenance_hash reproducibilityScriptSha256 \
          evidence-candidate/.github/scripts/test-fixture64-reproducibility.sh
        assert_provenance_hash zipHasherSha256 evidence-candidate/.github/scripts/canonical-zip-sha256.py
        assert_provenance_hash gistEvidenceSha256 evidence-candidate/.github/scripts/gist-evidence.mjs
        assert_provenance_hash fixturePreparationScriptSha256 \
          evidence-candidate/.github/scripts/prepare-fixture64-graphs.sh
        assert_provenance_hash workloadVerifierSha256 \
          evidence-candidate/.github/scripts/verify-fixture64-workload.sh
        assert_provenance_hash manifestSha256 benchmark-results/evidence/graphs.tsv
        assert_provenance_hash fixtureProvenanceSha256 benchmark-results/evidence/fixture-provenance.tsv
        assert_provenance_hash oracleSha256 benchmark-results/evidence/base-single-source-oracle.manifest
        NORMALIZED_PROVENANCE_SHA=$(cut -f1-18 benchmark-results/evidence/fixture-provenance.tsv | sha256sum | cut -d' ' -f1)
        NORMALIZED_MANIFEST_SHA=$(awk -F '\t' 'BEGIN { OFS="\t" } /^#/ { print; next } { print $1, $3, $4, $5, $6 }' \
          benchmark-results/evidence/graphs.tsv | sha256sum | cut -d' ' -f1)
        RECEIPT=benchmark-results/evidence/fixture-reproducibility.json
        test "$(jq -r .firstProvenanceSha256 "${RECEIPT}")" = "${NORMALIZED_PROVENANCE_SHA}"
        test "$(jq -r .repeatedProvenanceSha256 "${RECEIPT}")" = "${NORMALIZED_PROVENANCE_SHA}"
        test "$(jq -r .firstManifestSemanticSha256 "${RECEIPT}")" = "${NORMALIZED_MANIFEST_SHA}"
        test "$(jq -r .repeatedManifestSemanticSha256 "${RECEIPT}")" = "${NORMALIZED_MANIFEST_SHA}"
        EXPECTED_BASE_INSTRUMENTATION=$(
          for INSTRUMENTATION_PATH in \
            graphite-webgraph/src/jmh/kotlin/io/johnsonlee/graphite/webgraph/LargeBroadQueryPressureBenchmark.kt \
            graphite-webgraph/src/main/kotlin/io/johnsonlee/graphite/webgraph/QueryCorrectnessManifest.kt; do
            if ! cmp -s \
              "evidence-base/${INSTRUMENTATION_PATH}" \
              "evidence-candidate/${INSTRUMENTATION_PATH}"; then
              printf '%s\n' "${INSTRUMENTATION_PATH}"
            fi
          done | sort
        )
        cp \
          evidence-candidate/graphite-webgraph/src/jmh/kotlin/io/johnsonlee/graphite/webgraph/LargeBroadQueryPressureBenchmark.kt \
          evidence-base/graphite-webgraph/src/jmh/kotlin/io/johnsonlee/graphite/webgraph/LargeBroadQueryPressureBenchmark.kt
        cp \
          evidence-candidate/graphite-webgraph/src/main/kotlin/io/johnsonlee/graphite/webgraph/QueryCorrectnessManifest.kt \
          evidence-base/graphite-webgraph/src/main/kotlin/io/johnsonlee/graphite/webgraph/QueryCorrectnessManifest.kt
        test "$(git -C evidence-base diff --name-only | sort)" = "${EXPECTED_BASE_INSTRUMENTATION}"
        evidence-base/gradlew -p evidence-base :webgraph:jmhJar --no-daemon
        evidence-candidate/gradlew -p evidence-candidate \
          :webgraph:jmhJar :webgraph:prepareBenchmarkFixtures --no-daemon
        BASE_JAR=$(find evidence-base/graphite-webgraph/build/libs -maxdepth 1 -name '*-jmh.jar' -print -quit)
        CANDIDATE_JAR=$(find evidence-candidate/graphite-webgraph/build/libs -maxdepth 1 -name '*-jmh.jar' -print -quit)
        python3 -c 'import sys; assert sys.version_info >= (3, 12), sys.version'
        test "$(python3 evidence-candidate/.github/scripts/canonical-zip-sha256.py "${BASE_JAR}")" = \
          "$(jq -r .baseJarContentSha256 "${PROVENANCE}")"
        test "$(python3 evidence-candidate/.github/scripts/canonical-zip-sha256.py "${CANDIDATE_JAR}")" = \
          "$(jq -r .candidateJarContentSha256 "${PROVENANCE}")"
        FIXTURE_DIR=evidence-candidate/graphite-webgraph/build/benchmark-fixtures
        for FIXTURE_JAR in "${FIXTURE_DIR}"/*.jar; do
          FIXTURE_NAME=$(basename "${FIXTURE_JAR}")
          FIXTURE_SHA=$(sha256_file "${FIXTURE_JAR}")
          test "$(awk -F '\t' -v name="${FIXTURE_NAME}" -v sha="${FIXTURE_SHA}" \
            'NR > 1 && $4 == name && $5 == sha { count++ } END { print count + 0 }' \
            benchmark-results/evidence/fixture-provenance.tsv)" -eq 16
        done
        RECOMPUTED_FIXTURE64=${RUNNER_TEMP}/recomputed-fixture64
        evidence-candidate/.github/scripts/prepare-fixture64-graphs.sh \
          "${CANDIDATE_JAR}" "${FIXTURE_DIR}" "${RECOMPUTED_FIXTURE64}"
        evidence-candidate/.github/scripts/verify-fixture64-workload.sh \
          benchmark-results/evidence "${RECOMPUTED_FIXTURE64}" \
          benchmark-results/evidence/base-single-source-reference.tsv \
          benchmark-results/evidence/base-single-source-reference.manifest \
          benchmark-results/evidence/base-single-source-oracle.manifest \
          benchmark-results/evidence/base-graph-routing-cold.tsv \
          benchmark-results/evidence/base-graph-routing-cold.correctness \
          benchmark-results/evidence/candidate-graph-routing-cold.tsv \
          benchmark-results/evidence/candidate-graph-routing-cold.correctness \
          benchmark-results/evidence/base-graph-routing-warm.tsv \
          benchmark-results/evidence/base-graph-routing-warm.correctness \
          benchmark-results/evidence/candidate-graph-routing-warm.tsv \
          benchmark-results/evidence/candidate-graph-routing-warm.correctness \
          benchmark-results/evidence/base-graph-routing-startup-prepared.tsv \
          benchmark-results/evidence/base-graph-routing-startup-prepared.correctness \
          benchmark-results/evidence/candidate-graph-routing-startup-prepared.tsv \
          benchmark-results/evidence/candidate-graph-routing-startup-prepared.correctness
        node evidence-candidate/.github/scripts/benchmark-gate.mjs derive-graph-routing-oracle \
          --references benchmark-results/evidence/base-single-source-reference.manifest \
          --oracle benchmark-results/recomputed-base-single-source-oracle.manifest
        cmp benchmark-results/recomputed-base-single-source-oracle.manifest \
          benchmark-results/evidence/base-single-source-oracle.manifest
        for STATE in cold warm startup-prepared; do
          case "${STATE}" in
            cold) BASE_CORRECTNESS_ORACLE=benchmark-results/evidence/base-graph-routing-warm.correctness ;;
            warm|startup-prepared) \
              BASE_CORRECTNESS_ORACLE=benchmark-results/evidence/base-graph-routing-cold.correctness ;;
          esac
          node evidence-candidate/.github/scripts/benchmark-gate.mjs compare-graph-id-pressure \
            --base "benchmark-results/evidence/base-graph-routing-${STATE}.json" \
            --candidate "benchmark-results/evidence/candidate-graph-routing-${STATE}.json" \
            --base-observations "benchmark-results/evidence/base-graph-routing-${STATE}.tsv" \
            --candidate-observations "benchmark-results/evidence/candidate-graph-routing-${STATE}.tsv" \
            --base-correctness "${BASE_CORRECTNESS_ORACLE}" \
            --candidate-correctness benchmark-results/evidence/base-single-source-oracle.manifest \
            --minimum-speedup 10 \
            --report "benchmark-results/recomputed-${STATE}-report.md" \
            --status "benchmark-results/recomputed-${STATE}-status.json"
          cmp "benchmark-results/recomputed-${STATE}-report.md" \
            "benchmark-results/evidence/graph-routing-${STATE}-report.md"
          cmp "benchmark-results/recomputed-${STATE}-status.json" \
            "benchmark-results/evidence/graph-routing-${STATE}-status.json"
        done

    - name: Upload graph-routing evidence result
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-graph-routing-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
        path: benchmark-results/
        if-no-files-found: error
        retention-days: 14

    - name: Enforce graph-routing evidence
      if: always()
      run: jq -e '.passed == true' benchmark-results/graph-routing-status.json >/dev/null

  benchmark-regression-gate:
    name: benchmark-regression-gate
    if: always()
    needs: [candidate-gate-tests, method-level, explorer, method-compatibility, cypher-capacity, budgeted-collection, budgeted-mapped-string, large-corpus, wrapped-query-latency, wrapped-query-resources, graph-routing-pressure-evidence]
    runs-on: ubuntu-latest

    steps:
    - name: Checkout base reporting code
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        persist-credentials: false

    - name: Checkout candidate reporting code for taxonomy rollout
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: reporter
        persist-credentials: false

    - name: Download method-level results
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        pattern: benchmark-*-${{ github.event.pull_request.number }}-*
        path: downloaded-benchmark-results

    - name: Select latest successful benchmark artifacts
      continue-on-error: true
      run: |
        node .github/scripts/benchmark-gate.mjs stage-artifacts \
          --directory downloaded-benchmark-results \
          --output benchmark-results

    - name: Build benchmark report
      if: always()
      env:
        CANDIDATE_GATE_TEST_JOB: ${{ needs.candidate-gate-tests.result }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        BENCHMARK_RUNNER: ${{ runner.os }}-${{ runner.arch }}
        BENCHMARK_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        mkdir -p benchmark-results
        COMPARATOR=.github/scripts/benchmark-gate.mjs
        if ! grep -q '"graph-routing-pressure"' "${COMPARATOR}"; then
          test "${CANDIDATE_GATE_TEST_JOB}" = success
          test "$(sha256sum reporter/.github/scripts/benchmark-gate.mjs | cut -d' ' -f1)" = \
            "${BENCHMARK_REPORT_TRANSITION_SHA256}"
          COMPARATOR=reporter/.github/scripts/benchmark-gate.mjs
          grep -q '"graph-routing-pressure"' "${COMPARATOR}"
        fi
        node "${COMPARATOR}" aggregate \
          --directory benchmark-results \
          --base-sha "${BASE_SHA}" \
          --candidate-sha "${CANDIDATE_SHA}" \
          --runner "${BENCHMARK_RUNNER}" \
          --run-url "${BENCHMARK_RUN_URL}" \
          --report benchmark-results/benchmark-authoritative-report.md \
          --status benchmark-results/benchmark-authoritative-status.json
        node -e "const fs=require('fs');const p='./benchmark-results/benchmark-authoritative-status.json';const body=fs.readFileSync('./benchmark-results/benchmark-authoritative-report.md','utf8');const s=JSON.parse(fs.readFileSync(p));if(s.body!==body)process.exit(1);Object.assign(s,{baseSha:process.env.BASE_SHA,candidateSha:process.env.CANDIDATE_SHA,runner:process.env.BENCHMARK_RUNNER,runUrl:process.env.BENCHMARK_RUN_URL});fs.writeFileSync(p,JSON.stringify(s,null,2)+'\\n')"
        if grep -q '^### Coverage summary$' benchmark-results/benchmark-authoritative-report.md; then
          install -m 0644 benchmark-results/benchmark-authoritative-report.md \
            benchmark-results/benchmark-report.md
          install -m 0644 benchmark-results/benchmark-authoritative-status.json \
            benchmark-results/benchmark-status.json
          install -m 0644 benchmark-results/benchmark-authoritative-status.json \
            benchmark-results/benchmark-render-status.json
        else
          test "${CANDIDATE_GATE_TEST_JOB}" = success
          test "$(sha256sum reporter/.github/scripts/benchmark-gate.mjs | cut -d' ' -f1)" = \
            "${BENCHMARK_REPORT_TRANSITION_SHA256}"
          node reporter/.github/scripts/benchmark-gate.mjs aggregate \
            --directory benchmark-results \
            --base-sha "${BASE_SHA}" \
            --candidate-sha "${CANDIDATE_SHA}" \
            --runner "${BENCHMARK_RUNNER}" \
            --run-url "${BENCHMARK_RUN_URL}" \
            --report benchmark-results/benchmark-report.md \
            --status benchmark-results/benchmark-render-status.json
          node -e "const a=require('./benchmark-results/benchmark-authoritative-status.json');const r=require('./benchmark-results/benchmark-render-status.json');for(const k of ['passed','baseSha','candidateSha','runner','runUrl'])if(a[k]!==r[k])process.exit(1);if(JSON.stringify(a.errors)!==JSON.stringify(r.errors)||r.body!==require('fs').readFileSync('./benchmark-results/benchmark-report.md','utf8'))process.exit(1)"
          install -m 0644 benchmark-results/benchmark-render-status.json \
            benchmark-results/benchmark-status.json
        fi

    - name: Upload aggregate benchmark report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-report-${{ github.event.pull_request.number }}
        path: |
          benchmark-results/benchmark-report.md
          benchmark-results/benchmark-status.json
          benchmark-results/benchmark-authoritative-report.md
          benchmark-results/benchmark-authoritative-status.json
          benchmark-results/benchmark-render-status.json
        if-no-files-found: error
        overwrite: true
        retention-days: 14

    - name: Enforce benchmark gate
      if: always()
      env:
        CANDIDATE_GATE_TEST_JOB: ${{ needs.candidate-gate-tests.result }}
        METHOD_JOB: ${{ needs.method-level.result }}
        EXPLORER_JOB: ${{ needs.explorer.result }}
        METHOD_COMPATIBILITY_JOB: ${{ needs.method-compatibility.result }}
        CYPHER_CAPACITY_JOB: ${{ needs.cypher-capacity.result }}
        BUDGETED_COLLECTION_JOB: ${{ needs.budgeted-collection.result }}
        BUDGETED_STRING_JOB: ${{ needs.budgeted-mapped-string.result }}
        LARGE_CORPUS_JOB: ${{ needs.large-corpus.result }}
        LATENCY_JOB: ${{ needs.wrapped-query-latency.result }}
        LATENCY_RESOURCES_JOB: ${{ needs.wrapped-query-resources.result }}
        GRAPH_ROUTING_JOB: ${{ needs.graph-routing-pressure-evidence.result }}
      run: |
        if [ "${CANDIDATE_GATE_TEST_JOB}" != success ] || \
          [ "${METHOD_JOB}" != success ] || [ "${EXPLORER_JOB}" != success ] || \
          [ "${METHOD_COMPATIBILITY_JOB}" != success ] || \
          [ "${CYPHER_CAPACITY_JOB}" != success ] || \
          [ "${BUDGETED_COLLECTION_JOB}" != success ] || \
          [ "${BUDGETED_STRING_JOB}" != success ] || \
          [ "${LARGE_CORPUS_JOB}" != success ] || \
          [ "${LATENCY_JOB}" != success ] || [ "${LATENCY_RESOURCES_JOB}" != success ] || \
          [ "${GRAPH_ROUTING_JOB}" != success ]; then
          echo "::error::Benchmark execution or comparison failed"
          exit 1
        fi
        node -e "const s=require('./benchmark-results/benchmark-authoritative-status.json'); if(!s.passed) process.exit(1)"

  benchmark-comment:
    name: benchmark-comment
    if: always()
    needs: [benchmark-regression-gate]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write

    steps:
    - name: Download aggregate benchmark report
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: benchmark-report-${{ github.event.pull_request.number }}
        path: benchmark-results

    - name: Attach benchmark report to PR
      if: always()
      continue-on-error: true
      uses: actions/github-script@v9
      with:
        script: |
          const fs = require('fs');
          const marker = '<!-- graphite-benchmark-regression-gate -->';
          let body;
          try {
            body = fs.readFileSync('benchmark-results/benchmark-report.md', 'utf8');
          } catch (error) {
            body = `${marker}\n## Benchmark Regression Gate\n\n**FAIL**\n\nReport generation failed. ` +
              `[View logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
          }

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            per_page: 100
          });
          const existing = comments.find((comment) => comment.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
          }
