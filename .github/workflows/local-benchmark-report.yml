name: Local benchmark report

on:
  pull_request_target:
    branches: ['**']
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: local-benchmark-report-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: local-benchmark-report
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout trusted target revision
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        persist-credentials: false
    - name: Resolve comparison merge base
      id: revisions
      uses: actions/github-script@v9
      with:
        script: |
          const comparison = await github.rest.repos.compareCommitsWithBasehead({
            owner: context.repo.owner,
            repo: context.repo.repo,
            basehead: `${context.payload.pull_request.base.sha}...${context.payload.pull_request.head.sha}`,
          });
          core.setOutput('base', comparison.data.merge_base_commit.sha);
    - name: Setup trusted script runtime
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: .github/scripts/package.json
    - name: Validate local benchmark report
      working-directory: .github/scripts
      env:
        PR_BODY: ${{ github.event.pull_request.body }}
        EXPECTED_BASE: ${{ steps.revisions.outputs.base }}
        EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      run: |
        bun install --frozen-lockfile
        printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
        bun checks/local-benchmark-body.ts \
          --body "$RUNNER_TEMP/pr-body.md" \
          --base "$EXPECTED_BASE" --head "$EXPECTED_HEAD"
