name: Run unit tests

env:
  JAVA_TOOL_OPTIONS: -Xmx4g -XX:+ExitOnOutOfMemoryError -Dgraphite.correctness.only=true

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '**' ]

  repository_dispatch:
    types: [test]

permissions:
  contents: read
  pull-requests: write

# One active PR run owns the sticky CI status comment.
concurrency:
  group: jvm-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run-unit-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: 'adopt'
        java-version: '17'

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: .github/scripts/package.json
    - name: Check and test CI scripts
      working-directory: .github/scripts
      run: |
        bun install --frozen-lockfile
        bun run check
        bun test

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Test Explorer web state
      run: node --test frontend/jvm/explore/src/test/js/ui-state.test.js

    - name: Build
      run: |
        set -o pipefail
        ./gradlew check -S --no-daemon 2>&1 | tee build-output.txt
      env:
        JAVA_OPTS: -Xmx4g -XX:MetaspaceSize=1g -Dfile.encoding=UTF-8
        JVM_OPTS:  -Xmx4g -XX:MetaspaceSize=1g -Dfile.encoding=UTF-8

    - name: Preserve failed test diagnostics
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: failed-test-diagnostics
        path: |
          **/build/test-results/**/*.xml
          build-output.txt
        if-no-files-found: warn
        retention-days: 7

    - name: Generate coverage report
      if: success() && github.event_name == 'pull_request'
      run: |
        set -o pipefail
        ./gradlew koverLog --no-daemon 2>&1 | tee coverage-output.txt

    - name: Comment coverage on PR
      if: success() && github.event_name == 'pull_request'
      uses: actions/github-script@v9
      with:
        script: |
          const fs = require('fs');
          let output = '';
          try {
            output = fs.readFileSync('coverage-output.txt', 'utf8');
          } catch (e) {
            output = '';
          }

          // Parse coverage lines: "> Task :module:koverPrintCoverage" followed by "application line coverage: XX%"
          const lines = output.split('\n');
          const rows = [];
          for (let i = 0; i < lines.length; i++) {
            const taskMatch = lines[i].match(/> Task :(.+):koverPrintCoverage/);
            if (taskMatch && i + 1 < lines.length) {
              const covMatch = lines[i + 1].match(/application line coverage: ([\d.]+)%/);
              if (covMatch) {
                const module = taskMatch[1];
                const pct = parseFloat(covMatch[1]);
                const icon = pct >= 98 ? ':white_check_mark:' : pct >= 50 ? ':large_orange_diamond:' : ':red_circle:';
                rows.push(`| ${module} | ${icon} ${pct.toFixed(1)}% |`);
              }
            }
          }

          if (rows.length === 0) return;

          const body = [
            '## :bar_chart: Test Coverage',
            '',
            '| Module | Line Coverage |',
            '|--------|-------------|',
            ...rows,
            '',
            `[View full logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
          ].join('\n');

          // Update existing coverage comment or create new one
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number
          });
          const existing = comments.find(c => c.body.includes(':bar_chart: Test Coverage'));
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body: body
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
          }

    - name: Enforce coverage threshold
      if: success() && github.event_name == 'pull_request'
      run: |
        FAILED=false
        MODULE=""
        while IFS= read -r line; do
          if [[ "$line" == *":koverPrintCoverage"* ]]; then
            MODULE=${line#*> Task :}
            MODULE=${MODULE%:koverPrintCoverage*}
          fi
          if [[ "$line" == *"application line coverage:"* ]]; then
            PCT=${line#*coverage: }
            PCT=${PCT%%\%*}
            if awk "BEGIN{exit !($PCT < 98)}"; then
              echo "::error::Module $MODULE coverage is ${PCT}%, below 98% threshold"
              FAILED=true
            fi
          fi
        done < coverage-output.txt

        if [ "$FAILED" = true ]; then
          exit 1
        fi

    - name: Update build status comment on PR
      if: always() && !cancelled() && github.event_name == 'pull_request'
      uses: actions/github-script@v9
      env:
        CI_JOB_STATUS: ${{ job.status }}
      with:
        script: |
          const marker = '<!-- graphite-build-status:v1 -->';
          const { owner, repo } = context.repo;
          const number = context.payload.pull_request.number;
          const head = context.payload.pull_request.head.sha;
          const run = String(context.runId);
          const attempt = Number(process.env.GITHUB_RUN_ATTEMPT || '1');
          const failed = process.env.CI_JOB_STATUS === 'failure';
          if (!failed && process.env.CI_JOB_STATUS !== 'success') return;
          const runPrefix = `${context.serverUrl}/${owner}/${repo}/actions/runs/`;
          const runUrl = `${runPrefix}${run}/attempts/${attempt}`;
          const current = async () => {
            const { data: pull } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            return pull.state === 'open' && pull.head.sha === head;
          };
          if (!await current()) return;
          const comments = await github.paginate(github.rest.issues.listComments, {
            owner, repo, issue_number: number, per_page: 100
          });
          const owned = comments.filter(c => c.user?.login === 'github-actions[bot]' && c.user?.type === 'Bot');
          const existing = owned.filter(c => c.body?.startsWith(marker)).sort((a, b) => a.id - b.id)[0]
            ?? owned.filter(c => c.body?.startsWith('## :x: Build Failed') && c.body.includes(runPrefix))
              .sort((a, b) => b.id - a.id)[0];
          // A previously successful PR needs no new status comment.
          if (!existing && !failed) return;
          const previous = existing?.body?.startsWith(marker)
            ? existing.body.split('\n')[1]?.match(/^<!-- graphite-build-run:(\d+):(\d+):[0-9a-f]{40} -->$/)
            : undefined;
          if (previous && (BigInt(previous[1]) > BigInt(run) ||
              (BigInt(previous[1]) === BigInt(run) && Number(previous[2]) >= attempt))) return;
          const identity = `<!-- graphite-build-run:${run}:${attempt}:${head} -->`;
          let body = `${marker}\n${identity}\n`;
          if (failed) {
            let output;
            try { output = require('fs').readFileSync('build-output.txt', 'utf8'); }
            catch { output = 'Build output not available.'; }
            const lines = output.split('\n');
            let tail = lines.slice(-200).join('\n');
            const truncated = lines.length > 200 || tail.length > 48000;
            tail = tail.slice(-48000);
            // Do not start a truncated excerpt in the middle of a UTF-16 pair.
            if (/^[\uDC00-\uDFFF]/.test(tail)) tail = tail.slice(1);
            // Indented code keeps log fences and HTML as data, within the comment limit.
            const excerpt = tail.split('\n').map(line => `    ${line}`).join('\n');
            body += `## :x: CI failed\n\nThe workflow failed for \`${head}\`. See the run for the failing step.\n\n`;
            body += `Gradle log excerpt (the failure may be in another step):\n\n`;
            if (truncated) body += '> Showing only the last part of the log.\n\n';
            body += `${excerpt}\n\n`;
          } else {
            body += `## :white_check_mark: CI recovered\n\nThe workflow passed for \`${head}\`; the earlier failure is resolved.\n\n`;
          }
          body += `[View full logs](${runUrl})`;
          if (!await current()) return;
          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
          }
