name: JavaScript artifact frontend

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '**' ]

permissions:
  contents: read

jobs:
  windows-imports:
    name: javascript-artifact-windows-imports
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: frontend/web/package-lock.json
    - name: Check cross-file resolution with native Windows paths
      working-directory: frontend/web
      run: |
        npm ci
        npm run build
        node --test --test-name-pattern "native paths resolve nested emitted imports" test/analyzer.test.mjs

  typescript:
    name: javascript-artifact-build-save-query
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # A release-style version exercises default install and packaged metadata.
      GRAPHITE_VERSION: 0.0.0-ci.1
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Restore compiled Next.js fixtures
      id: fixtures
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/graphite-next-fixtures
        key: graphite-next-fixtures-v1-${{ hashFiles('.github/scripts/check-typescript-e2e.py') }}
    - name: Setup historical runtime for pinned Next 10 fixture
      if: steps.fixtures.outputs.cache-hit != 'true'
      uses: actions/setup-node@v6
      with:
        node-version: '14.17.0'
    - name: Preserve fixture runtime path
      if: steps.fixtures.outputs.cache-hit != 'true'
      run: echo "GRAPHITE_FIXTURE_NODE=$(command -v node)" >> "$GITHUB_ENV"
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: frontend/web/package-lock.json
    - name: Install and test JavaScript artifact frontend
      working-directory: frontend/web
      run: |
        npm ci
        npm test
    - name: Test compiled-operation oracle and evidence checks
      run: python3 .github/scripts/test-typescript-e2e.py
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
    - name: Build CLI
      run: cargo build --release --locked -p graphite-cli
    - name: Package and install the JS, TS and ES selectors in clean homes
      run: |
        RELEASE_VERSION="$GRAPHITE_VERSION" npm run package:release --prefix frontend/web
        python3 .github/scripts/check-js-frontend-install.py --cli target/release/graphite \
          --assets frontend/web/release-assets --version "$GRAPHITE_VERSION"
    - name: Check frontend discovery and persisted conflicting-edge policy through the Rust CLI
      run: node frontend/web/test/cli-integration.mjs target/release/graphite
    - name: Prepare pinned application fixtures on cache miss
      if: steps.fixtures.outputs.cache-hit != 'true'
      run: |
        for project in crud taskboard; do
          extra=()
          lock=pnpm-lock.yaml
          if [[ "$project" == crud ]]; then
            extra=(--legacy-build-node "$GRAPHITE_FIXTURE_NODE")
            lock=package-lock.json
          fi
          source_dir=$(python3 .github/scripts/check-typescript-e2e.py --project "$project" \
            --prepare-only "${extra[@]}" --output "$RUNNER_TEMP/js-preparation/$project")
          destination="$RUNNER_TEMP/graphite-next-fixtures/$project"
          mkdir -p "$destination"
          (cd "$source_dir" && cp .graphite-fixture.json "$lock" "$destination" &&
            find .next/server .next/static -type f \( -name '*.js' -o -name '*.cjs' -o -name '*.mjs' \) \
              -exec cp --parents -t "$destination" {} +)
        done
    - name: Verify client/server graph build, save and query from hashed fixtures
      run: |
        for project in crud taskboard; do
          python3 .github/scripts/check-typescript-e2e.py --project "$project" \
            --prepared-app "$RUNNER_TEMP/graphite-next-fixtures/$project" \
            --output "$RUNNER_TEMP/javascript-artifact-e2e/$project"
        done
    - name: Preserve complete correctness evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: javascript-artifact-e2e
        path: |
          ${{ runner.temp }}/javascript-artifact-e2e/*/*.json
          ${{ runner.temp }}/javascript-artifact-e2e/*/*.stdout
          ${{ runner.temp }}/javascript-artifact-e2e/*/*.stderr
          ${{ runner.temp }}/javascript-artifact-e2e/*/producer/frontend/dist/*.js
          ${{ runner.temp }}/javascript-artifact-e2e/*/producer/frontend/src/*.ts
          ${{ runner.temp }}/javascript-artifact-e2e/*/producer/frontend/package*.json
          ${{ runner.temp }}/js-preparation/*/*.json
          ${{ runner.temp }}/js-preparation/*/*.stdout
          ${{ runner.temp }}/js-preparation/*/*.stderr
          ${{ runner.temp }}/graphite-next-fixtures
        include-hidden-files: true
        if-no-files-found: warn
        retention-days: 14
