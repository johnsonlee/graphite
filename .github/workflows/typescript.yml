name: JavaScript artifact frontend

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '**' ]

permissions:
  contents: read

jobs:
  windows-imports:
    name: javascript-artifact-windows-imports
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: frontend/web/package-lock.json
    - name: Check cross-file resolution with native Windows paths
      working-directory: frontend/web
      run: |
        npm ci
        npm run build
        node --test --test-name-pattern "native paths resolve nested emitted imports" test/analyzer.test.mjs

  typescript:
    name: javascript-artifact-build-save-query
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Setup historical runtime for pinned Next 10 fixture
      uses: actions/setup-node@v6
      with:
        node-version: '14.17.0'
    - name: Preserve fixture runtime path
      run: echo "GRAPHITE_FIXTURE_NODE=$(command -v node)" >> "$GITHUB_ENV"
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: frontend/web/package-lock.json
    - name: Install and test JavaScript artifact frontend
      working-directory: frontend/web
      run: |
        npm ci
        npm test
    - name: Test compiled-operation oracle and evidence checks
      run: python3 .github/scripts/test-typescript-e2e.py
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
    - name: Build CLI
      run: cargo build --release --locked -p graphite-cli
    - name: Check frontend discovery and persisted conflicting-edge policy through the Rust CLI
      run: node frontend/web/test/cli-integration.mjs target/release/graphite
    - name: Build real Next/React app and verify client/server artifact graphs
      run: |
        python3 .github/scripts/check-typescript-e2e.py \
          --project crud --legacy-build-node "$GRAPHITE_FIXTURE_NODE" \
          --output "${RUNNER_TEMP}/javascript-artifact-e2e/crud"
        python3 .github/scripts/check-typescript-e2e.py \
          --project taskboard \
          --output "${RUNNER_TEMP}/javascript-artifact-e2e/taskboard"
    - name: Preserve complete correctness evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: javascript-artifact-e2e
        path: |
          ${{ runner.temp }}/javascript-artifact-e2e/*/*.json
          ${{ runner.temp }}/javascript-artifact-e2e/*/*.stdout
          ${{ runner.temp }}/javascript-artifact-e2e/*/*.stderr
          ${{ runner.temp }}/javascript-artifact-e2e/*/producer/frontend/dist/*.js
          ${{ runner.temp }}/javascript-artifact-e2e/*/producer/frontend/src/*.ts
          ${{ runner.temp }}/javascript-artifact-e2e/*/producer/frontend/package*.json
          ${{ runner.temp }}/javascript-artifact-e2e/*/sources/*/.next/server/**/*.js
          ${{ runner.temp }}/javascript-artifact-e2e/*/sources/*/.next/static/**/*.js
        include-hidden-files: true
        if-no-files-found: warn
        retention-days: 14
