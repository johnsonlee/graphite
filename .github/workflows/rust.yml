name: Rust

# No path filter: the differential below serves graphs built by the JVM frontend with the
# Kotlin explorer as the baseline, so a frontend, Gradle or fixture change must run it too.
on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '**' ]

permissions:
  contents: read

jobs:
  rust:
    name: rust-build-test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
        targets: x86_64-unknown-linux-musl

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: .

    - name: Format
      run: cargo fmt --all --check

    - name: Clippy
      run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

    - name: Build
      run: cargo build --release --locked

    - name: Unit tests
      run: cargo test --release --locked

    # The Linux release binary is a static musl build (it must run on any distribution
    # and on the libc-less distroless image); build it as the publish workflow does,
    # check it is static, then build the image from it and run it so the Dockerfile,
    # the build context and the entrypoint are exercised on every change.
    - name: Build the static Linux binary and run the graphite-explore image
      env:
        CC_x86_64_unknown_linux_musl: musl-gcc
      run: |
        sudo apt-get install -y -q musl-tools
        cargo build --release --locked --target x86_64-unknown-linux-musl -p graphite-cli
        bash .github/scripts/require-static.sh target/x86_64-unknown-linux-musl/release/graphite
        mkdir -p release-assets/linux/amd64
        cp target/x86_64-unknown-linux-musl/release/graphite release-assets/linux/amd64/graphite
        docker build -f backend/explore/Dockerfile --build-arg VERSION=ci -t graphite-explore:ci .
        docker run --rm --entrypoint /app/graphite graphite-explore:ci --version
        docker run --rm graphite-explore:ci --help | grep -F -- '--graph'
        rm -rf release-assets

    # The in-memory CallSite index must reproduce the persisted one byte for byte.
    # That test needs a real graph directory written by the Kotlin builder, so one is
    # built here from this repository's own core module.
    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: true

    # `graphite build` is the Rust CLI driving the JVM frontend (graphite.jar), found
    # here through GRAPHITE_FRONTEND_JVM as the Homebrew wrapper sets it.
    - name: Build the JVM frontend, the Kotlin explorer and a persisted fixture graph
      env:
        GRAPHITE_FRONTEND_JVM: ${{ github.workspace }}/frontend/jvm/query/build/libs/graphite.jar
        JAVA_TOOL_OPTIONS: -Xmx4g
      run: |
        ./gradlew :query:shadowJar :explore:shadowJar :core:jar --no-daemon -q
        ./target/release/graphite frontend list
        ./target/release/graphite frontend describe jvm | tee "${RUNNER_TEMP}/frontend.json"
        python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["name"]=="jvm" and d["version"], d' "${RUNNER_TEMP}/frontend.json"
        CORE_JAR=$(ls frontend/jvm/core/build/libs/core-*.jar | grep -v -- '-slim' | head -1)
        ./target/release/graphite build "${CORE_JAR}" \
          -o "${RUNNER_TEMP}/fixture-graph" --include io.johnsonlee.graphite
        test -f "${RUNNER_TEMP}/fixture-graph/graph.callsite-string-index"
        ls -la "${RUNNER_TEMP}/fixture-graph"
        # A small application with several capabilities calling each other, so the
        # component level has relationships to compare (the core jar is a library
        # and infers no components at all).
        mkdir -p "${RUNNER_TEMP}/acme-classes"
        javac -d "${RUNNER_TEMP}/acme-classes" $(find backend/bench/fixtures/acme/src -name '*.java')
        (cd "${RUNNER_TEMP}/acme-classes" && jar cfe "${RUNNER_TEMP}/acme.jar" com.acme.shop.api.Main com)
        ./target/release/graphite build "${RUNNER_TEMP}/acme.jar" \
          -o "${RUNNER_TEMP}/acme-graph" --include com.acme
        test -f "${RUNNER_TEMP}/acme-graph/graph.metadata"
        # The jar's own build of the same input is identical apart from the timestamp
        # comment in forward.properties: the CLI is a shell.
        java -jar frontend/jvm/query/build/libs/graphite.jar build "${RUNNER_TEMP}/acme.jar" \
          -o "${RUNNER_TEMP}/acme-graph-direct" --include com.acme
        diff -r -I '^#' "${RUNNER_TEMP}/acme-graph" "${RUNNER_TEMP}/acme-graph-direct"
        # Exercise the clean-env default through the actual CLI and JVM, then a
        # smaller explicit heap. Existing JAVA_TOOL_OPTIONS=4g builds above also
        # retain their override; the observer execs Java with unchanged arguments.
        python3 .github/scripts/check-build-jvm-defaults.py \
          --cli ./target/release/graphite \
          --frontend frontend/jvm/query/build/libs/graphite.jar \
          --input "${RUNNER_TEMP}/acme.jar" \
          --reference "${RUNNER_TEMP}/acme-graph-direct" \
          --output "${RUNNER_TEMP}/build-jvm-defaults"
        # A fold file with a `select` rule: the shell builds once without rules, runs the
        # query on that graph, and builds again with the selected call sites folded. The
        # gate `inventory.reserve(sku, quantity)` guards a throw in OrderService.place().
        cat > "${RUNNER_TEMP}/folds.yml" <<'EOF'
        version: 1
        folds:
          - select: >
              MATCH (cs:CallSite {callee_class: 'com.acme.shop.inventory.InventoryService', callee_name: 'reserve'})
              RETURN cs
            value: true
        EOF
        ./target/release/graphite build "${RUNNER_TEMP}/acme.jar" \
          -o "${RUNNER_TEMP}/acme-folded" --include com.acme --fold "${RUNNER_TEMP}/folds.yml" --fold-strict \
          2> "${RUNNER_TEMP}/fold.log"
        cat "${RUNNER_TEMP}/fold.log"
        grep -F 'select rule 0: 1 call site(s) selected' "${RUNNER_TEMP}/fold.log"
        test ! -e "${RUNNER_TEMP}"/acme-folded.unfolded-*
        python3 - "${RUNNER_TEMP}/acme-folded/graph.folds.json" <<'EOF'
        import json, sys
        report = json.load(open(sys.argv[1]))
        fold = report["folds"][0]
        assert report["version"] == 1 and fold["matched"] == 1, report
        key = fold["selected"][0]
        assert key["caller_signature"] == "com.acme.shop.orders.OrderService.place(java.lang.String,int,long)", key
        assert key["callee_signature"] == "com.acme.shop.inventory.InventoryService.reserve(java.lang.String,int)", key
        assert key["ordinal"] == 0, key
        assert key["callee_descriptor"].startswith("(Ljava/lang/String;I)"), key
        assert key["caller_descriptor"].startswith("(Ljava/lang/String;IJ)"), key
        assert len(fold["provenance"]["input_sha256"]) == 64, fold
        assert report["statementsRemoved"] > 0 and len(report["methods"]) == 1, report
        EOF
        # The report is a resolved plan for this input: it builds once, without a staging build.
        ./target/release/graphite build "${RUNNER_TEMP}/acme.jar" \
          -o "${RUNNER_TEMP}/acme-refolded" --include com.acme --fold "${RUNNER_TEMP}/acme-folded/graph.folds.json" \
          --fold-strict 2> "${RUNNER_TEMP}/refold.log"
        cat "${RUNNER_TEMP}/refold.log"
        if grep -F 'Building the graph without rules' "${RUNNER_TEMP}/refold.log"; then exit 1; fi
        test "$(./target/release/graphite query "${RUNNER_TEMP}/acme-refolded" \
          "MATCH (cs:CallSite {callee_name: 'reserve'}) RETURN count(cs) AS c" -f csv | tail -1)" = "0"
        test "$(./target/release/graphite query "${RUNNER_TEMP}/acme-folded" \
          "MATCH (cs:CallSite {callee_name: 'reserve'}) RETURN count(cs) AS c" -f csv | tail -1)" = "0"
        test "$(./target/release/graphite query "${RUNNER_TEMP}/acme-graph" \
          "MATCH (cs:CallSite {callee_name: 'reserve'}) RETURN cs.ordinal AS o" -f csv | tail -1)" = "0"
        # A query that returns a property instead of the node is refused with the row.
        sed -i 's/RETURN cs$/RETURN cs.ordinal/' "${RUNNER_TEMP}/folds.yml"
        set +e
        ./target/release/graphite build "${RUNNER_TEMP}/acme.jar" \
          -o "${RUNNER_TEMP}/acme-refused" --include com.acme --fold "${RUNNER_TEMP}/folds.yml" 2> "${RUNNER_TEMP}/refused.log"
        STATUS=$?
        set -e
        test "${STATUS}" -eq 1
        grep -F "select rule 0: row 0 of 'cs.ordinal' is not a node" "${RUNNER_TEMP}/refused.log"
        # A call on a function value runs every lambda it was resolved to: a query that selects
        # one lambda body is refused, since folding the call would fold the other lambda too;
        # selecting every body it runs, or the call itself, folds it.
        mkdir -p "${RUNNER_TEMP}/lambdas-classes"
        javac -d "${RUNNER_TEMP}/lambdas-classes" cli/fixtures/fold/fx/Lambdas.java
        (cd "${RUNNER_TEMP}/lambdas-classes" && jar cf "${RUNNER_TEMP}/lambdas.jar" fx)
        cat > "${RUNNER_TEMP}/one-lambda.yml" <<'EOF'
        version: 1
        folds:
          - select: >
              MATCH (cs:CallSite {caller_name: 'run'}), (inner:CallSite {callee_name: 'checkoutEnabled'})
              WHERE cs.ordinal < 0 AND cs.callee_name = inner.caller_name RETURN cs
            value: false
        EOF
        ./target/release/graphite build "${RUNNER_TEMP}/lambdas.jar" \
          -o "${RUNNER_TEMP}/lambdas-graph" --include fx
        ./target/release/graphite query "${RUNNER_TEMP}/lambdas-graph" \
          "MATCH (cs:CallSite {caller_name: 'run'}) WHERE cs.ordinal < 0 RETURN cs.callee_name AS n ORDER BY n" -f csv
        set +e
        ./target/release/graphite build "${RUNNER_TEMP}/lambdas.jar" \
          -o "${RUNNER_TEMP}/lambdas-one" --include fx --fold "${RUNNER_TEMP}/one-lambda.yml" 2> "${RUNNER_TEMP}/one-lambda.log"
        STATUS=$?
        set -e
        cat "${RUNNER_TEMP}/one-lambda.log"
        test "${STATUS}" -eq 1
        grep -F "select rule 0: the query selected 1 of the 2 function values that the call fx.Lambdas.run(java.util.function.Supplier) -> java.util.function.Supplier.get() #0 runs" "${RUNNER_TEMP}/one-lambda.log"
        test ! -e "${RUNNER_TEMP}/lambdas-one/graph.metadata"
        # Both bodies: the shared call folds, boxed as the lambdas' Boolean, and the derived
        # call sites go with it (the callers' branches test run()'s result, which stays a call).
        sed -i "s/(inner:CallSite {callee_name: 'checkoutEnabled'})/(inner:CallSite) WHERE inner.callee_name IN ['checkoutEnabled', 'darkModeEnabled']/; s/WHERE cs.ordinal < 0 AND/AND cs.ordinal < 0 AND/" "${RUNNER_TEMP}/one-lambda.yml"
        ./target/release/graphite build "${RUNNER_TEMP}/lambdas.jar" \
          -o "${RUNNER_TEMP}/lambdas-both" --include fx --fold "${RUNNER_TEMP}/one-lambda.yml" --fold-strict 2> "${RUNNER_TEMP}/both.log"
        cat "${RUNNER_TEMP}/both.log"
        grep -F "1 selected call site(s) = false: 1 call(s) in 1 method(s)" "${RUNNER_TEMP}/both.log"
        test "$(./target/release/graphite query "${RUNNER_TEMP}/lambdas-both" \
          "MATCH (cs:CallSite {caller_name: 'run'}) RETURN count(cs) AS c" -f csv | tail -1)" = "0"
        test "$(./target/release/graphite query "${RUNNER_TEMP}/lambdas-graph" \
          "MATCH (cs:CallSite {caller_name: 'run'}) RETURN count(cs) AS c" -f csv | tail -1)" = "3"
        # A body reached through a reference to the function type's own method
        # (`BiFunction<Function, String, String> invoke = Function::apply; invoke.apply(seed(), x)`)
        # hangs off a derived site that is itself derived: the row is followed up the chain
        # to the bytecode call, so the plan names a call with a non-negative ordinal.
        mkdir -p "${RUNNER_TEMP}/unbound-classes"
        javac -d "${RUNNER_TEMP}/unbound-classes" cli/fixtures/fold/fx/Unbound.java
        (cd "${RUNNER_TEMP}/unbound-classes" && jar cf "${RUNNER_TEMP}/unbound.jar" fx)
        cat > "${RUNNER_TEMP}/unbound.yml" <<'EOF'
        version: 1
        folds:
          - select: "MATCH (cs:CallSite {caller_name: 'use', callee_name: 'target'}) RETURN cs"
            value: stub
        EOF
        ./target/release/graphite build "${RUNNER_TEMP}/unbound.jar" \
          -o "${RUNNER_TEMP}/unbound-folded" --include fx --fold "${RUNNER_TEMP}/unbound.yml" --fold-strict 2> "${RUNNER_TEMP}/unbound.log"
        cat "${RUNNER_TEMP}/unbound.log"
        grep -F '1 selected call site(s) = "stub": 1 call(s) in 1 method(s)' "${RUNNER_TEMP}/unbound.log"
        python3 - "${RUNNER_TEMP}/unbound-folded/graph.folds.json" <<'EOF'
        import json, sys
        fold = json.load(open(sys.argv[1]))["folds"][0]
        key = fold["selected"][0]
        assert fold["matched"] == 1 and len(fold["selected"]) == 1, fold
        assert key["caller_signature"] == "fx.Unbound.use(java.lang.String)", key
        assert key["callee_signature"] == "java.util.function.BiFunction.apply(java.lang.Object,java.lang.Object)", key
        assert key["ordinal"] == 0 and key["result_type"] == "java.lang.String", key
        EOF
        test "$(./target/release/graphite query "${RUNNER_TEMP}/unbound-folded" \
          "MATCH (cs:CallSite {caller_name: 'use', callee_class: 'java.util.function.BiFunction'}) RETURN count(cs) AS c" -f csv | tail -1)" = "0"
        test ! -e "${RUNNER_TEMP}/acme-refused"
        # The single-file form: packed by the shell when -o names a .graphite file,
        # readable by standard zip tools, and the same graph as the directory.
        ./target/release/graphite build "${RUNNER_TEMP}/acme.jar" \
          -o "${RUNNER_TEMP}/acme.graphite" --include com.acme
        test -f "${RUNNER_TEMP}/acme.graphite"
        test ! -e "${RUNNER_TEMP}"/acme.graphite.build-*
        ./target/release/graphite verify --verbose "${RUNNER_TEMP}/acme.graphite"
        (cd "${RUNNER_TEMP}" && sha256sum -c acme.graphite.sha256)
        unzip -t "${RUNNER_TEMP}/acme.graphite"
        python3 -m zipfile -l "${RUNNER_TEMP}/acme.graphite" | grep -F META-INF/graphite.manifest
        ./target/release/graphite unpack "${RUNNER_TEMP}/acme.graphite" "${RUNNER_TEMP}/acme-unpacked"
        diff -r -I '^#' "${RUNNER_TEMP}/acme-graph" "${RUNNER_TEMP}/acme-unpacked" --exclude=META-INF
        # A .graphite file under --data is served under its file name without --graph.
        mkdir -p "${RUNNER_TEMP}/discover"
        cp "${RUNNER_TEMP}/acme.graphite" "${RUNNER_TEMP}/discover/acme-shop.graphite"
        ./target/release/graphite serve --data "${RUNNER_TEMP}/discover" --port 18090 \
          > "${RUNNER_TEMP}/discover.log" 2>&1 &
        DISCOVER=$!
        for _ in $(seq 1 60); do
          curl -sf http://localhost:18090/api/graphs > "${RUNNER_TEMP}/discover.json" && break
          sleep 1
        done
        # Every Cypher response carries `total`: exact when nothing was cut, a lower
        # bound one past the rows returned when a LIMIT cut the result.
        curl -sf -X POST http://localhost:18090/api/graphs/acme-shop/cypher -H 'Content-Type: application/json' \
          -d '{"query":"MATCH (n:CallSiteNode) RETURN count(n) AS c"}' > "${RUNNER_TEMP}/counted.json"
        curl -sf -X POST http://localhost:18090/api/graphs/acme-shop/cypher -H 'Content-Type: application/json' \
          -d '{"query":"MATCH (n:CallSiteNode) RETURN n.callee_name LIMIT 5"}' > "${RUNNER_TEMP}/limited.json"
        kill "${DISCOVER}"
        python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["rows"][0]["c"] > 5 and d["total"] == {"value": 1, "relation": "eq"}, d' "${RUNNER_TEMP}/counted.json"
        python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["rowCount"] == 5 and d["total"] == {"value": 6, "relation": "gte"}, d' "${RUNNER_TEMP}/limited.json"
        grep -F 'Discovered 1 graph(s)' "${RUNNER_TEMP}/discover.log"
        python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); ids=[g["id"] for g in d["graphs"]]; assert ids==["acme-shop"], ids' "${RUNNER_TEMP}/discover.json"
        QUERY='MATCH (n:CallSiteNode) RETURN n.callee_class, count(*) AS c ORDER BY c DESC, n.callee_class LIMIT 20'
        ./target/release/graphite query "${RUNNER_TEMP}/acme-graph" "${QUERY}" -f csv > "${RUNNER_TEMP}/from-dir.csv"
        ./target/release/graphite query "${RUNNER_TEMP}/acme.graphite" "${QUERY}" -f csv > "${RUNNER_TEMP}/from-file.csv"
        test "$(wc -l < "${RUNNER_TEMP}/from-dir.csv")" -gt 1
        cmp "${RUNNER_TEMP}/from-dir.csv" "${RUNNER_TEMP}/from-file.csv"
        # Without a frontend the shell says how to get one and exits 2.
        set +e
        env -u GRAPHITE_FRONTEND_JVM HOME="${RUNNER_TEMP}/nohome" PATH=/usr/bin:/bin \
          ./target/release/graphite build "${RUNNER_TEMP}/acme.jar" -o "${RUNNER_TEMP}/none"
        STATUS=$?
        set -e
        test "${STATUS}" -eq 2

    - name: Declared types JVM-to-native interoperability
      env:
        GRAPHITE_TYPES_FIXTURE: ${{ runner.temp }}/declared-types-graph
        GRAPHITE_TYPES_V1_FIXTURE: ${{ runner.temp }}/declared-types-v1-graph
        JAVA_TOOL_OPTIONS: -Xmx4g
      run: |
        # The test saves v2 through the JVM writer and creates its independent v1 equivalent.
        # Rerun this task so Gradle's cached success cannot omit the temp fixture.
        ./gradlew :webgraph:test --tests '*DeclaredTypePersistenceTest' --rerun --no-daemon -q
        for FIXTURE in "${GRAPHITE_TYPES_V1_FIXTURE}" "${GRAPHITE_TYPES_FIXTURE}"; do
          test -f "${FIXTURE}/graph.types"
          grep -E '^graphite\.declaredTypes\.sha256=[[:xdigit:]]{64}$' "${FIXTURE}/forward.properties"
        done
        cargo test --release --locked -p graphite-cypher declared_types_java_fixture_query_roundtrip_and_graph_local_identity -- --nocapture
        cargo test --release --locked -p graphite-cypher java_v1_v2_and_packed_graphs_preserve_all_properties_and_mixed_graph_queries -- --nocapture
        GRAPHITE_REQUIRE_DUAL_TYPES_FIXTURES=1 cargo test --release --locked -p graphite-storage dual_java_wire_versions_directory_and_packed_summaries_match_all_bindings -- --nocapture
        for FIXTURE in "${GRAPHITE_TYPES_V1_FIXTURE}" "${GRAPHITE_TYPES_FIXTURE}"; do
          GRAPHITE_INDEX_FIXTURE="${FIXTURE}" cargo test --release --locked -p graphite-storage a_packed_graph_is_the_same_graph_as_its_directory -- --nocapture
          GRAPHITE_INDEX_FIXTURE="${FIXTURE}" cargo test --release --locked -p graphite-explore schema_describes_a_loaded_graph -- --nocapture
        done

    - name: Persisted-index equivalence and relaxed scan plans against the real fixture
      env:
        GRAPHITE_INDEX_FIXTURE: ${{ runner.temp }}/fixture-graph
      run: |
        cargo test --release --locked -p graphite-storage in_memory_build_reproduces_a_real_persisted_index -- --nocapture
        cargo test --release --locked -p graphite-storage a_packed_graph_is_the_same_graph_as_its_directory -- --nocapture
        cargo test --release --locked -p graphite-cypher a_relaxed_plan_still_applies_the_dropped_conjunct -- --nocapture
        cargo test --release --locked -p graphite-cypher probed_execution_returns_the_same_rows_and_knows_when_more_exist -- --nocapture
        cargo test --release --locked -p graphite-cypher a_fused_with_prefix_answers_as_the_generic_pipeline_does -- --nocapture
        cargo test --release --locked -p graphite-cli select_sites_reads_call_site_keys_off_a_real_graph -- --nocapture
        cargo test --release --locked -p graphite-cypher partition::tests -- --nocapture
        cargo test --release --locked -p graphite-explore schema_describes_a_loaded_graph -- --nocapture
        # The C4 build bound, warm-up and cache against a real graph, and the retained footprint.
        cargo test --release --locked -p graphite-explore --lib -- --nocapture \
          an_abandoned_c4_request_keeps_its_permit_until_the_build_ends \
          a_burst_for_one_cold_graph_holds_one_permit \
          the_warm_up_build_counts_against_the_permits \
          a_request_on_a_replaced_generation_does_not_repopulate_the_cache \
          waiters_leave_the_blocking_pool_to_the_builder
        cargo test --release --locked -p graphite-explore --test c4_footprint -- --nocapture

    - name: Benchmark harness tests (fail-closed sampling and warmup)
      run: python3 -m unittest discover -s backend/bench -p 'test_*.py' -v
    # The release scripts' own checks, so a release does not find out first.
    - name: Release script self-tests
      run: |
        python3 .github/scripts/release-version.py --self-test
        bash .github/scripts/publish-release.sh --self-test

    # The same persisted graph served by both servers, every parity check compared.
    - name: Kotlin-vs-Rust differential over the fixture
      run: |
        FIXTURE="${RUNNER_TEMP}/fixture-graph"
        ACME="${RUNNER_TEMP}/acme-graph"
        # Two ids over the same graph, so the topology rule in backend/bench/topology can
        # relate them and the topology route is compared with a real relation; the
        # application fixture carries the component-level C4 checks.
        java -Xmx3g -jar frontend/jvm/explore/build/libs/graphite-explore.jar \
          --graph app:"${FIXTURE}" --graph app2:"${FIXTURE}" --graph acme:"${ACME}" \
          --topology backend/bench/topology \
          --port 18081 --metrics > "${RUNNER_TEMP}/kotlin.log" 2>&1 &
        KOTLIN=$!
        ./target/release/graphite serve \
          --graph app:"${FIXTURE}" --graph app2:"${FIXTURE}" --graph acme:"${ACME}" \
          --topology backend/bench/topology \
          --port 18080 --metrics > "${RUNNER_TEMP}/rust.log" 2>&1 &
        RUST=$!
        for _ in $(seq 1 120); do
          curl -sf http://localhost:18080/api/graphs >/dev/null && \
            curl -sf http://localhost:18081/api/graphs >/dev/null && break
          sleep 1
        done
        (cd backend/bench && python3 parity.py http://localhost:18081 http://localhost:18080)
        STATUS=$?
        # The MCP tools over stdio (`graphite mcp`) and over `POST /mcp` answer exactly
        # what the REST API answers for the same graphs.
        if [ "${STATUS}" -eq 0 ]; then
          python3 backend/bench/mcp-smoke.py ./target/release/graphite http://localhost:18080 \
            --graph app:"${FIXTURE}" --graph app2:"${FIXTURE}" --graph acme:"${ACME}"
          STATUS=$?
        fi
        # With --metrics, the tool call the smoke just made over POST /mcp is timed per
        # tool and outcome.
        if [ "${STATUS}" -eq 0 ]; then
          curl -sf http://localhost:18080/metrics > "${RUNNER_TEMP}/rust-metrics.txt"
          grep -E '^graphite_mcp_requests_total\{method="tools/call"\} [1-9]' "${RUNNER_TEMP}/rust-metrics.txt" && \
            grep -E '^graphite_mcp_tool_duration_seconds_count\{outcome="ok",tool="graphs"\} [1-9]' "${RUNNER_TEMP}/rust-metrics.txt" && \
            grep -E '^graphite_mcp_tool_duration_seconds_max\{outcome="ok",tool="graphs"\} ' "${RUNNER_TEMP}/rust-metrics.txt"
          STATUS=$?
        fi
        # Identity: the build, and every served graph with its content fingerprint. The
        # two ids over the same directory report the same fingerprint, and the packed
        # container of that directory reports it too.
        if [ "${STATUS}" -eq 0 ]; then
          grep -E '^graphite_build_info\{commit="[^"]+",version="[^"]+"\} 1$' "${RUNNER_TEMP}/rust-metrics.txt" && \
            grep -E '^graphite_graph_info\{fingerprint="[0-9a-f]{64}",graph="app"\} 1$' "${RUNNER_TEMP}/rust-metrics.txt" && \
            test "$(grep -E '^graphite_graph_info\{fingerprint="[0-9a-f]{64}",graph="app2?"\} 1$' "${RUNNER_TEMP}/rust-metrics.txt" | sed 's/.*fingerprint="\([0-9a-f]*\)".*/\1/' | sort -u | wc -l)" -eq 1 && \
            test "$(grep -E '^graphite_graph_info\{fingerprint="[0-9a-f]{64}",graph="acme"\} 1$' "${RUNNER_TEMP}/rust-metrics.txt" | sed 's/.*fingerprint="\([0-9a-f]*\)".*/\1/')" = \
              "$(python3 -c 'import hashlib,sys,zipfile; print(hashlib.sha256(zipfile.ZipFile(sys.argv[1]).read("META-INF/graphite.manifest")).hexdigest())' "${RUNNER_TEMP}/acme.graphite")"
          STATUS=$?
        fi
        kill ${KOTLIN} ${RUST} || true
        exit ${STATUS}

  windows-check:
    name: rust-check-windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: .
    # MSVC has no jemalloc; the explorer must still build with the system allocator.
    - name: Check
      run: cargo check --workspace --all-targets --locked
