name: Rust

# No path filter: the differential below serves graphs built by the JVM frontend with the
# Kotlin explorer as the baseline, so a frontend, Gradle or fixture change must run it too.
on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '**' ]

permissions:
  contents: read

jobs:
  rust:
    name: rust-build-test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
        targets: x86_64-unknown-linux-musl

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: .

    - name: Format
      run: cargo fmt --all --check

    - name: Clippy
      run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

    - name: Build
      run: cargo build --release --locked

    - name: Unit tests
      run: cargo test --release --locked

    # The Linux release binary is a static musl build (it must run on any distribution
    # and on the libc-less distroless image); build it as the publish workflow does,
    # check it is static, then build the image from it and run it so the Dockerfile,
    # the build context and the entrypoint are exercised on every change.
    - name: Build the static Linux binary and run the graphite-explore image
      env:
        CC_x86_64_unknown_linux_musl: musl-gcc
      run: |
        sudo apt-get install -y -q musl-tools
        cargo build --release --locked --target x86_64-unknown-linux-musl -p graphite-cli
        bash .github/scripts/require-static.sh target/x86_64-unknown-linux-musl/release/graphite
        mkdir -p release-assets/linux/amd64
        cp target/x86_64-unknown-linux-musl/release/graphite release-assets/linux/amd64/graphite
        docker build -f backend/explore/Dockerfile --build-arg VERSION=ci -t graphite-explore:ci .
        docker run --rm --entrypoint /app/graphite graphite-explore:ci --version
        docker run --rm graphite-explore:ci --help | grep -F -- '--graph'
        rm -rf release-assets

    # The in-memory CallSite index must reproduce the persisted one byte for byte.
    # That test needs a real graph directory written by the Kotlin builder, so one is
    # built here from this repository's own core module.
    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: true

    # `graphite build` is the Rust CLI driving the JVM frontend (graphite.jar), found
    # here through GRAPHITE_FRONTEND_JVM as the Homebrew wrapper sets it.
    - name: Build the JVM frontend, the Kotlin explorer and a persisted fixture graph
      env:
        GRAPHITE_FRONTEND_JVM: ${{ github.workspace }}/frontend/jvm/query/build/libs/graphite.jar
        JAVA_TOOL_OPTIONS: -Xmx4g
      run: |
        ./gradlew :query:shadowJar :explore:shadowJar :core:jar --no-daemon -q
        ./target/release/graphite frontend list
        ./target/release/graphite frontend describe jvm | tee "${RUNNER_TEMP}/frontend.json"
        python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["name"]=="jvm" and d["version"], d' "${RUNNER_TEMP}/frontend.json"
        CORE_JAR=$(ls frontend/jvm/core/build/libs/core-*.jar | grep -v -- '-slim' | head -1)
        ./target/release/graphite build "${CORE_JAR}" \
          -o "${RUNNER_TEMP}/fixture-graph" --include io.johnsonlee.graphite
        test -f "${RUNNER_TEMP}/fixture-graph/graph.callsite-string-index"
        ls -la "${RUNNER_TEMP}/fixture-graph"
        # A small application with several capabilities calling each other, so the
        # component level has relationships to compare (the core jar is a library
        # and infers no components at all).
        mkdir -p "${RUNNER_TEMP}/acme-classes"
        javac -d "${RUNNER_TEMP}/acme-classes" $(find backend/bench/fixtures/acme/src -name '*.java')
        (cd "${RUNNER_TEMP}/acme-classes" && jar cfe "${RUNNER_TEMP}/acme.jar" com.acme.shop.api.Main com)
        ./target/release/graphite build "${RUNNER_TEMP}/acme.jar" \
          -o "${RUNNER_TEMP}/acme-graph" --include com.acme
        test -f "${RUNNER_TEMP}/acme-graph/graph.metadata"
        # The jar's own build of the same input is identical apart from the timestamp
        # comment in forward.properties: the CLI is a shell.
        java -jar frontend/jvm/query/build/libs/graphite.jar build "${RUNNER_TEMP}/acme.jar" \
          -o "${RUNNER_TEMP}/acme-graph-direct" --include com.acme
        diff -r -I '^#' "${RUNNER_TEMP}/acme-graph" "${RUNNER_TEMP}/acme-graph-direct"
        # The single-file form: packed by the shell when -o names a .graphite file,
        # readable by standard zip tools, and the same graph as the directory.
        ./target/release/graphite build "${RUNNER_TEMP}/acme.jar" \
          -o "${RUNNER_TEMP}/acme.graphite" --include com.acme
        test -f "${RUNNER_TEMP}/acme.graphite"
        test ! -e "${RUNNER_TEMP}"/acme.graphite.build-*
        ./target/release/graphite verify --verbose "${RUNNER_TEMP}/acme.graphite"
        (cd "${RUNNER_TEMP}" && sha256sum -c acme.graphite.sha256)
        unzip -t "${RUNNER_TEMP}/acme.graphite"
        python3 -m zipfile -l "${RUNNER_TEMP}/acme.graphite" | grep -F META-INF/graphite.manifest
        ./target/release/graphite unpack "${RUNNER_TEMP}/acme.graphite" "${RUNNER_TEMP}/acme-unpacked"
        diff -r -I '^#' "${RUNNER_TEMP}/acme-graph" "${RUNNER_TEMP}/acme-unpacked" --exclude=META-INF
        # A .graphite file under --data is served under its file name without --graph.
        mkdir -p "${RUNNER_TEMP}/discover"
        cp "${RUNNER_TEMP}/acme.graphite" "${RUNNER_TEMP}/discover/acme-shop.graphite"
        ./target/release/graphite serve --data "${RUNNER_TEMP}/discover" --port 18090 \
          > "${RUNNER_TEMP}/discover.log" 2>&1 &
        DISCOVER=$!
        for _ in $(seq 1 60); do
          curl -sf http://localhost:18090/api/graphs > "${RUNNER_TEMP}/discover.json" && break
          sleep 1
        done
        # Every Cypher response carries `total`: exact when nothing was cut, a lower
        # bound one past the rows returned when a LIMIT cut the result.
        curl -sf -X POST http://localhost:18090/api/graphs/acme-shop/cypher -H 'Content-Type: application/json' \
          -d '{"query":"MATCH (n:CallSiteNode) RETURN count(n) AS c"}' > "${RUNNER_TEMP}/counted.json"
        curl -sf -X POST http://localhost:18090/api/graphs/acme-shop/cypher -H 'Content-Type: application/json' \
          -d '{"query":"MATCH (n:CallSiteNode) RETURN n.callee_name LIMIT 5"}' > "${RUNNER_TEMP}/limited.json"
        kill "${DISCOVER}"
        python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["rows"][0]["c"] > 5 and d["total"] == {"value": 1, "relation": "eq"}, d' "${RUNNER_TEMP}/counted.json"
        python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["rowCount"] == 5 and d["total"] == {"value": 6, "relation": "gte"}, d' "${RUNNER_TEMP}/limited.json"
        grep -F 'Discovered 1 graph(s)' "${RUNNER_TEMP}/discover.log"
        python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); ids=[g["id"] for g in d["graphs"]]; assert ids==["acme-shop"], ids' "${RUNNER_TEMP}/discover.json"
        QUERY='MATCH (n:CallSiteNode) RETURN n.callee_class, count(*) AS c ORDER BY c DESC, n.callee_class LIMIT 20'
        ./target/release/graphite query "${RUNNER_TEMP}/acme-graph" "${QUERY}" -f csv > "${RUNNER_TEMP}/from-dir.csv"
        ./target/release/graphite query "${RUNNER_TEMP}/acme.graphite" "${QUERY}" -f csv > "${RUNNER_TEMP}/from-file.csv"
        test "$(wc -l < "${RUNNER_TEMP}/from-dir.csv")" -gt 1
        cmp "${RUNNER_TEMP}/from-dir.csv" "${RUNNER_TEMP}/from-file.csv"
        # Without a frontend the shell says how to get one and exits 2.
        set +e
        env -u GRAPHITE_FRONTEND_JVM HOME="${RUNNER_TEMP}/nohome" PATH=/usr/bin:/bin \
          ./target/release/graphite build "${RUNNER_TEMP}/acme.jar" -o "${RUNNER_TEMP}/none"
        STATUS=$?
        set -e
        test "${STATUS}" -eq 2

    - name: Persisted-index equivalence and relaxed scan plans against the real fixture
      env:
        GRAPHITE_INDEX_FIXTURE: ${{ runner.temp }}/fixture-graph
      run: |
        cargo test --release --locked -p graphite-storage in_memory_build_reproduces_a_real_persisted_index -- --nocapture
        cargo test --release --locked -p graphite-storage a_packed_graph_is_the_same_graph_as_its_directory -- --nocapture
        cargo test --release --locked -p graphite-cypher a_relaxed_plan_still_applies_the_dropped_conjunct -- --nocapture
        cargo test --release --locked -p graphite-cypher probed_execution_returns_the_same_rows_and_knows_when_more_exist -- --nocapture

    - name: Benchmark harness tests (fail-closed sampling and warmup)
      run: python3 -m unittest discover -s backend/bench -p 'test_*.py' -v
    # The release scripts' own checks, so a release does not find out first.
    - name: Release script self-tests
      run: |
        python3 .github/scripts/release-version.py --self-test
        bash .github/scripts/publish-release.sh --self-test

    # The same persisted graph served by both servers, every parity check compared.
    - name: Kotlin-vs-Rust differential over the fixture
      run: |
        FIXTURE="${RUNNER_TEMP}/fixture-graph"
        ACME="${RUNNER_TEMP}/acme-graph"
        # Two ids over the same graph, so the topology rule in backend/bench/topology can
        # relate them and the topology route is compared with a real relation; the
        # application fixture carries the component-level C4 checks.
        java -Xmx3g -jar frontend/jvm/explore/build/libs/graphite-explore.jar \
          --graph app:"${FIXTURE}" --graph app2:"${FIXTURE}" --graph acme:"${ACME}" \
          --topology backend/bench/topology \
          --port 18081 --metrics > "${RUNNER_TEMP}/kotlin.log" 2>&1 &
        KOTLIN=$!
        ./target/release/graphite serve \
          --graph app:"${FIXTURE}" --graph app2:"${FIXTURE}" --graph acme:"${ACME}" \
          --topology backend/bench/topology \
          --port 18080 --metrics > "${RUNNER_TEMP}/rust.log" 2>&1 &
        RUST=$!
        for _ in $(seq 1 120); do
          curl -sf http://localhost:18080/api/graphs >/dev/null && \
            curl -sf http://localhost:18081/api/graphs >/dev/null && break
          sleep 1
        done
        (cd backend/bench && python3 parity.py http://localhost:18081 http://localhost:18080)
        STATUS=$?
        # The MCP tools over stdio (`graphite mcp`) and over `POST /mcp` answer exactly
        # what the REST API answers for the same graphs.
        if [ "${STATUS}" -eq 0 ]; then
          python3 backend/bench/mcp-smoke.py ./target/release/graphite http://localhost:18080 \
            --graph app:"${FIXTURE}" --graph app2:"${FIXTURE}" --graph acme:"${ACME}"
          STATUS=$?
        fi
        # With --metrics, the tool call the smoke just made over POST /mcp is timed per
        # tool and outcome.
        if [ "${STATUS}" -eq 0 ]; then
          curl -sf http://localhost:18080/metrics > "${RUNNER_TEMP}/rust-metrics.txt"
          grep -E '^graphite_mcp_requests_total\{method="tools/call"\} [1-9]' "${RUNNER_TEMP}/rust-metrics.txt" && \
            grep -E '^graphite_mcp_tool_duration_seconds_count\{outcome="ok",tool="graphs"\} [1-9]' "${RUNNER_TEMP}/rust-metrics.txt" && \
            grep -E '^graphite_mcp_tool_duration_seconds_max\{outcome="ok",tool="graphs"\} ' "${RUNNER_TEMP}/rust-metrics.txt"
          STATUS=$?
        fi
        # Identity: the build, and every served graph with its content fingerprint. The
        # two ids over the same directory report the same fingerprint, and the packed
        # container of that directory reports it too.
        if [ "${STATUS}" -eq 0 ]; then
          grep -E '^graphite_build_info\{commit="[^"]+",version="[^"]+"\} 1$' "${RUNNER_TEMP}/rust-metrics.txt" && \
            grep -E '^graphite_graph_info\{fingerprint="[0-9a-f]{64}",graph="app"\} 1$' "${RUNNER_TEMP}/rust-metrics.txt" && \
            test "$(grep -E '^graphite_graph_info\{fingerprint="[0-9a-f]{64}",graph="app2?"\} 1$' "${RUNNER_TEMP}/rust-metrics.txt" | sed 's/.*fingerprint="\([0-9a-f]*\)".*/\1/' | sort -u | wc -l)" -eq 1 && \
            test "$(grep -E '^graphite_graph_info\{fingerprint="[0-9a-f]{64}",graph="acme"\} 1$' "${RUNNER_TEMP}/rust-metrics.txt" | sed 's/.*fingerprint="\([0-9a-f]*\)".*/\1/')" = \
              "$(python3 -c 'import hashlib,sys,zipfile; print(hashlib.sha256(zipfile.ZipFile(sys.argv[1]).read("META-INF/graphite.manifest")).hexdigest())' "${RUNNER_TEMP}/acme.graphite")"
          STATUS=$?
        fi
        kill ${KOTLIN} ${RUST} || true
        exit ${STATUS}

  windows-check:
    name: rust-check-windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: .
    # MSVC has no jemalloc; the explorer must still build with the system allocator.
    - name: Check
      run: cargo check --workspace --all-targets --locked
