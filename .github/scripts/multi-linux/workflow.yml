name: Attempt146 multi-keyword paired diagnostic (not acceptance)
on:
  push:
    branches: [codex/attempt146-linux-profile]
permissions:
  contents: read
  actions: read
jobs:
  multi38-paired:
    if: github.repository == 'johnsonlee/graphite' && github.ref == 'refs/heads/codex/attempt146-linux-profile'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    env:
      JAVA_OPTS: -Xmx2g -XX:MetaspaceSize=512m -Dfile.encoding=UTF-8
      JVM_OPTS: -Xmx2g -XX:MetaspaceSize=512m -Dfile.encoding=UTF-8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: diagnostic
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 23dafb3dc82b31ea78a5d399d3ed68f70de5340f
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 4e328b0109e13c896b74004823fb049fcb19251a
          path: base
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch original authenticated CI fixture and provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 diagnostic/.github/scripts/multi-linux/fetch-inputs.py --mode global
      - name: Build originals and independently derive Linux38 oracle before measurement
        run: |
          python3 diagnostic/.github/scripts/multi-linux/prepare.py \
            --java "$JAVA_HOME/bin/java" \
            --base-tree base --candidate-tree candidate \
            --fixture-dir shared-fixture64 \
            --evidence-dir global-evidence/benchmark-global-wide-116-1/reference-4e328b0109e13c896b74004823fb049fcb19251a \
            --output diagnostic-output/multi38-setup
      - name: Run fixed3pairs in each cold state without profiling
        run: |
          python3 diagnostic/.github/scripts/multi-linux/paired-run.py \
            --prepared diagnostic-output/multi38-setup/prepared.json \
            --output diagnostic-output/multi38-pairs
      - name: Preserve file hashes and environment on success or failure
        if: always()
        env:
          MULTI_JOB_STATUS: ${{ job.status }}
        run: python3 diagnostic/.github/scripts/multi-linux/finalize.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: attempt146-linux-multi38-paired-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            diagnostic-output/
            !diagnostic-output/**/classes/**
            !diagnostic-output/**/*.jar
          if-no-files-found: error
          retention-days: 14
