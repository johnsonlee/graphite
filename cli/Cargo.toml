[package]
name = "graphite-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "graphite"
path = "src/main.rs"

[dependencies]
graphite-storage = { path = "../backend/storage" }
graphite-cypher = { path = "../backend/cypher" }
graphite-explore = { path = "../backend/explore" }
serde_json.workspace = true
clap.workspace = true
sha2.workspace = true

# jemalloc has no MSVC build; those targets keep the system allocator.
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.5"
